<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Painter</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Left UI */
    #left-ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: 220px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Right UI */
    #right-ui {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    #animation-list {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    /* Drawing Panel */
    #draw-panel {
      display: none;
      background: rgba(0, 0, 0, 0.85);
      padding: 28px 20px 20px 20px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      flex-direction: column;
      gap: 12px;
      min-width: 260px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 6px;
      right: 12px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover { color: #fff; }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      position: relative;
    }

    .undo-redo-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    input[type="file"] { display: none; }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s ease;
      text-align: center;
      user-select: none;
      width: 100%;
    }

    .btn:hover { background-color: #0056b3; }
    .btn-sky { background-color: #17a2b8; }
    .btn-sky:hover { background-color: #138496; }
    .btn-draw { background-color: #28a745; width: auto; }
    .btn-draw:hover { background-color: #218838; }
    .btn-download { background-color: #fd7e14; display: none; }
    .btn-download:hover { background-color: #e06b0e; }
    .btn-move { background-color: #6f42c1; width: 100%; display: none; }
    .btn-move:hover { background-color: #5a32a3; }

    .anim-btn {
      background-color: #20c997;
      width: 100%;
      font-size: 13px;
      padding: 8px 12px;
    }
    .anim-btn:hover { background-color: #17a589; }
    .anim-btn.active { background-color: #ffc107; color: #000; }

    .btn-toggle { background-color: #17a2b8; width: 100%; }
    .btn-toggle.painting { background-color: #ffc107; color: #000; }

    .btn-step { background-color: #6c757d; flex: 1; padding: 8px 10px; font-size: 16px; }
    .btn-step:hover { background-color: #5a6268; }
    .btn-step:disabled { background-color: #444; color: #888; cursor: not-allowed; }

    .color-picker-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .custom-color-btn {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
      background: linear-gradient(135deg, #ff0000, #00ff00, #0000ff);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }
    .custom-color-btn:hover { transform: scale(1.08); }

    .color-swatch-inner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
    }

    #color-wheel-popup {
      display: none;
      position: absolute;
      top: 45px;
      left: 0;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .color-wheel-container {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      cursor: crosshair;
    }

    #color-wheel-canvas { border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.5); }

    #wheel-pointer {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    .wheel-info-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      font-family: monospace;
      color: #ddd;
      padding: 2px 4px;
    }

    /* Sky Modal Overlay */
    #sky-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #sky-modal {
      background: rgba(30, 30, 30, 0.95);
      border: 1px solid #444;
      border-radius: 10px;
      padding: 24px;
      width: 300px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    #sky-modal h3 { font-size: 16px; text-align: center; margin-bottom: 4px; color: #fff; }

    #loading-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      display: none;
      font-size: 18px;
      z-index: 50;
    }

    #vr-camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      display: none;
    }

    #sky-photo-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
      display: none;
    }

    canvas {
      position: relative;
      z-index: 1;
    }

    /* Mocap Floating Panel */
    #mocap-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      width: 240px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #444;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mocap-view {
      position: relative;
      width: 100%;
      height: 150px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    #mocap-video, #mocap-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
  </style>

  <!-- Three.js r128 and all addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js.blend@1.0.3/build/js.blend.min.js"></script>

  <!-- MediaPipe FaceMesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="canvas-container">
    <video id="vr-camera-video" autoplay playsinline></video>
    <div id="sky-photo-bg"></div>

    <div id="left-ui">
      <label for="file-input" class="btn">Load Model/Photo</label>
      <input type="file" id="file-input" accept=".glb, .gltf, .fbx, .usdz, .dae, .mlt, .mtl, .stl, .obj, .blend, .prisma, .vrm, .vrma, .png, .jpg, .jpeg, .heic, .heif" />
      
      <button id="sky-btn" class="btn btn-sky">Sky</button>

      <button id="download-btn" class="btn btn-download">Download Painted Model</button>
      <button id="move-btn" class="btn btn-move">Move</button>
      <div id="animation-list"></div>
    </div>

    <div id="right-ui">
      <button id="enter-draw-btn" class="btn btn-draw">Drawing Mode</button>

      <div id="draw-panel">
        <button id="close-draw-btn" class="close-btn" title="Exit Drawing Mode">&times;</button>

        <div class="undo-redo-group">
          <button id="undo-btn" class="btn btn-step" title="Undo">↺ Undo</button>
          <button id="redo-btn" class="btn btn-step" title="Redo">↻ Redo</button>
        </div>

        <button id="toggle-paint-btn" class="btn btn-toggle">Rotate Mode</button>

        <div class="control-group">
          <div class="color-picker-wrapper" title="Paint Full Body Color">
            <div id="fill-color-btn" class="custom-color-btn">
              <div id="fill-color-preview" class="color-swatch-inner" style="background-color: #ffffff;"></div>
            </div>
            <label for="fill-color-btn" style="font-size: 12px; cursor: pointer;">Fill All</label>
          </div>

          <div class="color-picker-wrapper" title="Brush Color Picker">
            <label for="brush-color-btn" style="font-size: 12px; cursor: pointer;">Brush:</label>
            <div id="brush-color-btn" class="custom-color-btn">
              <div id="brush-color-preview" class="color-swatch-inner" style="background-color: #ff0000;"></div>
            </div>
          </div>
        </div>

        <!-- Color Wheel Popup Container -->
        <div id="color-wheel-popup">
          <div class="color-wheel-container" id="color-wheel-wrapper">
            <canvas id="color-wheel-canvas" width="160" height="160"></canvas>
            <div id="wheel-pointer"></div>
          </div>
          <div class="wheel-info-bar">
            <span id="wheel-selected-hex">#FFFFFF</span>
            <span id="wheel-selected-name">White</span>
          </div>
        </div>

        <div class="control-group">
          <label for="brush-size">Size:</label>
          <input type="range" id="brush-size" min="2" max="50" step="1" value="10" />
        </div>
      </div>
    </div>

    <div id="loading-screen">Loading file...</div>
  </div>

  <!-- Sky Popup Modal Overlay -->
  <div id="sky-modal-overlay">
    <div id="sky-modal">
      <button id="close-sky-modal" class="close-btn" title="Close">&times;</button>
      <h3>Configure Sky Background</h3>
      <button id="sky-vr-camera-btn" class="btn btn-sky">1. VR Camera</button>
      <label for="sky-photo-input" class="btn btn-sky" style="text-align: center; cursor: pointer;">2. Load Photo as Sky</label>
      <input type="file" id="sky-photo-input" accept=".png, .jpg, .jpeg, .heic, .heif" />
      <button id="sky-color-picker-btn" class="btn btn-sky">3. Color Picker Wheel</button>
      <button id="sky-mocap-btn" class="btn btn-sky" style="background-color: #e83e8c;">4. mocap (Face Mesh)</button>
    </div>
  </div>

  <!-- Mocap Floating Camera Panel -->
  <div id="mocap-container">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <span style="font-size: 12px; font-weight: bold;">Face Mocap Mesh</span>
      <button id="close-mocap-btn" class="close-btn" style="position:static; font-size:18px;">&times;</button>
    </div>
    <div class="mocap-view">
      <video id="mocap-video" autoplay playsinline muted></video>
      <canvas id="mocap-canvas"></canvas>
    </div>
    <button id="download-face-btn" class="btn" style="background-color: #28a745; display: none; padding: 6px; font-size: 12px;">Download Face Model (.glb)</button>
    <button id="capture-face-btn" class="btn" style="background-color: #fd7e14; padding: 6px; font-size: 12px;">Capture Face</button>
    <div id="mocap-status" style="font-size: 11px; color: #aaa; text-align: center;">Initializing camera...</div>
  </div>

  <!-- Hidden Secondary Color Wheel Popup Specifically for Sky Color Selection -->
  <div id="sky-color-wheel-popup" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(20,20,20,0.95); border:1px solid #444; border-radius:8px; padding:16px; z-index:1100; box-shadow:0 4px 15px rgba(0,0,0,0.5); flex-direction:column; align-items:center; gap:10px;">
    <button id="close-sky-wheel" class="close-btn">&times;</button>
    <div style="font-size:14px; font-weight:bold;">Pick Sky Color</div>
    <div class="color-wheel-container" id="sky-wheel-wrapper">
      <canvas id="sky-wheel-canvas" width="160" height="160"></canvas>
      <div id="sky-wheel-pointer" style="position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 3px rgba(0,0,0,0.8); transform: translate(-50%, -50%); pointer-events: none; display: none;"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const loadingScreen = document.getElementById('loading-screen');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(
      45, 
      container.clientWidth / container.clientHeight, 
      0.1, 
      1000
    );
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Restored old lighting strength/brightness settings
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    const drawCanvas = document.createElement('canvas');
    drawCanvas.width = 1024;
    drawCanvas.height = 1024;
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });

    let hasBeenInitialized = false;
    let hasMadeEdits = false; 
    let isPhotoLoaded = false;

    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 20;

    let mixer = null;
    let animations = [];
    let activeAction = null;
    const clock = new THREE.Clock();

    function resetDrawCanvas() {
      if (!isPhotoLoaded) {
        drawCtx.fillStyle = '#ffffff';
        drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
      }
      undoStack = [];
      redoStack = [];
      hasMadeEdits = false;
      saveState();
      hasBeenInitialized = true;
    }

    function saveState() {
      if (undoStack.length >= MAX_HISTORY) {
        undoStack.shift();
      }
      undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
      redoStack = [];
      updateUndoRedoButtons();
    }

    function undo() {
      if (undoStack.length > 1) {
        redoStack.push(undoStack.pop());
        const state = undoStack[undoStack.length - 1];
        drawCtx.putImageData(state, 0, 0);
        canvasTexture.needsUpdate = true;
        updateUndoRedoButtons();
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        const state = redoStack.pop();
        undoStack.push(state);
        drawCtx.putImageData(state, 0, 0);
        canvasTexture.needsUpdate = true;
        updateUndoRedoButtons();
      }
    }

    function updateUndoRedoButtons() {
      undoBtn.disabled = undoStack.length <= 1;
      redoBtn.disabled = redoStack.length === 0;
    }

    const canvasTexture = new THREE.CanvasTexture(drawCanvas);
    canvasTexture.flipY = true;

    let currentModel = null;
    let originalMaterials = new Map();
    let isDrawMode = false;
    let isPaintingState = false;
    let isDrawing = false;
    let lastUV = null;

    let activeColorTarget = 'brush';
    let brushColorVal = '#ff0000';
    let fillColorVal = '#ffffff';

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const enterDrawBtn = document.getElementById('enter-draw-btn');
    const drawPanel = document.getElementById('draw-panel');
    const downloadBtn = document.getElementById('download-btn');
    const moveBtn = document.getElementById('move-btn');
    const animationList = document.getElementById('animation-list');
    const togglePaintBtn = document.getElementById('toggle-paint-btn');
    const closeDrawBtn = document.getElementById('close-draw-btn');
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');
    const brushColorBtn = document.getElementById('brush-color-btn');
    const brushColorPreview = document.getElementById('brush-color-preview');
    const fillColorBtn = document.getElementById('fill-color-btn');
    const fillColorPreview = document.getElementById('fill-color-preview');
    const brushSizeInput = document.getElementById('brush-size');

    const colorWheelPopup = document.getElementById('color-wheel-popup');
    const colorWheelWrapper = document.getElementById('color-wheel-wrapper');
    const colorWheelCanvas = document.getElementById('color-wheel-canvas');
    const wheelCtx = colorWheelCanvas.getContext('2d', { willReadFrequently: true });
    const wheelPointer = document.getElementById('wheel-pointer');
    const wheelSelectedHex = document.getElementById('wheel-selected-hex');
    const wheelSelectedName = document.getElementById('wheel-selected-name');

    // Sky Modal Elements
    const skyBtn = document.getElementById('sky-btn');
    const skyModalOverlay = document.getElementById('sky-modal-overlay');
    const closeSkyModal = document.getElementById('close-sky-modal');
    const skyVrCameraBtn = document.getElementById('sky-vr-camera-btn');
    const skyPhotoInput = document.getElementById('sky-photo-input');
    const skyColorPickerBtn = document.getElementById('sky-color-picker-btn');
    const skyMocapBtn = document.getElementById('sky-mocap-btn');
    const vrCameraVideo = document.getElementById('vr-camera-video');
    const skyPhotoBg = document.getElementById('sky-photo-bg');
    const skyColorWheelPopup = document.getElementById('sky-color-wheel-popup');
    const closeSkyWheel = document.getElementById('close-sky-wheel');
    const skyWheelCanvas = document.getElementById('sky-wheel-canvas');
    const skyWheelCtx = skyWheelCanvas.getContext('2d', { willReadFrequently: true });
    const skyWheelWrapper = document.getElementById('sky-wheel-wrapper');
    const skyWheelPointer = document.getElementById('sky-wheel-pointer');

    // Mocap Elements
    const mocapContainer = document.getElementById('mocap-container');
    const closeMocapBtn = document.getElementById('close-mocap-btn');
    const mocapVideo = document.getElementById('mocap-video');
    const mocapCanvas = document.getElementById('mocap-canvas');
    const mocapCtx = mocapCanvas.getContext('2d');
    const mocapStatus = document.getElementById('mocap-status');
    const captureFaceBtn = document.getElementById('capture-face-btn');
    const downloadFaceBtn = document.getElementById('download-face-btn');
    let mocapCameraInstance = null;
    let latestLandmarks = null;
    let capturedFaceModelObject = null;
    let faceMesh = null;

    skyBtn.addEventListener('click', () => { skyModalOverlay.style.display = 'flex'; });
    closeSkyModal.addEventListener('click', () => { skyModalOverlay.style.display = 'none'; });
    skyModalOverlay.addEventListener('click', (e) => { if (e.target === skyModalOverlay) skyModalOverlay.style.display = 'none'; });

    function clearCustomBackgrounds() {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
      }
      vrCameraVideo.style.display = 'none';
      skyPhotoBg.style.display = 'none';
      skyPhotoBg.style.backgroundImage = 'none';
    }

    let activeStream = null;
    skyVrCameraBtn.addEventListener('click', async () => {
      skyModalOverlay.style.display = 'none';
      clearCustomBackgrounds();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        activeStream = stream;
        vrCameraVideo.srcObject = stream;
        vrCameraVideo.style.display = 'block';
        scene.background = null; 
      } catch (err) {
        alert("Unable to access camera for VR background.");
      }
    });

    skyPhotoInput.addEventListener('change', async (e) => {
      let file = e.target.files[0];
      if (!file) return;
      skyModalOverlay.style.display = 'none';
      clearCustomBackgrounds();

      const filename = file.name.toLowerCase();
      if (filename.endsWith('.heic') || filename.endsWith('.heif')) {
        try {

    function renderSkyColorWheel() {
      const radius = skyWheelCanvas.width / 2;
      const imgData = skyWheelCtx.createImageData(skyWheelCanvas.width, skyWheelCanvas.height);
      const data = imgData.data;

      for (let y = 0; y < skyWheelCanvas.height; y++) {
        for (let x = 0; x < skyWheelCanvas.width; x++) {
          const dx = x - radius, dy = y - radius;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const index = (y * skyWheelCanvas.width + x) * 4;

          if (dist <= radius) {
            const angle = Math.atan2(dy, dx);
            let hue = (angle * 180 / Math.PI + 360) % 360;
            let sat = dist / radius, light = 0.5;
            let c = (1 - Math.abs(2 * light - 1)) * sat;
            let xVal = c * (1 - Math.abs((hue / 60) % 2 - 1));
            let m = light - c / 2, r = 0, g = 0, b = 0;

            if (0 <= hue && hue < 60) { r = c; g = xVal; b = 0; }
            else if (60 <= hue && hue < 120) { r = xVal; g = c; b = 0; }
            else if (120 <= hue && hue < 180) { r = 0; g = c; b = xVal; }
            else if (180 <= hue && hue < 240) { r = 0; g = xVal; b = c; }
            else if (240 <= hue && hue < 300) { r = xVal; g = 0; b = c; }
            else if (300 <= hue && hue < 360) { r = c; g = 0; b = xVal; }

            data[index] = Math.round((r + m) * 255);
            data[index + 1] = Math.round((g + m) * 255);
            data[index + 2] = Math.round((b + m) * 255);
            data[index + 3] = 255;
          } else { data[index + 3] = 0; }
        }
      }
      skyWheelCtx.putImageData(imgData, 0, 0);
    }
    renderSkyColorWheel();

    function rgbToHex(r, g, b) {

    function getColorName(r, g, b) {

    function updatePointerPosition(x, y) {

        fbxLoader.load(fileURL, (fbx) => { displayModel(fbx, fbx.animations || []); URL.revokeObjectURL(fileURL); }, undefined, (err) => handleError(err, fileURL));

          displayModel(new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.1 })), []);
          URL.revokeObjectURL(fileURL);

          displayModel(group, []);
          URL.revokeObjectURL(fileURL);
        };
        img.src = fileURL;

    function drawStroke(startUV, endUV, size, color) {
      drawCtx.strokeStyle = color;
      drawCtx.fillStyle = color;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.lineWidth = size;
      drawCtx.beginPath();
      if (startUV) {
        drawCtx.moveTo(startUV.x, startUV.y);
        drawCtx.lineTo(endUV.x, endUV.y);
      } else {
        drawCtx.moveTo(endUV.x, endUV.y);
        drawCtx.lineTo(endUV.x, endUV.y);
      }
      drawCtx.stroke();
      canvasTexture.needsUpdate = true;
    }

    function paintAtPoint(clientX, clientY) {
      if (!isDrawMode || !isPaintingState || !currentModel) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentModel, true);

      if (intersects.length > 0 && intersects[0].uv) {
        const uv = intersects[0].uv;
        const currentUV = { x: uv.x * drawCanvas.width, y: (1 - uv.y) * drawCanvas.height };
        const size = parseInt(brushSizeInput.value, 10);
        const color = brushColorVal;

        if (lastUV) {
          if (Math.hypot(currentUV.x - lastUV.x, currentUV.y - lastUV.y) < drawCanvas.width * 0.15) {
            drawStroke(lastUV, currentUV, size, color);
          } else {
            drawStroke(null, currentUV, size, color);
          }
        } else {
          drawStroke(null, currentUV, size, color);
        }

        hasMadeEdits = true;
        downloadBtn.style.display = 'block';
        lastUV = currentUV;
      } else { lastUV = null; }
    }

    renderer.domElement.addEventListener('mousedown', (e) => { if (e.button === 0) { isDrawing = true; lastUV = null; paintAtPoint(e.clientX, e.clientY); } });
    renderer.domElement.addEventListener('mousemove', (e) => { if (isDrawing) paintAtPoint(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { if (isDrawing) { isDrawing = false; lastUV = null; saveState(); } });

    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && (!isDrawMode || isPaintingState)) {
        isDrawing = true;
        lastUV = null;
        paintAtPoint(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (isDrawing && e.touches.length === 1) {
        e.preventDefault();
        paintAtPoint(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });
    window.addEventListener('touchend', () => { if (isDrawing) { isDrawing = false; lastUV = null; saveState(); } });

    function displayModel(model, anims) {
      if (currentModel) scene.remove(currentModel);
      currentModel = model;
      originalMaterials.clear();
      hasBeenInitialized = false;
      hasMadeEdits = false;
      downloadBtn.style.display = 'none';

      mixer = new THREE.AnimationMixer(currentModel);
      currentModel.traverse((child) => { if (child.isMesh) originalMaterials.set(child.uuid, child.material); });
      scene.add(currentModel);

      const box = new THREE.Box3().setFromObject(currentModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const scale = 2 / (Math.max(size.x, size.y, size.z) || 1);

      currentModel.position.sub(center.multiplyScalar(scale));
      currentModel.scale.setScalar(scale);

      camera.position.set(0, 1.5, 4);
      controls.target.set(0, 0, 0);
      controls.update();

      setupAnimations(anims);
      loadingScreen.style.display = 'none';
    }

    function handleError(error, url) {
      alert('Failed to load the file.');
      loadingScreen.style.display = 'none';
      if (url) URL.revokeObjectURL(url);
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
