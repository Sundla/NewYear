<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Painter</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Left UI: Fixed width containing Load, Download, Move, and full unconstrained Animation List */
    #left-ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: 200px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Right UI: Drawing Mode Entry & Controls */
    #right-ui {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    #animation-list {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    /* Drawing Panel */
    #draw-panel {
      display: none;
      background: rgba(0, 0, 0, 0.85);
      padding: 28px 20px 20px 20px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      flex-direction: column;
      gap: 12px;
      min-width: 260px;
      position: relative;
    }

    /* Close (Cross) Button */
    .close-btn {
      position: absolute;
      top: 6px;
      right: 12px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #fff;
    }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      position: relative;
    }

    .undo-redo-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s ease;
      text-align: center;
      user-select: none;
      width: 100%;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .btn-draw {
      background-color: #28a745;
      width: auto;
    }

    .btn-draw:hover {
      background-color: #218838;
    }

    .btn-download {
      background-color: #fd7e14;
      display: none; /* Controlled dynamically */
    }

    .btn-download:hover {
      background-color: #e06b0e;
    }

    .btn-move {
      background-color: #6f42c1;
      width: 100%;
      display: none; /* Initially hidden until animations are found */
    }

    .btn-move:hover {
      background-color: #5a32a3;
    }

    .anim-btn {
      background-color: #20c997;
      width: 100%;
      font-size: 13px;
      padding: 8px 12px;
    }

    .anim-btn:hover {
      background-color: #17a589;
    }

    .anim-btn.active {
      background-color: #ffc107;
      color: #000;
    }

    .btn-toggle {
      background-color: #17a2b8;
      width: 100%;
    }

    .btn-toggle.painting {
      background-color: #ffc107;
      color: #000;
    }

    .btn-step {
      background-color: #6c757d;
      flex: 1;
      padding: 8px 10px;
      font-size: 16px;
    }

    .btn-step:hover {
      background-color: #5a6268;
    }

    .btn-step:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }

    /* Customized Color Picker Controls */
    .color-picker-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .custom-color-btn {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
      background: linear-gradient(135deg, #ff0000, #00ff00, #0000ff);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .custom-color-btn:hover {
      transform: scale(1.08);
    }

    .color-swatch-inner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
    }

    /* Interactive Color Wheel Popup */
    #color-wheel-popup {
      display: none;
      position: absolute;
      top: 45px;
      left: 0;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .color-wheel-container {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      cursor: crosshair;
    }

    #color-wheel-canvas {
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    /* Selection Pointer / Indicator */
    #wheel-pointer {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    /* Color Code & Name Info Bar */
    .wheel-info-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      font-family: monospace;
      color: #ddd;
      padding: 2px 4px;
    }

    #loading-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      display: none;
      font-size: 18px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>

  <div id="canvas-container">
    <div id="left-ui">
      <label for="file-input" class="btn">Load Model/Photo</label>
      <input type="file" id="file-input" accept=".glb, .gltf, .obj, .png, .jpg, .jpeg, .heic, .heif" />
      <button id="download-btn" class="btn btn-download">Download Painted Model</button>
      <button id="move-btn" class="btn btn-move">Move</button>
      <div id="animation-list"></div>
    </div>

    <div id="right-ui">
      <button id="enter-draw-btn" class="btn btn-draw">Drawing Mode</button>

      <div id="draw-panel">
        <button id="close-draw-btn" class="close-btn" title="Exit Drawing Mode">&times;</button>

        <div class="undo-redo-group">
          <button id="undo-btn" class="btn btn-step" title="Undo">↺ Undo</button>
          <button id="redo-btn" class="btn btn-step" title="Redo">↻ Redo</button>
        </div>

        <button id="toggle-paint-btn" class="btn btn-toggle">Rotate Mode</button>

        <div class="control-group">
          <div class="color-picker-wrapper" title="Paint Full Body Color">
            <div id="fill-color-btn" class="custom-color-btn">
              <div id="fill-color-preview" class="color-swatch-inner" style="background-color: #ffffff;"></div>
            </div>
            <label for="fill-color-btn" style="font-size: 12px; cursor: pointer;">Fill All</label>
          </div>

          <div class="color-picker-wrapper" title="Brush Color Picker">
            <label for="brush-color-btn" style="font-size: 12px; cursor: pointer;">Brush:</label>
            <div id="brush-color-btn" class="custom-color-btn">
              <div id="brush-color-preview" class="color-swatch-inner" style="background-color: #ff0000;"></div>
            </div>
          </div>
        </div>

        <!-- Color Wheel Popup Container -->
        <div id="color-wheel-popup">
          <div class="color-wheel-container" id="color-wheel-wrapper">
            <canvas id="color-wheel-canvas" width="160" height="160"></canvas>
            <div id="wheel-pointer"></div>
          </div>
          <div class="wheel-info-bar">
            <span id="wheel-selected-hex">#FFFFFF</span>
            <span id="wheel-selected-name">White</span>
          </div>
        </div>

        <div class="control-group">
          <label for="brush-size">Size:</label>
          <input type="range" id="brush-size" min="2" max="50" step="1" value="10" />
        </div>
      </div>
    </div>

    <div id="loading-screen">Loading file...</div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const loadingScreen = document.getElementById('loading-screen');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(
      45, 
      container.clientWidth / container.clientHeight, 
      0.1, 
      1000
    );
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    const drawCanvas = document.createElement('canvas');
    drawCanvas.width = 1024;
    drawCanvas.height = 1024;
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });

    let hasBeenInitialized = false;
    let hasMadeEdits = false; 
    let isPhotoLoaded = false;

    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 20;

    let mixer = null;
    let animations = [];
    let activeAction = null;
    const clock = new THREE.Clock();

    function resetDrawCanvas() {
      if (!isPhotoLoaded) {
        drawCtx.fillStyle = '#ffffff';
        drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
      }
      undoStack = [];
      redoStack = [];
      hasMadeEdits = false;
      saveState();
      hasBeenInitialized = true;
    }

    function saveState() {
      if (undoStack.length >= MAX_HISTORY) {
        undoStack.shift();
      }
      undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
      redoStack = [];
      updateUndoRedoButtons();
    }

    function undo() {
      if (undoStack.length > 1) {
        redoStack.push(undoStack.pop());
        const state = undoStack[undoStack.length - 1];
        drawCtx.putImageData(state, 0, 0);
        canvasTexture.needsUpdate = true;
        updateUndoRedoButtons();
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        const state = redoStack.pop();
        undoStack.push(state);
        drawCtx.putImageData(state, 0, 0);
        canvasTexture.needsUpdate = true;
        updateUndoRedoButtons();
      }
    }

    function updateUndoRedoButtons() {
      undoBtn.disabled = undoStack.length <= 1;
      redoBtn.disabled = redoStack.length === 0;
    }

    const canvasTexture = new THREE.CanvasTexture(drawCanvas);
    canvasTexture.flipY = true;

    let currentModel = null;
    let originalMaterials = new Map();
    let isDrawMode = false;
    let isPaintingState = false;
    let isDrawing = false;
    let lastUV = null;

    let activeColorTarget = 'brush';
    let brushColorVal = '#ff0000';
    let fillColorVal = '#ffffff';

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const enterDrawBtn = document.getElementById('enter-draw-btn');
    const drawPanel = document.getElementById('draw-panel');
    const downloadBtn = document.getElementById('download-btn');
    const moveBtn = document.getElementById('move-btn');
    const animationList = document.getElementById('animation-list');
    const togglePaintBtn = document.getElementById('toggle-paint-btn');
    const closeDrawBtn = document.getElementById('close-draw-btn');
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');
    const brushColorBtn = document.getElementById('brush-color-btn');
    const brushColorPreview = document.getElementById('brush-color-preview');
    const fillColorBtn = document.getElementById('fill-color-btn');
    const fillColorPreview = document.getElementById('fill-color-preview');
    const brushSizeInput = document.getElementById('brush-size');

    const colorWheelPopup = document.getElementById('color-wheel-popup');
    const colorWheelWrapper = document.getElementById('color-wheel-wrapper');
    const colorWheelCanvas = document.getElementById('color-wheel-canvas');
    const wheelCtx = colorWheelCanvas.getContext('2d', { willReadFrequently: true });
    const wheelPointer = document.getElementById('wheel-pointer');
    const wheelSelectedHex = document.getElementById('wheel-selected-hex');
    const wheelSelectedName = document.getElementById('wheel-selected-name');

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    function renderColorWheel() {
      const radius = colorWheelCanvas.width / 2;
      const imgData = wheelCtx.createImageData(colorWheelCanvas.width, colorWheelCanvas.height);
      const data = imgData.data;

      for (let y = 0; y < colorWheelCanvas.height; y++) {
        for (let x = 0; x < colorWheelCanvas.width; x++) {
          const dx = x - radius;
          const dy = y - radius;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const index = (y * colorWheelCanvas.width + x) * 4;

          if (dist <= radius) {
            const angle = Math.atan2(dy, dx);
            let hue = (angle * 180 / Math.PI + 360) % 360;
            let sat = dist / radius;
            let light = 0.5;

            let c = (1 - Math.abs(2 * light - 1)) * sat;
            let xVal = c * (1 - Math.abs((hue / 60) % 2 - 1));
            let m = light - c / 2;
            let r = 0, g = 0, b = 0;

            if (0 <= hue && hue < 60) { r = c; g = xVal; b = 0; }
            else if (60 <= hue && hue < 120) { r = xVal; g = c; b = 0; }
            else if (120 <= hue && hue < 180) { r = 0; g = c; b = xVal; }
            else if (180 <= hue && hue < 240) { r = 0; g = xVal; b = c; }
            else if (240 <= hue && hue < 300) { r = xVal; g = 0; b = c; }
            else if (300 <= hue && hue < 360) { r = c; g = 0; b = xVal; }

            data[index] = Math.round((r + m) * 255);
            data[index + 1] = Math.round((g + m) * 255);
            data[index + 2] = Math.round((b + m) * 255);
            data[index + 3] = 255;
          } else {
            data[index + 3] = 0;
          }
        }
      }
      wheelCtx.putImageData(imgData, 0, 0);
    }

    renderColorWheel();

    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }

    function getColorName(r, g, b) {
      if (r > 240 && g > 240 && b > 240) return "White";
      if (r < 15 && g < 15 && b < 15) return "Black";
      if (r > 200 && g < 50 && b < 50) return "Red";
      if (r < 50 && g > 200 && b < 50) return "Green";
      if (r < 50 && r < 50 && b > 200) return "Blue";
      if (r > 200 && g > 200 && b < 50) return "Yellow";
      if (r > 200 && g < 50 && b > 200) return "Magenta";
      if (r < 50 && g > 200 && b > 200) return "Cyan";
      if (r > 200 && g > 100 && b < 50) return "Orange";
      if (r > 120 && g < 50 && b > 120) return "Purple";
      if (r > 150 && g > 150 && b > 150) return "Gray";
      if (r > 100 && g < 60 && b < 30) return "Brown";
      
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h = Math.round(h * 60);
        if (h < 0) h += 360;
      }

      if (max < 60) return "Dark Gray";
      if (min > 190) return "Light Gray";
      
      if (h < 15 || h >= 345) return "Red";
      if (h < 45) return "Amber";
      if (h < 75) return "Yellow";
      if (h < 105) return "Chartreuse";
      if (h < 165) return "Green";
      if (h < 195) return "Spring Green";
      if (h < 255) return "Cyan/Blue";
      if (h < 285) return "Indigo/Violet";
      if (h < 315) return "Purple";
      return "Rose";
    }

    function updatePointerPosition(x, y) {
      const radius = colorWheelCanvas.width / 2;
      const dx = x - radius;
      const dy = y - radius;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let px = x;
      let py = y;

      if (dist > radius) {
        px = radius + (dx / dist) * radius;
        py = radius + (dy / dist) * radius;
      }

      wheelPointer.style.left = px + 'px';
      wheelPointer.style.top = py + 'px';
      wheelPointer.style.display = 'block';

      return { x: px, y: py };
    }

    function pickColorFromWheel(e) {
      const rect = colorWheelCanvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      if (clientX === undefined || clientY === undefined) return;

      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const radius = colorWheelCanvas.width / 2;
      const dx = x - radius;
      const dy = y - radius;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const constrained = updatePointerPosition(x, y);

      let sampleX = Math.min(Math.max(Math.floor(constrained.x), 0), colorWheelCanvas.width - 1);
      let sampleY = Math.min(Math.max(Math.floor(constrained.y), 0), colorWheelCanvas.height - 1);
      
      const pixel = wheelCtx.getImageData(sampleX, sampleY, 1, 1).data;
      if (pixel[3] > 0) {
        const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
        const colorName = getColorName(pixel[0], pixel[1], pixel[2]);
        
        wheelSelectedHex.innerText = hex;
        wheelSelectedName.innerText = colorName;

        if (activeColorTarget === 'brush') {
          brushColorVal = hex;
          brushColorPreview.style.backgroundColor = hex;
        } else {
          fillColorVal = hex;
          fillColorPreview.style.backgroundColor = hex;

          drawCtx.fillStyle = hex;
          drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
          canvasTexture.needsUpdate = true;

          hasMadeEdits = true;
          downloadBtn.style.display = 'block';
          saveState();
        }
      }
    }

    let isSelectingWheel = false;
    colorWheelWrapper.addEventListener('mousedown', (e) => {
      isSelectingWheel = true;
      pickColorFromWheel(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (isSelectingWheel) pickColorFromWheel(e);
    });
    window.addEventListener('mouseup', () => {
      isSelectingWheel = false;
    });

    colorWheelWrapper.addEventListener('touchstart', (e) => {
      isSelectingWheel = true;
      pickColorFromWheel(e);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (isSelectingWheel) pickColorFromWheel(e);
    }, { passive: true });
    window.addEventListener('touchend', () => {
      isSelectingWheel = false;
    });

    function initPointerForColor(hex) {
      wheelPointer.style.left = '80px';
      wheelPointer.style.top = '80px';
      wheelPointer.style.display = 'block';
      wheelSelectedHex.innerText = hex;
      wheelSelectedName.innerText = "Custom";
    }

    brushColorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      activeColorTarget = 'brush';
      colorWheelPopup.style.display = colorWheelPopup.style.display === 'flex' ? 'none' : 'flex';
      if (colorWheelPopup.style.display === 'flex') {
        initPointerForColor(brushColorVal);
      }
    });

    fillColorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      activeColorTarget = 'fill';
      colorWheelPopup.style.display = colorWheelPopup.style.display === 'flex' ? 'none' : 'flex';
      if (colorWheelPopup.style.display === 'flex') {
        initPointerForColor(fillColorVal);
      }
    });

    document.addEventListener('click', (e) => {
      if (!colorWheelPopup.contains(e.target) && !brushColorBtn.contains(e.target) && !fillColorBtn.contains(e.target)) {
        colorWheelPopup.style.display = 'none';
      }
    });

    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    const objLoader = new THREE.OBJLoader();
    const exporter = new THREE.GLTFExporter();

    function loadDefaultModel() {
      loadingScreen.style.display = 'block';
      isPhotoLoaded = false;
      gltfLoader.load(
        'Sachin.glb',
        (gltf) => {
          displayModel(gltf.scene, gltf.animations);
        },
        undefined,
        (error) => {
          console.warn('Could not load default model "Sachin.glb":', error);
          loadingScreen.style.display = 'none';
        }
      );
    }

    loadDefaultModel();

    document.getElementById('file-input').addEventListener('change', async function (event) {
      let file = event.target.files[0];
      if (!file) return;

      const filename = file.name.toLowerCase();
      loadingScreen.style.display = 'block';

      if (isDrawMode) exitDrawingMode();

      hasBeenInitialized = false;
      hasMadeEdits = false;
      downloadBtn.style.display = 'none';

      if (filename.endsWith('.heic') || filename.endsWith('.heif')) {
        try {
          const convertedBlob = await heic2any({
            blob: file,
            toType: "image/jpeg",
          });
          file = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
        } catch (err) {
          console.error("HEIC conversion failed:", err);
          alert("Could not decode HEIC image.");
          loadingScreen.style.display = 'none';
          return;
        }
      }

      const fileURL = URL.createObjectURL(file);

      if (filename.endsWith('.glb') || filename.endsWith('.gltf')) {
        isPhotoLoaded = false;
        gltfLoader.load(
          fileURL,
          (gltf) => {
            displayModel(gltf.scene, gltf.animations);
            URL.revokeObjectURL(fileURL);
          },
          undefined,
          (error) => handleError(error, fileURL)
        );
      } else if (filename.endsWith('.obj')) {
        isPhotoLoaded = false;
        objLoader.load(
          fileURL,
          (obj) => {
            displayModel(obj, []);
            URL.revokeObjectURL(fileURL);
          },
          undefined,
          (error) => handleError(error, fileURL)
        );
      } else if (
        filename.endsWith('.png') || 
        filename.endsWith('.jpg') || 
        filename.endsWith('.jpeg') || 
        filename.endsWith('.heic') || 
        filename.endsWith('.heif')
      ) {
        isPhotoLoaded = true;
        const img = new Image();
        img.onload = () => {
          const width = img.naturalWidth || img.width;
          const height = img.naturalHeight || img.height;
          
          const maxSide = 3.0;
          const aspect = width / height;
          let planeW, planeH;
          if (aspect >= 1) {
            planeW = maxSide;
            planeH = maxSide / aspect;
          } else {
            planeH = maxSide;
            planeW = maxSide * aspect;
          }

          const geometry = new THREE.PlaneGeometry(planeW, planeH);

          drawCanvas.width = width > 2048 ? 2048 : width;
          drawCanvas.height = height > 2048 ? 2048 : height;
          
          drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
          
          canvasTexture.image = drawCanvas;
          canvasTexture.needsUpdate = true;

          hasBeenInitialized = true;
          hasMadeEdits = true;
          downloadBtn.style.display = 'block';
          saveState();

          const material = new THREE.MeshStandardMaterial({
            map: canvasTexture,
            roughness: 0.5,
            metalness: 0.1,
            side: THREE.DoubleSide
          });

          const planeMesh = new THREE.Mesh(geometry, material);
          const group = new THREE.Group();
          group.add(planeMesh);

          displayModel(group, []);
          URL.revokeObjectURL(fileURL);
        };
        img.onerror = (error) => handleError(error, fileURL);
        img.src = fileURL;
      } else {
        alert('Unsupported file format! Please upload a .glb, .gltf, .obj, .png, .jpg, .jpeg, .heic, or .heif file.');
        loadingScreen.style.display = 'none';
        URL.revokeObjectURL(fileURL);
      }
    });

    enterDrawBtn.addEventListener('click', () => {
      if (!currentModel) return;

      isDrawMode = true;
      enterDrawBtn.style.display = 'none';
      drawPanel.style.display = 'flex';

      hasMadeEdits = true;
      downloadBtn.style.display = 'block';

      if (!hasBeenInitialized) {
        resetDrawCanvas();
      }
      canvasTexture.needsUpdate = true;

      currentModel.traverse((child) => {
        if (child.isMesh) {
          if (!originalMaterials.has(child.uuid)) {
            originalMaterials.set(child.uuid, child.material);
          }
          child.material = new THREE.MeshStandardMaterial({
            map: canvasTexture,
            roughness: 0.5,
            metalness: 0.1,
            side: THREE.DoubleSide
          });
        }
      });

      setPaintState(true);
    });

    function exitDrawingMode() {
      isDrawMode = false;
      setPaintState(false);

      drawPanel.style.display = 'none';
      colorWheelPopup.style.display = 'none';
      enterDrawBtn.style.display = 'block';

      if (currentModel) {
        currentModel.traverse((child) => {
          if (child.isMesh) {
            const origMat = originalMaterials.get(child.uuid);
            if (origMat) {
              child.material = origMat;
            }
          }
        });
      }
    }

    closeDrawBtn.addEventListener('click', exitDrawingMode);

    function setPaintState(painting) {
      isPaintingState = painting;
      controls.enabled = !isPaintingState;

      if (isPaintingState) {
        togglePaintBtn.innerText = "Paint Go Slow";
        togglePaintBtn.classList.add('painting');
      } else {
        togglePaintBtn.innerText = "Rotate Mode";
        togglePaintBtn.classList.remove('painting');
      }
    }

    togglePaintBtn.addEventListener('click', () => {
      setPaintState(!isPaintingState);
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentModel) return;

      currentModel.traverse((child) => {
        if (child.isMesh) {
          if (!child.material || child.material.map !== canvasTexture) {
            if (!originalMaterials.has(child.uuid)) {
              originalMaterials.set(child.uuid, child.material);
            }
            child.material = new THREE.MeshStandardMaterial({
              map: canvasTexture,
              roughness: 0.5,
              metalness: 0.1,
              side: THREE.DoubleSide
            });
          }
        }
      });

      const options = { binary: true };

      exporter.parse(
        currentModel,
        (result) => {
          let blob;
          if (result instanceof ArrayBuffer) {
            blob = new Blob([result], { type: 'application/octet-stream' });
          } else {
            const output = JSON.stringify(result, null, 2);
            blob = new Blob([output], { type: 'application/octet-stream' });
          }

          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = '3d-model.glb';
          
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(() => {
            URL.revokeObjectURL(link.href);
          }, 100);
        },
        (error) => {
          console.error('An error occurred while exporting the model:', error);
          alert('Could not export model.');
        },
        options
      );
    });

    moveBtn.addEventListener('click', () => {
      if (animationList.style.display === 'flex') {
        animationList.style.display = 'none';
      } else {
        animationList.style.display = 'flex';
      }
    });

    function setupAnimations(animArray) {
      animations = animArray || [];
      animationList.innerHTML = '';
      animationList.style.display = 'none';

      if (animations.length > 0) {
        moveBtn.style.display = 'block';
        
        animations.forEach((clip, index) => {
          const animBtn = document.createElement('button');
          animBtn.className = 'btn anim-btn';
          animBtn.innerText = clip.name ? clip.name : `Action ${index + 1}`;
          
          animBtn.addEventListener('click', () => {
            const allAnimBtns = animationList.querySelectorAll('.anim-btn');
            allAnimBtns.forEach(b => b.classList.remove('active'));
            animBtn.classList.add('active');

            if (mixer) {
              mixer.stopAllAction();
            }
            const action = mixer.clipAction(clip);
            action.reset().play();
            activeAction = action;
          });

          animationList.appendChild(animBtn);
        });

        if (animations.length > 0) {
          const firstAction = mixer.clipAction(animations[0]);
          firstAction.play();
          activeAction = firstAction;
          if (animationList.children[0]) {
            animationList.children[0].classList.add('active');
          }
        }
      } else {
        moveBtn.style.display = 'none';
      }
    }

    function drawStroke(startUV, endUV, size, color) {
      drawCtx.strokeStyle = color;
      drawCtx.fillStyle = color;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.lineWidth = size;

      drawCtx.beginPath();
      if (startUV) {
        drawCtx.moveTo(startUV.x, startUV.y);
        drawCtx.lineTo(endUV.x, endUV.y);
      } else {
        drawCtx.moveTo(endUV.x, endUV.y);
        drawCtx.lineTo(endUV.x, endUV.y);
      }
      drawCtx.stroke();

      canvasTexture.needsUpdate = true;
    }

    function paintAtPoint(clientX, clientY) {
      if (!isDrawMode || !isPaintingState || !currentModel) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentModel, true);

      if (intersects.length > 0 && intersects[0].uv) {
        const uv = intersects[0].uv;
        const currentUV = {
          x: uv.x * drawCanvas.width,
          y: (1 - uv.y) * drawCanvas.height
        };

        const size = parseInt(brushSizeInput.value, 10);
        const color = brushColorVal;

        if (lastUV) {
          const distUV = Math.hypot(currentUV.x - lastUV.x, currentUV.y - lastUV.y);
          if (distUV < drawCanvas.width * 0.15) {
            drawStroke(lastUV, currentUV, size, color);
          } else {
            drawStroke(null, currentUV, size, color);
          }
        } else {
          drawStroke(null, currentUV, size, color);
        }

        hasMadeEdits = true;
        downloadBtn.style.display = 'block';

        lastUV = currentUV;
      } else {
        lastUV = null;
      }
    }

    function handleStart(clientX, clientY) {
      if (isDrawMode && isPaintingState) {
        isDrawing = true;
        lastUV = null;
        paintAtPoint(clientX, clientY);
      }
    }

    function handleMove(clientX, clientY) {
      if (isDrawing) {
        paintAtPoint(clientX, clientY);
      }
    }

    function handleEnd() {
      if (isDrawing) {
        isDrawing = false;
        lastUV = null;
        saveState();
      }
    }

    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 0) handleStart(e.clientX, e.clientY);
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
      handleMove(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', handleEnd);

    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && (!isDrawMode || isPaintingState)) {
        const touch = e.touches[0];
        handleStart(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (isDrawing && e.touches.length === 1) {
        e.preventDefault();
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', handleEnd);

    function displayModel(model, anims) {
      if (currentModel) {
        scene.remove(currentModel);
      }

      currentModel = model;
      originalMaterials.clear();
      hasBeenInitialized = false;
      hasMadeEdits = false;
      downloadBtn.style.display = 'none';

      mixer = new THREE.AnimationMixer(currentModel);

      currentModel.traverse((child) => {
        if (child.isMesh) {
          originalMaterials.set(child.uuid, child.material);
        }
      });

      scene.add(currentModel);

      const box = new THREE.Box3().setFromObject(currentModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2 / (maxDim || 1);

      currentModel.position.sub(center.multiplyScalar(scale));
      currentModel.scale.setScalar(scale);

      camera.position.set(0, 1.5, 4);
      controls.target.set(0, 0, 0);
      controls.update();

      setupAnimations(anims);

      loadingScreen.style.display = 'none';
    }

    function handleError(error, url) {
      console.error('Error loading file:', error);
      alert('Failed to load the file.');
      loadingScreen.style.display = 'none';
      if (url) URL.revokeObjectURL(url);
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      if (mixer) {
        mixer.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
