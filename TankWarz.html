    .btn-main:active { transform: scale(0.98); }

    #sculpt-overlay {
        position: fixed;

        align-items: center;

        position: fixed;
        bottom: 20px;

    .dir-grid {

<script>
let scene, camera, renderer;
let baseWorldSize = 160; 
let worldW = 160, worldH = 160; 
let audioCtx = null;
let minimapCtx = null;

let customEnemyGeometry = null;
let sculptScene, sculptCamera, sculptRenderer, sculptMesh = null;
let sculptAnimFrame = null;
let sculptRotDir = null;

const stageData = [
    { ammo: 20, enemies: 4, time: 100, color: 0xff0000 }, 
    { ammo: 40, enemies: 8, time: 200, color: 0xff7f00 }, 
    { ammo: 80, enemies: 16, time: 300, color: 0xffff00 }, 
    { ammo: 160, enemies: 32, time: 400, color: 0x00ff00 }, 
    { ammo: 320, enemies: 64, time: 500, color: 0x0000ff }, 
    { ammo: 640, enemies: 128, time: 600, color: 0x4b0082 }, 
    { ammo: 1280, enemies: 256, time: 700, color: 0x8a2be2 } 
];

const state = { 
    active: false,
    stage: 1,
    player: { x: 0, z: 60, angle: 0, moveDir: 0, turnDir: 0, speed: 0.8, turnSpeed: 0.04 },
    enemies: [],
    blocks: [],
    bullets: [],
    explosions: [],
    clouds: [],
    timer: 100,
    ammo: 20,
    kills: 0,
    timerInt: null
};

let playerTankMesh, playerBarrelMesh, groundMesh;
let dirLight, sunMesh;

function setupPadControls(containerId, actionCallback, stopCallback) {
    const el = document.getElementById(containerId);
    if (!el) return;

    let startX = 0;
    let startY = 0;
    let activeDir = null;
    let isSwiping = false;
    const threshold = 8;

    el.addEventListener('pointerdown', (e) => {
        startX = e.clientX;
        startY = e.clientY;
        isSwiping = false;
        activeDir = null;
        try {
            el.setPointerCapture(e.pointerId);
        } catch(err) {}

        const btn = e.target.closest('.ctrl-btn');
        if (btn) {
            const dir = btn.getAttribute('data-dir');
            if (dir) {
                activeDir = dir;
                actionCallback(activeDir);
            }
        }
    });

    el.addEventListener('pointermove', (e) => {
        if (e.buttons === 0 && !e.pressure) return;
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;

        if (!isSwiping && (Math.abs(dx) > threshold || Math.abs(dy) > threshold)) {
            isSwiping = true;
        }

        if (isSwiping) {
            let newDir = null;
            if (Math.abs(dx) > Math.abs(dy)) {
                newDir = dx > 0 ? 'right' : 'left';
            } else {
                newDir = dy > 0 ? 'down' : 'up';
            }

            if (newDir !== activeDir) {
                activeDir = newDir;
                actionCallback(activeDir);
            }
        }
    });

    const handleEnd = (e) => {
        if (activeDir) {
            activeDir = null;
            stopCallback();
        }
        isSwiping = false;
        try {
            el.releasePointerCapture(e.pointerId);
        } catch(err) {}
    };

    el.addEventListener('pointerup', handleEnd);
    el.addEventListener('pointercancel', handleEnd);
}

window.addEventListener('DOMContentLoaded', () => {
    setupPadControls('game-dpad', (dir) => {
        if (dir === 'up') setMove('up');
        if (dir === 'down') setMove('down');
        if (dir === 'left') setMove('left');
        if (dir === 'right') setMove('right');
    }, () => {
        stopMove();
    });

    setupPadControls('sculpt-dpad', (dir) => {
        sculptRotate(dir);
    }, () => {
        sculptStop();
    });
});

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'explosion') {
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.linearRampToValueAtTime(50, now + 0.5);

        noise.connect(filter);
        filter.connect(gain);

        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

        noise.start(now);
        noise.stop(now + 0.5);
    }
}

function init3D() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb0e0e6);
    scene.fog = new THREE.FogExp2(0xb0e0e6, 0.005);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
    dirLight.position.set(60, 120, 60);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 600;
    
    let d = 150;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const sunGeo = new THREE.SphereGeometry(10, 16, 16);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
    sunMesh = new THREE.Mesh(sunGeo, sunMat);
    sunMesh.position.copy(dirLight.position);
    scene.add(sunMesh);

    createGround();
    createClouds();
    minimapCtx = document.getElementById('minimap').getContext('2d');
    window.addEventListener('resize', onWindowResize);
}

function updateWorldDimensions() {
    let sizeMultiplier = Math.pow(2, Math.floor((state.stage - 1) / 3));
    worldW = baseWorldSize * Math.sqrt(sizeMultiplier);
    worldH = baseWorldSize * Math.sqrt(sizeMultiplier);

    if (groundMesh) scene.remove(groundMesh);
    const groundGeo = new THREE.PlaneGeometry(worldW, worldH);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.8 });
    groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = 0;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    if (dirLight) {
        let d = Math.max(worldW, worldH) * 0.75;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.updateProjectionMatrix();
    }
}

function createGround() {
    updateWorldDimensions();
}

function createClouds() {
    const cloudGeo = new THREE.SphereGeometry(6, 8, 8);
    const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
    
    for (let i = 0; i < 25; i++) {
        const cloudGroup = new THREE.Group();
        const parts = 4 + Math.floor(Math.random() * 4);
        for (let j = 0; j < parts; j++) {
            const part = new THREE.Mesh(cloudGeo, cloudMat);
            part.position.set((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 15);
            const scale = 0.8 + Math.random() * 1.2;
            part.scale.set(scale, scale, scale);
            cloudGroup.add(part);
        }
        cloudGroup.position.set((Math.random() - 0.5) * 300, 60 + Math.random() * 30, (Math.random() - 0.5) * 300);
        scene.add(cloudGroup);
        state.clouds.push(cloudGroup);
    }
}

function createTankModel(colorHex) {
    const group = new THREE.Group();
    if (customEnemyGeometry) {
        let customMesh = customEnemyGeometry.clone();
        
        let box = new THREE.Box3().setFromObject(customMesh);
        let center = box.getCenter(new THREE.Vector3());
        
        customMesh.position.x = -center.x;
        customMesh.position.z = -center.z;
        customMesh.position.y = -box.min.y;

        group.add(customMesh);
        return { group, barrel: null, wheels: [] };
    }
    const bodyGeo = new THREE.BoxGeometry(4, 2, 6);
    const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    const barrelGeo = new THREE.CylinderGeometry(0.4, 0.4, 4, 16);
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
    const barrel = new THREE.Mesh(barrelGeo, barrelMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 1.5, -3);
    barrel.castShadow = true;
    barrel.receiveShadow = true;
    group.add(barrel);

    return { group, barrel, wheels: [] };
}

function createRoundedBoxGeometry(width, height, depth, radius, smoothness) {
    const shape = new THREE.Shape();
    const eps = 0.00001;
    let rad = Math.max(eps, radius);
    
    shape.absarc(width / 2 - rad, height / 2 - rad, rad, -Math.PI / 2, 0, false);
    shape.absarc(width / 2 - rad, -height / 2 + rad, rad, 0, Math.PI / 2, false);
    shape.absarc(-width / 2 + rad, -height / 2 + rad, rad, Math.PI / 2, Math.PI, false);
    shape.absarc(-width / 2 + rad, height / 2 - rad, rad, Math.PI, (3 * Math.PI) / 2, false);

    const settings = {
        steps: 1,
        depth: depth - rad * 2,
        bevelEnabled: true,
        bevelThickness: rad,
        bevelSize: rad,
        bevelSegments: smoothness
    };

    const geometry = new THREE.ExtrudeGeometry(shape, settings);
    geometry.center();
    return geometry;
}

function createEnhancedEnemyTank(colorHex) {
    const group = new THREE.Group();
    const wheels = [];

    const bodyGeo = createRoundedBoxGeometry(3.6, 1.2, 5.2, 0.5, 4);
    const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, metalness: 0.2 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    const frustumGeo = new THREE.CylinderGeometry(1.2, 1.8, 1.2, 16);
    const frustumMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.3 });
    const frustum = new THREE.Mesh(frustumGeo, frustumMat);
    frustum.position.set(0, 2.4, 0);
    frustum.castShadow = true;
    frustum.receiveShadow = true;
    group.add(frustum);

    const barrelGeo = new THREE.CylinderGeometry(0.35, 0.35, 3.5, 16);
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const barrel = new THREE.Mesh(barrelGeo, barrelMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 2.6, -2.2);
    barrel.castShadow = true;
    group.add(barrel);

    const mainWheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.5, 16);
    const centerHubGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.52, 16);
    const stripWheelGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.15, 16);
    
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    const metallicMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
    const blackStripMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.9 });

    mainWheelGeo.rotateZ(Math.PI / 2);
    centerHubGeo.rotateZ(Math.PI / 2);
    stripWheelGeo.rotateZ(Math.PI / 2);

    const zOffsets = [-1.8, -0.6, 0.6, 1.8];
    const xSides = [-2.2, 2.2];

    for (let xSide of xSides) {
        for (let zOffset of zOffsets) {
            const wheelGroup = new THREE.Group();

            const mainWheel = new THREE.Mesh(mainWheelGeo, tireMat);
            mainWheel.castShadow = true;
            wheelGroup.add(mainWheel);

            const centerHub = new THREE.Mesh(centerHubGeo, metallicMat);
            centerHub.castShadow = true;
            wheelGroup.add(centerHub);

            for (let sOffset of [-0.15, 0.15]) {
                const strip = new THREE.Mesh(stripWheelGeo, blackStripMat);
                strip.position.x = sOffset;
                strip.castShadow = true;
                wheelGroup.add(strip);
            }

            wheelGroup.position.set(xSide, 0.6, zOffset);
            group.add(wheelGroup);
            wheels.push(wheelGroup);
        }
    }

    return { group, barrel, wheels };
}

function buildWorld() {
    state.blocks.forEach(b => scene.remove(b.mesh));
    state.blocks = [];
    state.enemies.forEach(e => scene.remove(e.group));
    state.enemies = [];

    updateWorldDimensions();

    let halfW = worldW / 2;
    let halfH = worldH / 2;
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });

    const borderThickness = 4;
    const borderHeight = 4;

    let northGeo = new THREE.BoxGeometry(worldW, borderHeight, borderThickness);
    let northMesh = new THREE.Mesh(northGeo, wallMat);
    northMesh.position.set(0, borderHeight/2, -halfH);
    northMesh.castShadow = true;
    northMesh.receiveShadow = true;
    scene.add(northMesh);
    state.blocks.push({ x: 0, z: -halfH, w: worldW, d: borderThickness, mesh: northMesh, isBorder: true });

    let southMesh = new THREE.Mesh(northGeo, wallMat);
    southMesh.position.set(0, borderHeight/2, halfH);
    southMesh.castShadow = true;
    southMesh.receiveShadow = true;
    scene.add(southMesh);
    state.blocks.push({ x: 0, z: halfH, w: worldW, d: borderThickness, mesh: southMesh, isBorder: true });

    let sideGeo = new THREE.BoxGeometry(borderThickness, borderHeight, worldH);
    let westMesh = new THREE.Mesh(sideGeo, wallMat);
    westMesh.position.set(-halfW, borderHeight/2, 0);
    westMesh.castShadow = true;
    westMesh.receiveShadow = true;
    scene.add(westMesh);
    state.blocks.push({ x: -halfW, z: 0, w: borderThickness, d: worldH, mesh: westMesh, isBorder: true });

    let eastMesh = new THREE.Mesh(sideGeo, wallMat);
    eastMesh.position.set(halfW, borderHeight/2, 0);
    eastMesh.castShadow = true;
    eastMesh.receiveShadow = true;
    scene.add(eastMesh);
    state.blocks.push({ x: halfW, z: 0, w: borderThickness, d: worldH, mesh: eastMesh, isBorder: true });

    const cubeGeo = new THREE.BoxGeometry(6, 3, 6);
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0xc49a6c, roughness: 0.7 });
    const roofGeo = new THREE.ConeGeometry(4.5, 3, 4);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.7 });

    for (let x = -halfW + 20; x <= halfW - 20; x += 20) {
        for (let z = -halfH + 20; z <= halfH - 20; z += 20) {
            if (Math.random() > 0.75 && !(Math.abs(x) < 25 && Math.abs(z - 60) < 25)) {
                let houseGroup = new THREE.Group();
                
                let cubeMesh = new THREE.Mesh(cubeGeo, cubeMat);
                cubeMesh.position.y = 1.5;
                cubeMesh.castShadow = true;
                cubeMesh.receiveShadow = true;
                houseGroup.add(cubeMesh);

                let roofMesh = new THREE.Mesh(roofGeo, roofMat);
                roofMesh.position.y = 4.5;
                roofMesh.rotation.y = Math.PI / 4;
                roofMesh.castShadow = true;
                roofMesh.receiveShadow = true;
                houseGroup.add(roofMesh);

                houseGroup.position.set(x, 0, z);
                scene.add(houseGroup);

                state.blocks.push({ x, z, w: 6, d: 6, mesh: houseGroup, isBorder: false });
            }
        }
    }

    if (playerTankMesh) scene.remove(playerTankMesh);
    const pTank = createTankModel(0x2e7d32);
    playerTankMesh = pTank.group;
    playerBarrelMesh = pTank.barrel;
}

function spawnEnemies(count) {
    let enemyColor = stageData[state.stage - 1].color;
    let halfW = worldW / 2 - 20;
    let halfH = worldH / 2 - 20;

    for (let i = 0; i < count; i++) {
        let ex, ez;
        do {
            ex = (Math.random() - 0.5) * halfW * 1.5;
            ez = (Math.random() - 0.5) * halfH * 1.5;
        } while (Math.abs(ex - state.player.x) < 35 && Math.abs(ez - state.player.z) < 35);

        let eTank;
        if (customEnemyGeometry) {
            eTank = createTankModel(enemyColor);
        } else {
            eTank = createEnhancedEnemyTank(enemyColor);
        }

        eTank.group.position.set(ex, 0, ez);
        scene.add(eTank.group);

        state.enemies.push({
            x: ex,
            z: ez,
            angle: Math.random() * Math.PI * 2,
            group: eTank.group,
            wheels: eTank.wheels || [],
            fireCooldown: Math.floor(Math.random() * 60) + 30
        });
    }
}

function createExplosion(x, z) {
    playSound('explosion');
    const particleCount = 25;
    const explosionGroup = new THREE.Group();
    explosionGroup.position.set(x, 1.5, z);
    
    const particles = [];
    for (let i = 0; i < particleCount; i++) {
        let color = Math.random() > 0.6 ? 0xff3300 : (Math.random() > 0.3 ? 0xffcc00 : 0x111111);
        const geometry = new THREE.SphereGeometry(0.4 + Math.random() * 0.4, 8, 8);
        const material = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
        const mesh = new THREE.Mesh(geometry, material);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const speed = 0.15 + Math.random() * 0.45;
        
        particles.push({
            mesh: mesh,
            vx: Math.sin(phi) * Math.cos(theta) * speed,
            vy: Math.cos(phi) * speed + 0.05,
            vz: Math.sin(phi) * Math.sin(theta) * speed
        });
        explosionGroup.add(mesh);
    }
    
    scene.add(explosionGroup);
    state.explosions.push({ group: explosionGroup, particles: particles, life: 35 });
}

function updateUI() {
    document.getElementById('stage-num').innerText = state.stage;
    document.getElementById('enemy-count').innerText = state.enemies.length;
    document.getElementById('ammo-count').innerText = state.ammo;
    document.getElementById('timer').innerText = state.timer;
    
    document.getElementById('sculpt-stage-num').innerText = state.stage;
    document.getElementById('sculpt-enemy-count').innerText = stageData[state.stage - 1].enemies;
    document.getElementById('sculpt-ammo-count').innerText = stageData[state.stage - 1].ammo;
    document.getElementById('sculpt-timer').innerText = stageData[state.stage - 1].time;
}

function drawMinimap() {
    if (!minimapCtx) return;
    minimapCtx.clearRect(0, 0, 110, 110);

    let scale = 110 / worldW;
    let offsetX = 55;
    let offsetZ = 55;

    state.blocks.forEach(b => {
        minimapCtx.fillStyle = b.isBorder ? '#555555' : '#c49a6c';
        let bx = (b.x - b.w/2) * scale + offsetX;
        let bz = (b.z - b.d/2) * scale + offsetZ;
        minimapCtx.fillRect(bx, bz, b.w * scale, b.d * scale);
    });

    state.enemies.forEach(e => {
        minimapCtx.fillStyle = '#ff0000';
        let ex = e.x * scale + offsetX;
        let ez = e.z * scale + offsetZ;
        minimapCtx.beginPath();
        minimapCtx.arc(ex, ez, 2.5, 0, Math.PI * 2);
        minimapCtx.fill();
    });

    minimapCtx.fillStyle = '#00ff00';
    let px = state.player.x * scale + offsetX;
    let pz = state.player.z * scale + offsetZ;
    minimapCtx.beginPath();
    minimapCtx.arc(px, pz, 3.5, 0, Math.PI * 2);
    minimapCtx.fill();

    minimapCtx.strokeStyle = '#ffff00';
    minimapCtx.lineWidth = 2;
    minimapCtx.beginPath();
    minimapCtx.moveTo(px, pz);
    minimapCtx.lineTo(px + Math.sin(state.player.angle) * 6, pz + Math.cos(state.player.angle) * 6);
    minimapCtx.stroke();
}

function startGame() {
    initAudio();
    if (!scene) init3D();
    document.getElementById('overlay').classList.add('d-none');
    state.active = true;
    
    let currentConfig = stageData[state.stage - 1];
    state.timer = currentConfig.time;
    state.ammo = currentConfig.ammo;
    if(state.stage === 1) state.kills = 0;

    state.bullets.forEach(b => scene.remove(b.mesh));
    state.bullets = [];

    state.player.x = 0;
    state.player.z = worldH / 2 - 20;
    state.player.angle = 0;
    state.player.moveDir = 0;
    state.player.turnDir = 0;

    buildWorld();
    spawnEnemies(currentConfig.enemies);
    updateUI();

    if(state.timerInt) clearInterval(state.timerInt);
    state.timerInt = setInterval(() => {
        if(state.active) {
            state.timer--;
            updateUI();
            if(state.timer <= 0) endGame("TIME EXPIRED");
        }
    }, 1000);

    requestAnimationFrame(gameLoop);
}

function setMove(dir) {
    if (dir === 'up') state.player.moveDir = 1;
    if (dir === 'down') state.player.moveDir = -1;
    if (dir === 'left') state.player.turnDir = 1;
    if (dir === 'right') state.player.turnDir = -1;
}

function stopMove() {
    state.player.moveDir = 0;
    state.player.turnDir = 0;
}

function checkCollision(nx, nz, size) {
    return state.blocks.some(b => {
        let halfW = b.w / 2;
        let halfD = b.d / 2;
        return (nx + size/2 > b.x - halfW && nx - size/2 < b.x + halfW &&
                nz + size/2 > b.z - halfD && nz - size/2 < b.z + halfD);
    });
}

function gameLoop() {
    if (!state.active) return;

    state.player.angle += state.player.turnDir * state.player.turnSpeed;
    let nx = state.player.x + Math.sin(state.player.angle) * state.player.moveDir * state.player.speed;
    let nz = state.player.z + Math.cos(state.player.angle) * state.player.moveDir * state.player.speed;

    if (!checkCollision(nx, state.player.z, 4)) state.player.x = nx;
    if (!checkCollision(state.player.x, nz, 4)) state.player.z = nz;

    playerTankMesh.position.set(state.player.x, 0, state.player.z);
    playerTankMesh.rotation.y = state.player.angle;

    camera.position.set(state.player.x, 2.2, state.player.z);
    const lookTarget = new THREE.Vector3(
        state.player.x + Math.sin(state.player.angle) * 20,
        2.2,
        state.player.z + Math.cos(state.player.angle) * 20
    );
    camera.lookAt(lookTarget);

    for (let i = state.explosions.length - 1; i >= 0; i--) {
        let exp = state.explosions[i];
        exp.life--;
        exp.particles.forEach(p => {
            p.mesh.position.x += p.vx;
            p.mesh.position.y += p.vy;
            p.mesh.position.z += p.vz;
            p.mesh.scale.multiplyScalar(0.94);
        });
        if (exp.life <= 0) {
            scene.remove(exp.group);
            state.explosions.splice(i, 1);
        }
    }

    state.enemies.forEach(en => {
        let enSpeed = 0.3;
        let nextX = en.x - Math.sin(en.angle) * enSpeed;
        let nextZ = en.z - Math.cos(en.angle) * enSpeed;

        if (checkCollision(nextX, nextZ, 4)) {
            en.angle += Math.PI + (Math.random() - 0.5) * 1.5;
        } else {
            en.x = nextX;
            en.z = nextZ;
            if (en.wheels && en.wheels.length > 0) {
                en.wheels.forEach(w => {
                    w.rotation.x += 0.15;
                });
            }
        }

        en.group.position.set(en.x, 0, en.z);
        en.group.rotation.y = en.angle;

        en.fireCooldown--;
        if (en.fireCooldown <= 0) {
            en.fireCooldown = Math.floor(Math.random() * 80) + 60;
            let bGeo = new THREE.SphereGeometry(0.3, 8, 8);
            let bMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            let ebMesh = new THREE.Mesh(bGeo, bMat);
            let ebx = en.x - Math.sin(en.angle) * 3;
            let ebz = en.z - Math.cos(en.angle) * 3;
            ebMesh.position.set(ebx, 1.5, ebz);
            scene.add(ebMesh);
            state.bullets.push({
                mesh: ebMesh,
                x: ebx,
                z: ebz,
                angle: en.angle,
                speed: 1.2,
                isEnemy: true,
                isReversed: true
            });
        }

        if (Math.abs(en.x - state.player.x) < 4 && Math.abs(en.z - state.player.z) < 4) {
            createExplosion(state.player.x, state.player.z);
            endGame("TANK DESTROYED!");
        }
    });

    for (let i = state.bullets.length - 1; i >= 0; i--) {
        let b = state.bullets[i];
        if (b.isEnemy && b.isReversed) {
            b.x -= Math.sin(b.angle) * b.speed;
            b.z -= Math.cos(b.angle) * b.speed;
        } else {
            b.x += Math.sin(b.angle) * b.speed;
            b.z += Math.cos(b.angle) * b.speed;
        }
        b.mesh.position.set(b.x, 1.5, b.z);

        let blockIndex = state.blocks.findIndex(bl => {
            let halfW = bl.w / 2;
            let halfD = bl.d / 2;
            return (b.x > bl.x - halfW && b.x < bl.x + halfW &&
                    b.z > bl.z - halfD && b.z < bl.z + halfD);
        });

        if (blockIndex !== -1) {
            let bl = state.blocks[blockIndex];
            createExplosion(bl.x, bl.z);
            if (!bl.isBorder) {
                scene.remove(bl.mesh);
                state.blocks.splice(blockIndex, 1);
            }
            scene.remove(b.mesh);
            state.bullets.splice(i, 1);
            continue;
        }

        if (b.isEnemy) {
            if (Math.abs(b.x - state.player.x) < 3 && Math.abs(b.z - state.player.z) < 3) {
                createExplosion(state.player.x, state.player.z);
                scene.remove(b.mesh);
                state.bullets.splice(i, 1);
                endGame("TANK DESTROYED!");
                break;
            }
        } else {
            let hitIndex = state.enemies.findIndex(en => Math.abs(b.x - en.x) < 3 && Math.abs(b.z - en.z) < 3);
            if (hitIndex !== -1) {
                createExplosion(state.enemies[hitIndex].x, state.enemies[hitIndex].z);
                scene.remove(state.enemies[hitIndex].group);
                state.enemies.splice(hitIndex, 1);
                scene.remove(b.mesh);
                state.bullets.splice(i, 1);
                state.kills++;
                state.ammo += 5;
                updateUI();

                if (state.enemies.length === 0) {
                    if (state.stage < 7) {
                        let completedStage = state.stage;
                        state.stage++;
                        endGame(`STAGE ${completedStage} CLEAR!`);
                    } else {
                        endGame("ULTIMATE MISSION ACCOMPLISHED!");
                        state.stage = 1;
                    }
                }
                break;
            }
        }
    }

    renderer.render(scene, camera);
    drawMinimap();
    requestAnimationFrame(gameLoop);
}

function playerFire() {
    if (!state.active || state.ammo <= 0) return;
    state.ammo--;
    updateUI();
    playSound('shoot');

    const bulletGeo = new THREE.SphereGeometry(0.3, 8, 8);
    const bulletMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const bMesh = new THREE.Mesh(bulletGeo, bulletMat);
    
    let bx = state.player.x + Math.sin(state.player.angle) * 3;
    let bz = state.player.z + Math.cos(state.player.angle) * 3;
    bMesh.position.set(bx, 1.5, bz);
    scene.add(bMesh);

    state.bullets.push({
        mesh: bMesh,
        x: bx,
        z: bz,
        angle: state.player.angle,
        speed: 1.5,
        isEnemy: false
    });
}

function endGame(msg) {
    state.active = false;
    clearInterval(state.timerInt);
    document.getElementById('overlay-title').innerText = msg;
    document.getElementById('overlay-title').style.color = msg.includes("CLEAR") || msg.includes("ACCOMPLISHED") ? "#4CAF50" : "#ff4444";
    document.getElementById('final-kills').innerText = "Enemies Defeated: " + state.kills;
    
    const startBtn = document.getElementById('start-btn');
    if (msg.includes("CLEAR!")) {
        startBtn.innerText = `START STAGE ${state.stage}`;
    } else if (msg.includes("ULTIMATE")) {
        startBtn.innerText = "PLAY AGAIN";
    } else {
        startBtn.innerText = "RESTART MISSION";
        state.stage = 1;
    }
    document.getElementById('overlay').classList.remove('d-none');
}

function onWindowResize() {
    if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    if (sculptCamera && sculptRenderer) {
        const container = document.getElementById('sculpt-viewport');
        sculptCamera.aspect = container.clientWidth / container.clientHeight;
        sculptCamera.updateProjectionMatrix();
        sculptRenderer.setSize(container.clientWidth, container.clientHeight);
    }
}

function openSculptModal() {
    document.getElementById('gltf-file-input').click();
}

async function handleFileLoaded(event) {
    let file = event.target.files[0];
    if (!file) return;

    let fileName = file.name.toLowerCase();

    if (fileName.endsWith('.heic') || fileName.endsWith('.heif')) {
        try {
            const convertedBlob = await heic2any({
                blob: file,
                toType: "image/jpeg",
                quality: 0.8
            });
            file = new File([convertedBlob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: "image/jpeg" });
            fileName = file.name.toLowerCase();
        } catch (err) {
            console.error("HEIC conversion failed:", err);
            alert("Could not process HEIC/HEIF file format. Please upload standard JPG or PNG.");
            return;
        }
    }

    if (fileName.endsWith('.png') || fileName.endsWith('.jpg') || fileName.endsWith('.jpeg') || fileName.endsWith('.gif')) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const imgWidth = img.naturalWidth || img.width || 1;
                const imgHeight = img.naturalHeight || img.height || 1;
                const aspect = imgHeight / imgWidth;

                const boxWidth = 4;
                const boxDepth = 6;
                const boxHeight = Math.max(0.5, boxWidth * aspect);

                const textureLoader = new THREE.TextureLoader();
                textureLoader.load(e.target.result, (texture) => {
                    const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                    const imageMat = new THREE.MeshBasicMaterial({ map: texture });
                    
                    const materials = [
                        imageMat,
                        imageMat,
                        blackMat,
                        blackMat,
                        imageMat,
                        imageMat
                    ];

                    const geo = new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth);
                    const mesh = new THREE.Mesh(geo, materials);
                    const group = new THREE.Group();
                    group.add(mesh);
                    document.getElementById('sculpt-overlay').classList.remove('d-none');
                    updateUI();
                    initSculptViewport(group);
                });
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        return;
    }

    const reader = new FileReader();
    
    if (fileName.endsWith('.usdz')) {
        const usdzLoader = new THREE.USDZLoader();
        reader.onload = function(e) {
            try {
                const modelScene = usdzLoader.parse(e.target.result);
                processLoadedModelScene(modelScene);
            } catch (err) {
                alert("Error parsing USDZ file.");
                console.error(err);
            }
        };
        reader.readAsArrayBuffer(file);
        return;
    }

    if (fileName.endsWith('.dae')) {
        const daeLoader = new THREE.ColladaLoader();
        reader.onload = function(e) {
            try {
                const textDecoder = new TextDecoder();
                const daeText = textDecoder.decode(e.target.result);
                const collada = daeLoader.parse(daeText);
                processLoadedModelScene(collada.scene);
            } catch (err) {
                alert("Error parsing DAE (Collada) file.");
                console.error(err);
            }
        };
        reader.readAsArrayBuffer(file);
        return;
    }

    reader.onload = function(e) {
        const contents = e.target.result;
        
        if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
            const loader = new THREE.GLTFLoader();
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
            loader.setDRACOLoader(dracoLoader);

            loader.parse(contents, '', (gltf) => {
                processLoadedModelScene(gltf.scene);
            }, (error) => {
                alert("Error parsing GLB/GLTF file.");
                console.error(error);
            });
        } 
        else if (fileName.endsWith('.obj')) {
            const objLoader = new THREE.OBJLoader();
            try {
                const textDecoder = new TextDecoder();
                const objText = textDecoder.decode(contents);
                const objGroup = objLoader.parse(objText);
                processLoadedModelScene(objGroup);
            } catch (err) {
                alert("Error parsing OBJ file.");
                console.error(err);
            }
        } 
        else if (fileName.endsWith('.fbx')) {
            const fbxLoader = new THREE.FBXLoader();
            try {
                const fbxGroup = fbxLoader.parse(contents, '');
                processLoadedModelScene(fbxGroup);
            } catch (err) {
                alert("Error parsing FBX file.");
                console.error(err);
            }
        }
        else if (fileName.endsWith('.blend')) {
            alert("Blender project files (.blend) cannot be parsed directly in browsers without export. A fallback container tank model has been loaded.");
            const fallbackGeo = new THREE.BoxGeometry(4, 2, 6);
            const fallbackMat = new THREE.MeshBasicMaterial({ color: 0x9955ff });
            const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
            const group = new THREE.Group();
            group.add(fallbackMesh);
            document.getElementById('sculpt-overlay').classList.remove('d-none');
            updateUI();
            initSculptViewport(group);
        }
        else {
            alert("Unsupported format. Please select a valid 3D model or image file.");
        }
    };
    
    reader.readAsArrayBuffer(file);
}

function processLoadedModelScene(modelScene) {
    modelScene.traverse((node) => {
        if (node.isMesh && node.material) {
            let originalMap = node.material.map;
            let originalColor = node.material.color ? node.material.color.clone() : new THREE.Color(0xffffff);
            node.material = new THREE.MeshBasicMaterial({
                map: originalMap,
                color: originalMap ? 0xffffff : originalColor
            });
        }
    });
    document.getElementById('sculpt-overlay').classList.remove('d-none');
    updateUI();
    initSculptViewport(modelScene);
}

function initSculptViewport(modelGroup) {
    const container = document.getElementById('sculpt-viewport');
    container.innerHTML = '';

    sculptScene = new THREE.Scene();
    sculptScene.background = new THREE.Color(0x151518);

    const width = container.clientWidth;
    const height = container.clientHeight;
    sculptCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    sculptCamera.position.set(0, 3, 7);
    sculptCamera.lookAt(0, 0, 0);

    sculptRenderer = new THREE.WebGLRenderer({ antialias: true });
    sculptRenderer.setSize(width, height);
    container.appendChild(sculptRenderer.domElement);

    const ambLight = new THREE.AmbientLight(0xffffff, 1.0);
    sculptScene.add(ambLight);

    const box = new THREE.Box3().setFromObject(modelGroup);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const targetSize = 3.5;
    const scaleFactor = targetSize / (maxDim > 0 ? maxDim : 1);
    modelGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);

    box.setFromObject(modelGroup);
    const center = box.getCenter(new THREE.Vector3());
    modelGroup.position.x = -center.x;
    modelGroup.position.y = -center.y;
    modelGroup.position.z = -center.z;

    sculptMesh = modelGroup;
    sculptScene.add(sculptMesh);

    let isSculptDragging = false;
    let previousTouchPosition = { x: 0, y: 0 };

    container.onpointerdown = (e) => {
        isSculptDragging = true;
        previousTouchPosition = { x: e.clientX, y: e.clientY };
    };

    container.onpointermove = (e) => {
        if (!isSculptDragging || !sculptMesh) return;
        const deltaX = e.clientX - previousTouchPosition.x;
        const deltaY = e.clientY - previousTouchPosition.y;

        sculptMesh.rotation.y += deltaX * 0.01;
        sculptMesh.rotation.x += deltaY * 0.01;

        previousTouchPosition = { x: e.clientX, y: e.clientY };
    };

    window.onpointerup = () => {
        isSculptDragging = false;
    };

    if (sculptAnimFrame) cancelAnimationFrame(sculptAnimFrame);
    runSculptLoop();
}

function runSculptLoop() {
    if (sculptMesh) {
        if (sculptRotDir === 'up') sculptMesh.rotation.x -= 0.03;
        if (sculptRotDir === 'down') sculptMesh.rotation.x += 0.03;
        if (sculptRotDir === 'left') sculptMesh.rotation.y += 0.03;
        if (sculptRotDir === 'right') sculptMesh.rotation.y -= 0.03;
    }
    sculptRenderer.render(sculptScene, sculptCamera);
    sculptAnimFrame = requestAnimationFrame(runSculptLoop);
}

function sculptRotate(dir) {
    sculptRotDir = dir;
}

function sculptStop() {
    sculptRotDir = null;
}

function confirmCustomEnemy() {
    if (sculptMesh) {
        // Corrected orientation mapping: applies a 180-degree offset so front setter aligns with gameplay forward vector
        sculptMesh.rotation.y += Math.PI;
        customEnemyGeometry = sculptMesh.clone();
    }
    if (sculptAnimFrame) cancelAnimationFrame(sculptAnimFrame);
    document.getElementById('sculpt-overlay').classList.add('d-none');
    startGame();
}
</script>
</body>
