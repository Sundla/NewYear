<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>3D Sculpt & Paint Studio</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      touch-action: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Floating UI Panels Base */
    .ui-panel {
      position: absolute;
      z-index: 10;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    /* Unified Top Navigation Bar */
    #top-bar {
      top: 8px;
      left: 8px;
      right: 8px;
      background: rgba(25, 25, 25, 0.92);
      backdrop-filter: blur(10px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 110;
    }

    #top-bar::-webkit-scrollbar {
      display: none;
    }

    .top-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Left Toolbar: Brush Sliders (Shifted down to prevent collisions) */
    #left-toolbar {
      top: 115px;
      left: 8px;
      flex-direction: column;
      background: rgba(25, 25, 25, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 6px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      align-items: center;
      gap: 12px;
      width: 44px;
      z-index: 90;
    }

    /* Dynamic Bottom/Top Options Container */
    #bottom-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 100;
      width: 98%;
      max-width: 680px;
      pointer-events: none;
      transition: top 0.3s ease, bottom 0.3s ease;
    }

    /* Default Anchored at Bottom */
    #bottom-container.dock-bottom {
      top: auto;
      bottom: calc(52px + env(safe-area-inset-bottom, 0px));
    }

    /* Shifted Directly Below Top Panel */
    #bottom-container.dock-top {
      bottom: auto;
      top: 54px;
    }

    /* Floating Sub-options Bar */
    .sub-bar {
      display: none;
      background: rgba(18, 18, 18, 0.94);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 210, 255, 0.4);
      gap: 6px;
      pointer-events: auto;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      max-width: 100%;
      overflow-x: auto;
      touch-action: pan-x;
    }

    /* Main Control Toolbar */
    #bottom-bar {
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(12px);
      padding: 8px 12px;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      width: 100%;
      pointer-events: auto;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      overflow-x: auto;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: auto;
    }

    #bottom-bar::-webkit-scrollbar {
      height: 4px;
    }
    #bottom-bar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    /* Slider Track Controls */
    .slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .slider-icon {
      font-size: 10px;
      color: #aaa;
      font-weight: bold;
    }

    input[type="range"].thin-dragger {
      -webkit-appearance: none;
      appearance: none;
      width: 4px;
      height: 90px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      cursor: pointer;
      touch-action: auto;
    }

    input[type="range"].thin-dragger::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d2ff;
      box-shadow: 0 0 6px rgba(0, 210, 255, 0.8);
      cursor: pointer;
    }

    /* Buttons Styling */
    .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-icon.active {
      background: rgba(0, 210, 255, 0.25);
      border-color: #00d2ff;
      color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .btn-primary { background-color: #007bff; border: none; }
    .btn-success { background-color: #28a745; border: none; }

    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    input[type="file"] { display: none; }

    #loading-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 24px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Modal Overlay */
    #modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px;
      width: 320px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      color: #00d2ff;
    }

    .modal-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      font-weight: 600;
    }

    .shape-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .shape-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 6px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }

    .shape-option.selected {
      border-color: #00d2ff;
      background: rgba(0, 210, 255, 0.2);
      color: #00d2ff;
    }

    .modal-color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

  <div id="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">Choose 3D Canvas Shape</div>
      
      <div class="modal-group">
        <span class="modal-label">Base Primitive</span>
        <div class="shape-grid">
          <div class="shape-option selected" data-shape="cube">Cube</div>
          <div class="shape-option" data-shape="sphere">Sphere</div>
          <div class="shape-option" data-shape="pyramid">Pyramid</div>
          <div class="shape-option" data-shape="cylinder">Cylinder</div>
          <div class="shape-option" data-shape="torus">Torus</div>
          <div class="shape-option" data-shape="cone">Cone</div>
        </div>
      </div>

      <div class="modal-group">
        <div class="modal-color-row">
          <span class="modal-label">Initial Color</span>
          <input type="color" id="start-color" value="#ffffff" />
        </div>
      </div>

      <button id="start-create-btn" class="btn-icon btn-primary" style="padding: 10px; font-weight: bold;">
        Create Canvas
      </button>
    </div>
  </div>

  <div id="canvas-container">
    
    <div id="top-bar" class="ui-panel">
      <div class="top-group">
        <button id="undo-btn" class="btn-icon" title="Undo">↺</button>
        <button id="redo-btn" class="btn-icon" title="Redo">↻</button>
        <button id="symmetry-btn" class="btn-icon active" title="Toggle Symmetry">🪞 Symmetry</button>
        
        <button id="dock-toggle-btn" class="btn-icon" title="Move Controls Up/Down">↕️</button>
      </div>

      <div class="top-group">
        <label for="file-input" class="btn-icon btn-primary">📁 Load</label>
        <input type="file" id="file-input" accept=".glb, .gltf, .obj" />
        <button id="export-btn" class="btn-icon btn-success">💾 Save</button>
      </div>
    </div>

    <div id="left-toolbar" class="ui-panel">
      <div class="slider-container" title="Brush Size">
        <span class="slider-icon">SZ</span>
        <input type="range" id="brush-size" class="thin-dragger" min="0.05" max="1.5" step="0.01" value="0.4" />
      </div>

      <div class="slider-container" title="Brush Strength">
        <span class="slider-icon">ST</span>
        <input type="range" id="brush-strength" class="thin-dragger" min="0.01" max="0.5" step="0.01" value="0.1" />
      </div>

      <div class="slider-container" title="Paint Color">
        <input type="color" id="brush-color" value="#00d2ff" />
      </div>
    </div>

    <div id="bottom-container" class="dock-bottom">
      
      <div id="sculpt-options" class="sub-bar">
        <button id="sculpt-mode-build" class="btn-icon active">➕ Build</button>
        <button id="sculpt-mode-carve" class="btn-icon">➖ Carve</button>
        <span style="color: rgba(255,255,255,0.3)">|</span>
        <button id="sculpt-shape-sphere" class="btn-icon active">🔴 Sphere</button>
        <button id="sculpt-shape-cone" class="btn-icon">🔺 Cone</button>
        <button id="sculpt-shape-box" class="btn-icon">⬛ Box</button>
      </div>

      <div id="select-options" class="sub-bar">
        <button id="sel-point" class="btn-icon active">📍 Point</button>
        <button id="sel-line" class="btn-icon">📏 Line</button>
        <button id="sel-side" class="btn-icon">🔷 Side</button>
      </div>

      <div id="gizmo-options" class="sub-bar">
        <button id="toggle-gizmo-btn" class="btn-icon">🏹 Axis Arrows</button>
        <button id="gizmo-translate" class="btn-icon active">Move</button>
        <button id="gizmo-rotate" class="btn-icon">Rotate</button>
        <button id="gizmo-scale" class="btn-icon">Scale</button>
      </div>

      <div id="bottom-bar">
        <button id="tool-view" class="btn-icon active">🖐️ Move</button>
        <button id="tool-sculpt" class="btn-icon">🌋 Sculpt</button>
        <button id="tool-smooth" class="btn-icon">💧 Smooth</button>
        <button id="tool-paint" class="btn-icon">🖌️ Paint</button>
        <button id="tool-select" class="btn-icon">📐 Select</button>
        <button id="tool-transform" class="btn-icon">🎯 Transform</button>
      </div>
    </div>

    <div id="loading-screen">Processing Model...</div>
  </div>

  <script>
    // --- State Engine ---
    const STATE = {
      activeTool: 'view',
      selectSubMode: 'point',
      sculptAction: 'build',
      sculptShape: 'sphere',
      symmetry: true,
      dockedTop: false,
      brushSize: 0.4,
      brushStrength: 0.1,
      brushColor: '#00d2ff',
      isInteracting: false,
      showGizmo: false,
      dragStartPoint: null
    };

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const loadingScreen = document.getElementById('loading-screen');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // Controls
    const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.05;

    const transformControls = new THREE.TransformControls(camera, renderer.domElement);
    scene.add(transformControls);

    transformControls.addEventListener('dragging-changed', (event) => {
      orbitControls.enabled = !event.value;
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Canvas Texture & Painting Setup
    let currentMesh = null;
    const drawCanvas = document.createElement('canvas');
    drawCanvas.width = 1024;
    drawCanvas.height = 1024;
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });

    function resetCanvas(color = '#ffffff') {
      drawCtx.fillStyle = color;
      drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
    }
    resetCanvas();

    const canvasTexture = new THREE.CanvasTexture(drawCanvas);
    canvasTexture.flipY = true;

    // Loaders
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    const objLoader = new THREE.OBJLoader();
    const exporter = new THREE.GLTFExporter();

    // History Engine
    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 15;

    function saveHistoryState() {
      if (!currentMesh) return;
      if (undoStack.length >= MAX_HISTORY) undoStack.shift();

      const geoState = currentMesh.geometry.attributes.position.clone();
      const textureState = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
      
      undoStack.push({ geometry: geoState, texture: textureState });
      redoStack = [];
    }

    function undo() {
      if (undoStack.length <= 1) return;
      redoStack.push(undoStack.pop());
      const state = undoStack[undoStack.length - 1];
      applyState(state);
    }

    function redo() {
      if (redoStack.length === 0) return;
      const state = redoStack.pop();
      undoStack.push(state);
      applyState(state);
    }

    function applyState(state) {
      if (!currentMesh || !state) return;
      currentMesh.geometry.attributes.position.copy(state.geometry);
      currentMesh.geometry.attributes.position.needsUpdate = true;
      currentMesh.geometry.computeVertexNormals();

      drawCtx.putImageData(state.texture, 0, 0);
      canvasTexture.needsUpdate = true;
    }

    // Modal Selector
    let selectedShape = 'cube';
    const shapeOptions = document.querySelectorAll('.shape-option');
    shapeOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        shapeOptions.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedShape = opt.dataset.shape;
      });
    });

    document.getElementById('start-create-btn').addEventListener('click', () => {
      const color = document.getElementById('start-color').value;
      initShape(selectedShape || 'cube', color);
      document.getElementById('modal-overlay').style.display = 'none';
    });

    function initShape(shapeType, colorHex) {
      let geometry;
      switch (shapeType) {
        case 'sphere': 
          geometry = new THREE.SphereGeometry(1, 64, 64); 
          break;
        case 'pyramid': 
          geometry = new THREE.ConeGeometry(1.2, 1.5, 4, 32); 
          break;
        case 'cylinder': 
          geometry = new THREE.CylinderGeometry(0.8, 0.8, 1.5, 32, 32); 
          break;
        case 'torus': 
          geometry = new THREE.TorusGeometry(0.8, 0.3, 32, 48); 
          break;
        case 'cone': 
          geometry = new THREE.ConeGeometry(0.9, 1.5, 32, 32); 
          break;
        case 'cube':
        default: 
          geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5, 32, 32, 32); 
          break;
      }

      resetCanvas(colorHex);

      const material = new THREE.MeshStandardMaterial({
        map: canvasTexture,
        roughness: 0.4,
        metalness: 0.1,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geometry, material);
      setupModel(mesh);
    }

    function setupModel(mesh) {
      if (currentMesh) {
        scene.remove(currentMesh);
        transformControls.detach();
      }

      currentMesh = mesh;
      
      if (currentMesh.geometry.index) {
        currentMesh.geometry = currentMesh.geometry.toNonIndexed();
      }

      scene.add(currentMesh);
      transformControls.attach(currentMesh);
      transformControls.enabled = false;

      undoStack = [];
      redoStack = [];
      saveHistoryState();
      
      loadingScreen.style.display = 'none';
    }

    initShape('cube', '#ffffff');

    // File Importer
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      loadingScreen.style.display = 'block';
      const filename = file.name.toLowerCase();

      const handleLoadedObj = (objScene) => {
        let foundMesh = null;
        objScene.traverse((child) => {
          if (child.isMesh && !foundMesh) foundMesh = child;
        });

        if (foundMesh) {
          foundMesh.material = new THREE.MeshStandardMaterial({
            map: canvasTexture,
            roughness: 0.4,
            metalness: 0.1
          });
          setupModel(foundMesh);
        } else {
          alert('No valid 3D mesh found.');
          loadingScreen.style.display = 'none';
        }
      };

      if (filename.endsWith('.glb') || filename.endsWith('.gltf')) {
        gltfLoader.load(URL.createObjectURL(file), (gltf) => handleLoadedObj(gltf.scene));
      } else if (filename.endsWith('.obj')) {
        objLoader.load(URL.createObjectURL(file), (obj) => handleLoadedObj(obj));
      }
    });

    // Panel Position Docking Toggle (Up / Down)
    const dockContainer = document.getElementById('bottom-container');
    const dockToggleBtn = document.getElementById('dock-toggle-btn');
    const leftToolbar = document.getElementById('left-toolbar');

    dockToggleBtn.addEventListener('click', () => {
      STATE.dockedTop = !STATE.dockedTop;
      dockToggleBtn.classList.toggle('active', STATE.dockedTop);

      if (STATE.dockedTop) {
        dockContainer.classList.remove('dock-bottom');
        dockContainer.classList.add('dock-top');
        leftToolbar.style.top = '150px'; // Move sliders further down when panel is up
      } else {
        dockContainer.classList.remove('dock-top');
        dockContainer.classList.add('dock-bottom');
        leftToolbar.style.top = '115px';
      }
    });

    // Tool Management
    const toolButtons = {
      view: document.getElementById('tool-view'),
      sculpt: document.getElementById('tool-sculpt'),
      smooth: document.getElementById('tool-smooth'),
      paint: document.getElementById('tool-paint'),
      select: document.getElementById('tool-select'),
      transform: document.getElementById('tool-transform')
    };

    const sculptOptions = document.getElementById('sculpt-options');
    const gizmoOptions = document.getElementById('gizmo-options');
    const selectOptions = document.getElementById('select-options');
    const toggleGizmoBtn = document.getElementById('toggle-gizmo-btn');

    function setActiveTool(tool) {
      STATE.activeTool = tool;
      Object.keys(toolButtons).forEach((key) => {
        toolButtons[key].classList.toggle('active', key === tool);
      });

      orbitControls.enabled = (tool === 'view');
      
      sculptOptions.style.display = (tool === 'sculpt') ? 'flex' : 'none';
      selectOptions.style.display = (tool === 'select') ? 'flex' : 'none';
      gizmoOptions.style.display = (tool === 'transform') ? 'flex' : 'none';
      transformControls.enabled = (tool === 'transform' && STATE.showGizmo);
    }

    Object.keys(toolButtons).forEach((tool) => {
      toolButtons[tool].addEventListener('click', () => setActiveTool(tool));
    });

    // Sculpt Action / Shapes
    const sculptBuildBtn = document.getElementById('sculpt-mode-build');
    const sculptCarveBtn = document.getElementById('sculpt-mode-carve');

    sculptBuildBtn.addEventListener('click', () => {
      STATE.sculptAction = 'build';
      sculptBuildBtn.classList.add('active');
      sculptCarveBtn.classList.remove('active');
    });

    sculptCarveBtn.addEventListener('click', () => {
      STATE.sculptAction = 'carve';
      sculptCarveBtn.classList.add('active');
      sculptBuildBtn.classList.remove('active');
    });

    const shapeBtns = {
      sphere: document.getElementById('sculpt-shape-sphere'),
      cone: document.getElementById('sculpt-shape-cone'),
      box: document.getElementById('sculpt-shape-box')
    };

    Object.keys(shapeBtns).forEach(shape => {
      shapeBtns[shape].addEventListener('click', () => {
        STATE.sculptShape = shape;
        Object.keys(shapeBtns).forEach(s => shapeBtns[s].classList.toggle('active', s === shape));
      });
    });

    // Select Sub Modes
    const selectSubBtns = {
      point: document.getElementById('sel-point'),
      line: document.getElementById('sel-line'),
      side: document.getElementById('sel-side')
    };

    Object.keys(selectSubBtns).forEach(mode => {
      selectSubBtns[mode].addEventListener('click', () => {
        STATE.selectSubMode = mode;
        Object.keys(selectSubBtns).forEach(m => selectSubBtns[m].classList.toggle('active', m === mode));
      });
    });

    // Gizmo Controls
    toggleGizmoBtn.addEventListener('click', () => {
      STATE.showGizmo = !STATE.showGizmo;
      toggleGizmoBtn.classList.toggle('active', STATE.showGizmo);
      transformControls.enabled = (STATE.activeTool === 'transform' && STATE.showGizmo);
    });

    document.getElementById('gizmo-translate').addEventListener('click', (e) => {
      transformControls.setMode('translate');
      updateGizmoUI(e.target);
    });
    document.getElementById('gizmo-rotate').addEventListener('click', (e) => {
      transformControls.setMode('rotate');
      updateGizmoUI(e.target);
    });
    document.getElementById('gizmo-scale').addEventListener('click', (e) => {
      transformControls.setMode('scale');
      updateGizmoUI(e.target);
    });

    function updateGizmoUI(activeBtn) {
      document.querySelectorAll('#gizmo-options button').forEach(b => {
        if (b !== toggleGizmoBtn) b.classList.remove('active');
      });
      activeBtn.classList.add('active');
    }

    document.getElementById('brush-size').addEventListener('input', (e) => STATE.brushSize = parseFloat(e.target.value));
    document.getElementById('brush-strength').addEventListener('input', (e) => STATE.brushStrength = parseFloat(e.target.value));
    document.getElementById('brush-color').addEventListener('input', (e) => STATE.brushColor = e.target.value);
    
    const symmetryBtn = document.getElementById('symmetry-btn');
    symmetryBtn.addEventListener('click', () => {
      STATE.symmetry = !STATE.symmetry;
      symmetryBtn.classList.toggle('active', STATE.symmetry);
    });

    document.getElementById('undo-btn').addEventListener('click', undo);
    document.getElementById('redo-btn').addEventListener('click', redo);

    document.getElementById('export-btn').addEventListener('click', () => {
      if (!currentMesh) return;
      exporter.parse(
        currentMesh,
        (result) => {
          const blob = new Blob([result], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'sculpted-model.glb';
          link.click();
        },
        { binary: true }
      );
    });

    // Engine Core Interactor
    let selectedIndices = [];

    function performSculptOrPaint(e) {
      if (!currentMesh || STATE.activeTool === 'view' || STATE.activeTool === 'transform') return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentMesh);

      if (intersects.length > 0) {
        const hit = intersects[0];

        if (STATE.activeTool === 'paint' && hit.uv) {
          paintTexture(hit.uv);
          if (STATE.symmetry) {
            const symUV = new THREE.Vector2(1.0 - hit.uv.x, hit.uv.y);
            paintTexture(symUV);
          }
        } else if (STATE.activeTool === 'sculpt' || STATE.activeTool === 'smooth') {
          sculptMesh(hit.point, hit.face.normal, STATE.activeTool === 'smooth');
          if (STATE.symmetry) {
            const symPoint = hit.point.clone();
            symPoint.x *= -1;
            const symNormal = hit.face.normal.clone();
            symNormal.x *= -1;
            sculptMesh(symPoint, symNormal, STATE.activeTool === 'smooth');
          }
        } else if (STATE.activeTool === 'select') {
          manipulateSelection(hit);
        }
      }
    }

    function manipulateSelection(hit) {
      const positions = currentMesh.geometry.attributes.position;
      const radius = STATE.brushSize;
      
      if (!STATE.dragStartPoint) {
        STATE.dragStartPoint = hit.point.clone();
        selectedIndices = [];

        const face = hit.face;
        if (STATE.selectSubMode === 'point') {
          selectedIndices.push(face.a);
        } else if (STATE.selectSubMode === 'line') {
          selectedIndices.push(face.a, face.b);
        } else if (STATE.selectSubMode === 'side') {
          const localCenter = currentMesh.worldToLocal(hit.point.clone());
          for (let i = 0; i < positions.count; i++) {
            const vx = positions.getX(i), vy = positions.getY(i), vz = positions.getZ(i);
            if (Math.sqrt((vx - localCenter.x)**2 + (vy - localCenter.y)**2 + (vz - localCenter.z)**2) < radius) {
              selectedIndices.push(i);
            }
          }
        }
      } else {
        const delta = hit.point.distanceTo(STATE.dragStartPoint) * STATE.brushStrength * 0.5;
        const normal = hit.face.normal;

        selectedIndices.forEach(idx => {
          positions.setXYZ(
            idx,
            positions.getX(idx) + normal.x * delta,
            positions.getY(idx) + normal.y * delta,
            positions.getZ(idx) + normal.z * delta
          );
        });

        positions.needsUpdate = true;
        currentMesh.geometry.computeVertexNormals();
      }
    }

    function sculptMesh(centerPoint, normal, isSmooth) {
      const positions = currentMesh.geometry.attributes.position;
      const localCenter = currentMesh.worldToLocal(centerPoint.clone());
      const radius = STATE.brushSize;
      const strength = STATE.brushStrength * (STATE.sculptAction === 'carve' ? -1 : 1);

      for (let i = 0; i < positions.count; i++) {
        const vx = positions.getX(i);
        const vy = positions.getY(i);
        const vz = positions.getZ(i);

        const dist = Math.sqrt((vx - localCenter.x) ** 2 + (vy - localCenter.y) ** 2 + (vz - localCenter.z) ** 2);

        if (dist < radius) {
          let falloff = 0;

          if (STATE.sculptShape === 'cone') {
            falloff = (1 - dist / radius);
          } else if (STATE.sculptShape === 'box') {
            falloff = 1.0;
          } else {
            falloff = (1 - dist / radius) ** 2;
          }

          if (isSmooth) {
            positions.setXYZ(
              i,
              vx + (localCenter.x - vx) * STATE.brushStrength * falloff * 0.2,
              vy + (localCenter.y - vy) * STATE.brushStrength * falloff * 0.2,
              vz + (localCenter.z - vz) * STATE.brushStrength * falloff * 0.2
            );
          } else {
            positions.setXYZ(
              i,
              vx + normal.x * strength * falloff * 0.2,
              vy + normal.y * strength * falloff * 0.2,
              vz + normal.z * strength * falloff * 0.2
            );
          }
        }
      }

      positions.needsUpdate = true;
      currentMesh.geometry.computeVertexNormals();
    }

    let lastUV = null;
    function paintTexture(uv) {
      const x = uv.x * drawCanvas.width;
      const y = (1 - uv.y) * drawCanvas.height;
      const radius = STATE.brushSize * 30;

      drawCtx.fillStyle = STATE.brushColor;
      drawCtx.strokeStyle = STATE.brushColor;
      drawCtx.lineWidth = radius * 2;
      drawCtx.lineCap = 'round';

      drawCtx.beginPath();
      if (lastUV) {
        drawCtx.moveTo(lastUV.x, lastUV.y);
        drawCtx.lineTo(x, y);
      } else {
        drawCtx.arc(x, y, radius, 0, Math.PI * 2);
      }
      drawCtx.stroke();
      drawCtx.fill();

      lastUV = { x, y };
      canvasTexture.needsUpdate = true;
    }

    // Pointer Events Listener
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ui-panel') || e.target.closest('#bottom-container') || e.target.closest('#modal-overlay')) return;
      STATE.isInteracting = true;
      STATE.dragStartPoint = null;
      lastUV = null;
      performSculptOrPaint(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (STATE.isInteracting) {
        performSculptOrPaint(e);
      }
    });

    window.addEventListener('pointerup', () => {
      if (STATE.isInteracting) {
        STATE.isInteracting = false;
        STATE.dragStartPoint = null;
        lastUV = null;
        saveHistoryState();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      orbitControls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
