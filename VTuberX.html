<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V-Tuber X</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Welcome Splash Screen */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    #welcome-screen h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #00ffcc;
      text-align: center;
    }

    #welcome-screen p {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 30px;
      text-align: center;
      max-width: 500px;
      padding: 0 20px;
    }

    .btn-start {
      padding: 15px 35px;
      background-color: #00ffcc;
      color: #121212;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-start:hover {
      background-color: #00cca3;
      transform: scale(1.05);
    }

    /* Main App Layout */
    #app-container {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
    }

    /* Upper Half: 3D Viewport */
    #upper-container {
      flex: 1;
      width: 100%;
      position: relative;
      background-color: #1a1a1a;
      border-bottom: 2px solid #333;
      transition: background-color 0.3s ease;
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Lower Half: Camera Window */
    #lower-container {
      flex: 1;
      width: 100%;
      position: relative;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 640px;
      max-height: 480px;
    }

    #camera-video, #camera-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect */
    }

    /* Floating UI Toolbar */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      padding: 10px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }
    .btn:hover { background-color: #0056b3; }
    .btn-capture { background-color: #fd7e14; }
    .btn-capture:hover { background-color: #e06b0e; }
    .btn-vtuber { background-color: #e83e8c; }
    .btn-vtuber:hover { background-color: #d63384; }
    .btn-load { background-color: #20c997; }
    .btn-load:hover { background-color: #17a589; }

    /* Color Picker Trigger Button in Toolbar */
    .custom-color-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }
    .custom-color-btn:hover {
      transform: scale(1.08);
    }
    .color-swatch-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    #status-msg {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: #00ffcc;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }

    /* Interactive Color Wheel Popup (Opens in Middle) */
    #color-wheel-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #444;
      border-radius: 12px;
      padding: 16px;
      z-index: 300;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .wheel-top-actions {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 2px;
      gap: 10px;
    }

    .wheel-shortcut-btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .wheel-shortcut-btn:hover {
      background: #555;
    }

    .color-wheel-container {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      cursor: crosshair;
    }

    #color-wheel-canvas {
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    #wheel-pointer {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    .wheel-info-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 12px;
      font-family: monospace;
      color: #ddd;
      padding: 4px 2px;
    }

    /* POPUP MODAL STYLES FOR IMAGE SETTER */
    #popup-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-content {
      background: #1e1e1e;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 25px rgba(0, 255, 204, 0.3);
    }

    .modal-content h3 {
      color: #00ffcc;
      margin-bottom: 8px;
      font-size: 17px;
    }

    .modal-instructions {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 10px;
      text-align: center;
    }

    .modal-grid-container {
      position: relative;
      width: 300px;
      height: 300px;
      background: #111;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      touch-action: none;
      cursor: grab;
    }
    .modal-grid-container:active {
      cursor: grabbing;
    }

    #popup-grid-canvas {
      width: 100%;
      height: 100%;
      background: #000;
      transform: scaleX(-1); /* Mirrored face grid overlay */
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn-stamp {
      background-color: #00ffcc;
      color: #121212;
    }
    .btn-stamp:hover { background-color: #00cca3; }

    .btn-close-modal {
      background-color: #444;
      color: #fff;
    }
    .btn-close-modal:hover { background-color: #555; }
  </style>

  <!-- Import Map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- MediaPipe FaceMesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <!-- HEIC/HEIF Decoder Library -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Welcome Start Screen -->
  <div id="welcome-screen">
    <h1>V-Tuber X</h1>
    <p>Camera V-Tuber.</p>
    <button id="start-btn" class="btn-start">Start Experience</button>
  </div>

  <!-- Popup Face Grid Adjuster Modal -->
  <div id="popup-modal">
    <div class="modal-content">
      <h3>Align Photo</h3>
      <p class="modal-instructions">👉 Drag to Set.</p>
      <div class="modal-grid-container" id="grid-touch-area">
        <canvas id="popup-grid-canvas" width="300" height="300"></canvas>
      </div>
      <div class="modal-buttons">
        <button id="stamp-grid-btn" class="btn btn-stamp">Stamp Photo on Grid</button>
        <button id="close-modal-btn" class="btn btn-close-modal">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Interactive Color Wheel Popup (Opens in Middle) -->
  <div id="color-wheel-popup">
    <div class="wheel-top-actions">
      <button type="button" id="wheel-btn-black" class="wheel-shortcut-btn">Black</button>
      <button type="button" id="wheel-btn-white" class="wheel-shortcut-btn">White</button>
    </div>
    <div class="color-wheel-container" id="color-wheel-wrapper">
      <canvas id="color-wheel-canvas" width="180" height="180"></canvas>
      <div id="wheel-pointer"></div>
    </div>
    <div class="wheel-info-bar">
      <span id="wheel-selected-hex">#1A1A1A</span>
      <span id="wheel-selected-name">Background Color</span>
    </div>
  </div>

  <!-- Main Application Container -->
  <div id="app-container">
    <!-- UI Action Buttons -->
    <div id="ui-overlay">
      <div id="bg-color-btn" class="custom-color-btn" title="Change Background Color">
        <div id="bg-color-preview" class="color-swatch-inner" style="background-color: #1a1a1a;"></div>
      </div>
      <button id="capture-btn" class="btn btn-capture">Capture Face</button>
      <button id="vtuber-btn" class="btn btn-vtuber">V-Tube Mode</button>
      <input type="file" id="face-file-input" accept="image/png, image/jpeg, image/jpg, image/webp, image/heif, image/heic, .png, .jpg, .jpeg, .webp, .heif, .heic" style="display: none;" />
      <button id="load-face-btn" class="btn btn-load">Load Face Image</button>
    </div>

    <div id="status-msg">Tip: Center your face before capturing!</div>

    <!-- UPPER HALF: 3D Viewport Model -->
    <div id="upper-container">
      <canvas id="three-canvas"></canvas>
    </div>

    <!-- LOWER HALF: Live Camera Window -->
    <div id="lower-container">
      <div class="camera-wrapper">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="camera-canvas"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const welcomeScreen = document.getElementById('welcome-screen');
    const appContainer = document.getElementById('app-container');
    const startBtn = document.getElementById('start-btn');

    // --- 1. THREE.JS SCENE SETUP (Upper Half) ---
    const upperContainer = document.getElementById('upper-container');
    const canvas = document.getElementById('three-canvas');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting setup
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    
    const topRightLight = new THREE.DirectionalLight(0xffffff, 1.4);
    topRightLight.position.set(5, 8, 5);
    scene.add(topRightLight);

    const fillLight = new THREE.DirectionalLight(0xd9e6ff, 0.4);
    fillLight.position.set(-5, -3, -5);
    scene.add(fillLight);

    let liveWireframe = null;
    let capturedMesh = null;
    let vtuberMesh = null;
    let customFaceMesh = null;

    let latestLandmarks = null;
    let isCaptured = false;
    let isVtuberMode = false;
    let isCustomFaceMode = false;

    // --- Color Wheel Implementation Logic ---
    const colorWheelPopup = document.getElementById('color-wheel-popup');
    const colorWheelWrapper = document.getElementById('color-wheel-wrapper');
    const colorWheelCanvas = document.getElementById('color-wheel-canvas');
    const wheelCtx = colorWheelCanvas.getContext('2d', { willReadFrequently: true });
    const wheelPointer = document.getElementById('wheel-pointer');
    const wheelSelectedHex = document.getElementById('wheel-selected-hex');
    const wheelSelectedName = document.getElementById('wheel-selected-name');
    const bgColorBtn = document.getElementById('bg-color-btn');
    const bgColorPreview = document.getElementById('bg-color-preview');

    function renderColorWheel() {
      const radius = colorWheelCanvas.width / 2;
      const imgData = wheelCtx.createImageData(colorWheelCanvas.width, colorWheelCanvas.height);
      const data = imgData.data;

      for (let y = 0; y < colorWheelCanvas.height; y++) {
        for (let x = 0; x < colorWheelCanvas.width; x++) {
          const dx = x - radius;
          const dy = y - radius;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const index = (y * colorWheelCanvas.width + x) * 4;

          if (dist <= radius) {
            const angle = Math.atan2(dy, dx);
            let hue = (angle * 180 / Math.PI + 360) % 360;
            let sat = dist / radius;
            let light = 0.5;

            let c = (1 - Math.abs(2 * light - 1)) * sat;
            let xVal = c * (1 - Math.abs((hue / 60) % 2 - 1));
            let m = light - c / 2;
            let r = 0, g = 0, b = 0;

            if (0 <= hue && hue < 60) { r = c; g = xVal; b = 0; }
            else if (60 <= hue && hue < 120) { r = xVal; g = c; b = 0; }
            else if (120 <= hue && hue < 180) { r = 0; g = c; b = xVal; }
            else if (180 <= hue && hue < 240) { r = 0; g = xVal; b = c; }
            else if (240 <= hue && hue < 300) { r = xVal; g = 0; b = c; }
            else if (300 <= hue && hue < 360) { r = c; g = 0; b = xVal; }

            data[index] = Math.round((r + m) * 255);
            data[index + 1] = Math.round((g + m) * 255);
            data[index + 2] = Math.round((b + m) * 255);
            data[index + 3] = 255;
          } else {
            data[index + 3] = 0;
          }
        }
      }
      wheelCtx.putImageData(imgData, 0, 0);
    }
    renderColorWheel();

    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }

    function updatePointerPosition(x, y) {
      const radius = colorWheelCanvas.width / 2;
      const dx = x - radius;
      const dy = y - radius;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let px = x;
      let py = y;

      if (dist > radius) {
        px = radius + (dx / dist) * radius;
        py = radius + (dy / dist) * radius;
      }

      wheelPointer.style.left = px + 'px';
      wheelPointer.style.top = py + 'px';
      wheelPointer.style.display = 'block';

      return { x: px, y: py };
    }

    function applyBackgroundColor(hex) {
      wheelSelectedHex.innerText = hex;
      bgColorPreview.style.backgroundColor = hex;
      upperContainer.style.backgroundColor = hex;
      scene.background.set(hex);
    }

    function pickColorFromWheel(e) {
      const rect = colorWheelCanvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      if (clientX === undefined || clientY === undefined) return;

      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const constrained = updatePointerPosition(x, y);

      let sampleX = Math.min(Math.max(Math.floor(constrained.x), 0), colorWheelCanvas.width - 1);
      let sampleY = Math.min(Math.max(Math.floor(constrained.y), 0), colorWheelCanvas.height - 1);
      
      const pixel = wheelCtx.getImageData(sampleX, sampleY, 1, 1).data;
      if (pixel[3] > 0) {
        const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
        applyBackgroundColor(hex);
      }
    }

    document.getElementById('wheel-btn-black').addEventListener('click', (e) => {
      e.stopPropagation();
      applyBackgroundColor('#000000');
    });

    document.getElementById('wheel-btn-white').addEventListener('click', (e) => {
      e.stopPropagation();
      applyBackgroundColor('#FFFFFF');
    });

    let isSelectingWheel = false;
    colorWheelWrapper.addEventListener('mousedown', (e) => { isSelectingWheel = true; pickColorFromWheel(e); });
    window.addEventListener('mousemove', (e) => { if (isSelectingWheel) pickColorFromWheel(e); });
    window.addEventListener('mouseup', () => { isSelectingWheel = false; });

    colorWheelWrapper.addEventListener('touchstart', (e) => { isSelectingWheel = true; pickColorFromWheel(e); }, { passive: true });
    window.addEventListener('touchmove', (e) => { if (isSelectingWheel) pickColorFromWheel(e); }, { passive: true });
    window.addEventListener('touchend', () => { isSelectingWheel = false; });

    bgColorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      colorWheelPopup.style.display = colorWheelPopup.style.display === 'flex' ? 'none' : 'flex';
    });

    document.addEventListener('click', (e) => {
      if (!colorWheelPopup.contains(e.target) && !bgColorBtn.contains(e.target)) {
        colorWheelPopup.style.display = 'none';
      }
    });

    // Popup Modal & Touch Transformation States
    const popupModal = document.getElementById('popup-modal');
    const popupGridCanvas = document.getElementById('popup-grid-canvas');
    const popupGridCtx = popupGridCanvas.getContext('2d');
    const gridTouchArea = document.getElementById('grid-touch-area');
    const stampGridBtn = document.getElementById('stamp-grid-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');

    let loadedSourceImage = null;
    let imgTransform = {
      zoom: 1.0,
      offsetX: 0,
      offsetY: 0
    };

    const activePointers = new Map();
    let initialPinchDistance = 0;
    let initialZoom = 1.0;

    gridTouchArea.addEventListener('pointerdown', (e) => {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      gridTouchArea.setPointerCapture(e.pointerId);

      if (activePointers.size === 2) {
        const pointers = Array.from(activePointers.values());
        initialPinchDistance = Math.hypot(pointers[0].x - pointers[1].x, pointers[0].y - pointers[1].y);
        initialZoom = imgTransform.zoom;
      }
    });

    gridTouchArea.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 2) {
        const pointers = Array.from(activePointers.values());
        const currentDistance = Math.hypot(pointers[0].x - pointers[1].x, pointers[0].y - pointers[1].y);
        if (initialPinchDistance > 0) {
          const factor = currentDistance / initialPinchDistance;
          imgTransform.zoom = Math.max(0.3, Math.min(5.0, initialZoom * factor));
          renderPopupGrid();
        }
      } else if (activePointers.size === 1) {
        imgTransform.offsetX += e.movementX;
        imgTransform.offsetY += e.movementY;
        renderPopupGrid();
      }
    });

    function removePointer(e) {
      activePointers.delete(e.pointerId);
      try { gridTouchArea.releasePointerCapture(e.pointerId); } catch(err){}
      if (activePointers.size < 2) {
        initialPinchDistance = 0;
      }
    }

    gridTouchArea.addEventListener('pointerup', removePointer);
    gridTouchArea.addEventListener('pointercancel', removePointer);

    gridTouchArea.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.93;
      imgTransform.zoom = Math.max(0.3, Math.min(5.0, imgTransform.zoom * zoomFactor));
      renderPopupGrid();
    }, { passive: false });

    // --- 2. MEDIAPIPE FACE MESH SETUP ---
    const videoElement = document.getElementById('camera-video');
    const cameraCanvas = document.getElementById('camera-canvas');
    const cameraCtx = cameraCanvas.getContext('2d');
    const statusMsg = document.getElementById('status-msg');
    
    const captureBtn = document.getElementById('capture-btn');
    const vtuberBtn = document.getElementById('vtuber-btn');
    const loadFaceBtn = document.getElementById('load-face-btn');
    const faceFileInput = document.getElementById('face-file-input');

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onFaceResults);

    const mpCamera = new Camera(videoElement, {
      onFrame: async () => {
        if (videoElement.videoWidth) {
          cameraCanvas.width = videoElement.videoWidth;
          cameraCanvas.height = videoElement.videoHeight;
        }
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    startBtn.addEventListener('click', () => {
      welcomeScreen.style.opacity = '0';
      setTimeout(() => {
        welcomeScreen.style.display = 'none';
        appContainer.style.display = 'flex';
        
        onWindowResize();

        mpCamera.start()
          .then(() => { statusMsg.innerText = "Camera Active: Center your face!"; })
          .catch((err) => { 
            console.error(err);
            statusMsg.innerText = "Camera access denied or unavailable. Check browser settings."; 
          });
      }, 500);
    });

    // --- RENDER POPUP GRID & MESH OVERLAY ---
    function renderPopupGrid() {
      if (!loadedSourceImage) return;

      popupGridCtx.clearRect(0, 0, popupGridCanvas.width, popupGridCanvas.height);

      popupGridCtx.save();
      popupGridCtx.translate(popupGridCanvas.width / 2 + imgTransform.offsetX, popupGridCanvas.height / 2 + imgTransform.offsetY);
      popupGridCtx.scale(imgTransform.zoom, imgTransform.zoom);
      
      const w = popupGridCanvas.width;
      const h = popupGridCanvas.height;
      popupGridCtx.drawImage(loadedSourceImage, -w / 2, -h / 2, w, h);
      popupGridCtx.restore();

      if (latestLandmarks) {
        popupGridCtx.save();
        drawConnectors(popupGridCtx, latestLandmarks, FACEMESH_TESSELATION, { color: 'rgba(0, 255, 204, 0.4)', lineWidth: 0.5 });
        drawConnectors(popupGridCtx, latestLandmarks, FACEMESH_RIGHT_EYE, { color: '#00ffcc', lineWidth: 1 });
        drawConnectors(popupGridCtx, latestLandmarks, FACEMESH_LEFT_EYE, { color: '#00ffcc', lineWidth: 1 });
        drawConnectors(popupGridCtx, latestLandmarks, FACEMESH_LIPS, { color: '#ff44aa', lineWidth: 1 });
        drawConnectors(popupGridCtx, latestLandmarks, FACEMESH_FACE_OVAL, { color: '#ffffff', lineWidth: 1.5 });
        popupGridCtx.restore();
      }
    }

    function onFaceResults(results) {
      cameraCtx.save();
      cameraCtx.clearRect(0, 0, cameraCanvas.width, cameraCanvas.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        latestLandmarks = results.multiFaceLandmarks[0];

        drawConnectors(cameraCtx, latestLandmarks, FACEMESH_TESSELATION, { color: 'rgba(0, 255, 204, 0.3)', lineWidth: 0.5 });
        drawConnectors(cameraCtx, latestLandmarks, FACEMESH_RIGHT_EYE, { color: '#00ffcc', lineWidth: 1 });
        drawConnectors(cameraCtx, latestLandmarks, FACEMESH_LEFT_EYE, { color: '#00ffcc', lineWidth: 1 });
        drawConnectors(cameraCtx, latestLandmarks, FACEMESH_LIPS, { color: '#ff44aa', lineWidth: 1 });
        drawConnectors(cameraCtx, latestLandmarks, FACEMESH_FACE_OVAL, { color: '#ffffff', lineWidth: 1 });

        if (isVtuberMode) {
          updateVtuberAvatar(latestLandmarks);
        } else if (isCustomFaceMode) {
          updateCustomFaceAvatar(latestLandmarks);
        } else if (!isCaptured) {
          updateUpperWireframe(latestLandmarks);
        } else {
          updateCapturedMesh(latestLandmarks);
        }

        if (popupModal.style.display === 'flex') {
          renderPopupGrid();
        }
      } else {
        latestLandmarks = null;
        statusMsg.innerText = "Looking for face... Center your face.";
      }
      cameraCtx.restore();
    }

    function updateUpperWireframe(landmarks) {
      if (!landmarks) return;

      const positions = [];
      landmarks.forEach(pt => {
        positions.push(-(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
      });

      if (!liveWireframe) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

        const lineIndices = [];
        FACEMESH_TESSELATION.forEach(pair => {
          lineIndices.push(pair[0], pair[1]);
        });
        geometry.setIndex(lineIndices);

        const material = new THREE.LineBasicMaterial({ color: 0x00ffcc });
        liveWireframe = new THREE.LineSegments(geometry, material);
        scene.add(liveWireframe);
      } else {
        const posAttr = liveWireframe.geometry.attributes.position;
        landmarks.forEach((pt, index) => {
          posAttr.setXYZ(index, -(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
        });
        posAttr.needsUpdate = true;
      }
    }

    function updateCapturedMesh(landmarks) {
      if (!capturedMesh || !landmarks) return;

      const posAttr = capturedMesh.geometry.attributes.position;
      landmarks.forEach((pt, index) => {
        posAttr.setXYZ(index, -(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
      });
      posAttr.needsUpdate = true;
      capturedMesh.geometry.computeVertexNormals();
    }

    // --- V-TUBE MODE: UNIFORM ANIME SKIN TONE ---
    function createVtuberTexture() {
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 1024;
      texCanvas.height = 1024;
      const ctx = texCanvas.getContext('2d');

      ctx.fillStyle = '#ffe0db';
      ctx.fillRect(0, 0, 1024, 1024);

      const texture = new THREE.CanvasTexture(texCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function createVtuberAvatar() {
      if (liveWireframe) { scene.remove(liveWireframe); liveWireframe = null; }
      if (capturedMesh) { scene.remove(capturedMesh); capturedMesh = null; }
      if (customFaceMesh) { scene.remove(customFaceMesh); customFaceMesh = null; }
      if (vtuberMesh) { scene.remove(vtuberMesh); }

      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];

      latestLandmarks.forEach(pt => {
        positions.push(-(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
        uvs.push(pt.x, 1.0 - pt.y);
      });

      const indices = [];
      for (let i = 0; i < FACEMESH_TESSELATION.length; i += 3) {
        if (i + 2 < FACEMESH_TESSELATION.length) {
          indices.push(FACEMESH_TESSELATION[i][0], FACEMESH_TESSELATION[i+1][0], FACEMESH_TESSELATION[i+2][0]);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const vtuberTexture = createVtuberTexture();
      const material = new THREE.MeshStandardMaterial({
        map: vtuberTexture,
        roughness: 0.35,
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      vtuberMesh = new THREE.Mesh(geometry, material);
      scene.add(vtuberMesh);
    }

    function updateVtuberAvatar(landmarks) {
      if (!vtuberMesh || !landmarks) return;

      const posAttr = vtuberMesh.geometry.attributes.position;
      landmarks.forEach((pt, index) => {
        posAttr.setXYZ(index, -(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
      });
      posAttr.needsUpdate = true;
      vtuberMesh.geometry.computeVertexNormals();
    }

    // --- UNIVERSAL IMAGE LOADER & HEIC/HEIF CONVERTER FLOW ---
    loadFaceBtn.addEventListener('click', () => {
      faceFileInput.click();
    });

    faceFileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      let imageFile = file;
      const fileName = file.name.toLowerCase();
      const isHeic = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';

      try {
        statusMsg.innerText = "Processing image...";
        if (isHeic && typeof heic2any !== 'undefined') {
          const convertedBlob = await heic2any({
            blob: file,
            toType: 'image/jpeg',
            quality: 0.9
          });
          imageFile = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            loadedSourceImage = img;
            imgTransform.zoom = 1.0;
            imgTransform.offsetX = 0;
            imgTransform.offsetY = 0;

            statusMsg.innerText = "Tip: Center your face before capturing!";
            popupModal.style.display = 'flex';
            renderPopupGrid();
          };
          img.onerror = function() {
            statusMsg.innerText = "Error decoding image file.";
            alert("Could not load image. Please try a different file.");
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(imageFile);
      } catch (err) {
        console.error(err);
        statusMsg.innerText = "Error parsing HEIC/HEIF file.";
        alert("Failed to convert HEIC/HEIF file. Make sure your browser allows processing.");
      }
    });

    closeModalBtn.addEventListener('click', () => {
      popupModal.style.display = 'none';
    });

    // --- STAMP PHOTO ON GRID BUTTON (APPLY TO 3D MASK) ---
    stampGridBtn.addEventListener('click', () => {
      if (!loadedSourceImage) return;
      if (!latestLandmarks) {
        alert("Please ensure camera is running and detecting your face for tracking!");
        return;
      }

      const bakeCanvas = document.createElement('canvas');
      bakeCanvas.width = 1024;
      bakeCanvas.height = 1024;
      const bakeCtx = bakeCanvas.getContext('2d');

      bakeCtx.fillStyle = '#111';
      bakeCtx.fillRect(0, 0, 1024, 1024);

      const scaleFactor = 1024 / 300;
      bakeCtx.save();
      bakeCtx.translate(1024 / 2 + imgTransform.offsetX * scaleFactor, 1024 / 2 + imgTransform.offsetY * scaleFactor);
      bakeCtx.scale(imgTransform.zoom, imgTransform.zoom);
      bakeCtx.drawImage(loadedSourceImage, -1024 / 2, -1024 / 2, 1024, 1024);
      bakeCtx.restore();

      const customTexture = new THREE.CanvasTexture(bakeCanvas);
      customTexture.colorSpace = THREE.SRGBColorSpace;

      isCustomFaceMode = true;
      isVtuberMode = false;
      isCaptured = false;
      vtuberBtn.innerText = "V-Tube Mode";

      if (liveWireframe) { scene.remove(liveWireframe); liveWireframe = null; }
      if (capturedMesh) { scene.remove(capturedMesh); capturedMesh = null; }
      if (vtuberMesh) { scene.remove(vtuberMesh); vtuberMesh = null; }

      createCustomFaceAvatar(customTexture);

      popupModal.style.display = 'none';
      statusMsg.innerText = "Custom face stamped and tracking your motions!";
    });

    function createCustomFaceAvatar(texture) {
      if (customFaceMesh) { scene.remove(customFaceMesh); }

      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];

      latestLandmarks.forEach(pt => {
        positions.push(-(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
        uvs.push(pt.x, 1.0 - pt.y);
      });

      const indices = [];
      for (let i = 0; i < FACEMESH_TESSELATION.length; i += 3) {
        if (i + 2 < FACEMESH_TESSELATION.length) {
          indices.push(FACEMESH_TESSELATION[i][0], FACEMESH_TESSELATION[i+1][0], FACEMESH_TESSELATION[i+2][0]);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.3,
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      customFaceMesh = new THREE.Mesh(geometry, material);
      scene.add(customFaceMesh);
    }

    function updateCustomFaceAvatar(landmarks) {
      if (!customFaceMesh || !landmarks) return;

      const posAttr = customFaceMesh.geometry.attributes.position;
      landmarks.forEach((pt, index) => {
        posAttr.setXYZ(index, -(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
      });
      posAttr.needsUpdate = true;
      customFaceMesh.geometry.computeVertexNormals();
    }

    // --- BUTTON EVENT HANDLERS ---
    captureBtn.addEventListener('click', () => {
      isVtuberMode = false;
      isCustomFaceMode = false;
      vtuberBtn.innerText = "V-Tube Mode";
      if (vtuberMesh) { scene.remove(vtuberMesh); vtuberMesh = null; }
      if (customFaceMesh) { scene.remove(customFaceMesh); customFaceMesh = null; }

      if (!latestLandmarks) {
        alert("No face detected to capture!");
        return;
      }

      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = videoElement.videoWidth || 640;
      snapCanvas.height = videoElement.videoHeight || 480;
      const snapCtx = snapCanvas.getContext('2d');
      snapCtx.save();
      snapCtx.scale(-1, 1);
      snapCtx.drawImage(videoElement, -snapCanvas.width, 0, snapCanvas.width, snapCanvas.height);
      snapCtx.restore();

      const texture = new THREE.CanvasTexture(snapCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      if (isCaptured && capturedMesh) {
        capturedMesh.material.map = texture;
        capturedMesh.material.map.needsUpdate = true;
        statusMsg.innerText = "Texture Updated!";
        return;
      }

      isCaptured = true;
      if (liveWireframe) {
        scene.remove(liveWireframe);
        liveWireframe = null;
      }

      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];

      latestLandmarks.forEach(pt => {
        positions.push(-(pt.x - 0.5) * 2.2, -(pt.y - 0.5) * 2.2, -pt.z * 2.2);
        uvs.push(1.0 - pt.x, 1.0 - pt.y);
      });

      const indices = [];
      for (let i = 0; i < FACEMESH_TESSELATION.length; i += 3) {
        if (i + 2 < FACEMESH_TESSELATION.length) {
          indices.push(FACEMESH_TESSELATION[i][0], FACEMESH_TESSELATION[i+1][0], FACEMESH_TESSELATION[i+2][0]);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.25,
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      capturedMesh = new THREE.Mesh(geometry, material);
      scene.add(capturedMesh);

      captureBtn.innerText = "Update Face Texture";
      statusMsg.innerText = "Mask is now tracking your face movements!";
    });

    vtuberBtn.addEventListener('click', () => {
      if (!latestLandmarks) {
        alert("No face detected for V-Tube mode!");
        return;
      }

      isVtuberMode = !isVtuberMode;
      if (isVtuberMode) {
        isCustomFaceMode = false;
        if (liveWireframe) { scene.remove(liveWireframe); liveWireframe = null; }
        if (capturedMesh) { scene.remove(capturedMesh); capturedMesh = null; isCaptured = false; captureBtn.innerText = "Capture Face Texture"; }
        if (customFaceMesh) { scene.remove(customFaceMesh); customFaceMesh = null; }
        
        createVtuberAvatar();
        vtuberBtn.innerText = "Exit V-Tube Mode";
        statusMsg.innerText = "V-Tube Anime Mode Active.";
      } else {
        if (vtuberMesh) { scene.remove(vtuberMesh); vtuberMesh = null; }
        vtuberBtn.innerText = "V-Tube Mode";
        statusMsg.innerText = "Exited V-Tube Mode.";
      }
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    function onWindowResize() {
      if (appContainer.style.display === 'flex') {
        camera.aspect = upperContainer.clientWidth / upperContainer.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(upperContainer.clientWidth, upperContainer.clientHeight);
      }
    }
    window.addEventListener('resize', onWindowResize);
  </script>
</body>
</html>
