<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }

        :root {
            --stage-color: #4E2D17;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--stage-color);
            background-attachment: fixed;
            overflow-x: hidden;
            font-family: 'Courier New', Courier, monospace; 
        }

        #carromCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
            touch-action: none; 
        }

        .parallax-container {
            position: relative;
            z-index: 2;
            height: 180vh; 
            pointer-events: none; 
        }

        .button-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            pointer-events: none; 
        }

        .carrom-btn {
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 16px 30px;
            border-radius: 14px; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            background: transparent;
            text-align: center;
            width: 100%; 
            pointer-events: auto;
            position: relative;
        }

        .btn-tank1 {
            color: #ff4d4d;
            border: 2px solid #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.7);
            box-shadow: inset 0 0 15px rgba(255, 77, 77, 0.1), 0 0 15px rgba(255, 77, 77, 0.2);
        }
        .btn-tank1:hover {
            background: rgba(255, 77, 77, 0.15);
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.8);
        }

        .btn-tank2 {
            color: #ff9900;
            border: 2px solid #ff9900;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.7);
            box-shadow: inset 0 0 15px rgba(255, 153, 0, 0.1), 0 0 15px rgba(255, 153, 0, 0.2);
        }
        .btn-tank2:hover {
            background: rgba(255, 153, 0, 0.15);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
        }

        .btn-gta {
            color: #ffffff;
            border: 2px solid #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.1), 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .btn-gta:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
        }

        .color-module-container { 
            position: fixed; 
            top: 34px;
            right: 34px;
            z-index: 1200;
            display: flex; 
            align-items: center; 
            pointer-events: auto;
        }
        .native-wheel-proxy {
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            border: 2px solid rgba(255, 255, 255, 0.4);
            position: relative; 
            cursor: pointer;
            background: #4E2D17;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }
        .native-wheel-proxy:hover {
            border-color: #ffffff;
            transform: scale(1.08);
            transition: transform 0.2s ease;
        }

        #color-wheel-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 24, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            z-index: 1300;
            box-shadow: 0 10px 35px rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wheel-top-actions {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 6px;
        }

        .wheel-shortcut-btn {
            background: #2a2a38;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .wheel-shortcut-btn:hover { background: #00d2ff; color: #121212; }

        .color-wheel-container {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            cursor: crosshair;
        }

        #color-wheel-canvas {
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        #wheel-pointer {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }

        .wheel-info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            font-family: monospace;
            color: #8e8e9f;
            padding: 2px 4px;
        }
    </style>
</head>
<body>

    <canvas id="carromCanvas"></canvas>

    <div class="parallax-container">
        <div class="button-overlay">
            <a href="TankWars.html" class="carrom-btn btn-tank1" id="btn1">Tank Wars</a>
            <a href="TankWarz.html" class="carrom-btn btn-tank2" id="btn2">Tank Wars 2</a>
            <a href="GTA.html" class="carrom-btn btn-gta" id="btn3">GTA</a>
        </div>
    </div>

    <div class="color-module-container">
        <div class="native-wheel-proxy" id="color-indicator-preview" title="Change Stage Theme Color"></div>
    </div>

    <div id="color-wheel-popup">
        <div class="wheel-top-actions">
            <button type="button" id="wheel-btn-black" class="wheel-shortcut-btn">BL</button>
            <button type="button" id="wheel-btn-edit" class="wheel-shortcut-btn">Edit</button>
            <button type="button" id="wheel-btn-white" class="wheel-shortcut-btn">WH</button>
            <input type="color" id="native-color-picker-input" style="display:none;">
        </div>
        <div class="color-wheel-container" id="color-wheel-wrapper">
            <canvas id="color-wheel-canvas" width="160" height="160"></canvas>
            <div id="wheel-pointer"></div>
        </div>
        <div class="wheel-info-bar">
            <span id="wheel-selected-hex">#4E2D17</span>
            <span id="wheel-selected-name">Chocolate Wood</span>
        </div>
    </div>

    <script>
        const ArtWheelController = {
            init() {
                const canvas = document.getElementById('color-wheel-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const wrapper = document.getElementById('color-wheel-wrapper');
                const pointer = document.getElementById('wheel-pointer');
                const hexLabel = document.getElementById('wheel-selected-hex');
                const nameLabel = document.getElementById('wheel-selected-name');
                const nativeColorInput = document.getElementById('native-color-picker-input');
                const colorPopup = document.getElementById('color-wheel-popup');
                const indicatorPreview = document.getElementById('color-indicator-preview');

                const radius = canvas.width / 2;
                const imgData = ctx.createImageData(canvas.width, canvas.height);
                const data = imgData.data;

                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const dx = x - radius;
                        const dy = y - radius;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const index = (y * canvas.width + x) * 4;

                        if (dist <= radius) {
                            const angle = Math.atan2(dy, dx);
                            let hue = (angle * 180 / Math.PI + 360) % 360;
                            let sat = dist / radius;
                            let light = 0.5;

                            let c = (1 - Math.abs(2 * light - 1)) * sat;
                            let xVal = c * (1 - Math.abs((hue / 60) % 2 - 1));
                            let m = light - c / 2;
                            let r = 0, g = 0, b = 0;

                            if (0 <= hue && hue < 60) { r = c; g = xVal; b = 0; }
                            else if (60 <= hue && hue < 120) { r = xVal; g = c; b = 0; }
                            else if (120 <= hue && hue < 180) { r = 0; g = c; b = xVal; }
                            else if (180 <= hue && hue < 240) { r = 0; g = xVal; b = c; }
                            else if (240 <= hue && hue < 300) { r = xVal; g = 0; b = c; }
                            else if (300 <= hue && hue < 360) { r = c; g = 0; b = xVal; }

                            data[index] = Math.round((r + m) * 255);
                            data[index + 1] = Math.round((g + m) * 255);
                            data[index + 2] = Math.round((b + m) * 255);
                            data[index + 3] = 255;
                        } else {
                            data[index + 3] = 0;
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                const rgbToHex = (r, g, b) => "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();

                const getColorName = (r, g, b) => {
                    if (r === 0 && g === 0 && b === 0) return 'Lamp Black';
                    if (r === 255 && g === 255 && g === 255) return 'Titanium White';

                    let rf = r / 255, gf = g / 255, bf = b / 255;
                    let max = Math.max(rf, gf, bf), min = Math.min(rf, gf, bf);
                    let h, s, l = (max + min) / 2;

                    if (max === min) {
                        h = s = 0;
                    } else {
                        let d = max - min;
                        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                        switch (max) {
                            case rf: h = (gf - bf) / d + (gf < bf ? 6 : 0); break;
                            case gf: h = (bf - rf) / d + 2; break;
                            case bf: h = (rf - gf) / d + 4; break;
                        }
                        h /= 6;
                    }

                    const hue = Math.round(h * 360);
                    const sat = Math.round(s * 100);
                    const light = Math.round(l * 100);

                    if (light < 15) return 'Dark Shade';
                    if (light > 85 && sat < 15) return 'Light Tint';
                    if (sat < 15) return 'Neutral Gray';

                    if (hue < 15 || hue >= 345) return 'Crimson Red';
                    if (hue < 45) return 'Warm Orange';
                    if (hue < 70) return 'Golden Yellow';
                    if (hue < 150) return 'Emerald Green';
                    if (hue < 190) return 'Turquoise Cyan';
                    if (hue < 260) return 'Cobalt Blue';
                    if (hue < 315) return 'Deep Violet';
                    return 'Magenta Pink';
                };

                const applyColorChange = (hex) => {
                    indicatorPreview.style.backgroundColor = hex;
                    document.documentElement.style.setProperty('--stage-color', hex);
                };

                let activeTargetCallback = null;

                const pickColor = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    if (clientX === undefined) return;

                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    const dx = x - radius;
                    const dy = y - radius;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    let px = x, py = y;
                    if (dist > radius) {
                        px = radius + (dx / dist) * radius;
                        py = radius + (dy / dist) * radius;
                    }

                    pointer.style.left = px + 'px';
                    pointer.style.top = py + 'px';
                    pointer.style.display = 'block';

                    const sx = Math.min(Math.max(Math.floor(px), 0), canvas.width - 1);
                    const sy = Math.min(Math.max(Math.floor(py), 0), canvas.height - 1);
                    const pixel = ctx.getImageData(sx, sy, 1, 1).data;

                    if (pixel[3] > 0) {
                        const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
                        const name = getColorName(pixel[0], pixel[1], pixel[2]);
                        hexLabel.innerText = hex;
                        nameLabel.innerText = name;
                        if (activeTargetCallback) activeTargetCallback(hex);
                    }
                };

                let selecting = false;
                wrapper.addEventListener('mousedown', (e) => { selecting = true; pickColor(e); });
                window.addEventListener('mousemove', (e) => { if (selecting) pickColor(e); });
                window.addEventListener('mouseup', () => { selecting = false; });

                wrapper.addEventListener('touchstart', (e) => { selecting = true; pickColor(e); }, { passive: true });
                window.addEventListener('touchmove', (e) => { if (selecting) pickColor(e); }, { passive: true });
                window.addEventListener('touchend', () => { selecting = false; });

                document.getElementById('wheel-btn-black').addEventListener('click', (e) => {
                    e.stopPropagation();
                    hexLabel.innerText = '#000000';
                    nameLabel.innerText = 'Lamp Black';
                    pointer.style.display = 'none';
                    if (activeTargetCallback) activeTargetCallback('#000000');
                });

                document.getElementById('wheel-btn-white').addEventListener('click', (e) => {
                    e.stopPropagation();
                    hexLabel.innerText = '#FFFFFF';
                    nameLabel.innerText = 'Titanium White';
                    pointer.style.display = 'none';
                    if (activeTargetCallback) activeTargetCallback('#FFFFFF');
                });

                document.getElementById('wheel-btn-edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    nativeColorInput.click();
                });

                nativeColorInput.addEventListener('input', (e) => {
                    const hex = e.target.value.toUpperCase();
                    const bigint = parseInt(hex.slice(1), 16);
                    const r = (bigint >> 16) & 255;
                    const g = (bigint >> 8) & 255;
                    const b = bigint & 255;
                    const name = getColorName(r, g, b);
                    hexLabel.innerText = hex;
                    nameLabel.innerText = name;
                    pointer.style.display = 'none';
                    if (activeTargetCallback) activeTargetCallback(hex);
                });

                const setupTrigger = (elId, callback) => {
                    const el = document.getElementById(elId);
                    if (el) {
                        el.addEventListener('click', (e) => {
                            e.stopPropagation();
                            activeTargetCallback = callback;
                            colorPopup.style.display = 'flex';
                        });
                    }
                };

                setupTrigger('color-indicator-preview', (hex) => {
                    applyColorChange(hex);
                });

                document.addEventListener('click', (e) => {
                    if (!colorPopup.contains(e.target) && !indicatorPreview.contains(e.target)) {
                        colorPopup.style.display = 'none';
                    }
                });
            }
        };
        ArtWheelController.init();

        const btn1 = document.getElementById('btn1');
        const scoreButton = document.getElementById('btn2');
        const btn3 = document.getElementById('btn3');

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'slide') {
                // Single smooth sliding sound when player moves by tap
                const bufferSize = audioCtx.sampleRate * 0.10;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(280, now);
                filter.Q.setValueAtTime(2.5, now);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.10);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start(now);
                noise.stop(now + 0.10);
                return;
            } else if (type === 'wall') {
                // Single crisp sound when striking a wall/corner
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            } else if (type === 'hit') {
                // Single short wooden thud when striking a piece
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.06);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            } else if (type === 'pocket') {
                // Single smooth suction/entry sound when going into black hole
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            } else if (type === 'foul') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        const canvas = document.getElementById('carromCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let coins = [];
        let particles = [];
        let score = 0;
        let hasScored = false;

        let lives = 3;
        let currentStage = 1;

        let pendingQueenCover = false;
        let shotScoredAPieceThisTurn = false;

        const coinColors = [
            { fill: '#fffaee', stroke: '#c8b48e', points: 20 },
            { fill: '#332211', stroke: '#554433', points: 10 },
            { fill: '#ff4d4d', stroke: '#991111', points: 50 }
        ];

        function initCarromStack() {
            coins = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 16;

            coins.push({ x: centerX, y: centerY, vx: 0, vy: 0, radius: radius, color: coinColors[2], isQueen: true });

            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const dist = radius * 2.1;
                const color = coinColors[i % 2];
                coins.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    vx: 0, vy: 0, radius: radius, color: color, isQueen: false
                });
            }
        }
        initCarromStack();

        let striker = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: 0,
            vy: 0,
            radius: 22,
            active: false,
            speed: 16
        };

        function resetWholeGame() {
            score = 0;
            lives = 3;
            currentStage = 1;
            hasScored = false;
            pendingQueenCover = false;
            shotScoredAPieceThisTurn = false;
            btn1.textContent = "Tank Wars";
            btn1.style.color = '#ff4d4d';
            scoreButton.textContent = "Tank Wars 2";
            scoreButton.style.color = '#ff9900';
            btn3.textContent = "GTA";
            btn3.style.color = '#ffffff';
            initCarromStack();
            striker.x = canvas.width / 2;
            striker.y = canvas.height / 2;
            striker.vx = 0;
            striker.vy = 0;
            striker.active = false;
        }

        function handleFoul() {
            playSound('foul');
            
            if (hasScored) {
                lives--;
                let heartsStr = '';
                for (let h = 0; h < lives; h++) {
                    heartsStr += '❤';
                }
                btn1.textContent = heartsStr;

                if (lives <= 0) {
                    resetWholeGame();
                    return;
                }
            }

            striker.x = canvas.width / 2;
            striker.y = canvas.height / 2;
            striker.vx = 0;
            striker.vy = 0;
            striker.active = false;
        }

        function handleCanvasTap(clientX, clientY) {
            initAudio();
            playSound('slide');

            shotScoredAPieceThisTurn = false;

            const angle = Math.atan2(clientY - striker.y, clientX - striker.x);
            striker.vx = Math.cos(angle) * striker.speed;
            striker.vy = Math.sin(angle) * striker.speed;
            striker.active = true;
        }

        canvas.addEventListener('mousedown', (e) => handleCanvasTap(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleCanvasTap(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        function animateCarrom() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 45, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 90, 0, Math.PI * 2);
            ctx.stroke();

            let currentPockets = [
                { x: 50, y: 50, radius: 32 },
                { x: canvas.width - 50, y: 50, radius: 32 },
                { x: 50, y: canvas.height - 50, radius: 32 },
                { x: canvas.width - 50, y: canvas.height - 50, radius: 32 }
            ];

            if (currentStage === 2) {
                currentPockets.push(
                    { x: canvas.width / 2, y: 50, radius: 32 },
                    { x: canvas.width / 2, y: canvas.height - 50, radius: 32 },
                    { x: 50, y: canvas.height / 2, radius: 32 },
                    { x: canvas.width - 50, y: canvas.height / 2, radius: 32 }
                );
            }

            currentPockets.forEach(p => {
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.03;

                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = `rgba(255, 245, 220, ${pt.alpha})`;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();
            }

            const minX = 24;
            const maxX = canvas.width - 24;
            const minY = 24;
            const maxY = canvas.height - 24;

            if (striker.active) {
                striker.x += striker.vx;
                striker.y += striker.vy;
                striker.vx *= 0.97;
                striker.vy *= 0.97;

                for (let k = 0; k < 2; k++) {
                    particles.push({
                        x: striker.x + (Math.random() * 10 - 5),
                        y: striker.y + (Math.random() * 10 - 5),
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        alpha: 0.8,
                        size: Math.random() * 2 + 1
                    });
                }

                currentPockets.forEach(p => {
                    if (Math.hypot(striker.x - p.x, striker.y - p.y) < p.radius) {
                        handleFoul();
                    }
                });

                let wallHit = false;
                if (striker.x < minX) { striker.x = minX; striker.vx *= -1; wallHit = true; }
                if (striker.x > maxX) { striker.x = maxX; striker.vx *= -1; wallHit = true; }
                if (striker.y < minY) { striker.y = minY; striker.vy *= -1; wallHit = true; }
                if (striker.y > maxY) { striker.y = maxY; striker.vy *= -1; wallHit = true; }
                if (wallHit) playSound('wall');

                if (Math.hypot(striker.vx, striker.vy) < 0.4) {
                    striker.active = false;
                    striker.vx = 0;
                    striker.vy = 0;
                    
                    if (pendingQueenCover && !shotScoredAPieceThisTurn) {
                        pendingQueenCover = false;
                        const respawnAngle = Math.random() * Math.PI * 2;
                        coins.push({
                            x: cx + Math.cos(respawnAngle) * 90,
                            y: cy + Math.sin(respawnAngle) * 90,
                            vx: 0, vy: 0, radius: 16, color: coinColors[2], isQueen: true
                        });
                    }
                }
            }

            coins.forEach(coin => {
                const dist = Math.hypot(coin.x - striker.x, coin.y - striker.y);
                if (dist < striker.radius + coin.radius) {
                    playSound('hit');
                    const angle = Math.atan2(coin.y - striker.y, coin.x - striker.x);
                    const overlap = (striker.radius + coin.radius) - dist;
                    coin.x += Math.cos(angle) * overlap;
                    coin.y += Math.sin(angle) * overlap;

                    coin.vx = Math.cos(angle) * 7 + striker.vx * 0.5;
                    coin.vy = Math.sin(angle) * 7 + striker.vy * 0.5;
                }
            });

            for (let i = 0; i < coins.length; i++) {
                for (let j = i + 1; j < coins.length; j++) {
                    let c1 = coins[i];
                    let c2 = coins[j];
                    let d = Math.hypot(c2.x - c1.x, c2.y - c1.y);
                    if (d < c1.radius + c2.radius) {
                        playSound('hit');
                        let angle = Math.atan2(c2.y - c1.y, c2.x - c1.x);
                        let overlap = (c1.radius + c2.radius) - d;
                        c1.x -= Math.cos(angle) * overlap / 2;
                        c1.y -= Math.sin(angle) * overlap / 2;
                        c2.x += Math.cos(angle) * overlap / 2;
                        c2.y += Math.sin(angle) * overlap / 2;

                        let tempVx = c1.vx;
                        let tempVy = c1.vy;
                        c1.vx = c2.vx * 0.8;
                        c1.vy = c2.vy * 0.8;
                        c2.vx = tempVx * 0.8;
                        c2.vy = tempVy * 0.8;
                    }
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.x += coin.vx;
                coin.y += coin.vy;
                coin.vx *= 0.96;
                coin.vy *= 0.96;

                let coinWallHit = false;
                if (coin.x < minX) { coin.x = minX; coin.vx *= -1; coinWallHit = true; }
                if (coin.x > maxX) { coin.x = maxX; coin.vx *= -1; coinWallHit = true; }
                if (coin.y < minY) { coin.y = minY; coin.vy *= -1; coinWallHit = true; }
                if (coin.y > maxY) { coin.y = maxY; coin.vy *= -1; coinWallHit = true; }
                if (coinWallHit && (Math.abs(coin.vx) > 0.5 || Math.abs(coin.vy) > 0.5)) {
                    playSound('wall');
                }

                let pocketed = false;
                currentPockets.forEach(p => {
                    if (Math.hypot(coin.x - p.x, coin.y - p.y) < p.radius) {
                        pocketed = true;
                    }
                });

                if (pocketed) {
                    playSound('pocket');
                    coins.splice(i, 1);
                    shotScoredAPieceThisTurn = true;

                    if (!hasScored) {
                        hasScored = true;
                        btn1.textContent = "❤❤❤"; 
                        btn3.style.color = 'transparent';
                        btn3.style.textShadow = 'none';
                    }

                    if (coin.isQueen) {
                        const remainingNonQueen = coins.filter(c => !c.isQueen);
                        if (remainingNonQueen.length === 0) {
                            score += coin.color.points;
                            scoreButton.textContent = `Score: ${score}`;
                        } else {
                            pendingQueenCover = true;
                        }
                    } else {
                        score += coin.color.points;
                        scoreButton.textContent = `Score: ${score}`;

                        if (pendingQueenCover) {
                            pendingQueenCover = false;
                            score += 50; 
                            scoreButton.textContent = `Score: ${score}`;
                        }
                    }

                    if (coins.length === 0) {
                        if (currentStage === 1) {
                            currentStage = 2;
                            setTimeout(initCarromStack, 1000);
                        } else {
                            setTimeout(initCarromStack, 1000);
                        }
                    }
                    continue;
                }

                ctx.save();
                ctx.translate(coin.x, coin.y);
                ctx.fillStyle = coin.color.fill;
                ctx.strokeStyle = coin.color.stroke;
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.arc(0, 0, coin.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = coin.color.stroke;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(0, 0, coin.radius * 0.4, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }

            ctx.save();
            ctx.translate(striker.x, striker.y);
            ctx.fillStyle = '#111111';
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.arc(0, 0, striker.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();

            requestAnimationFrame(animateCarrom);
        }
        animateCarrom();

        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            const scrollDelta = currentScrollY - lastScrollY;
            lastScrollY = currentScrollY;

            coins.forEach(c => c.y -= scrollDelta * 0.15);
            if (!striker.active) striker.y -= scrollDelta * 0.15;
        });
    </script>
</body>
</html>
