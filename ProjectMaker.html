<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Lobster&family=Montserrat:wght@400;500;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;700&family=Sacramento&family=Parisienne&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f0f4fe; font-family: 'Arial', sans-serif; padding: 24px; color: #0f172a; }
        .app-wrapper { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; flex-wrap: wrap; }
        .preview-section { flex: 2; min-width: 350px; }
        
        .master-slide { 
            width: 100%; 
            min-height: 400px; 
            height: auto;
            border-radius: 20px; 
            padding: 40px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: block; 
            transition: background 0.3s; 
            font-family: 'Arial', sans-serif;
        }
        
        .master-slide h1 {
            font-size: 40px;
            margin-bottom: 15px;
            word-wrap: break-word;
        }
        
        .master-slide p {
            font-size: 20px;
            margin-bottom: 20px;
            word-wrap: break-word;
            line-height: 1.5;
        }
        
        .master-slide img { 
            display: block;
            max-width: 100%; 
            max-height: 250px; 
            object-fit: contain; 
            border-radius: 8px; 
            clear: both;
        }
        
        .nav-controls { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
        .thumb-row { display: flex; gap: 10px; margin-top: 20px; overflow-x: auto; padding-bottom: 10px; }
        .thumb { width: 60px; height: 40px; background: #ddd; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .active-thumb { border: 2px solid #4f46e5; }
        
        .tool-panel { flex: 1; min-width: 300px; background: white; padding: 24px; border-radius: 20px; position: relative; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 8px; margin-bottom: 10px; font-weight: bold; width: 100%; }
        
        #imageInput, #fontFileInput { display: none; }

        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .btn-row button, .btn-row select { margin-bottom: 0; width: 50%; }

        /* Customized Color Picker Controls & Wheels */
        .color-picker-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .color-picker-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .custom-color-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .custom-color-btn:hover {
            transform: scale(1.08);
        }

        .color-swatch-inner {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: inset 0 0 2px rgba(0,0,0,0.2);
        }

        /* Interactive Color Wheel Popup */
        #color-wheel-popup {
            display: none;
            position: absolute;
            bottom: 140px;
            left: 24px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .wheel-top-actions {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 2px;
        }

        .wheel-shortcut-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            cursor: pointer;
            width: auto;
            margin-bottom: 0;
            transition: background 0.2s;
        }

        .wheel-shortcut-btn:hover {
            background: #555;
        }

        .color-wheel-container {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            cursor: crosshair;
        }

        #color-wheel-canvas {
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        #wheel-pointer {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }

        .wheel-info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            font-family: monospace;
            color: #ddd;
            padding: 2px 4px;
        }

        /* Style for the Image PDF Maker panel at the bottom */
        .pdf-maker-panel { width: 100%; max-width: 1200px; margin: 40px auto 0 auto; background: white; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .pdf-maker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .pdf-maker-title { font-size: 18px; font-weight: bold; }
        .pdf-maker-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .pdf-maker-buttons { display: flex; gap: 10px; }
        .pdf-thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        .pdf-thumb-wrapper { position: relative; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: #f8fafc; }
        .pdf-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .pdf-thumb-remove { position: absolute; top: 5px; right: 5px; background: rgba(220, 38, 38, 0.85); color: white; border: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
        #bulkImageInput { display: none; }
        #pdfNameInput { width: 220px; margin-bottom: 0; padding: 8px 12px; display: none; }

        /* Animated Modal Popup for Size Selector */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 20px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.85);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: #0f172a;
        }

        .size-inputs-wrapper {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .size-field {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
        }

        .size-field label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        .size-input-box {
            display: flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 10px;
            background: #f8fafc;
            width: 100%;
        }

        .size-input-box input {
            border: none;
            background: transparent;
            padding: 10px 0;
            margin-bottom: 0;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            text-align: center;
        }

        .size-input-box span {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin-left: 4px;
        }

        .size-separator {
            font-size: 20px;
            font-weight: bold;
            color: #64748b;
            padding-bottom: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions button {
            margin-bottom: 0;
            padding: 12px;
        }

        .btn-apply {
            background: #4f46e5;
            color: white;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="preview-section">
        <div class="master-slide" id="slideDisplay">
            <h1 id="dTitle">Title</h1>
            <p id="dDesc">Description</p>
            <img id="dImg" src="" style="display:none;">
        </div>
        
        <div class="nav-controls">
            <button onclick="changeSlide(-1)" style="width:auto;"><i class="fas fa-chevron-left"></i></button>
            <span id="counter">1 / 1</span>
            <button onclick="changeSlide(1)" style="width:auto;"><i class="fas fa-chevron-right"></i></button>
            <button onclick="addSlide()" style="background:#10b981; color:white; width:auto;"><i class="fas fa-plus"></i></button>
            <button onclick="deleteSlide()" style="background:#fee2e2; color:#dc2626; width:auto;"><i class="fas fa-trash"></i></button>
        </div>
        <div class="thumb-row" id="thumbList"></div>
    </div>

    <div class="tool-panel">
        <input type="text" id="titleIn" placeholder="Title">
        <textarea id="descIn" rows="4" placeholder="Description"></textarea>
        
        <div class="btn-row">
            <button onclick="openSizeModal()" style="background:#4b5563; color:white;"><i class="fas fa-expand"></i> Size (<span id="sizeDisplay">960x540</span>)</button>
            <button onclick="openTextSizeModal()" style="background:#0284c7; color:white;"><i class="fas fa-text-height"></i> Text Size (<span id="textSizeDisplay">28/14pt</span>)</button>
        </div>

        <button onclick="document.getElementById('imageInput').click()" style="background:#6366f1; color:white;"><i class="fas fa-image"></i> Upload Image</button>
        <input type="file" id="imageInput" accept="image/*,.heic,.heif">
        
        <p style="font-weight:bold; font-size: 14px; margin-bottom: 6px;">Font</p>
        <div class="btn-row">
            <select id="fontSelect" onchange="applyFont(this.value)">
                <optgroup label="Standard Sans-Serif">
                    <option value="Arial" selected>Arial</option>
                    <option value="Montserrat">Montserrat</option>
                    <option value="Roboto">Roboto</option>
                </optgroup>
                <optgroup label="Cursive Calligraphy">
                    <option value="Arrowlicious">Arrowlicious</option>
                    <option value="Berson Dream">Berson Dream</option>
                    <option value="Madina">Madina</option>
                    <option value="Classique Script">Classique Script</option>
                    <option value="Gravity">Gravity</option>
                    <option value="La Jour">La Jour</option>
                    <option value="Billion Miracles">Billion Miracles</option>
                    <option value="Cataline">Cataline</option>
                    <option value="Endless and Sunshine Olivia">Endless & Sunshine Olivia</option>
                </optgroup>
                <optgroup label="Classic Calligraphy">
                    <option value="Dancing Script">Dancing Script</option>
                    <option value="Great Vibes">Great Vibes</option>
                    <option value="Pacifico">Pacifico</option>
                </optgroup>
                <optgroup label="Serif & Monospace">
                    <option value="Playfair Display">Playfair Display</option>
                    <option value="Cinzel">Cinzel</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Lobster">Lobster</option>
                    <option value="Roboto Mono">Roboto Mono</option>
                    <option value="Courier New">Courier New</option>
                </optgroup>
            </select>
            <button onclick="document.getElementById('fontFileInput').click()" style="background:#8b5cf6; color:white;">Upload Font</button>
            <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2">
        </div>

        <button onclick="exportPDF()" style="background:#b91c1c; color:white;">Download PDF</button>
        <button onclick="exportPPTX()" style="background:#2d6a4f; color:white;">Download PPTX</button>

        <p style="margin-top:20px; font-weight:bold; font-size: 14px; margin-bottom: 8px;">Slide Colors:</p>
        <div class="color-picker-row">
            <div class="color-picker-wrapper" title="Background Color">
                <div id="bg-color-btn" class="custom-color-btn">
                    <div id="bg-color-preview" class="color-swatch-inner" style="background-color: #ffffff;"></div>
                </div>
                <span style="font-size: 11px; font-weight: bold; color: #475569;">Background</span>
            </div>

            <div class="color-picker-wrapper" title="Title Color">
                <div id="title-color-btn" class="custom-color-btn">
                    <div id="title-color-preview" class="color-swatch-inner" style="background-color: #000000;"></div>
                </div>
                <span style="font-size: 11px; font-weight: bold; color: #475569;">Title</span>
            </div>

            <div class="color-picker-wrapper" title="Text Color">
                <div id="text-color-btn" class="custom-color-btn">
                    <div id="text-color-preview" class="color-swatch-inner" style="background-color: #333333;"></div>
                </div>
                <span style="font-size: 11px; font-weight: bold; color: #475569;">Text</span>
            </div>
        </div>

        <!-- Color Wheel Popup Container -->
        <div id="color-wheel-popup">
          <div class="wheel-top-actions">
            <button type="button" id="wheel-btn-black" class="wheel-shortcut-btn">BL</button>
            <button type="button" id="wheel-btn-white" class="wheel-shortcut-btn">WH</button>
          </div>
          <div class="color-wheel-container" id="color-wheel-wrapper">
            <canvas id="color-wheel-canvas" width="160" height="160"></canvas>
            <div id="wheel-pointer"></div>
          </div>
          <div class="wheel-info-bar">
            <span id="wheel-selected-hex">#FFFFFF</span>
            <span id="wheel-selected-name">White</span>
          </div>
        </div>
    </div>
</div>

<div class="pdf-maker-panel">
    <div class="pdf-maker-header">
        <div class="pdf-maker-title"><i class="fas fa-images"></i> Image PDF Maker</div>
        <div class="pdf-maker-controls">
            <input type="text" id="pdfNameInput" placeholder="Enter PDF File Name">
            <div class="pdf-maker-buttons">
                <input type="file" id="bulkImageInput" accept="image/*,.heic,.heif" multiple>
                <button onclick="document.getElementById('bulkImageInput').click()" style="background:#10b981; color:white; width:auto; margin-bottom:0;"><i class="fas fa-plus"></i> Add Images</button>
                <button onclick="exportImagesToPDF()" style="background:#b91c1c; color:white; width:auto; margin-bottom:0;"><i class="fas fa-file-pdf"></i> Download PDF</button>
            </div>
        </div>
    </div>
    <div class="pdf-thumb-grid" id="pdfThumbGrid"></div>
</div>

<!-- Modal Popup for Slide Dimensions -->
<div class="modal-overlay" id="sizeModalOverlay">
    <div class="modal-content">
        <div class="modal-title"><i class="fas fa-ruler-combined"></i> Set Slide Dimensions</div>
        <div class="size-inputs-wrapper">
            <div class="size-field">
                <label for="modalWidthInput">Width</label>
                <div class="size-input-box">
                    <input type="number" id="modalWidthInput" placeholder="960" min="1">
                    <span>px</span>
                </div>
            </div>
            <div class="size-separator">x</div>
            <div class="size-field">
                <label for="modalHeightInput">Height</label>
                <div class="size-input-box">
                    <input type="number" id="modalHeightInput" placeholder="540" min="1">
                    <span>px</span>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeSizeModal()">Cancel</button>
            <button class="btn-apply" onclick="applyCustomSize()">Apply Size</button>
        </div>
    </div>
</div>

<!-- Modal Popup for Export Text Sizes -->
<div class="modal-overlay" id="textSizeModalOverlay">
    <div class="modal-content">
        <div class="modal-title"><i class="fas fa-text-height"></i> Set Export Text Sizes</div>
        <div class="size-inputs-wrapper">
            <div class="size-field">
                <label for="modalTitleSizeInput">Title Size</label>
                <div class="size-input-box">
                    <input type="number" id="modalTitleSizeInput" placeholder="28" min="8" max="120">
                    <span>pt</span>
                </div>
            </div>
            <div class="size-separator">/</div>
            <div class="size-field">
                <label for="modalTextSizeInput">Text Size</label>
                <div class="size-input-box">
                    <input type="number" id="modalTextSizeInput" placeholder="14" min="6" max="72">
                    <span>pt</span>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeTextSizeModal()">Cancel</button>
            <button class="btn-apply" onclick="applyCustomTextSize()">Apply Sizes</button>
        </div>
    </div>
</div>

<script>
    // Color State variables (Background, Title, Text)
    let slideBg = "#ffffff";
    let slideTitleColor = "#000000";
    let slideTextColor = "#333333";
    let activeColorTarget = 'bg'; // 'bg', 'title', or 'text'

    let slides = [{ title: "Welcome", description: "Start your presentation.", img: null }];
    let current = 0;
    let pdfImages = []; // Stores DataURLs for the Image PDF Maker
    
    let slideWidthPx = 960;
    let slideHeightPx = 540;
    let exportTitleSizePt = 28;
    let exportTextSizePt = 14;

    let currentFont = "Arial";
    let customFontData = null; // Stores Base64 string for uploaded fonts

    // Reliable Font TTF source mapping (via CDN) for embedding vector fonts into PDF
    const fontSourceMap = {
        "Montserrat": "https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-400-normal.ttf",
        "Roboto": "https://cdn.jsdelivr.net/fontsource/fonts/roboto@latest/latin-400-normal.ttf",
        "Dancing Script": "https://cdn.jsdelivr.net/fontsource/fonts/dancing-script@latest/latin-400-normal.ttf",
        "Great Vibes": "https://cdn.jsdelivr.net/fontsource/fonts/great-vibes@latest/latin-400-normal.ttf",
        "Pacifico": "https://cdn.jsdelivr.net/fontsource/fonts/pacifico@latest/latin-400-normal.ttf",
        "Playfair Display": "https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-400-normal.ttf",
        "Cinzel": "https://cdn.jsdelivr.net/fontsource/fonts/cinzel@latest/latin-400-normal.ttf",
        "Lobster": "https://cdn.jsdelivr.net/fontsource/fonts/lobster@latest/latin-400-normal.ttf",
        "Roboto Mono": "https://cdn.jsdelivr.net/fontsource/fonts/roboto-mono@latest/latin-400-normal.ttf",
        "Sacramento": "https://cdn.jsdelivr.net/fontsource/fonts/sacramento@latest/latin-400-normal.ttf",
        "Parisienne": "https://cdn.jsdelivr.net/fontsource/fonts/parisienne@latest/latin-400-normal.ttf",
        "Tangerine": "https://cdn.jsdelivr.net/fontsource/fonts/tangerine@latest/latin-400-normal.ttf"
    };

    const fontFallbacks = {
        "Arrowlicious": "'Dancing Script', 'Great Vibes', cursive",
        "Berson Dream": "'Playfair Display', 'Georgia', serif",
        "Madina": "'Sacramento', 'Great Vibes', cursive",
        "Classique Script": "'Parisienne', 'Great Vibes', cursive",
        "Gravity": "'Montserrat', 'Arial', sans-serif",
        "La Jour": "'Cinzel', 'Playfair Display', serif",
        "Billion Miracles": "'Tangerine', 'Great Vibes', cursive",
        "Cataline": "'Pacifico', 'Dancing Script', cursive",
        "Endless and Sunshine Olivia": "'Great Vibes', 'Sacramento', cursive"
    };

    const fontToTTFMap = {
        "Arrowlicious": "Dancing Script",
        "Berson Dream": "Playfair Display",
        "Madina": "Sacramento",
        "Classique Script": "Parisienne",
        "Gravity": "Montserrat",
        "La Jour": "Cinzel",
        "Billion Miracles": "Tangerine",
        "Cataline": "Pacifico",
        "Endless and Sunshine Olivia": "Great Vibes"
    };

    const fontToPPTXMap = {
        "Arial": "Arial",
        "Montserrat": "Arial",
        "Roboto": "Calibri",
        "Arrowlicious": "Monotype Corsiva",
        "Berson Dream": "Georgia",
        "Madina": "Monotype Corsiva",
        "Classique Script": "Brush Script MT",
        "Gravity": "Arial",
        "La Jour": "Georgia",
        "Billion Miracles": "Monotype Corsiva",
        "Cataline": "Comic Sans MS",
        "Endless and Sunshine Olivia": "Monotype Corsiva",
        "Dancing Script": "Monotype Corsiva",
        "Great Vibes": "Monotype Corsiva",
        "Pacifico": "Comic Sans MS",
        "Playfair Display": "Georgia",
        "Cinzel": "Times New Roman",
        "Georgia": "Georgia",
        "Times New Roman": "Times New Roman",
        "Lobster": "Impact",
        "Roboto Mono": "Courier New",
        "Courier New": "Courier New"
    };

    const fetchedFontCache = {};

    // --- Color Wheel Implementation ---
    const colorWheelPopup = document.getElementById('color-wheel-popup');
    const colorWheelWrapper = document.getElementById('color-wheel-wrapper');
    const colorWheelCanvas = document.getElementById('color-wheel-canvas');
    const wheelCtx = colorWheelCanvas.getContext('2d', { willReadFrequently: true });
    const wheelPointer = document.getElementById('wheel-pointer');
    const wheelSelectedHex = document.getElementById('wheel-selected-hex');
    const wheelSelectedName = document.getElementById('wheel-selected-name');

    function renderColorWheel() {
      const radius = colorWheelCanvas.width / 2;
      const imgData = wheelCtx.createImageData(colorWheelCanvas.width, colorWheelCanvas.height);
      const data = imgData.data;

      for (let y = 0; y < colorWheelCanvas.height; y++) {
        for (let x = 0; x < colorWheelCanvas.width; x++) {
          const dx = x - radius;
          const dy = y - radius;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const index = (y * colorWheelCanvas.width + x) * 4;

          if (dist <= radius) {
            const angle = Math.atan2(dy, dx);
            let hue = (angle * 180 / Math.PI + 360) % 360;
            let sat = dist / radius;
            let light = 0.5;

            let c = (1 - Math.abs(2 * light - 1)) * sat;
            let xVal = c * (1 - Math.abs((hue / 60) % 2 - 1));
            let m = light - c / 2;
            let r = 0, g = 0, b = 0;

            if (0 <= hue && hue < 60) { r = c; g = xVal; b = 0; }
            else if (60 <= hue && hue < 120) { r = xVal; g = c; b = 0; }
            else if (120 <= hue && hue < 180) { r = 0; g = c; b = xVal; }
            else if (180 <= hue && hue < 240) { r = 0; g = xVal; b = c; }
            else if (240 <= hue && hue < 300) { r = xVal; g = 0; b = c; }
            else if (300 <= hue && hue < 360) { r = c; g = 0; b = xVal; }

            data[index] = Math.round((r + m) * 255);
            data[index + 1] = Math.round((g + m) * 255);
            data[index + 2] = Math.round((b + m) * 255);
            data[index + 3] = 255;
          } else {
            data[index + 3] = 0;
          }
        }
      }
      wheelCtx.putImageData(imgData, 0, 0);
    }
    renderColorWheel();

    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }

    function getColorName(r, g, b) {
      if (r > 240 && g > 240 && b > 240) return "White";
      if (r < 15 && g < 15 && b < 15) return "Black";
      if (r > 200 && g < 50 && b < 50) return "Red";
      if (r < 50 && g > 200 && b < 50) return "Green";
      if (r < 50 && g < 50 && b > 200) return "Blue";
      if (r > 200 && g > 200 && b < 50) return "Yellow";
      if (r > 200 && g < 50 && b > 200) return "Magenta";
      if (r < 50 && g > 200 && b > 200) return "Cyan";
      if (r > 200 && g > 100 && b < 50) return "Orange";
      if (r > 120 && g < 50 && b > 120) return "Purple";
      if (r > 150 && g > 150 && b > 150) return "Gray";
      if (r > 100 && g < 60 && b < 30) return "Brown";
      
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h = Math.round(h * 60);
        if (h < 0) h += 360;
      }

      if (max < 60) return "Dark Gray";
      if (min > 190) return "Light Gray";
      
      if (h < 15 || h >= 345) return "Red";
      if (h < 45) return "Amber";
      if (h < 75) return "Yellow";
      if (h < 105) return "Chartreuse";
      if (h < 165) return "Green";
      if (h < 195) return "Spring Green";
      if (h < 255) return "Cyan/Blue";
      if (h < 285) return "Indigo/Violet";
      if (h < 315) return "Purple";
      return "Rose";
    }

    function updatePointerPosition(x, y) {
      const radius = colorWheelCanvas.width / 2;
      const dx = x - radius;
      const dy = y - radius;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let px = x;
      let py = y;

      if (dist > radius) {
        px = radius + (dx / dist) * radius;
        py = radius + (dy / dist) * radius;
      }

      wheelPointer.style.left = px + 'px';
      wheelPointer.style.top = py + 'px';
      wheelPointer.style.display = 'block';

      return { x: px, y: py };
    }

    function pickColorFromWheel(e) {
      const rect = colorWheelCanvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      if (clientX === undefined || clientY === undefined) return;

      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const constrained = updatePointerPosition(x, y);

      let sampleX = Math.min(Math.max(Math.floor(constrained.x), 0), colorWheelCanvas.width - 1);
      let sampleY = Math.min(Math.max(Math.floor(constrained.y), 0), colorWheelCanvas.height - 1);
      
      const pixel = wheelCtx.getImageData(sampleX, sampleY, 1, 1).data;
      if (pixel[3] > 0) {
        const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
        const colorName = getColorName(pixel[0], pixel[1], pixel[2]);
        applySelectedColor(hex, colorName);
      }
    }

    function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
    }

    async function processImageFile(file) {
        const isHeic = file.type === "image/heic" || file.type === "image/heif" || 
                       file.name.toLowerCase().endsWith(".heic") || file.name.toLowerCase().endsWith(".heif");
        
        if (isHeic && typeof heic2any !== "undefined") {
            try {
                let converted = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.98 });
                return Array.isArray(converted) ? converted[0] : converted;
            } catch (error) {
                console.error("HEIC conversion failed:", error);
                return file;
            }
        }
        return file;
    }

    async function fetchFontBase64(url) {
        if (fetchedFontCache[url]) return fetchedFontCache[url];
        try {
            const res = await fetch(url);
            if (!res.ok) return null;
            const blob = await res.arrayBuffer();
            const b64 = arrayBufferToBase64(blob);
            fetchedFontCache[url] = b64;
            return b64;
        } catch(e) {
            console.error("Failed to fetch font TTF:", e);
            return null;
        }
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let currentY = y;

        for (let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                ctx.fillText(line, x, currentY);
                line = words[n] + ' ';
                currentY += lineHeight;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, currentY);
        return currentY + lineHeight;
    }

    async function renderSlideToCanvas(slide, fontName, titleFontSize, descFontSize) {
        const canvas = document.createElement('canvas');
        const scale = 2;
        canvas.width = slideWidthPx * scale;
        canvas.height = slideHeightPx * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        ctx.fillStyle = slideBg;
        ctx.fillRect(0, 0, slideWidthPx, slideHeightPx);

        const margin = 40;
        const maxTextWidth = slideWidthPx - (margin * 2);
        let currentY = margin;

        const fallback = fontFallbacks[fontName] || "sans-serif";
        const fontStack = `'${fontName}', ${fallback}`;

        if (slide.title) {
            ctx.font = `bold ${titleFontSize}px ${fontStack}`;
            ctx.fillStyle = slideTitleColor;
            ctx.textBaseline = "top";
            currentY = wrapCanvasText(ctx, slide.title, margin, currentY, maxTextWidth, titleFontSize * 1.2);
            currentY += 15;
        }

        if (slide.description) {
            ctx.font = `${descFontSize}px ${fontStack}`;
            ctx.fillStyle = slideTextColor;
            ctx.textBaseline = "top";
            currentY = wrapCanvasText(ctx, slide.description, margin, currentY, maxTextWidth, descFontSize * 1.5);
            currentY += 20;
        }

        if (slide.img) {
            try {
                const img = new Image();
                img.src = slide.img;
                await img.decode();

                const maxImgWidth = maxTextWidth;
                const maxImgHeight = slideHeightPx - currentY - margin;

                let imgW = img.naturalWidth;
                let imgH = img.naturalHeight;

                let imgScale = Math.min(maxImgWidth / imgW, maxImgHeight / imgH);
                if (imgScale > 1) imgScale = 1;

                imgW = imgW * imgScale;
                imgH = imgH * imgScale;

                if (imgW > 0 && imgH > 0 && maxImgHeight > 20) {
                    ctx.drawImage(img, margin, currentY, imgW, imgH);
                }
            } catch (err) {
                console.error("Error rendering image on canvas:", err);
            }
        }

        return canvas.toDataURL("image/png");
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        
        const slideWidthPt = slideWidthPx * 0.75;
        const slideHeightPt = slideHeightPx * 0.75;

        const titleFontSize = exportTitleSizePt;
        const descFontSize = exportTextSizePt;

        const pdf = new jsPDF({
            orientation: slideWidthPt >= slideHeightPt ? 'l' : 'p',
            unit: 'pt',
            format: [slideWidthPt, slideHeightPt]
        });
        
        const isCustomUploadedFontActive = customFontData && customFontData.name === currentFont;

        if (isCustomUploadedFontActive) {
            for (let i = 0; i < slides.length; i++) {
                if (i !== 0) pdf.addPage([slideWidthPt, slideHeightPt], slideWidthPt >= slideHeightPt ? 'l' : 'p');
                const imgData = await renderSlideToCanvas(slides[i], currentFont, titleFontSize, descFontSize);
                pdf.addImage(imgData, 'PNG', 0, 0, slideWidthPt, slideHeightPt);
            }
        } else {
            let pdfFontName = "helvetica";
            let targetFontKey = fontToTTFMap[currentFont] || currentFont;

            if (fontSourceMap[targetFontKey]) {
                const b64 = await fetchFontBase64(fontSourceMap[targetFontKey]);
                if (b64) {
                    const cleanFontName = targetFontKey.replace(/[^a-zA-Z0-9]/g, "");
                    pdf.addFileToVFS(`${cleanFontName}.ttf`, b64);
                    pdf.addFont(`${cleanFontName}.ttf`, cleanFontName, 'normal');
                    pdfFontName = cleanFontName;
                }
            } else if (currentFont === "Times New Roman" || currentFont === "Georgia") {
                pdfFontName = "times";
            } else if (currentFont === "Courier New" || currentFont === "Roboto Mono") {
                pdfFontName = "courier";
            }

            const margin = 30;
            const maxTextWidth = slideWidthPt - (margin * 2);

            for (let i = 0; i < slides.length; i++) {
                if (i !== 0) pdf.addPage([slideWidthPt, slideHeightPt], slideWidthPt >= slideHeightPt ? 'l' : 'p');
                
                pdf.setFillColor(slideBg); 
                pdf.rect(0, 0, slideWidthPt, slideHeightPt, 'F');
                
                pdf.setFont(pdfFontName, 'normal');
                let currentY = margin;

                if (slides[i].title) {
                    pdf.setFontSize(titleFontSize);
                    pdf.setTextColor(slideTitleColor); 
                    const titleLines = pdf.splitTextToSize(slides[i].title, maxTextWidth);
                    const titleLineHeight = titleFontSize * 1.25;
                    pdf.text(titleLines, margin, currentY + titleFontSize);
                    currentY += (titleLines.length * titleLineHeight) + 15;
                }

                if (slides[i].description) {
                    pdf.setFontSize(descFontSize);
                    pdf.setTextColor(slideTextColor); 
                    const descLines = pdf.splitTextToSize(slides[i].description, maxTextWidth);
                    const descLineHeight = descFontSize * 1.4;
                    pdf.text(descLines, margin, currentY + descFontSize);
                    currentY += (descLines.length * descLineHeight) + 20;
                }

                if (slides[i].img) {
                    try {
                        const img = new Image(); 
                        img.src = slides[i].img; 
                        await img.decode();

                        const maxImgWidth = maxTextWidth;
                        const maxImgHeight = slideHeightPt - currentY - margin;

                        let imgW = img.naturalWidth;
                        let imgH = img.naturalHeight;
                        
                        let scale = Math.min(maxImgWidth / imgW, maxImgHeight / imgH);
                        if (scale > 1) scale = 1;

                        imgW = imgW * scale;
                        imgH = imgH * scale;

                        if (imgW > 0 && imgH > 0 && maxImgHeight > 20) {
                            pdf.addImage(slides[i].img, 'PNG', margin, currentY, imgW, imgH);
                        }
                    } catch(err) {
                        console.error("Error drawing image to PDF:", err);
                    }
                }
            }
        }
        pdf.save("Presentation.pdf");
    }

    async function exportPPTX() {
        let pptx = new PptxGenJS();
        
        pptx.defineLayout({
            name: 'CUSTOM_LAYOUT',
            width: slideWidthPx / 96,
            height: slideHeightPx / 96
        });
        pptx.layout = 'CUSTOM_LAYOUT';

        let fontFaceToUse = fontToPPTXMap[currentFont] || currentFont;
        if (customFontData && customFontData.name === currentFont) {
            fontFaceToUse = customFontData.name;
        }

        const titleFontSize = exportTitleSizePt;
        const descFontSize = exportTextSizePt;

        for (let i = 0; i < slides.length; i++) {
            const s = slides[i];
            let slide = pptx.addSlide();
            
            slide.background = { color: slideBg.replace('#','') };
            
            let currentY = 0.5;

            if (s.title) {
                slide.addText(s.title, { 
                    x: 0.5, y: currentY, w: (slideWidthPx / 96) - 1.0, 
                    fontSize: titleFontSize, bold: true, color: slideTitleColor.replace('#',''), 
                    fontFace: fontFaceToUse, wrap: true 
                });
                currentY += (titleFontSize / 72) * 1.5 + 0.3;
            }
            
            if (s.description) {
                slide.addText(s.description, { 
                    x: 0.5, y: currentY, w: (slideWidthPx / 96) - 1.0, 
                    fontSize: descFontSize, color: slideTextColor.replace('#',''), 
                    fontFace: fontFaceToUse, wrap: true 
                });
                currentY += (descFontSize / 72) * 2.0 + 0.2;
            }
            
            if (s.img) {
                try {
                    const img = new Image(); 
                    img.src = s.img; 
                    await img.decode();
                    
                    let maxH = (slideHeightPx / 96) - currentY - 0.5; 
                    if (maxH < 1.0) maxH = 1.0;
                    
                    let widthVal = (slideWidthPx / 96) - 1.0;
                    let heightVal = (widthVal * img.naturalHeight) / img.naturalWidth;
                    
                    if (heightVal > maxH) {
                        heightVal = maxH;
                        widthVal = (maxH * img.naturalWidth) / img.naturalHeight;
                    }
                    
                    slide.addImage({ data: s.img, x: 0.5, y: currentY, w: widthVal, h: heightVal });
                } catch(e) {
                    console.error("Error drawing PPTX image:", e);
                }
            }
        }
        pptx.writeFile({ fileName: "Presentation.pptx" });
    }

        }
        
        renderPdfThumbs();
        document.getElementById("bulkImageInput").value = "";
    };

    function renderPdfThumbs() {
        const grid = document.getElementById("pdfThumbGrid");
        grid.innerHTML = "";
        
        if (pdfImages.length === 0) {
            document.getElementById("pdfNameInput").style.display = "none";
        } else {
            document.getElementById("pdfNameInput").style.display = "inline-block";
        }
        
        pdfImages.forEach((imgSrc, index) => {
            const wrapper = document.createElement("div");
            wrapper.className = "pdf-thumb-wrapper";
            
            const img = document.createElement("img");
            img.src = imgSrc;
            
            const removeBtn = document.createElement("button");
            removeBtn.className = "pdf-thumb-remove";
            removeBtn.innerHTML = "<i class='fas fa-times'></i>";
            removeBtn.onclick = () => {
                pdfImages.splice(index, 1);
                renderPdfThumbs();
            };
            
            wrapper.appendChild(img);
            wrapper.appendChild(removeBtn);
            grid.appendChild(wrapper);
        });
    }

    async function exportImagesToPDF() {
        if (pdfImages.length === 0) {
            alert("Please add at least one image first.");
            return;
        }

        const { jsPDF } = window.jspdf;
        
        let firstImg = new Image();
        firstImg.src = pdfImages[0];
        await firstImg.decode();
        
        const targetWidth = 210;
        let targetHeight = (targetWidth * firstImg.naturalHeight) / firstImg.naturalWidth;
        
        const pdf = new jsPDF({
            orientation: targetHeight > targetWidth ? 'p' : 'l',
            unit: 'mm',
            format: [targetWidth, targetHeight]
        });

        for (let i = 0; i < pdfImages.length; i++) {
            const img = new Image();
            img.src = pdfImages[i];
            await img.decode();

            const currentHeight = (targetWidth * img.naturalHeight) / img.naturalWidth;

            if (i !== 0) {
                pdf.addPage([targetWidth, currentHeight], currentHeight > targetWidth ? 'p' : 'l');
            }
            
            pdf.addImage(pdfImages[i], 'NONE', 0, 0, targetWidth, currentHeight);
        }
        
        let filename = document.getElementById("pdfNameInput").value.trim();
        if(!filename) {
            filename = "Images";
        }
        if(!filename.endsWith(".pdf")) {
            filename += ".pdf";
        }
        
        pdf.save(filename);
    }

    updateView();
</script>
