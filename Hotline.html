<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pahadi Hot Line</title>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght=500;700;900&family=Inter:wght=400;500;600&display=swap');

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #0b0f19;
        color: #f3f4f6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 50px;
      }

      header {
        border-bottom: 1px solid rgba(0, 242, 254, 0.2);
        padding: 20px;
        text-align: center;
        background: #0e1424;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      header h1 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 1.8rem;
        letter-spacing: 2px;
        color: #00f2fe;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
      }

      .app-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      .video-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 100%;
      }

      @media (max-width: 768px) {
        .video-grid {
          grid-template-columns: 1fr;
        }
      }

      .video-wrapper {
        position: relative;
        background: #111827;
        border: 2px solid #1f2937;
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 4 / 3;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        transition: border-color 0.3s ease;
      }

      .video-wrapper.active {
        border-color: #00f2fe;
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
      }

      .video-label {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 10;
        background: rgba(11, 15, 25, 0.8);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #00f2fe;
        border: 1px solid rgba(0, 242, 254, 0.3);
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background-color: #030712;
      }

      .controls-deck {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 100%;
      }

      @media (max-width: 768px) {
        .controls-deck {
          grid-template-columns: 1fr;
        }
      }

      .card-panel {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 15px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .card-panel h2 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #f3f4f6;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #1f2937;
        padding-bottom: 10px;
      }

      .input-field-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }

      input {
        width: 100%;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 14px 50px 14px 14px;
        color: #ffffff;
        font-family: inherit;
        font-size: 1rem;
        text-align: center;
        outline: none;
        transition: border-color 0.2s ease;
      }

      input:focus {
        border-color: #00f2fe;
      }

      .btn-copy {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: #374151;
        border: none;
        color: #00f2fe;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: background 0.2s;
      }

      .btn-copy:hover {
        background: #4b5563;
      }

      .btn-copy svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .share-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 5px;
      }

      .share-label {
        font-size: 0.8rem;
        color: #9ca3af;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .share-buttons-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .share-icon-btn {
        flex: 1;
        min-width: 45px;
        height: 40px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s, transform 0.1s;
        padding: 0;
      }

      .share-icon-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .share-icon-btn svg {
        width: 20px;
        height: 20px;
        fill: #ffffff;
      }

      .share-wa { background: #25D366; }
      .share-fb { background: #1877F2; }
      .share-msg { background: #006AFF; }
      .share-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }

      button.main-action {
        width: 100%;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .btn-cyan {
        background: #00f2fe;
        color: #0b0f19;
        box-shadow: 0 4px 14px rgba(0, 242, 254, 0.3);
      }

      .btn-cyan:hover:not(:disabled) {
        background: #00d8e4;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
      }

      .btn-pink {
        background: #ff007f;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(255, 0, 127, 0.3);
      }

      .btn-pink:hover:not(:disabled) {
        background: #e60072;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
      }

      .btn-disconnect {
        width: 100%;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: #dc2626;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(220, 38, 38, 0.3);
        display: block;
        text-align: center;
        margin-top: 10px;
      }

      .btn-disconnect:hover {
        background: #b91c1c;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
      }

      button:disabled {
        background: #374151 !important;
        color: #9ca3af !important;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>

    <header>
      <h1>Pahadi Hot Line</h1>
    </header>

    <div class="app-container">
      <div class="video-grid">
        <div class="video-wrapper" id="localPanel">
          <div class="video-label">Local Video</div>
          <video id="webcamVideo" autoplay playsinline muted></video>
        </div>

        <div class="video-wrapper" id="remotePanel">
          <div class="video-label">Remote Video</div>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
      </div>

      <div class="controls-deck">
        <div class="card-panel">
          <h2>Create Channel</h2>
          <p style="color: #9ca3af; font-size: 0.9rem;">Start chat by generating a channel code. Send code to your friend and ask him to connect to channel. To cancel, press End Call.</p>
          <button id="callButton" class="main-action btn-pink">Generate Channel Code</button>
        </div>

        <div class="card-panel">
          <h2>Join / Channel Code</h2>
          <div class="input-field-wrapper">
            <input id="callInput" placeholder="Enter channel code signature" />
            <button class="btn-copy" id="copyBtn" title="Copy Code">
              <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>
          </div>
          <button id="answerButton" class="main-action btn-cyan">Connect to Channel</button>

          <div class="share-container">
            <span class="share-label">Share Code Via:</span>
            <div class="share-buttons-row">
              <button class="share-icon-btn share-wa" id="shareWA" title="Share on WhatsApp">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.42 9.863-9.855.001-2.633-1.02-5.107-2.875-6.964C16.647 1.913 14.177.893 11.546.893c-5.44 0-9.866 4.422-9.869 9.858-.001 1.702.46 3.366 1.332 4.814l-.991 3.616 3.702-.971zm11.367-7.393c-.3-.15-1.772-.875-2.046-.975-.276-.101-.476-.15-.676.15-.199.3-.775 1.001-.95 1.201-.175.2-.35.225-.65.075-.301-.15-1.267-.467-2.414-1.493-.893-.795-1.496-1.777-1.671-2.076-.175-.3-.019-.463.13-.612.134-.133.3-.35.45-.525.149-.175.199-.3.3-.5.1-.2.05-.375-.025-.525-.075-.15-.676-1.628-.926-2.228-.243-.584-.492-.504-.676-.514-.174-.009-.374-.01-.574-.01-.2 0-.526.075-.802.375-.275.3-1.05 1.025-1.05 2.5s1.075 2.9 1.225 3.1c.15.2 2.116 3.23 5.125 4.534.715.311 1.274.497 1.71.636.719.228 1.375.196 1.892.119.577-.087 1.772-.725 2.022-1.425.25-.7 0-1.275-.1-1.425-.1-.15-.35-.25-.65-.4z"/></svg>
              </button>
              <button class="share-icon-btn share-fb" id="shareFB" title="Share on Facebook">
                <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              </button>
              <button class="share-icon-btn share-msg" id="shareMsg" title="Share on Messenger">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 4.97 0 11.11c0 3.498 1.743 6.618 4.475 8.61V24l4.086-2.253c1.087.303 2.235.466 3.439.466 6.63 0 12-4.97 12-11.11S18.63 0 12 0zm1.293 14.33l-3.064-3.27-5.98 3.27 6.575-7.002 3.12 3.27 5.923-3.27-6.574 7.002z"/></svg>
              </button>
              <button class="share-icon-btn share-ig" id="shareIG" title="Share Code Link">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <button id="hangupButton" class="btn-disconnect">End Video Call</button>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getFirestore, collection, doc, setDoc, addDoc, getDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCYUxuk4GGUYVvIpG0UEXCuZcur1tKvnBY",
        authDomain: "my-video-call-52c6a.firebaseapp.com",
        projectId: "my-video-call-52c6a",
        storageBucket: "my-video-call-52c6a.firebasestorage.app",
        messagingSenderId: "57992802493",
        appId: "1:57992802493:web:595b72fdca823a666507d4",
        measurementId: "G-PGFYFNZ4J3"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const servers = {
        iceServers: [
          { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] },
        ],
        iceCandidatePoolSize: 10,
      };

      let pc = null; 
      let localStream = null;
      let activeCallId = null;

      const webcamVideo = document.getElementById('webcamVideo');
      const callButton = document.getElementById('callButton');
      const callInput = document.getElementById('callInput');
      const answerButton = document.getElementById('answerButton');
      const remoteVideo = document.getElementById('remoteVideo');
      const hangupButton = document.getElementById('hangupButton');
      const copyBtn = document.getElementById('copyBtn');
      const localPanel = document.getElementById('localPanel');
      const remotePanel = document.getElementById('remotePanel');

      function initPeerConnection() {
        pc = new RTCPeerConnection(servers);
        
        pc.onconnectionstatechange = () => {
          switch(pc.connectionState) {
            case "disconnected":
            case "failed":
            case "closed":
              console.log("Peer lifecycle closed. Cleaning up interface...");
              triggerQuietHangup();
              break;
          }
        };

        // FIXED: Stream assigned dynamically directly when live tracks arrive.
        // Prevents Safari/Mobile browsers from freezing up on an empty MediaStream instance.
        pc.ontrack = (event) => {
          if (event.streams && event.streams[0]) {
            remoteVideo.srcObject = event.streams[0];
            remotePanel.classList.add('active');
          }
        };
      }

      async function getLocalHardware() {
        if (!localStream) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            webcamVideo.srcObject = localStream;
            localPanel.classList.add('active');
          } catch (error) {
            alert("Camera or Microphone access denied: " + error.message);
            throw error;
          }
        }
      }

      callButton.onclick = async () => {
        try {
          callButton.disabled = true;
          await getLocalHardware();
          initPeerConnection();

          localStream.getTracks().forEach((track) => {
            pc.addTrack(track, localStream);
          });

          const callDocRef = doc(collection(db, 'calls'));
          const offerCandidatesRef = collection(callDocRef, 'offerCandidates');
          const answerCandidatesRef = collection(callDocRef, 'answerCandidates');

          callInput.value = callDocRef.id;
          activeCallId = callDocRef.id;

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              addDoc(offerCandidatesRef, event.candidate.toJSON());
            }
          };

          const offerDescription = await pc.createOffer();
          await pc.setLocalDescription(offerDescription);

          const offer = {
            sdp: offerDescription.sdp,
            type: offerDescription.type,
          };

          await setDoc(callDocRef, { offer, createdAt: serverTimestamp() });

          onSnapshot(callDocRef, (snapshot) => {
            const data = snapshot.data();
            if (pc && !pc.currentRemoteDescription && data?.answer) {
              const answerDescription = new RTCSessionDescription(data.answer);
              pc.setRemoteDescription(answerDescription);
            }
          });

          onSnapshot(answerCandidatesRef, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
              if (change.type === 'added' && pc && pc.currentRemoteDescription) {
                const candidate = new RTCIceCandidate(change.doc.data());
                pc.addIceCandidate(candidate);
              }
            });
          });

        } catch (e) {
          console.error(e);
          callButton.disabled = false;
          cleanState();
        }
      };

      answerButton.onclick = async () => {
        const callId = callInput.value.trim();
        if (!callId) {
          alert("Please type or paste a valid Channel Code before connecting.");
          return;
        }

        try {
          answerButton.disabled = true;

          const callDocRef = doc(db, 'calls', callId);
          const callSnapshot = await getDoc(callDocRef);
          
          // FIXED: Validation occurs before initializing components.
          // Prevents hardware leak and UI locking if code entry is misspelled.
          if (!callSnapshot.exists()) {
            alert("No channel found with that signature code. Double check your code.");
            answerButton.disabled = false;
            return;
          }

          await getLocalHardware();
          initPeerConnection();

          localStream.getTracks().forEach((track) => {
            pc.addTrack(track, localStream);
          });

          activeCallId = callId;
          const answerCandidatesRef = collection(callDocRef, 'answerCandidates');
          const offerCandidatesRef = collection(callDocRef, 'offerCandidates');

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              addDoc(answerCandidatesRef, event.candidate.toJSON());
            }
          };

          const callData = callSnapshot.data();
          const offerDescription = callData.offer;
          
          // FIXED: setRemoteDescription executed immediately before generating answer.
          // Corrects signaling protocol order so ICE tracking syncs properly across distinct networks.
          await pc.setRemoteDescription(new RTCSessionDescription(offerDescription));

          const answerDescription = await pc.createAnswer();
          await pc.setLocalDescription(answerDescription);

          const answer = {
            type: answerDescription.type,
            sdp: answerDescription.sdp,
          };

          await updateDoc(callDocRef, { answer });

          onSnapshot(offerCandidatesRef, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
              if (change.type === 'added' && pc) {
                let data = change.doc.data();
                pc.addIceCandidate(new RTCIceCandidate(data));
              }
            });
          });

        } catch (e) {
          console.error(e);
          answerButton.disabled = false;
          cleanState();
        }
      };

      copyBtn.onclick = () => {
        const code = callInput.value.trim();
        if (!code) {
          alert("Generate or enter a channel code first!");
          return;
        }
        navigator.clipboard.writeText(code).then(() => {
          alert("Channel code copied successfully!");
        }).catch(() => {
          callInput.select();
          document.execCommand("copy");
          alert("Channel code copied successfully!");
        });
      };

      function getShareMessage() {
        const code = callInput.value.trim() || "[No Code Generated Yet]";
        return `Join my video call on Pahadi Hot Line!\nCode: ${code}\nLink: ${window.location.href}`;
      }

      document.getElementById('shareWA').onclick = () => {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(getShareMessage())}`, '_blank');
      };

      document.getElementById('shareFB').onclick = () => {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
      };

      document.getElementById('shareMsg').onclick = () => {
        window.open('fb-messenger://share/?link=' + encodeURIComponent(window.location.href), '_blank');
      };

      document.getElementById('shareIG').onclick = () => {
        const msg = getShareMessage();
        navigator.clipboard.writeText(msg).then(() => {
          alert("Full invitation text copied! Open Instagram to paste and send it to your friends.");
        });
      };

      // FIXED: Modular abstraction for runtime garbage isolation. Clean variables without layout destruction.
      function cleanState() {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
          localStream = null;
        }
        if (pc) {
          pc.close();
          pc = null;
        }
        webcamVideo.srcObject = null;
        remoteVideo.srcObject = null;
        localPanel.classList.remove('active');
        remotePanel.classList.remove('active');
        callButton.disabled = false;
        answerButton.disabled = false;
      }

      function triggerQuietHangup() {
        cleanState();
        location.reload();
      }

      hangupButton.onclick = async () => {
        const targetId = activeCallId || callInput.value.trim();
        if (targetId) {
          try {
            const callDocRef = doc(db, 'calls', targetId);
            await deleteDoc(callDocRef);
            console.log("Channel documentation database cleared successfully.");
          } catch (e) {
            console.error("Error wiping database entry: ", e);
          }
        }
        triggerQuietHangup();
      };
    </script>
  </body>
</html>
