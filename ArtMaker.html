        const ViewportController = {
            init() {
                window.addEventListener('resize', () => this.fitToScreenView());
                this.bindPointersGestures();
            },

            fitToScreenView() {
                const margin = 20;
                const vW = DOM.viewport.clientWidth - margin;
                const vH = DOM.viewport.clientHeight - margin;
                const sX = vW / Engine.width;
                const sY = vH / Engine.height;

                Engine.scale = Math.min(sX, sY, 1.2);
                Engine.panX = (DOM.viewport.clientWidth - Engine.width * Engine.scale) / 2;
                Engine.panY = (DOM.viewport.clientHeight - Engine.height * Engine.scale) / 2;
                this.apply();
            },

            apply() {
                DOM.container.style.width = Engine.width + 'px';
                DOM.container.style.height = Engine.height + 'px';
                DOM.container.style.transform = `translate(${Engine.panX}px, ${Engine.panY}px) scale(${Engine.scale})`;
            },

            clientToCanvas(cx, cy) {
                const rect = DOM.container.getBoundingClientRect();
                return {
                    x: ((cx - rect.left) / rect.width) * Engine.width,
                    y: ((cy - rect.top) / rect.height) * Engine.height
                };
            },

            bindPointersGestures() {
                let activePointers = new Map();
                let initialPinchDist = 0;
                let initialPinchScale = 1.0;
                let initialPinchMid = { x: 0, y: 0 };

                DOM.viewport.addEventListener('pointerdown', (e) => {
                    if (Engine.currentTool === 'placement') return;
                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (activePointers.size >= 2) {
                        if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                        Engine.isPanning = true;
                        Engine.isDrawing = false;
                        if (Engine.currentTool !== 'lasso_cut' && Engine.currentTool !== 'lasso_zone') DOM.overlayLayer.innerHTML = '';
                        
                        const pts = Array.from(activePointers.values());
                        initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                        initialPinchScale = Engine.scale;
                        initialPinchMid = {
                            x: (pts[0].x + pts[1].x) / 2 - Engine.panX,
                            y: (pts[0].y + pts[1].y) / 2 - Engine.panY
                        };
                    } else if (activePointers.size === 1) {
                        const now = Date.now();
                        if (now - Engine.lastTapTime < 260) {
                            if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                            HistoryController.undo();
                            activePointers.clear();
                            Engine.isDrawing = false;
                            if (Engine.currentTool !== 'lasso_cut' && Engine.currentTool !== 'lasso_zone') DOM.overlayLayer.innerHTML = '';
                            return;
                        }
                        Engine.lastTapTime = now;
                        
                        const coords = this.clientToCanvas(e.clientX, e.clientY);
                        
                        if (Engine.currentTool === 'lasso_cut' || Engine.currentTool === 'lasso_zone') {
                            Engine.isDrawing = true;
                            Engine.lassoPoints = [{x: coords.x, y: coords.y}];
                            DOM.overlayLayer.innerHTML = `<svg width="${Engine.width}" height="${Engine.height}" style="width:100%; height:100%; position:absolute; top:0; left:0;"><polyline points="${coords.x},${coords.y}" fill="rgba(58,134,255,0.2)" stroke="#3a86ff" stroke-width="3" stroke-dasharray="6,6"/></svg>`;
                            return;
                        }

                        Engine.longPressTimeout = setTimeout(() => {
                            DrawingCore.runEyedropper(Math.floor(coords.x), Math.floor(coords.y));
                            Engine.isDrawing = false;
                            activePointers.clear();
                        }, CONFIG.LONG_PRESS_MS);

                        Engine.isDrawing = true;
                        Engine.lastX = coords.x; Engine.lastY = coords.y;
                        Engine.startX = coords.x; Engine.startY = coords.y;
                        Engine.stabilizedX = coords.x; Engine.stabilizedY = coords.y;
                        
                        if (Engine.currentTool === 'bucket') {
                            if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                            DrawingCore.floodFill(Math.floor(coords.x), Math.floor(coords.y));
                            Engine.isDrawing = false;
                        } else if (Engine.currentTool === 'eyedropper') {
                            if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                            DrawingCore.runEyedropper(Math.floor(coords.x), Math.floor(coords.y));
                            Engine.isDrawing = false;
                        } else {
                            DrawingCore.paint(coords.x, coords.y, coords.x, coords.y, e.pressure || 0.5);
                        }
                    }
                });

                DOM.viewport.addEventListener('pointermove', (e) => {
                    if (!activePointers.has(e.pointerId)) return;
                    const startPt = activePointers.get(e.pointerId);
                    if (startPt && Math.hypot(e.clientX - startPt.x, e.clientY - startPt.y) > 10) {
                        if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                    }
                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (Engine.isPanning && activePointers.size >= 2) {
                        const pts = Array.from(activePointers.values());
                        const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                        const targetScale = initialPinchScale * (currentDist / initialPinchDist);
                        Engine.scale = Math.min(Math.max(targetScale, CONFIG.MIN_SCALE), CONFIG.MAX_SCALE);

                        const currentMidX = (pts[0].x + pts[1].x) / 2;
                        const currentMidY = (pts[0].y + pts[1].y) / 2;
                        Engine.panX = currentMidX - initialPinchMid.x * (Engine.scale / initialPinchScale);
                        Engine.panY = currentMidY - initialPinchMid.y * (Engine.scale / initialPinchScale);
                        this.apply();
                    } else if (Engine.isDrawing && activePointers.size === 1) {
                        const coords = this.clientToCanvas(e.clientX, e.clientY);
                        
                        if (Engine.currentTool === 'lasso_cut' || Engine.currentTool === 'lasso_zone') {
                            Engine.lassoPoints.push({x: coords.x, y: coords.y});
                            const ptsStr = Engine.lassoPoints.map(p => `${p.x},${p.y}`).join(' ');
                            DOM.overlayLayer.innerHTML = `<svg width="${Engine.width}" height="${Engine.height}" style="width:100%; height:100%; position:absolute; top:0; left:0;"><polygon points="${ptsStr}" fill="rgba(58,134,255,0.25)" stroke="#3a86ff" stroke-width="3" stroke-dasharray="6,6"/></svg>`;
                            return;
                        }

                        Engine.stabilizedX += (coords.x - Engine.stabilizedX) * CONFIG.STABILIZATION;
                        Engine.stabilizedY += (coords.y - Engine.stabilizedY) * CONFIG.STABILIZATION;

                        if (Engine.currentTool === 'ruler') {
                            ToolOverlayRenderer.renderLinePreview(Engine.startX, Engine.startY, coords.x, coords.y);
                        } else if (Engine.currentTool === 'shape') {
                            ToolOverlayRenderer.renderShapePreview(Engine.selectedShape, Engine.startX, Engine.startY, coords.x, coords.y);
                        } else if (Engine.currentTool === 'symmetry') {
                            DrawingCore.paintSymmetric(Engine.lastX, Engine.lastY, Engine.stabilizedX, Engine.stabilizedY, e.pressure || 0.5);
                            Engine.lastX = Engine.stabilizedX; Engine.lastY = Engine.stabilizedY;
                        } else {
                            DrawingCore.paint(Engine.lastX, Engine.lastY, Engine.stabilizedX, Engine.stabilizedY, e.pressure || 0.5);
                            Engine.lastX = Engine.stabilizedX; Engine.lastY = Engine.stabilizedY;
                        }
                    }
                });

                const clearPointers = (e) => {
                    if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                    activePointers.delete(e.pointerId);
                    if (activePointers.size < 2) Engine.isPanning = false;
                    if (activePointers.size === 0 && Engine.isDrawing) {
                        Engine.isDrawing = false;
                        
                        if (Engine.currentTool === 'lasso_cut') {
                            DOM.overlayLayer.innerHTML = '';
                            if (Engine.lassoPoints.length > 3) {
                                LasserController.processLassoCut(Engine.lassoPoints);
                            }
                            Engine.lassoPoints = [];
                            return;
                        } else if (Engine.currentTool === 'lasso_zone') {
                            if (Engine.lassoPoints.length > 3) {
                                Engine.lassoZonePoints = [...Engine.lassoPoints];
                                DOM.removeZoneBtn.style.display = 'block';
                                const ptsStr = Engine.lassoZonePoints.map(p => `${p.x},${p.y}`).join(' ');
                                DOM.overlayLayer.innerHTML = `<svg width="${Engine.width}" height="${Engine.height}" style="width:100%; height:100%; position:absolute; top:0; left:0;"><polygon points="${ptsStr}" fill="none" stroke="#3a86ff" stroke-width="3" stroke-dasharray="6,6"/></svg>`;
                            } else {
                                DOM.overlayLayer.innerHTML = '';
                            }
                            Engine.lassoPoints = [];
                            return;
                        }

                        const coords = ViewportController.clientToCanvas(e.clientX, e.clientY);
                        if (Engine.currentTool === 'ruler') {
                            DrawingCore.paintStraightLine(Engine.startX, Engine.startY, coords.x, coords.y);
                            DOM.overlayLayer.innerHTML = '';
                        } else if (Engine.currentTool === 'shape') {
                            DrawingCore.stampShapeDrag(Engine.selectedShape, Engine.startX, Engine.startY, coords.x, coords.y);
                            DOM.overlayLayer.innerHTML = '';
                        }
                        HistoryController.saveState();
                        UIController.renderLayersList();
                        if (Engine.isAnimationMode) {
                            AnimationController.saveActiveFrameState();
                            AnimationController.renderTimeline();
                        }
                    }
                };

                DOM.viewport.addEventListener('pointerup', clearPointers);
                DOM.viewport.addEventListener('pointercancel', clearPointers);
            }
        };

        const LasserController = {
            processLassoCut(points) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer) return;

                let minX = Engine.width, minY = Engine.height, maxX = 0, maxY = 0;
                points.forEach(p => {
                    if (p.x < minX) minX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y > maxY) maxY = p.y;
                });

                minX = Math.max(0, Math.floor(minX));
                minY = Math.max(0, Math.floor(minY));
                maxX = Math.min(Engine.width, Math.ceil(maxX));
                maxY = Math.min(Engine.height, Math.ceil(maxY));

                const w = maxX - minX;
                const h = maxY - minY;
                if (w <= 10 || h <= 10) return;

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = w;
                tempCanvas.height = h;
                const tCtx = tempCanvas.getContext('2d');

                tCtx.beginPath();
                points.forEach((p, idx) => {
                    if (idx === 0) tCtx.moveTo(p.x - minX, p.y - minY);
                    else tCtx.lineTo(p.x - minX, p.y - minY);
                });
                tCtx.closePath();
                tCtx.clip();

                tCtx.drawImage(layer.canvas, minX, minY, w, h, 0, 0, w, h);

                layer.ctx.save();
                layer.ctx.globalCompositeOperation = 'source-over';
                layer.ctx.beginPath();
                points.forEach((p, idx) => {
                    if (idx === 0) layer.ctx.moveTo(p.x, p.y);
                    else layer.ctx.lineTo(p.x, p.y);
                });
                layer.ctx.closePath();
                layer.ctx.clip();
                layer.ctx.clearRect(minX, minY, w, h);
                layer.ctx.drawImage(layer.originalCanvas, minX, minY, w, h, minX, minY, w, h);
                layer.ctx.restore();

                HistoryController.saveState();
                UIController.renderLayersList();

                const cutImg = new Image();
                cutImg.onload = () => {
                    TransformOverlayController.activateWithImage(cutImg);
                };
                cutImg.src = tempCanvas.toDataURL('image/png');
            }
        };

        const ToolOverlayRenderer = {
            renderLinePreview(x1, y1, x2, y2) {
                DOM.overlayLayer.innerHTML = `
                    <svg width="${Engine.width}" height="${Engine.height}" style="width:100%; height:100%; position:absolute; top:0; left:0;">
                        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${Engine.brushColor}" stroke-width="${Engine.brushSize}" stroke-linecap="round" opacity="${Engine.brushOpacity}" />
                    </svg>
                `;
            },
            renderShapePreview(shapeType, x1, y1, x2, y2) {
                const xMin = Math.min(x1, x2);
                const yMin = Math.min(y1, y2);
                const w = Math.abs(x2 - x1);
                const h = Math.abs(y2 - y1);
                const strokeColor = Engine.brushColor;
                const strokeW = Math.max(2, Engine.brushSize);

                let svgContent = '';
                if (shapeType === 'square') {
                    svgContent = `<rect x="${xMin}" y="${yMin}" width="${w}" height="${h}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>`;
                } else if (shapeType === 'triangle') {
                    svgContent = `<polygon points="${xMin + w/2},${yMin} ${xMin + w},${yMin + h} ${xMin},${yMin + h}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>`;
                } else if (shapeType === 'circle') {
                    svgContent = `<ellipse cx="${xMin + w/2}" cy="${yMin + h/2}" rx="${w/2}" ry="${h/2}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>`;
                } else if (shapeType === 'cuboid') {
                    const d = Math.min(w, h) * 0.35;
                    const fw = w - d, fh = h - d;
                    svgContent = `
                        <rect x="${xMin}" y="${yMin + d}" width="${fw}" height="${fh}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <rect x="${xMin + d}" y="${yMin}" width="${fw}" height="${fh}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin}" y1="${yMin + d}" x2="${xMin + d}" y2="${yMin}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin + fw}" y1="${yMin + d}" x2="${xMin + fw + d}" y2="${yMin}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin}" y1="${yMin + d + fh}" x2="${xMin + d}" y2="${yMin + fh}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin + fw}" y1="${yMin + d + fh}" x2="${xMin + fw + d}" y2="${yMin + fh}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                    `;
                } else if (shapeType === 'pyramid') {
                    svgContent = `
                        <polygon points="${xMin + w/2},${yMin} ${xMin + w},${yMin + h} ${xMin},${yMin + h}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin + w/2}" y1="${yMin}" x2="${xMin + w * 0.6}" y2="${yMin + h * 0.7}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin}" y1="${yMin + h}" x2="${xMin + w * 0.6}" y2="${yMin + h * 0.7}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin + w}" y1="${yMin + h}" x2="${xMin + w * 0.6}" y2="${yMin + h * 0.7}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                    `;
                } else if (shapeType === 'cylinder') {
                    const rh = h * 0.15;
                    svgContent = `
                        <ellipse cx="${xMin + w/2}" cy="${yMin + rh}" rx="${w/2}" ry="${rh}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <ellipse cx="${xMin + w/2}" cy="${yMin + h - rh}" rx="${w/2}" ry="${rh}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin}" y1="${yMin + rh}" x2="${xMin}" y2="${yMin + h - rh}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin + w}" y1="${yMin + rh}" x2="${xMin + w}" y2="${yMin + h - rh}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                    `;
                } else if (shapeType === 'cone') {
                    const rh = h * 0.2;
                    svgContent = `
                        <line x1="${xMin + w/2}" y1="${yMin}" x2="${xMin}" y2="${yMin + h - rh}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <line x1="${xMin + w/2}" y1="${yMin}" x2="${xMin + w}" y2="${yMin + h - rh}" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                        <ellipse cx="${xMin + w/2}" cy="${yMin + h - rh}" rx="${w/2}" ry="${rh}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"/>
                    `;
                }

                DOM.overlayLayer.innerHTML = `
                    <svg width="${Engine.width}" height="${Engine.height}" style="width:100%; height:100%; position:absolute; top:0; left:0;" opacity="${Engine.brushOpacity}">
                        ${svgContent}
                    </svg>
                `;
            }
        };

        const DrawingCore = {
            applyLassoZoneClip(ctx) {
                if (Engine.lassoZonePoints && Engine.lassoZonePoints.length > 2) {
                    ctx.beginPath();
                    Engine.lassoZonePoints.forEach((p, idx) => {
                        if (idx === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                    ctx.closePath();
                    ctx.clip();
                }
            },

            paint(x1, y1, x2, y2, pressure) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer || !layer.visible) return;

                const ctx = layer.ctx;
                ctx.save();
                this.applyLassoZoneClip(ctx);

                if (layer.alphaLocked) ctx.globalCompositeOperation = 'source-atop';
                else ctx.globalCompositeOperation = 'source-over';

                const targetSize = Engine.brushSize * (0.4 + pressure * 0.6);
                
                if (Engine.currentTool === 'eraser') {
                    this.eraseOriginalSegment(x1, y1, x2, y2, targetSize, layer);
                } else if (Engine.currentTool === 'bg-eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    const distance = Math.hypot(x2 - x1, y2 - y1);
                    const steps = Math.ceil(distance / Math.max(1, targetSize * 0.05));
                    
                    for (let i = 0; i <= steps; i++) {
                        const ratio = steps === 0 ? 1 : i / steps;
                        ctx.save();
                        ctx.translate(x1 + (x2 - x1) * ratio, y1 + (y2 - y1) * ratio);
                        ctx.beginPath(); 
                        ctx.arc(0, 0, targetSize * 0.5, 0, Math.PI * 2); 
                        ctx.fill();
                        ctx.restore();
                    }
                } else if (Engine.currentTool === 'smudge') {
                    this.smudgeSegment(x1, y1, x2, y2, targetSize, ctx);
                } else if (Engine.currentTool === 'liquify') {
                    this.liquifySegment(x1, y1, x2, y2, targetSize, ctx);
                } else {
                    const distance = Math.hypot(x2 - x1, y2 - y1);
                    const steps = Math.ceil(distance / Math.max(1, targetSize * 0.05));
                    
                    const grad = ctx.createRadialGradient(0, 0, targetSize * Engine.brushHardness * 0.5, 0, 0, targetSize * 0.5);
                    const rgb = this.hexToRgb(Engine.brushColor);
                    
                    grad.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${Engine.brushOpacity})`);
                    grad.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
                    ctx.fillStyle = grad;

                    for (let i = 0; i <= steps; i++) {
                        const ratio = steps === 0 ? 1 : i / steps;
                        ctx.save();
                        ctx.translate(x1 + (x2 - x1) * ratio, y1 + (y2 - y1) * ratio);
                        ctx.beginPath(); ctx.arc(0, 0, targetSize * 0.5, 0, Math.PI * 2); ctx.fill();
                        ctx.restore();
                    }
                }
                ctx.restore();
            },

            eraseOriginalSegment(x1, y1, x2, y2, size, layer) {
                const ctx = layer.ctx;
                const origCtx = layer.originalCtx;
                const radius = size * 0.5;
                const distance = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.ceil(distance / Math.max(1, radius * 0.5));

                ctx.save();
                ctx.globalCompositeOperation = 'source-over';
                for (let i = 0; i <= steps; i++) {
                    const t = steps === 0 ? 1 : i / steps;
                    const cx = x1 + (x2 - x1) * t;
                    const cy = y1 + (y2 - y1) * t;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.clearRect(cx - radius, cy - radius, radius * 2, radius * 2);
                    ctx.drawImage(origCtx.canvas, cx - radius, cy - radius, radius * 2, radius * 2, cx - radius, cy - radius, radius * 2, radius * 2);
                    ctx.restore();
                }
                ctx.restore();
            },

            paintStraightLine(x1, y1, x2, y2) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer || !layer.visible) return;
                const ctx = layer.ctx;
                ctx.save();
                this.applyLassoZoneClip(ctx);
                if (layer.alphaLocked) ctx.globalCompositeOperation = 'source-atop';
                else ctx.globalCompositeOperation = 'source-over';

                const rgb = this.hexToRgb(Engine.brushColor);
                ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${Engine.brushOpacity})`;
                ctx.lineWidth = Engine.brushSize;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.restore();
            },

            paintSymmetric(x1, y1, x2, y2, pressure) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer || !layer.visible) return;
                const cx = Engine.width / 2;
                const cy = Engine.height / 2;
                const count = parseInt(Engine.symmetryCount) || 4;

                for (let i = 0; i < count; i++) {
                    const angle = (i * 2 * Math.PI) / count;
                    const rx1 = cx + (x1 - cx) * Math.cos(angle) - (y1 - cy) * Math.sin(angle);
                    const ry1 = cy + (x1 - cx) * Math.sin(angle) + (y1 - cy) * Math.cos(angle);
                    const rx2 = cx + (x2 - cx) * Math.cos(angle) - (y2 - cy) * Math.sin(angle);
                    const ry2 = cy + (x2 - cx) * Math.sin(angle) + (y2 - cy) * Math.cos(angle);
                    
                    this.paintSingleSegment(rx1, ry1, rx2, ry2, pressure);
                }
            },

            paintSingleSegment(x1, y1, x2, y2, pressure) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                const ctx = layer.ctx;
                ctx.save();
                this.applyLassoZoneClip(ctx);
                const targetSize = Engine.brushSize * (0.4 + pressure * 0.6);
                const distance = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.ceil(distance / Math.max(1, targetSize * 0.05));
                const grad = ctx.createRadialGradient(0, 0, targetSize * Engine.brushHardness * 0.5, 0, 0, targetSize * 0.5);
                const rgb = this.hexToRgb(Engine.brushColor);
                grad.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${Engine.brushOpacity})`);
                grad.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
                ctx.fillStyle = grad;

                for (let i = 0; i <= steps; i++) {
                    const ratio = steps === 0 ? 1 : i / steps;
                    ctx.save();
                    ctx.translate(x1 + (x2 - x1) * ratio, y1 + (y2 - y1) * ratio);
                    ctx.beginPath(); ctx.arc(0, 0, targetSize * 0.5, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            },

            smudgeSegment(x1, y1, x2, y2, size, ctx) {
                const distance = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.ceil(distance / 2);
                const radius = size * 0.5;

                for (let i = 0; i <= steps; i++) {
                    const t = steps === 0 ? 1 : i / steps;
                    const sx = x1 + (x2 - x1) * t;
                    const sy = y1 + (y2 - y1) * t;
                    ctx.save();
                    ctx.globalAlpha = 0.2;
                    try {
                        ctx.beginPath(); ctx.arc(sx, sy, radius, 0, Math.PI * 2); ctx.clip();
                        ctx.drawImage(ctx.canvas, sx - radius, sy - radius, size, size, sx - radius + (x2 - x1) * 0.05, sy - radius + (y2 - y1) * 0.05, size, size);
                    } catch (err) {}
                    ctx.restore();
                }
            },

            liquifySegment(x1, y1, x2, y2, size, ctx) {
                const radius = size * 1.2;
                const canvasW = ctx.canvas.width;
                const canvasH = ctx.canvas.height;

                const minX = Math.max(0, Math.floor(x1 - radius));
                const maxX = Math.min(canvasW, Math.ceil(x1 + radius));
                const minY = Math.max(0, Math.floor(y1 - radius));
                const maxY = Math.min(canvasH, Math.ceil(y1 + radius));

                const w = maxX - minX;
                const h = maxY - minY;
                if (w <= 0 || h <= 0) return;

                const imgData = ctx.getImageData(minX, minY, w, h);
                const data = imgData.data;
                const copyData = new Uint8ClampedArray(data);

                const dx = x2 - x1;
                const dy = y2 - y1;
                const strength = Math.min(2.5, Math.hypot(dx, dy) * 0.6 + 0.5);

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const px = minX + x;
                        const py = minY + y;
                        const dist = Math.hypot(px - x1, py - y1);

                        if (dist < radius) {
                            const factor = Math.pow(1 - dist / radius, 2) * strength * 0.35;
                            const srcX = px - dx * factor;
                            const srcY = py - dy * factor;

                            const val = this.sampleBilinear(copyData, w, h, srcX - minX, srcY - minY);
                            const idx = (y * w + x) * 4;
                            data[idx] = val.r;
                            data[idx + 1] = val.g;
                            data[idx + 2] = val.b;
                            data[idx + 3] = val.a;
                        }
                    }
                }
                ctx.putImageData(imgData, minX, minY);
            },

            sampleBilinear(data, w, h, x, y) {
                const x0 = Math.floor(x);
                const y0 = Math.floor(y);
                const x1 = x0 + 1;
                const y1 = y0 + 1;

                const fx = x - x0;
                const fy = y - y0;

                const getPixel = (px, py) => {
                    if (px < 0 || px >= w || py < 0 || py >= h) return { r: 0, g: 0, b: 0, a: 0 };
                    const i = (py * w + px) * 4;
                    return { r: data[i], g: data[i+1], b: data[i+2], a: data[i+3] };
                };

                const p00 = getPixel(x0, y0);
                const p10 = getPixel(x1, y0);
                const p01 = getPixel(x0, y1);
                const p11 = getPixel(x1, y1);

                const r = (1 - fx) * (1 - fy) * p00.r + fx * (1 - fy) * p10.r + (1 - fx) * fy * p01.r + fx * fy * p11.r;
                const g = (1 - fx) * (1 - fy) * p00.g + fx * (1 - fy) * p10.g + (1 - fx) * fy * p01.g + fx * fy * p11.g;
                const b = (1 - fx) * (1 - fy) * p00.b + fx * (1 - fy) * p10.b + (1 - fx) * fy * p01.b + fx * fy * p11.b;
                const a = (1 - fx) * (1 - fy) * p00.a + fx * (1 - fy) * p10.a + (1 - fx) * fy * p01.a + fx * fy * p11.a;

                return { r, g, b, a };
            },

            stampShapeDrag(shapeType, x1, y1, x2, y2) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer || !layer.visible) return;
                const ctx = layer.ctx;
                ctx.save();
                this.applyLassoZoneClip(ctx);
                const rgb = this.hexToRgb(Engine.brushColor);
                ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${Engine.brushOpacity})`;
                ctx.lineWidth = Math.max(2, Engine.brushSize);

                const xMin = Math.min(x1, x2);
                const yMin = Math.min(y1, y2);
                const w = Math.abs(x2 - x1);
                const h = Math.abs(y2 - y1);

                if (shapeType === 'square') {
                    ctx.strokeRect(xMin, yMin, w, h);
                } else if (shapeType === 'triangle') {
                    ctx.beginPath();
                    ctx.moveTo(xMin + w/2, yMin);
                    ctx.lineTo(xMin + w, yMin + h);
                    ctx.lineTo(xMin, yMin + h);
                    ctx.closePath();
                    ctx.stroke();
                } else if (shapeType === 'circle') {
                    ctx.beginPath();
                    ctx.ellipse(xMin + w/2, yMin + h/2, w/2, h/2, 0, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (shapeType === 'cuboid') {
                    const d = Math.min(w, h) * 0.35;
                    const fw = w - d, fh = h - d;
                    ctx.strokeRect(xMin, yMin + d, fw, fh);
                    ctx.strokeRect(xMin + d, yMin, fw, fh);
                    ctx.beginPath();
                    ctx.moveTo(xMin, yMin + d); ctx.lineTo(xMin + d, yMin);
                    ctx.moveTo(xMin + fw, yMin + d); ctx.lineTo(xMin + fw + d, yMin);
                    ctx.moveTo(xMin, yMin + d + fh); ctx.lineTo(xMin + d, yMin + fh);
                    ctx.moveTo(xMin + fw, yMin + d + fh); ctx.lineTo(xMin + fw + d, yMin + fh);
                    ctx.stroke();
                } else if (shapeType === 'pyramid') {
                    ctx.beginPath();
                    ctx.moveTo(xMin + w/2, yMin);
                    ctx.lineTo(xMin + w, yMin + h);
                    ctx.lineTo(xMin, yMin + h);
                    ctx.closePath();
                    ctx.moveTo(xMin + w/2, yMin);
                    ctx.lineTo(xMin + w * 0.6, yMin + h * 0.7);
                    ctx.lineTo(xMin, yMin + h);
                    ctx.moveTo(xMin + w * 0.6, yMin + h * 0.7);
                    ctx.lineTo(xMin + w, yMin + h);
                    ctx.stroke();
                } else if (shapeType === 'cylinder') {
                    const rh = h * 0.15;
                    ctx.beginPath();
                    ctx.ellipse(xMin + w/2, yMin + rh, w/2, rh, 0, 0, Math.PI * 2);
                    ctx.ellipse(xMin + w/2, yMin + h - rh, w/2, rh, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(xMin, yMin + rh); ctx.lineTo(xMin, yMin + h - rh);
                    ctx.moveTo(xMin + w, yMin + rh); ctx.lineTo(xMin + w, yMin + h - rh);
                    ctx.stroke();
                } else if (shapeType === 'cone') {
                    const rh = h * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(xMin + w/2, yMin);
                    ctx.lineTo(xMin, yMin + h - rh);
                    ctx.lineTo(xMin + w, yMin + h - rh);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(xMin + w/2, yMin + h - rh, w/2, rh, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            },

            floodFill(startX, startY) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer) return;
                const ctx = layer.ctx;
                
                if (Engine.lassoZonePoints && Engine.lassoZonePoints.length > 2) {
                    ctx.save();
                    this.applyLassoZoneClip(ctx);
                }

                const imgData = ctx.getImageData(0, 0, Engine.width, Engine.height);
                const raw = imgData.data;

                const startIdx = (startY * Engine.width + startX) * 4;
                const targetColor = { r: raw[startIdx], g: raw[startIdx+1], b: raw[startIdx+2], a: raw[startIdx+3] };
                const fillColor = this.hexToRgb(Engine.brushColor);
                const fillAlpha = Math.floor(Engine.brushOpacity * 255);

                if (Math.abs(targetColor.r - fillColor.r) < 4 && Math.abs(targetColor.g - fillColor.g) < 4 && Math.abs(targetColor.b - fillColor.b) < 4) {
                    ctx.restore();
                    return;
                }

                let queue = [startX, startY];
                let head = 0;

                while (head < queue.length) {
                    const cx = queue[head++]; const cy = queue[head++];
                    const idx = (cy * Engine.width + cx) * 4;

                    if (raw[idx] === targetColor.r && raw[idx+1] === targetColor.g && raw[idx+2] === targetColor.b && raw[idx+3] === targetColor.a) {
                        raw[idx] = fillColor.r; raw[idx+1] = fillColor.g; raw[idx+2] = fillColor.b; raw[idx+3] = fillAlpha;

                        if (cx > 0) queue.push(cx - 1, cy);
                        if (cx < Engine.width - 1) queue.push(cx + 1, cy);
                        if (cy > 0) queue.push(cx, cy - 1);
                        if (cy < Engine.height - 1) queue.push(cx, cy + 1);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                ctx.restore();
                HistoryController.saveState();
                if (Engine.isAnimationMode) {
                    AnimationController.saveActiveFrameState();
                    AnimationController.renderTimeline();
                }
            },

            runEyedropper(x, y) {
                if (x < 0 || x >= Engine.width || y < 0 || y >= Engine.height) return;
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer) return;
                try {
                    const pixel = layer.ctx.getImageData(x, y, 1, 1).data;
                    if (pixel[3] > 0) {
                        const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1).toUpperCase();
                        Engine.brushColor = hex;
                        DOM.colorIndicator.style.backgroundColor = hex;
                        document.getElementById('wheel-selected-hex').innerText = hex;
                        document.getElementById('wheel-selected-name').innerText = "Eyedropper Pick";
                        
                        if (Engine.currentTool === 'text') {
                            LiveTextController.updateLiveText();
                        }
                    }
                } catch(e){}
            },

            hexToRgb(hex) {
                const val = parseInt(hex.slice(1), 16);
                return { r: (val >> 16) & 255, g: (val >> 8) & 255, b: val & 255 };
            }
        };

        const HistoryController = {
            saveState() {
                const layerConfigs = Engine.layers.map(l => {
                    const buf = document.createElement('canvas');
                    buf.width = Engine.width; buf.height = Engine.height;
                    buf.getContext('2d').drawImage(l.canvas, 0, 0);

                    const origBuf = document.createElement('canvas');
                    origBuf.width = Engine.width; origBuf.height = Engine.height;
                    origBuf.getContext('2d').drawImage(l.originalCanvas, 0, 0);

                    return { name: l.name, visible: l.visible, alphaLocked: l.alphaLocked, opacity: l.opacity, buffer: buf, originalBuffer: origBuf };
                });

                Engine.undoStack.push({ activeIdx: Engine.activeLayerIndex, layers: layerConfigs });
                if (Engine.undoStack.length > CONFIG.MAX_HISTORY) Engine.undoStack.shift();
                Engine.redoStack = [];
                this.syncButtons();
            },

            undo() {
                if (Engine.undoStack.length <= 1) return;
                Engine.redoStack.push(Engine.undoStack.pop());
                this.apply(Engine.undoStack[Engine.undoStack.length - 1]);
            },

            redo() {
                if (Engine.redoStack.length === 0) return;
                const state = Engine.redoStack.pop();
                Engine.undoStack.push(state);
                this.apply(state);
            },

            apply(state) {
                if (!state) return;
                Engine.layers.forEach(l => DOM.container.removeChild(l.canvas));
                Engine.layers = [];

                state.layers.forEach((config, idx) => {
                    const l = new StudioLayer(Engine.width, Engine.height, config.name);
                    l.visible = config.visible; l.alphaLocked = config.alphaLocked; l.opacity = config.opacity;
                    l.ctx.drawImage(config.buffer, 0, 0);
                    l.originalCtx.drawImage(config.originalBuffer, 0, 0);
                    Engine.layers.push(l);
                    DOM.container.appendChild(l.canvas);
                    l.syncDOM(idx);
                });

                Engine.activeLayerIndex = state.activeIdx;
                UIController.renderLayersList();
                this.syncButtons();
                if (Engine.isAnimationMode) {
                    AnimationController.saveActiveFrameState();
                    AnimationController.renderTimeline();
                }
            },

            syncButtons() {
                DOM.undoBtn.disabled = (Engine.undoStack.length <= 1);
                DOM.redoBtn.disabled = (Engine.redoStack.length === 0);
            }
        };

        const LiveTextController = {
            async updateLiveText() {
                const textContent = document.getElementById('text-input-content').value.trim();
                if (!textContent) {
                    TransformOverlayController.close();

                const fontFamily = document.getElementById('text-font-family').value;
                const fontSize = Math.max(36, Engine.brushSize * 3);

                try {
                    await document.fonts.load(`${fontSize}px "${fontFamily}"`);
                } catch(err) {}

                const textCanvas = document.createElement('canvas');
                const tCtx = textCanvas.getContext('2d');
                tCtx.font = `${fontSize}px "${fontFamily}", sans-serif`;
                const metrics = tCtx.measureText(textContent);
                textCanvas.width = Math.ceil(metrics.width) + 40;
                textCanvas.height = Math.ceil(fontSize * 1.5);
                
                tCtx.font = `${fontSize}px "${fontFamily}", sans-serif`;
                tCtx.fillStyle = Engine.brushColor;
                tCtx.textBaseline = 'middle';
                tCtx.fillText(textContent, 20, textCanvas.height / 2);

                const img = new Image();
                img.onload = () => {
                    if (DOM.transformOverlay.style.display !== 'block' || Engine.currentTool === 'text') {
                        TransformOverlayController.activateWithImage(img);
                    } else {
                        Engine.transform.image = img;

        const TransformOverlayController = {
            init() {
                DOM.layerImportInput.addEventListener('change', (e) => this.processImport(e));
                this.setupGestures();
            },

            async processImport(e) {
                let file = e.target.files[0];
                if (!file) return;
                file = await ensureReadableImageFile(file);

                const r = new FileReader();
                r.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        this.activateWithImage(img, ev.target.result);
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(file);
                e.target.value = "";
            },

            activateWithImage(img, dataUrl) {
                Engine.transform.image = img;
                Engine.transform.w = (img.naturalWidth || img.width) * 1.35;
                Engine.transform.h = (img.naturalHeight || img.height) * 1.35;
                
                if(Engine.transform.w > Engine.width) {
                    const ratio = (Engine.width * 0.8) / Engine.transform.w;
                    Engine.transform.w *= ratio; Engine.transform.h *= ratio;
                }

                Engine.transform.x = (Engine.width - Engine.transform.w) / 2;
                Engine.transform.y = (Engine.height - Engine.transform.h) / 2;
                Engine.transform.rotation = 0;

                DOM.transformOverlay.style.backgroundImage = `url(${dataUrl || img.src})`;
                Engine.currentTool = Engine.currentTool === 'text' ? 'text' : 'placement';
                DOM.transformOverlay.style.display = 'block';
                this.sync();
            },

            sync() {
                const t = Engine.transform;
                DOM.transformOverlay.style.width = t.w + 'px';
                DOM.transformOverlay.style.height = t.h + 'px';
                DOM.transformOverlay.style.transform = `translate(${t.x}px, ${t.y}px) rotate(${t.rotation}rad)`;
            },

            setupGestures() {
                const target = DOM.transformOverlay;
                target.addEventListener('pointerdown', (e) => {
                    const handle = e.target.getAttribute('data-handle');
                    const t = Engine.transform;
                    t.activeHandle = handle || 'move';
                    t.startX = e.clientX; t.startY = e.clientY;
                    t.startW = t.w; t.startH = t.h;
                    t.startXPos = t.x; t.startYPos = t.y;
                    t.startRot = t.rotation;
                    target.setPointerCapture(e.pointerId);
                    e.stopPropagation();
                });

                target.addEventListener('pointermove', (e) => {
                    const t = Engine.transform;
                    if (!t.activeHandle) return;

                    const dx = (e.clientX - t.startX) / Engine.scale;
                    const dy = (e.clientY - t.startY) / Engine.scale;

                    if (t.activeHandle === 'move') {
                        t.x = t.startXPos + dx; t.y = t.startYPos + dy;
                    } else if (t.activeHandle === 'br') {
                        t.w = Math.max(44, t.startW + dx);
                        t.h = t.w * (t.startH / t.startW);
                    } else if (t.activeHandle === 'rot') {
                        const box = target.getBoundingClientRect();
                        const cx = box.left + box.width / 2; const cy = box.top + box.height / 2;
                        t.rotation = t.startRot + (Math.atan2(e.clientY - cy, e.clientX - cx) - Math.atan2(t.startY - cy, t.startX - cx));
                    }
                    this.sync();
                });

                const stop = () => Engine.transform.activeHandle = null;
                target.addEventListener('pointerup', stop); target.addEventListener('pointercancel', stop);

                document.getElementById('xf-confirm-btn').addEventListener('click', () => {
                    const activeLyr = Engine.layers[Engine.activeLayerIndex];
                    const t = Engine.transform;
                    if (t.image && activeLyr) {
                        const drawAction = (c) => {
                            c.save();
                            DrawingCore.applyLassoZoneClip(c);
                            c.translate(t.x + t.w/2, t.y + t.h/2);
                            c.rotate(t.rotation);
                            c.drawImage(t.image, -t.w/2, -t.h/2, t.w, t.h);
                            c.restore();
                        };
                        drawAction(activeLyr.ctx);

                        HistoryController.saveState();
                        UIController.renderLayersList();
                        if (Engine.isAnimationMode) {
                            AnimationController.saveActiveFrameState();
                            AnimationController.renderTimeline();
                        }
                    }
                    this.close();
                });

                document.getElementById('xf-cancel-btn').addEventListener('click', () => {
                    if (Engine.currentTool === 'text') {
                        document.getElementById('text-input-content').value = '';
                    }
                    this.close();
                });
            },

            close() {
                DOM.transformOverlay.style.display = 'none';
                DOM.transformOverlay.style.backgroundImage = 'none';
                Engine.transform.image = null;
                if (Engine.currentTool === 'placement') {
                    Engine.currentTool = DOM.toolSelect.value;
                }
            }
        };

        const AppLifecycleController = {
            init() {
                ViewportController.init();
                UIController.init();
                TransformOverlayController.init();
                ArtWheelController.init();
                CodeGeneratorModal.init();
                ModePopupController.init();

                document.getElementById('start-white-canvas-btn').addEventListener('click', () => {
                    const w = parseInt(document.getElementById('start-width-input').value) || 1080;

                    this.startWorkspace(w, h, null);
                });

                document.getElementById('start-file-input').addEventListener('change', async (e) => {
                    let file = e.target.files[0];
                    if (!file) return;
                    file = await ensureReadableImageFile(file);

                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            this.startWorkspace(img.naturalWidth || img.width, img.naturalHeight || img.height, img);
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                DOM.undoBtn.addEventListener('click', () => HistoryController.undo());
                DOM.redoBtn.addEventListener('click', () => HistoryController.redo());
                document.getElementById('hdr-download-png').addEventListener('click', () => this.exportFlattenedAsset());
            },

            startWorkspace(w, h, baseImg) {
                Engine.width = w; Engine.height = h;
                DOM.startScreen.style.display = 'none';
                DOM.workspace.style.display = 'block';

                const baseLyr = new StudioLayer(w, h, "Background Layer");
                if (baseImg) {
                    baseLyr.ctx.drawImage(baseImg, 0, 0, w, h);
                    baseLyr.originalCtx.drawImage(baseImg, 0, 0, w, h);
                } else {
                    baseLyr.ctx.fillStyle = '#ffffff'; baseLyr.ctx.fillRect(0, 0, w, h);
                    baseLyr.originalCtx.fillStyle = '#ffffff'; baseLyr.originalCtx.fillRect(0, 0, w, h);
                }

                Engine.layers.push(baseLyr);
                DOM.container.appendChild(baseLyr.canvas);
                
                ViewportController.fitToScreenView();
                UIController.renderLayersList();
                HistoryController.saveState();
            },

            exportFlattenedAsset() {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = Engine.width; exportCanvas.height = Engine.height;
                const eCtx = exportCanvas.getContext('2d');

                Engine.layers.forEach(l => {
                    if (l.visible) {
                        eCtx.save(); eCtx.globalAlpha = l.opacity; eCtx.drawImage(l.canvas, 0, 0); eCtx.restore();
                    }
                });

                const a = document.createElement('a');
                a.download = `art_studio_mobile_art_${Date.now()}.png`;
                a.href = exportCanvas.toDataURL('image/png');
                a.click();
            }
        };

        document.addEventListener('DOMContentLoaded', () => AppLifecycleController.init());
    </script>
</body>
</html>
