<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tomar Art Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --bg-main: #141419;
            --bg-panel: #1e1e26;
            --bg-item: #2a2a38;
            --bg-input: #0f0f14;
            --accent: #3a86ff;
            --accent-hover: #5496ff;
            --text: #f5f5fa;
            --text-muted: #8e8e9f;
            --border: #2d2d3d;
            --danger: #ff4a4a;
            --success: #25a244;
            --hdr-h: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: radial-gradient(circle at center, #232330 0%, #08080b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .config-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .config-card h2 {
            margin-bottom: 24px;
            font-size: 26px;
            color: var(--accent);
            font-weight: 800;
        }

        .file-wrapper {
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .file-wrapper input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-success { background: var(--success); color: white; }

        .divider {
            margin: 16px 0;
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: var(--border);
        }

        .dimensions-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 12px;
        }

        .input-unit { flex: 1; text-align: left; }
        .input-unit label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .input-unit input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 6px; padding: 12px; color: white; font-size: 16px; text-align: center;
        }

        #workspace {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: var(--hdr-h);
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            z-index: 100;
        }

        .toolbar-cluster { display: flex; align-items: center; gap: 8px; }

        .ctrl-btn {
            background: var(--bg-item);
            border: 1px solid var(--border);
            color: var(--text);
            min-width: 44px;
            height: 44px;
            padding: 0 10px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .ctrl-btn:disabled { opacity: 0.25; }

        #canvas-viewport {
            position: absolute;
            top: var(--hdr-h);
            bottom: calc(var(--hdr-h) + 180px); 
            left: 0;
            right: 0;
            overflow: hidden;
            background: #141418;
            touch-action: none;
            outline: none;
        }

        #canvas-container {
            position: absolute;
            transform-origin: 0 0;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background-color: #ffffff;
        }

        #canvas-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            image-rendering: pixelated;
        }

        #transform-overlay {
            position: absolute;
            border: 3px dashed var(--accent);
            display: none;
            z-index: 500;
            transform-origin: 0 0;
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .node-handle {
            position: absolute;
            width: 28px;
            height: 28px;
            background: white;
            border: 4px solid var(--accent);
            border-radius: 50%;
            touch-action: none;
        }
        .node-br { bottom: -14px; right: -14px; }
        
        .rotator-node {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: #00ff66;
            border: 3px solid white;
            border-radius: 50%;
        }

        #transform-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            white-space: nowrap;
            z-index: 550;
        }

        #layers-panel {
            position: absolute;
            bottom: 180px;
            left: 0;
            right: 0;
            height: 310px;
            background: rgba(30, 30, 38, 0.98);
            border-top: 2px solid var(--border);
            display: none; 
            flex-direction: column;
            z-index: 600;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }

        .layers-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px 4px 14px;
            border-bottom: 1px solid var(--border);
        }

        .layers-header h3 { font-size: 16px; color: var(--text); }

        .close-drawer-btn {
            background: var(--bg-item);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        #layer-items-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .layer-row {
            background: var(--bg-item);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .layer-row.active { border-color: var(--accent); background: #2c2c3e; }

        .layer-title-text { font-size: 16px; font-weight: bold; flex: 1; }
        .layer-inline-controls { display: flex; gap: 10px; }
        
        .layer-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 16px;
            min-width: 40px;
            text-align: center;
        }
        .layer-toggle.state-active { color: var(--text); background: var(--accent); }

        .layers-footer-actions {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: var(--bg-panel);
        }

        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            gap: 10px;
            z-index: 150;
        }

        .footer-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }

        .engine-param-slider {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 12px;
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .engine-param-slider label { font-size: 13px; font-weight: bold; width: 120px; color: var(--text); }
        .engine-param-slider input[type="range"] { flex: 1; height: 26px; accent-color: var(--accent); }

        .color-module-container { position: relative; display: flex; align-items: center; }
        .native-wheel-proxy {
            width: 42px; height: 42px; border-radius: 50%; border: 2px solid white;
            position: relative; box-shadow: 0 0 8px rgba(0,0,0,0.4); cursor: pointer;
            background: #3a86ff;
        }

        #color-wheel-popup {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 0;
            background: rgba(20, 20, 24, 0.96);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            z-index: 1100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .wheel-top-actions {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 6px;
        }

        .wheel-shortcut-btn {
            background: var(--bg-item);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .wheel-shortcut-btn:hover { background: var(--accent); }

        .color-wheel-container {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            cursor: crosshair;
        }

        #color-wheel-canvas {
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        #wheel-pointer {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }

        .wheel-info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            font-family: monospace;
            color: var(--text-muted);
            padding: 2px 4px;
        }

        .layer-small-btn {
            background: var(--bg-item); color: white; border: 1px solid var(--border);
            padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; text-align: center;
        }

        .transform-action-btn {
            padding: 12px 18px;
            font-size: 16px;
        }

        .preview-circle-indicator {
            position: fixed; border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 4px rgba(0,0,0,0.5); border-radius: 50%;
            pointer-events: none; transform: translate(-50%, -50%); display: none; z-index: 99999;
        }

        #code-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .code-modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .code-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-modal-header h3 {
            font-size: 18px;
            color: var(--text);
            font-weight: 700;
        }

        .code-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg-input);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .code-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .code-tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .code-modal-content input[type="text"] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .code-modal-content input[type="text"]:focus {
            border-color: var(--accent);
        }

        .code-preview-area {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            min-height: 180px;
            max-height: 220px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
        }

        .code-modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div id="brush-cursor-preview" class="preview-circle-indicator"></div>

    <div id="start-screen">
        <div class="config-card">
            <h2>Tomar Art Studio</h2>
            
            <div class="file-wrapper">
                <button class="btn">Import Image</button>
                <input type="file" id="start-file-input" accept="image/*, .heic, .heif">
            </div>

            <div class="divider">OR</div>

            <button class="btn btn-success" id="start-white-canvas-btn">Canvas</button>
            
            <div class="dimensions-box" style="margin-top: 16px;">
                <div class="input-unit">
                    <label>Width (px)</label>
                    <input type="number" id="start-width-input" value="1080">
                </div>
                <div class="input-unit">
                    <label>Height (px)</label>
                    <input type="number" id="start-height-input" value="1080">
                </div>
            </div>
        </div>
    </div>

    <div id="code-modal">
        <div class="code-modal-content">
            <div class="code-modal-header">
                <h3>Code Generator</h3>
                <button class="close-drawer-btn" id="code-x-close" style="padding:4px 8px;">✕</button>
            </div>

            <div class="code-tabs">
                <button class="code-tab-btn active" data-mode="qr">QR Code</button>
                <button class="code-tab-btn" data-mode="barcode">Barcode</button>
            </div>

            <div class="code-preview-area">
                <canvas id="modal-qr-canvas" style="display:none; max-width:100%; max-height:160px; object-fit:contain;"></canvas>
                <svg id="modal-barcode-svg" style="display:none; max-width:100%; max-height:160px;"></svg>
                <span id="code-placeholder" style="color:#888; font-size:14px; text-align:center;">Enter text or URL to generate</span>
            </div>

            <input type="text" id="code-text-input" placeholder="Type content here (e.g., URL or Serial)..." autocomplete="off">
            
            <div class="code-modal-actions">
                <button class="layer-small-btn" id="code-cancel-btn" style="background:var(--bg-item);">Cancel</button>
                <button class="layer-small-btn btn-success" id="code-stamp-btn" style="font-weight:bold;">Stamp to Canvas</button>
            </div>
        </div>
    </div>

    <div id="workspace">
        <header>
            <div class="toolbar-cluster">
                <button class="ctrl-btn" id="hdr-undo-btn" title="Undo">↶</button>
                <button class="ctrl-btn" id="hdr-redo-btn" title="Redo">↷</button>
            </div>

            <div class="toolbar-cluster">
                <button class="ctrl-btn" id="hdr-qrbar-btn" style="font-weight:bold; font-size:13px; background:var(--bg-item); border-color:var(--accent);">QR/Bar</button>
                
                <div class="file-wrapper" style="margin:0;">
                    <button class="ctrl-btn" style="font-weight:bold; font-size:14px; background:var(--accent);">+ Layer Photo</button>
                    <input type="file" id="layer-file-import" accept="image/*, .heic, .heif">
                </div>
                <button class="ctrl-btn" id="hdr-download-png" title="Download">💾</button>
            </div>
        </header>

        <div id="canvas-viewport">
            <div id="canvas-container">
                <div id="transform-overlay">
                    <div id="transform-bar">
                        <button class="layer-small-btn transform-action-btn" id="xf-confirm-btn" style="background:#1b4d22;">✔ Stamp</button>
                        <button class="layer-small-btn transform-action-btn" id="xf-flipx-btn">⇄ Flip</button>
                        <button class="layer-small-btn transform-action-btn" id="xf-cancel-btn" style="background:#611a1a;">✖ Cancel</button>
                    </div>
                    <div class="node-handle node-br" data-handle="br"></div>
                    <div class="rotator-node" data-handle="rot"></div>
                </div>
            </div>
        </div>

        <div id="layers-panel">
            <div class="layers-header">
                <h3>📚 Active Layers</h3>
                <button class="close-drawer-btn" id="close-layers-sheet-btn">✖ Close</button>
            </div>
            <div id="layer-items-container"></div>
            <div class="layers-footer-actions">
                <button class="layer-small-btn" id="lyr-add-btn">+ New Layer</button>
                <button class="layer-small-btn" id="lyr-merge-btn">Merge Down</button>
                <button class="layer-small-btn" id="lyr-delete-btn" style="color:var(--danger)">Delete</button>
            </div>
        </div>

        <footer>
            <div class="footer-top-row">
                <select id="tool-select" class="layer-small-btn" style="padding:10px; font-size:14px; flex:1; background:var(--bg-item); text-align:left;">
                    <option value="pen">Brush Tool 🖌️</option>
                    <option value="eraser">Soft Eraser 🧼</option>
                    <option value="smudge">Smudge Paint 👆</option>
                    <option value="bucket">Flood Fill 🪣</option>
                    <option value="eyedropper">Eyedropper 🧪</option>
                </select>
                
                <button class="ctrl-btn" id="mobile-layer-toggle-btn" style="background:var(--bg-item); font-weight:bold; font-size: 14px;">📚 Layers</button>

                <div class="color-module-container">
                    <div class="native-wheel-proxy" id="color-indicator-preview" title="Open Art Wheel"></div>
                    
                    <div id="color-wheel-popup">
                        <div class="wheel-top-actions">
                            <button type="button" id="wheel-btn-black" class="wheel-shortcut-btn">BL</button>
                            <button type="button" id="wheel-btn-edit" class="wheel-shortcut-btn">Edit</button>
                            <button type="button" id="wheel-btn-white" class="wheel-shortcut-btn">WH</button>
                            <input type="color" id="native-color-picker-input" style="display:none;">
                        </div>
                        <div class="color-wheel-container" id="color-wheel-wrapper">
                            <canvas id="color-wheel-canvas" width="150" height="150"></canvas>
                            <div id="wheel-pointer"></div>
                        </div>
                        <div class="wheel-info-bar">
                            <span id="wheel-selected-hex">#3A86FF</span>
                            <span id="wheel-selected-name">Cobalt Blue</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="engine-param-slider">
                <label id="lbl-brush-size">Size: 20px</label>
                <input type="range" id="slider-brush-size" min="1" max="200" value="20">
            </div>

            <div class="engine-param-slider">
                <label id="lbl-brush-opacity">Opacity: 100%</label>
                <input type="range" id="slider-brush-opacity" min="0" max="100" value="100">
            </div>

            <div class="engine-param-slider">
                <label id="lbl-brush-hardness">Hardness: 80%</label>
                <input type="range" id="slider-brush-hardness" min="0" max="100" value="80">
            </div>
        </footer>
    </div>

    <script type="module">
        const CONFIG = {
            MAX_HISTORY: 20,
            MIN_SCALE: 0.1,
            MAX_SCALE: 40.0,
            STABILIZATION: 0.25,
            LONG_PRESS_MS: 600
        };

        async function ensureReadableImageFile(file) {
            const extension = file.name.split('.').pop().toLowerCase();
            if ((extension === 'heic' || extension === 'heif') && typeof heic2any === 'function') {
                try {
                    const convertedBlob = await heic2any({ blob: file, toType: "image/png" });
                    const singleBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    return new File([singleBlob], file.name.substring(0, file.name.lastIndexOf('.')) + '.png', { type: 'image/png' });
                } catch (err) {
                    console.error("HEIC format conversion failed: ", err);
                }
            }
            return file;
        }

        class MobileAppEngineState {
            constructor() {
                this.width = 1080;
                this.height = 1080;
                this.layers = [];
                this.activeLayerIndex = 0;
                this.undoStack = [];
                this.redoStack = [];
                
                this.scale = 1.0;
                this.panX = 0;
                this.panY = 0;

                this.currentTool = 'pen';
                this.brushColor = '#3a86ff';
                this.brushSize = 20;
                this.brushOpacity = 1.0;
                this.brushHardness = 0.8;

                this.isDrawing = false;
                this.isPanning = false;
                this.lastX = 0; this.lastY = 0;
                this.stabilizedX = 0; this.stabilizedY = 0;
                this.lastTapTime = 0;
                this.longPressTimeout = null;

                this.transform = {
                    image: null, x: 0, y: 0, w: 100, h: 100, rotation: 0,
                    activeHandle: null, startX: 0, startY: 0, startW: 100, startH: 100, startXPos: 0, startYPos: 0, startRot: 0
                };
            }
        }

        const Engine = new MobileAppEngineState();

        class StudioLayer {
            constructor(w, h, name) {
                this.id = 'lyr_' + Math.random().toString(36).substr(2, 9);
                this.canvas = document.createElement('canvas');
                this.canvas.width = w;
                this.canvas.height = h;
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                this.name = name;
                this.opacity = 1.0;
                this.visible = true;
                this.alphaLocked = false;
                
                this.ctx.imageSmoothingEnabled = true;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
            }
            syncDOM(zIndex) {
                this.canvas.style.zIndex = zIndex;
                this.canvas.style.opacity = this.opacity;
                this.canvas.style.display = this.visible ? 'block' : 'none';
            }
        }

        const ArtWheelController = {
            init() {
                const canvas = document.getElementById('color-wheel-canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const wrapper = document.getElementById('color-wheel-wrapper');
                const pointer = document.getElementById('wheel-pointer');
                const hexLabel = document.getElementById('wheel-selected-hex');
                const nameLabel = document.getElementById('wheel-selected-name');
                const nativeColorInput = document.getElementById('native-color-picker-input');

                const radius = canvas.width / 2;
                const imgData = ctx.createImageData(canvas.width, canvas.height);
                const data = imgData.data;

                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const dx = x - radius;
                        const dy = y - radius;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const index = (y * canvas.width + x) * 4;

                        if (dist <= radius) {
                            const angle = Math.atan2(dy, dx);
                            let hue = (angle * 180 / Math.PI + 360) % 360;
                            let sat = dist / radius;
                            let light = 0.5;

                            let c = (1 - Math.abs(2 * light - 1)) * sat;
                            let xVal = c * (1 - Math.abs((hue / 60) % 2 - 1));
                            let m = light - c / 2;
                            let r = 0, g = 0, b = 0;

                            if (0 <= hue && hue < 60) { r = c; g = xVal; b = 0; }
                            else if (60 <= hue && hue < 120) { r = xVal; g = c; b = 0; }
                            else if (120 <= hue && hue < 180) { r = 0; g = c; b = xVal; }
                            else if (180 <= hue && hue < 240) { r = 0; g = xVal; b = c; }
                            else if (240 <= hue && hue < 300) { r = xVal; g = 0; b = c; }
                            else if (300 <= hue && hue < 360) { r = c; g = 0; b = xVal; }

                            data[index] = Math.round((r + m) * 255);
                            data[index + 1] = Math.round((g + m) * 255);
                            data[index + 2] = Math.round((b + m) * 255);
                            data[index + 3] = 255;
                        } else {
                            data[index + 3] = 0;
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                const rgbToHex = (r, g, b) => "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();

                const getColorName = (r, g, b) => {
                    if (r === 0 && g === 0 && b === 0) return 'Lamp Black';
                    if (r === 255 && g === 255 && b === 255) return 'Titanium White';

                    // Convert RGB to HSL for dynamic descriptive naming
                    let rf = r / 255, gf = g / 255, bf = b / 255;
                    let max = Math.max(rf, gf, bf), min = Math.min(rf, gf, bf);
                    let h, s, l = (max + min) / 2;

                    if (max === min) {
                        h = s = 0;
                    } else {
                        let d = max - min;
                        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                        switch (max) {
                            case rf: h = (gf - bf) / d + (gf < bf ? 6 : 0); break;
                            case gf: h = (bf - rf) / d + 2; break;
                            case bf: h = (rf - gf) / d + 4; break;
                        }
                        h /= 6;
                    }

                    const hue = Math.round(h * 360);
                    const sat = Math.round(s * 100);
                    const light = Math.round(l * 100);

                    if (light < 15) return 'Dark Shade';
                    if (light > 85 && sat < 15) return 'Light Tint';
                    if (sat < 15) return 'Neutral Gray';

                    if (hue < 15 || hue >= 345) return 'Crimson Red';
                    if (hue < 45) return 'Warm Orange';
                    if (hue < 70) return 'Golden Yellow';
                    if (hue < 150) return 'Emerald Green';
                    if (hue < 190) return 'Turquoise Cyan';
                    if (hue < 260) return 'Cobalt Blue';
                    if (hue < 315) return 'Deep Violet';
                    return 'Magenta Pink';
                };

                const applyColor = (hex, name) => {
                    Engine.brushColor = hex;
                    DOM.colorIndicator.style.backgroundColor = hex;
                    hexLabel.innerText = hex;
                    nameLabel.innerText = name;
                };

                const pickColor = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    if (clientX === undefined) return;

                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    const dx = x - radius;
                    const dy = y - radius;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    let px = x, py = y;
                    if (dist > radius) {
                        px = radius + (dx / dist) * radius;
                        py = radius + (dy / dist) * radius;
                    }

                    pointer.style.left = px + 'px';
                    pointer.style.top = py + 'px';
                    pointer.style.display = 'block';

                    const sx = Math.min(Math.max(Math.floor(px), 0), canvas.width - 1);
                    const sy = Math.min(Math.max(Math.floor(py), 0), canvas.height - 1);
                    const pixel = ctx.getImageData(sx, sy, 1, 1).data;

                    if (pixel[3] > 0) {
                        const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
                        const name = getColorName(pixel[0], pixel[1], pixel[2]);
                        applyColor(hex, name);
                    }
                };

                let selecting = false;
                wrapper.addEventListener('mousedown', (e) => { selecting = true; pickColor(e); });
                window.addEventListener('mousemove', (e) => { if (selecting) pickColor(e); });
                window.addEventListener('mouseup', () => { selecting = false; });

                wrapper.addEventListener('touchstart', (e) => { selecting = true; pickColor(e); }, { passive: true });
                window.addEventListener('touchmove', (e) => { if (selecting) pickColor(e); }, { passive: true });
                window.addEventListener('touchend', () => { selecting = false; });

                document.getElementById('wheel-btn-black').addEventListener('click', (e) => {
                    e.stopPropagation();
                    applyColor('#000000', 'Lamp Black');
                    pointer.style.display = 'none';
                });

                document.getElementById('wheel-btn-white').addEventListener('click', (e) => {
                    e.stopPropagation();
                    applyColor('#FFFFFF', 'Titanium White');
                    pointer.style.display = 'none';
                });

                document.getElementById('wheel-btn-edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    nativeColorInput.click();
                });

                nativeColorInput.addEventListener('input', (e) => {
                    const hex = e.target.value.toUpperCase();
                    // Parse hex to RGB for dynamic naming
                    const bigint = parseInt(hex.slice(1), 16);
                    const r = (bigint >> 16) & 255;
                    const g = (bigint >> 8) & 255;
                    const b = bigint & 255;
                    const name = getColorName(r, g, b);
                    applyColor(hex, name);
                    pointer.style.display = 'none';
                });

                DOM.colorIndicator.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = DOM.colorWheelPopup.style.display === 'flex';
                    DOM.colorWheelPopup.style.display = isVisible ? 'none' : 'flex';
                });

                document.addEventListener('click', (e) => {
                    if (!DOM.colorWheelPopup.contains(e.target) && !DOM.colorIndicator.contains(e.target)) {
                        DOM.colorWheelPopup.style.display = 'none';
                    }
                });
            }
        };

        const CodeGeneratorModal = {

        const ViewportController = {
            init() {
                window.addEventListener('resize', () => this.fitToScreenView());
                this.bindPointersGestures();
            },

            fitToScreenView() {
                const margin = 20;
                const vW = DOM.viewport.clientWidth - margin;
                const vH = DOM.viewport.clientHeight - margin;
                const sX = vW / Engine.width;
                const sY = vH / Engine.height;

                Engine.scale = Math.min(sX, sY, 1.2);
                Engine.panX = (DOM.viewport.clientWidth - Engine.width * Engine.scale) / 2;
                Engine.panY = (DOM.viewport.clientHeight - Engine.height * Engine.scale) / 2;
                this.apply();
            },

            apply() {
                DOM.container.style.width = Engine.width + 'px';
                DOM.container.style.height = Engine.height + 'px';
                DOM.container.style.transform = `translate(${Engine.panX}px, ${Engine.panY}px) scale(${Engine.scale})`;
            },

            clientToCanvas(cx, cy) {
                const rect = DOM.container.getBoundingClientRect();
                return {
                    x: ((cx - rect.left) / rect.width) * Engine.width,
                    y: ((cy - rect.top) / rect.height) * Engine.height
                };
            },

            bindPointersGestures() {
                let activePointers = new Map();
                let initialPinchDist = 0;
                let initialPinchScale = 1.0;
                let initialPinchMid = { x: 0, y: 0 };

                DOM.viewport.addEventListener('pointerdown', (e) => {
                    if (Engine.currentTool === 'placement') return;
                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (activePointers.size >= 2) {
                        if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                        Engine.isPanning = true;
                        Engine.isDrawing = false;
                        
                        const pts = Array.from(activePointers.values());
                        initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                        initialPinchScale = Engine.scale;
                        initialPinchMid = {
                            x: (pts[0].x + pts[1].x) / 2 - Engine.panX,
                            y: (pts[0].y + pts[1].y) / 2 - Engine.panY
                        };
                    } else if (activePointers.size === 1) {
                        const now = Date.now();
                        if (now - Engine.lastTapTime < 260) {
                            if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                            HistoryController.undo();
                            activePointers.clear();
                            Engine.isDrawing = false;
                            return;
                        }
                        Engine.lastTapTime = now;
                        
                        const coords = this.clientToCanvas(e.clientX, e.clientY);
                        Engine.longPressTimeout = setTimeout(() => {
                            DrawingCore.runEyedropper(Math.floor(coords.x), Math.floor(coords.y));
                            Engine.isDrawing = false;
                            activePointers.clear();
                        }, CONFIG.LONG_PRESS_MS);

                        Engine.isDrawing = true;
                        Engine.lastX = coords.x; Engine.lastY = coords.y;
                        Engine.stabilizedX = coords.x; Engine.stabilizedY = coords.y;
                        
                        if (Engine.currentTool === 'bucket') {
                            if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                            DrawingCore.floodFill(Math.floor(coords.x), Math.floor(coords.y));
                            Engine.isDrawing = false;
                        } else if (Engine.currentTool === 'eyedropper') {
                            if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                            DrawingCore.runEyedropper(Math.floor(coords.x), Math.floor(coords.y));
                            Engine.isDrawing = false;
                        } else {
                            DrawingCore.paint(coords.x, coords.y, coords.x, coords.y, e.pressure || 0.5);
                        }
                    }
                });

                DOM.viewport.addEventListener('pointermove', (e) => {
                    if (!activePointers.has(e.pointerId)) return;
                    const startPt = activePointers.get(e.pointerId);
                    if (startPt && Math.hypot(e.clientX - startPt.x, e.clientY - startPt.y) > 10) {
                        if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                    }
                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (Engine.isPanning && activePointers.size >= 2) {
                        const pts = Array.from(activePointers.values());
                        const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                        const targetScale = initialPinchScale * (currentDist / initialPinchDist);
                        Engine.scale = Math.min(Math.max(targetScale, CONFIG.MIN_SCALE), CONFIG.MAX_SCALE);

                        const currentMidX = (pts[0].x + pts[1].x) / 2;
                        const currentMidY = (pts[0].y + pts[1].y) / 2;
                        Engine.panX = currentMidX - initialPinchMid.x * (Engine.scale / initialPinchScale);
                        Engine.panY = currentMidY - initialPinchMid.y * (Engine.scale / initialPinchScale);
                        this.apply();
                    } else if (Engine.isDrawing && activePointers.size === 1) {
                        const coords = this.clientToCanvas(e.clientX, e.clientY);
                        Engine.stabilizedX += (coords.x - Engine.stabilizedX) * CONFIG.STABILIZATION;
                        Engine.stabilizedY += (coords.y - Engine.stabilizedY) * CONFIG.STABILIZATION;

                        DrawingCore.paint(Engine.lastX, Engine.lastY, Engine.stabilizedX, Engine.stabilizedY, e.pressure || 0.5);
                        Engine.lastX = Engine.stabilizedX; Engine.lastY = Engine.stabilizedY;
                    }
                });

                const clearPointers = (e) => {
                    if (Engine.longPressTimeout) clearTimeout(Engine.longPressTimeout);
                    activePointers.delete(e.pointerId);
                    if (activePointers.size < 2) Engine.isPanning = false;
                    if (activePointers.size === 0 && Engine.isDrawing) {
                        Engine.isDrawing = false;
                        HistoryController.saveState();
                        UIController.renderLayersList();
                    }
                };

                DOM.viewport.addEventListener('pointerup', clearPointers);
                DOM.viewport.addEventListener('pointercancel', clearPointers);
            }
        };

        const DrawingCore = {
            paint(x1, y1, x2, y2, pressure) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer || !layer.visible) return;

                const ctx = layer.ctx;
                ctx.save();

                if (layer.alphaLocked) ctx.globalCompositeOperation = 'source-atop';
                else ctx.globalCompositeOperation = (Engine.currentTool === 'eraser') ? 'destination-out' : 'source-over';

                const targetSize = Engine.brushSize * (0.4 + pressure * 0.6);
                
                if (Engine.currentTool === 'smudge') {
                    this.smudgeSegment(x1, y1, x2, y2, targetSize, ctx);
                } else {
                    const distance = Math.hypot(x2 - x1, y2 - y1);
                    const steps = Math.ceil(distance / Math.max(1, targetSize * 0.05));
                    
                    const grad = ctx.createRadialGradient(0, 0, targetSize * Engine.brushHardness * 0.5, 0, 0, targetSize * 0.5);
                    const rgb = this.hexToRgb(Engine.brushColor);
                    
                    grad.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${Engine.brushOpacity})`);
                    grad.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
                    ctx.fillStyle = grad;

                    for (let i = 0; i <= steps; i++) {
                        const ratio = steps === 0 ? 1 : i / steps;
                        ctx.save();
                        ctx.translate(x1 + (x2 - x1) * ratio, y1 + (y2 - y1) * ratio);
                        ctx.beginPath(); ctx.arc(0, 0, targetSize * 0.5, 0, Math.PI * 2); ctx.fill();
                        ctx.restore();
                    }
                }
                ctx.restore();
            },

            smudgeSegment(x1, y1, x2, y2, size, ctx) {
                const distance = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.ceil(distance / 2);
                const radius = size * 0.5;

                for (let i = 0; i <= steps; i++) {
                    const t = steps === 0 ? 1 : i / steps;
                    const sx = x1 + (x2 - x1) * t;
                    const sy = y1 + (y2 - y1) * t;
                    ctx.save();
                    ctx.globalAlpha = 0.2;
                    try {
                        ctx.beginPath(); ctx.arc(sx, sy, radius, 0, Math.PI * 2); ctx.clip();
                        ctx.drawImage(ctx.canvas, sx - radius, sy - radius, size, size, sx - radius + (x2 - x1) * 0.05, sy - radius + (y2 - y1) * 0.05, size, size);
                    } catch (err) {}
                    ctx.restore();
                }
            },

            floodFill(startX, startY) {
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer) return;
                const ctx = layer.ctx;
                const imgData = ctx.getImageData(0, 0, Engine.width, Engine.height);
                const raw = imgData.data;

                const startIdx = (startY * Engine.width + startX) * 4;
                const targetColor = { r: raw[startIdx], g: raw[startIdx+1], b: raw[startIdx+2], a: raw[startIdx+3] };
                const fillColor = this.hexToRgb(Engine.brushColor);
                const fillAlpha = Math.floor(Engine.brushOpacity * 255);

                if (Math.abs(targetColor.r - fillColor.r) < 4 && Math.abs(targetColor.g - fillColor.g) < 4 && Math.abs(targetColor.b - fillColor.b) < 4) return;

                let queue = [startX, startY];
                let head = 0;

                while (head < queue.length) {
                    const cx = queue[head++]; const cy = queue[head++];
                    const idx = (cy * Engine.width + cx) * 4;

                    if (raw[idx] === targetColor.r && raw[idx+1] === targetColor.g && raw[idx+2] === targetColor.b && raw[idx+3] === targetColor.a) {
                        raw[idx] = fillColor.r; raw[idx+1] = fillColor.g; raw[idx+2] = fillColor.b; raw[idx+3] = fillAlpha;

                        if (cx > 0) queue.push(cx - 1, cy);
                        if (cx < Engine.width - 1) queue.push(cx + 1, cy);
                        if (cy > 0) queue.push(cx, cy - 1);
                        if (cy < Engine.height - 1) queue.push(cx, cy + 1);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                HistoryController.saveState();
            },

            runEyedropper(x, y) {
                if (x < 0 || x >= Engine.width || y < 0 || y >= Engine.height) return;
                const layer = Engine.layers[Engine.activeLayerIndex];
                if (!layer) return;
                try {
                    const pixel = layer.ctx.getImageData(x, y, 1, 1).data;
                    if (pixel[3] > 0) {
                        const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1).toUpperCase();
                        Engine.brushColor = hex;
                        DOM.colorIndicator.style.backgroundColor = hex;
                        document.getElementById('wheel-selected-hex').innerText = hex;
                        document.getElementById('wheel-selected-name').innerText = "Eyedropper Pick";
                    }
                } catch(e){}
            },

            hexToRgb(hex) {
                const val = parseInt(hex.slice(1), 16);
                return { r: (val >> 16) & 255, g: (val >> 8) & 255, b: val & 255 };
            }
        };

        const HistoryController = {
            saveState() {
                const layerConfigs = Engine.layers.map(l => {
                    const buf = document.createElement('canvas');
                    buf.width = Engine.width; buf.height = Engine.height;
                    buf.getContext('2d').drawImage(l.canvas, 0, 0);
                    return { name: l.name, visible: l.visible, alphaLocked: l.alphaLocked, opacity: l.opacity, buffer: buf };
                });

                Engine.undoStack.push({ activeIdx: Engine.activeLayerIndex, layers: layerConfigs });
                if (Engine.undoStack.length > CONFIG.MAX_HISTORY) Engine.undoStack.shift();
                Engine.redoStack = [];
                this.syncButtons();
            },

            undo() {
                if (Engine.undoStack.length <= 1) return;
                Engine.redoStack.push(Engine.undoStack.pop());
                this.apply(Engine.undoStack[Engine.undoStack.length - 1]);
            },

            redo() {
                if (Engine.redoStack.length === 0) return;
                const state = Engine.redoStack.pop();
                Engine.undoStack.push(state);
                this.apply(state);
            },

            apply(state) {
                if (!state) return;
                Engine.layers.forEach(l => DOM.container.removeChild(l.canvas));
                Engine.layers = [];

                state.layers.forEach((config, idx) => {
                    const l = new StudioLayer(Engine.width, Engine.height, config.name);
                    l.visible = config.visible; l.alphaLocked = config.alphaLocked; l.opacity = config.opacity;
                    l.ctx.drawImage(config.buffer, 0, 0);
                    Engine.layers.push(l);
                    DOM.container.appendChild(l.canvas);
                    l.syncDOM(idx);
                });

                Engine.activeLayerIndex = state.activeIdx;
                UIController.renderLayersList();
                this.syncButtons();
            },

            syncButtons() {
                DOM.undoBtn.disabled = (Engine.undoStack.length <= 1);
                DOM.redoBtn.disabled = (Engine.redoStack.length === 0);
            }
        };

        const UIController = {
            init() {
                DOM.toolSelect.addEventListener('change', (e) => Engine.currentTool = e.target.value);
                
                DOM.sliderSize.addEventListener('input', (e) => {
                    Engine.brushSize = parseInt(e.target.value);
                    DOM.lblSize.innerText = `Size: ${Engine.brushSize}px`;
                });
                DOM.sliderOpacity.addEventListener('input', (e) => {
                    Engine.brushOpacity = parseFloat(e.target.value / 100);
                    DOM.lblOpacity.innerText = `Opacity: ${e.target.value}%`;
                });
                DOM.sliderHardness.addEventListener('input', (e) => {
                    Engine.brushHardness = parseFloat(e.target.value / 100);
                    DOM.lblHardness.innerText = `Hardness: ${e.target.value}%`;
                });

                DOM.mobileLayerToggle.addEventListener('click', () => {
                    const isVisible = DOM.layersPanel.style.display === 'flex';
                    DOM.layersPanel.style.display = isVisible ? 'none' : 'flex';
                });

                DOM.closeLayersBtn.addEventListener('click', () => {
                    DOM.layersPanel.style.display = 'none';
                });

                document.getElementById('lyr-add-btn').addEventListener('click', () => {
                    const lyr = new StudioLayer(Engine.width, Engine.height, `Layer ${Engine.layers.length + 1}`);
                    Engine.layers.splice(Engine.activeLayerIndex + 1, 0, lyr);
                    DOM.container.appendChild(lyr.canvas);
                    Engine.activeLayerIndex++;
                    HistoryController.saveState();
                    this.renderLayersList();
                });

                document.getElementById('lyr-merge-btn').addEventListener('click', () => {
                    if (Engine.activeLayerIndex === 0) return;
                    const top = Engine.layers[Engine.activeLayerIndex];
                    const bottom = Engine.layers[Engine.activeLayerIndex - 1];
                    bottom.ctx.save(); bottom.ctx.globalAlpha = top.opacity; bottom.ctx.drawImage(top.canvas, 0, 0); bottom.ctx.restore();
                    DOM.container.removeChild(top.canvas);
                    Engine.layers.splice(Engine.activeLayerIndex, 1);
                    Engine.activeLayerIndex--;
                    HistoryController.saveState();
                    this.renderLayersList();
                });

                document.getElementById('lyr-delete-btn').addEventListener('click', () => {
                    if (Engine.layers.length <= 1) return;
                    DOM.container.removeChild(Engine.layers[Engine.activeLayerIndex].canvas);
                    Engine.layers.splice(Engine.activeLayerIndex, 1);
                    Engine.activeLayerIndex = Math.max(0, Engine.activeLayerIndex - 1);
                    HistoryController.saveState();
                    this.renderLayersList();
                });
            },

            renderLayersList() {
                DOM.layerItemsContainer.innerHTML = '';
                Engine.layers.forEach((l, idx) => l.syncDOM(idx));

                for (let i = Engine.layers.length - 1; i >= 0; i--) {
                    const layer = Engine.layers[i];
                    const row = document.createElement('div');
                    row.className = `layer-row ${i === Engine.activeLayerIndex ? 'active' : ''}`;
                    
                    row.innerHTML = `
                        <span class="layer-title-text">${layer.name}</span>
                        <div class="layer-inline-controls">
                            <button class="layer-toggle ${layer.visible ? 'state-active' : ''}" id="vis-${layer.id}">${layer.visible ? '👁️' : '❌'}</button>
                            <button class="layer-toggle ${layer.alphaLocked ? 'state-active' : ''}" id="lock-${layer.id}">🔒</button>
                        </div>
                    `;

                    row.addEventListener('click', () => {
                        Engine.activeLayerIndex = i;
                        this.renderLayersList();
                    });

                    row.querySelector(`#vis-${layer.id}`).addEventListener('click', (e) => {
                        e.stopPropagation();
                        layer.visible = !layer.visible;
                        HistoryController.saveState();
                        this.renderLayersList();
                    });

                    row.querySelector(`#lock-${layer.id}`).addEventListener('click', (e) => {
                        e.stopPropagation();
                        layer.alphaLocked = !layer.alphaLocked;
                        this.renderLayersList();
                    });

                    DOM.layerItemsContainer.appendChild(row);
                }
            }
        };

        const TransformOverlayController = {
            init() {
                DOM.layerImportInput.addEventListener('change', (e) => this.processImport(e));
                this.setupGestures();
            },

            async processImport(e) {
                let file = e.target.files[0];
                if (!file) return;
                file = await ensureReadableImageFile(file);

                const r = new FileReader();
                r.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        this.activateWithImage(img, ev.target.result);
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(file);
                e.target.value = "";
            },

            activateWithImage(img, dataUrl) {
                Engine.transform.image = img;
                Engine.transform.w = img.naturalWidth || img.width;
                Engine.transform.h = img.naturalHeight || img.height;
                
                if(Engine.transform.w > Engine.width) {
                    const ratio = Engine.width / Engine.transform.w;
                    Engine.transform.w *= ratio; Engine.transform.h *= ratio;
                }

                Engine.transform.x = (Engine.width - Engine.transform.w) / 2;
                Engine.transform.y = (Engine.height - Engine.transform.h) / 2;
                Engine.transform.rotation = 0;

                DOM.transformOverlay.style.backgroundImage = `url(${dataUrl || img.src})`;
                Engine.currentTool = 'placement';
                DOM.transformOverlay.style.display = 'block';
                this.sync();
            },

            sync() {
                const t = Engine.transform;
                DOM.transformOverlay.style.width = t.w + 'px';
                DOM.transformOverlay.style.height = t.h + 'px';
                DOM.transformOverlay.style.transform = `translate(${t.x}px, ${t.y}px) rotate(${t.rotation}rad)`;
            },

            setupGestures() {
                const target = DOM.transformOverlay;
                target.addEventListener('pointerdown', (e) => {
                    const handle = e.target.getAttribute('data-handle');
                    const t = Engine.transform;
                    t.activeHandle = handle || 'move';
                    t.startX = e.clientX; t.startY = e.clientY;
                    t.startW = t.w; t.startH = t.h;
                    t.startXPos = t.x; t.startYPos = t.y;
                    t.startRot = t.rotation;
                    target.setPointerCapture(e.pointerId);
                    e.stopPropagation();
                });

                target.addEventListener('pointermove', (e) => {
                    const t = Engine.transform;
                    if (!t.activeHandle) return;

                    const dx = (e.clientX - t.startX) / Engine.scale;
                    const dy = (e.clientY - t.startY) / Engine.scale;

                    if (t.activeHandle === 'move') {
                        t.x = t.startXPos + dx; t.y = t.startYPos + dy;
                    } else if (t.activeHandle === 'br') {
                        t.w = Math.max(44, t.startW + dx);
                        t.h = t.w * (t.startH / t.startW);
                    } else if (t.activeHandle === 'rot') {
                        const box = target.getBoundingClientRect();
                        const cx = box.left + box.width / 2; const cy = box.top + box.height / 2;
                        t.rotation = t.startRot + (Math.atan2(e.clientY - cy, e.clientX - cx) - Math.atan2(t.startY - cy, t.startX - cx));
                    }
                    this.sync();
                });

                const stop = () => Engine.transform.activeHandle = null;
                target.addEventListener('pointerup', stop); target.addEventListener('pointercancel', stop);

                document.getElementById('xf-confirm-btn').addEventListener('click', () => {
                    const activeLyr = Engine.layers[Engine.activeLayerIndex];
                    const t = Engine.transform;
                    if (t.image && activeLyr) {
                        const ctx = activeLyr.ctx;
                        ctx.save();
                        ctx.translate(t.x + t.w/2, t.y + t.h/2);
                        ctx.rotate(t.rotation);
                        ctx.drawImage(t.image, -t.w/2, -t.h/2, t.w, t.h);
                        ctx.restore();
                        HistoryController.saveState();
                        UIController.renderLayersList();
                    }
                    this.close();
                });

                document.getElementById('xf-flipx-btn').addEventListener('click', () => {
                    const activeLyr = Engine.layers[Engine.activeLayerIndex];
                    const t = Engine.transform;
                    if (t.image && activeLyr) {
                        const ctx = activeLyr.ctx;
                        ctx.save();
                        ctx.translate(t.x + t.w/2, t.y + t.h/2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(t.image, -t.w/2, -t.h/2, t.w, t.h);
                        ctx.restore();
                        HistoryController.saveState();
                        UIController.renderLayersList();
                    }
                    this.close();
                });

                document.getElementById('xf-cancel-btn').addEventListener('click', () => this.close());
            },

            close() {
                DOM.transformOverlay.style.display = 'none';
                DOM.transformOverlay.style.backgroundImage = 'none';
                Engine.transform.image = null;
                Engine.currentTool = DOM.toolSelect.value;
            }
        };

        const AppLifecycleController = {
            init() {
                ViewportController.init();
                UIController.init();
                TransformOverlayController.init();
                ArtWheelController.init();
                CodeGeneratorModal.init();

                document.getElementById('start-white-canvas-btn').addEventListener('click', () => {
                    const w = parseInt(document.getElementById('start-width-input').value) || 1080;
                    const h = parseInt(document.getElementById('start-height-input').value) || 1080;
                    this.startWorkspace(w, h, null);
                });

                document.getElementById('start-file-input').addEventListener('change', async (e) => {
                    let file = e.target.files[0];
                    if (!file) return;
                    file = await ensureReadableImageFile(file);

                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            this.startWorkspace(img.naturalWidth || img.width, img.naturalHeight || img.height, img);
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                DOM.undoBtn.addEventListener('click', () => HistoryController.undo());
                DOM.redoBtn.addEventListener('click', () => HistoryController.redo());
                document.getElementById('hdr-download-png').addEventListener('click', () => this.exportFlattenedAsset());
            },

            startWorkspace(w, h, baseImg) {
                Engine.width = w; Engine.height = h;
                DOM.startScreen.style.display = 'none';
                DOM.workspace.style.display = 'block';

                const baseLyr = new StudioLayer(w, h, "Background Layer");
                if (baseImg) {
                    baseLyr.ctx.drawImage(baseImg, 0, 0, w, h);
                } else {
                    baseLyr.ctx.fillStyle = '#ffffff'; baseLyr.ctx.fillRect(0, 0, w, h);
                }

                Engine.layers.push(baseLyr);
                DOM.container.appendChild(baseLyr.canvas);
                
                ViewportController.fitToScreenView();
                UIController.renderLayersList();
                HistoryController.saveState();
            },

            exportFlattenedAsset() {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = Engine.width; exportCanvas.height = Engine.height;
                const eCtx = exportCanvas.getContext('2d');

                Engine.layers.forEach(l => {
                    if (l.visible) {
                        eCtx.save(); eCtx.globalAlpha = l.opacity; eCtx.drawImage(l.canvas, 0, 0); eCtx.restore();
                    }
                });

                const a = document.createElement('a');
                a.download = `art_studio_mobile_art_${Date.now()}.png`;
                a.href = exportCanvas.toDataURL('image/png');
                a.click();
            }
        };

        document.addEventListener('DOMContentLoaded', () => AppLifecycleController.init());
    </script>
</body>
