<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TANK WARS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap');
    * { box-sizing: border-box; padding: 0; margin: 0; user-select: none; font-family: 'Quicksand', sans-serif; }
    
    body { background-color: #1a1a1a; overflow: hidden; color: white; touch-action: none; width: 100vw; height: 100vh; position: fixed; }
    
    .status { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-around; z-index: 100; text-shadow: 2px 2px #000; background: rgba(0,0,0,0.8); padding: 10px 0; border-bottom: 3px solid #FF9933; }
    
    .hearts-container { position: fixed; top: 48px; left: 15px; display: flex; gap: 6px; font-size: 18px; z-index: 105; text-shadow: 2px 2px #000; }
    .heart { color: #ff3333; text-shadow: 0 0 5px #ff0000; }

    .cross-toggle-btn { position: fixed; top: 48px; right: 15px; background: rgba(0, 128, 0, 0.85); border: 2px solid #81c784; border-radius: 4px; padding: 6px 12px; display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; color: white; cursor: pointer; z-index: 105; box-shadow: 0 0 8px #4caf50; }
    .cross-toggle-btn:active { background: rgba(0, 150, 0, 1); }

    .viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; background: #edc9af; z-index: 1; }
    
    #world { position: absolute; top: 0; left: 0; width: 2200px; height: 1500px; background-color: #edc9af; background-image: radial-gradient(#d4a373 1.5px, transparent 1.5px); background-size: 50px 50px; }
    
    .sprite { position: absolute; width: 30px; height: 30px; z-index: 10; }
    
    .tank { background: #2e7d32; border: 2px solid darkgreen; border-radius: 4px; }
    .tank::after { content: ''; position: absolute; width: 6px; height: 16px; background: black; top: -12px; left: 10px; border-radius: 2px; }
    
    /* Quad Cannons (4 sides) */
    .tank.quad-cannon::before, .tank.quad-cannon::after { content: ''; position: absolute; background: black; border-radius: 2px; }
    .tank.quad-cannon::before { width: 16px; height: 6px; top: 10px; left: -12px; box-shadow: 38px 0 0 black; }
    .tank.quad-cannon .side-barrel-v { position: absolute; width: 6px; height: 16px; background: black; top: -12px; left: 10px; box-shadow: 0 38px 0 black; border-radius: 2px; }

    /* Vertex Cannons (X-mode - 4 corners) */
    .tank.vertex-cannons::after { content: none; }
    .tank.vertex-cannons::before, 
    .tank.vertex-cannons .v-barrel-3, 
    .tank.vertex-cannons .v-barrel-4,
    .tank.vertex-cannons .v-barrel-2 {
        content: ''; 
        position: absolute; 
        width: 14px; 
        height: 6px; 
        background: black; 
        border-radius: 1px; 
        z-index: 11;
    }
    .tank.vertex-cannons::before { top: -5px; left: -5px; transform: rotate(-135deg); } 
    .tank.vertex-cannons .v-barrel-2 { top: -5px; right: -5px; transform: rotate(-45deg); } 
    .tank.vertex-cannons .v-barrel-3 { bottom: -5px; left: -5px; transform: rotate(135deg); } 
    .tank.vertex-cannons .v-barrel-4 { bottom: -5px; right: -5px; transform: rotate(45deg); }

    /* All 8 Cannons simultaneously active (4 sides + 4 corners) */
    .tank.quad-cannon.vertex-cannons::after { content: ''; } 
    .tank.quad-cannon.vertex-cannons::before { width: 16px; height: 6px; top: 10px; left: -12px; box-shadow: 38px 0 0 black; transform: none; }
    .tank.quad-cannon.vertex-cannons .side-barrel-v { position: absolute; width: 6px; height: 16px; background: black; top: -12px; left: 10px; box-shadow: 0 38px 0 black; border-radius: 2px; }
    
    .tank.quad-cannon.vertex-cannons .v-corner-1,
    .tank.quad-cannon.vertex-cannons .v-corner-2,
    .tank.quad-cannon.vertex-cannons .v-corner-3,
    .tank.quad-cannon.vertex-cannons .v-corner-4 {
        content: ''; 
        position: absolute; 
        width: 12px; 
        height: 5px; 
        background: black; 
        border-radius: 1px; 
        z-index: 12;
    }
    .tank.quad-cannon.vertex-cannons .v-corner-1 { top: -6px; left: -6px; transform: rotate(-135deg); }
    .tank.quad-cannon.vertex-cannons .v-corner-2 { top: -6px; right: -6px; transform: rotate(-45deg); }
    .tank.quad-cannon.vertex-cannons .v-corner-3 { bottom: -6px; left: -6px; transform: rotate(135deg); }
    .tank.quad-cannon.vertex-cannons .v-corner-4 { bottom: -6px; right: -6px; transform: rotate(45deg); }

    .enemy { border: 2px solid rgba(0,0,0,0.3); border-radius: 4px; }
    .enemy::after { content: ''; position: absolute; width: 6px; height: 14px; background: #000; top: -10px; left: 10px; border-radius: 2px; }

    /* Special Enemies Styling */
    .enemy-plus::before { content: '+'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 20px; font-weight: bold; text-shadow: 0 0 3px #000; z-index: 5; }
    .enemy-x::before { content: '✕'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 18px; font-weight: bold; text-shadow: 0 0 3px #000; z-index: 5; }
    .enemy-heart::before { content: '❤️'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; z-index: 5; }

    .brick { background: #8d6e63; position: absolute; width: 40px; height: 40px; border: 2px solid #5d4037; border-radius: 4px; }
    .stone { background: #424242; position: absolute; width: 40px; height: 40px; border: 2px solid #212121; }
    
    .power-brick { background: #2e7d32 !important; position: absolute; width: 40px; height: 40px; border: 2px solid #1b5e20 !important; box-shadow: 0 0 10px #4caf50; display: flex; justify-content: center; align-items: center; }
    .power-brick::before { content: '+'; color: white; font-size: 26px; font-weight: bold; text-shadow: 0 0 4px #000; line-height: 1; }
    
    .x-power-brick { background: #2e7d32 !important; position: absolute; width: 40px; height: 40px; border: 2px solid #1b5e20 !important; box-shadow: 0 0 10px #00ff00; display: flex; justify-content: center; align-items: center; }
    .x-power-brick::before { content: '✕'; color: white; font-size: 22px; font-weight: bold; text-shadow: 0 0 4px #000; }

    .heart-drop { position: absolute; width: 30px; height: 30px; background: rgba(255, 0, 0, 0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; z-index: 12; animation: pulse 0.8s infinite alternate; }
    @keyframes pulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.2); }
    }

    .bullet { position: absolute; width: 10px; height: 10px; border-radius: 50%; z-index: 15; }
    .player-shot { background: #ff0000; box-shadow: 0 0 12px #f00; } 
    .enemy-shot { background: #000; border: 1px solid #fff; } 
    .whitestack-shot { background: #ffffff; border: 1px solid #000; box-shadow: 0 0 10px #fff; }
    .special-white-shot { background: #ffffff; border: 1px solid #000; box-shadow: 0 0 12px #ffffff; }

    .blast { position: absolute; width: 50px; height: 50px; z-index: 50; pointer-events: none; transform: translate(-10px, -10px); animation: boom 0.4s ease-out forwards; }
    @keyframes boom {
        0% { transform: scale(0.5); opacity: 1; }
        100% { transform: scale(1.8); opacity: 0; }
    }

    @keyframes blip3 {
        0% { opacity: 1; }
        16% { opacity: 0.1; }
        33% { opacity: 1; }
        50% { opacity: 0.1; }
        66% { opacity: 1; }
        83% { opacity: 0.1; }
        100% { opacity: 1; }
    }
    .blipping { animation: blip3 0.9s ease-in-out forwards; }

    .ui-layer { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; align-items: center; z-index: 100; pointer-events: none; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 4px; pointer-events: auto; position: relative; }
    .ctrl-btn { background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 26px; color: white; backdrop-filter: blur(4px); }
    .ctrl-btn:active { background: rgba(255,255,255,0.4); }
    
    .mode-toggle-btn { grid-row: 2; grid-column: 2; background: rgba(46, 125, 50, 0.85); border: 2px solid #81c784; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; color: white; cursor: pointer; z-index: 10; box-shadow: 0 0 8px #4caf50; }
    .mode-toggle-btn span { display: inline-block; }
    .mode-toggle-btn:active { background: rgba(56, 142, 60, 1); }

    .fire-btn { width: 110px; height: 110px; border-radius: 50%; background: rgba(211, 47, 47, 0.85); border: 5px solid #b71c1c; color: white; font-size: 22px; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); backdrop-filter: blur(4px); pointer-events: auto; }

    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 20px; }
    .d-none { display: none !important; }
    .btn-main { padding: 18px 50px; margin-top: 25px; background: #FF9933; color: black; border: none; border-radius: 40px; cursor: pointer; font-size: 1.4rem; font-weight: bold; }
    .stat-box { margin-top: 15px; font-size: 1.2rem; color: #edc9af; line-height: 1.6; }
    
    .player-name-input { margin-top: 15px; padding: 10px 20px; font-size: 1.2rem; border-radius: 8px; border: 2px solid #FF9933; background: #222; color: white; text-align: center; outline: none; width: 250px; }
  
    /* === STAGE 1 CREATOR === */
    .creator-controls { position: fixed; right: 20px; bottom: 18px; display: none; gap: 8px; align-items: center; z-index: 1100; pointer-events: auto; }
    .creator-btn { min-width: 92px; height: 48px; padding: 0 12px; border-radius: 11px; border: 2px solid #fff; background: rgba(0,0,0,.78); color:#fff; font-size:14px; font-weight:bold; box-shadow:0 3px 9px #000; }
    .creator-download { position: fixed; right: 20px; bottom: 266px; display: none; width: 92px; height: 30px; padding: 0 4px; border-radius: 8px; border: 2px solid #d4a900; background:#ffd21a; color:#111; font-size:9px; font-weight:bold; box-shadow:0 3px 9px #000; z-index: 1110; pointer-events:auto; }
    .creator-btn.start { background:#4caf50; border-color:#81c784; }
    .creator-btn.asset { background:#1976d2; border-color:#90caf9; }
    .creator-mode .fire-btn { transform: translateY(-125px); }
    
    .creator-mode .fire-btn { position: fixed; right: 20px; bottom: 143px; transform: none; }
    .creator-mode .creator-controls { flex-direction: row; bottom: 18px; }
    .creator-btn:active { transform:scale(.96); }
    .asset-panel { position:fixed; right:20px; bottom:90px; width:min(280px,calc(100vw - 24px)); max-height:60vh; overflow:auto; display:none; z-index:1200; background:rgba(15,15,15,.98); border:3px solid #FF9933; border-radius:16px; padding:12px; box-shadow:0 8px 30px #000; }
    .asset-tabs { display:flex; gap:8px; margin-bottom:10px; position:sticky; top:0; background:rgba(15,15,15,.98); padding-bottom:8px; z-index:2; }
    .asset-tab { flex:1; height:42px; border:2px solid #555; border-radius:10px; background:#222; color:#fff; font-weight:bold; font-size:16px; }
    .asset-tab.active { background:#FF9933; color:#111; border-color:#fff; }
    .asset-section { display:none; }
    .asset-section.active { display:block; }
    .asset-row { display:flex; align-items:center; gap:6px; padding:7px; margin:6px 0; border:2px solid #444; border-radius:10px; background:#222; cursor:pointer; min-height:48px; }
    .asset-row.selected { border-color:#FF9933; box-shadow:0 0 8px #FF9933; }
    .asset-preview { width:30px; height:30px; flex:0 0 30px; border-radius:4px; position:relative; }
    .asset-label { flex:1; text-align:left; font-size:13px; min-width:0; }
    .asset-color { width:36px; height:28px; padding:0; border:1px solid #aaa; background:transparent; cursor:pointer; flex:0 0 36px; }
    .editor-hint { display:none !important; }
    .editor-cursor { width:34px !important; height:34px !important; background:transparent !important; border:0 !important; z-index:80 !important; }
    .editor-cursor::before { content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ff0000; font-size:38px; font-weight:bold; text-shadow:0 0 5px #fff,2px 2px #000; }
    .editor-cursor::after { content:'↑' !important; position:absolute; top:-15px; left:9px; color:#000; font-size:18px; font-weight:bold; text-shadow:0 0 2px #fff; }
    .editor-cursor[data-dir="right"]::after { transform:rotate(90deg); }
    .editor-cursor[data-dir="down"]::after { transform:rotate(180deg); }
    .editor-cursor[data-dir="left"]::after { transform:rotate(270deg); }
    .creator-mode .status { border-bottom-color:#4caf50; }
    @media (max-width:600px) {
      .creator-controls { right:10px; bottom:12px; gap:7px; flex-direction:row; }
      .creator-btn { min-width:102px; height:54px; font-size:15px; padding:0 10px; }
      .creator-download { right:10px; bottom:266px; width:92px; height:30px; font-size:9px; }
      .asset-panel { right:10px; bottom:72px; width:min(270px,calc(100vw - 20px)); max-height:58vh; }
    }

  
/* Final Stage Creator positioning */
#editorDownloadBtn { transform: translateY(10px); }
#editorAddBtn { transform: translateY(10px); }

</style>
</head>
<body>

<div class="hearts-container" id="hearts-display">
    <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
</div>

<div id="cross-toggle" class="cross-toggle-btn d-none" onclick="toggleXMode()"><span>X-MODE</span></div>

<div class="status">
    <div>Stage: <span id="stage-num">1</span></div>
    <div>Target: <span id="enemy-count">10</span></div>
    <div>Ammo: <span id="ammo-count">50</span></div>
    <div>Time: <span id="timer">100</span>s</div>
</div>

<div id="overlay" class="overlay">
    <h1 id="overlay-title" style="color: red; font-size: 3rem; margin-bottom: 10px;">TANK WARS</h1>
    <div id="stat-display" class="stat-box">
        <div id="stage-msg"></div>
         <span id="final-kills" style="color:red; font-size:1.8rem;">Stage 1</span>
    </div>
    <div id="win-container" class="d-none" style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px;">
        <input type="text" id="player-name-input" class="player-name-input" placeholder="Name Here" value="PlayerX">
        <button class="btn-main" id="download-btn" style="margin-top: 5px; background: #4caf50; color: white;" onclick="downloadScorecard()">Download Score Card</button>
        <button class="btn-main" id="play-again-win-btn" style="margin-top: 5px; background: #FF9933; color: black;" onclick="handlePlayAgainButton()">Play Again</button>
    </div>
    <div id="stage-file-controls" style="display:flex;gap:10px;align-items:center;justify-content:center;margin-top:15px;flex-wrap:wrap;">
        <button class="btn-main" id="upload-stage-btn" onclick="document.getElementById('stage-upload-input').click()" style="margin-top:0;background:#555;color:white;padding:14px 24px;font-size:1.05rem;">+UPLOAD</button>
        <button class="btn-main" id="create-btn" onclick="openStageCreator()" style="margin-top:0;background:#1976d2;color:white;padding:14px 24px;font-size:1.05rem;">+CREATE</button>
    </div>
    <input id="stage-upload-input" type="file" accept=".json,application/json" style="display:none" onchange="uploadStageFile(event)">
    <button class="btn-main" id="start-btn" onclick="handleStartButton()">START MISSION</button>
</div>

<div class="viewport">
    <div id="world"></div>
</div>

<div class="ui-layer">
    <div class="d-pad">
        <div class="ctrl-btn" style="grid-column:2; grid-row:1" onpointerdown="setMove('up')" onpointerup="stopMove()">▲</div>
        <div class="ctrl-btn" style="grid-row:2; grid-column:1" onpointerdown="setMove('left')" onpointerup="stopMove()">◀</div>
        <div id="mode-toggle" class="mode-toggle-btn d-none" onclick="toggleQuadMode()"><span>QUAD</span></div>
        <div class="ctrl-btn" style="grid-row:2; grid-column:3" onpointerdown="setMove('right')" onpointerup="stopMove()">▶</div>
        <div class="ctrl-btn" style="grid-row:3; grid-column:2" onpointerdown="setMove('down')" onpointerup="stopMove()">▼</div>
    </div>
    <div id="fire-btn" class="fire-btn" onpointerdown="editorMode ? addEditorAsset() : playerFire()">FIRE</div>
</div>

<div id="editor-hint" class="editor-hint"></div>
<div id="asset-panel" class="asset-panel">
  <div class="asset-tabs">
    <button class="asset-tab active" data-tab="tanks" onclick="showAssetTab('tanks')">TANKS</button>
    <button class="asset-tab" data-tab="blocks" onclick="showAssetTab('blocks')">BLOCKS</button>
  </div>
  <div id="asset-tanks" class="asset-section active">
    <div class="asset-row" data-asset="player" onclick="selectEditorAsset('player',this)"><div class="asset-preview tank"></div><div class="asset-label">Player Origin</div></div>
    <div class="asset-row" data-asset="enemy" onclick="selectEditorAsset('enemy',this)"><input id="enemy-color" class="asset-color" type="color" value="#ff0000" onclick="event.stopPropagation()"><div class="asset-preview enemy" style="background:#ff0000"></div><div class="asset-label">Normal Tank</div></div>
    <div class="asset-row" data-asset="plusEnemy" onclick="selectEditorAsset('plusEnemy',this)"><input id="plus-color" class="asset-color" type="color" value="#ff0000" onclick="event.stopPropagation()"><div class="asset-preview enemy enemy-plus" style="background:#ff0000"></div><div class="asset-label">Plus Tank</div></div>
    <div class="asset-row" data-asset="xEnemy" onclick="selectEditorAsset('xEnemy',this)"><input id="x-color" class="asset-color" type="color" value="#ff0000" onclick="event.stopPropagation()"><div class="asset-preview enemy enemy-x" style="background:#ff0000"></div><div class="asset-label">Cross Tank</div></div>
    <div class="asset-row" data-asset="heartEnemy" onclick="selectEditorAsset('heartEnemy',this)"><input id="heart-color" class="asset-color" type="color" value="#ff0000" onclick="event.stopPropagation()"><div class="asset-preview enemy enemy-heart" style="background:#ff0000"></div><div class="asset-label">Heal Tank</div></div>
    <div class="asset-row" data-asset="changing" onclick="selectEditorAsset('changing',this)"><input id="changing-color" class="asset-color" type="color" value="#ff0000" onclick="event.stopPropagation()"><div class="asset-preview enemy" style="background:#fff"></div><div class="asset-label">Color Changer</div></div>
    <div class="asset-row" data-asset="whiteTank" onclick="selectEditorAsset('whiteTank',this)"><input id="white-color" class="asset-color" type="color" value="#ffffff" onclick="event.stopPropagation()"><div class="asset-preview enemy" style="background:#fff;border:2px solid #000"></div><div class="asset-label">White King</div></div>
  </div>
  <div id="asset-blocks" class="asset-section">
    <div class="asset-row" data-asset="brick" onclick="selectEditorAsset('brick',this)"><div class="asset-preview brick"></div><div class="asset-label">Normal Block</div></div>
    <div class="asset-row" data-asset="powerBrick" onclick="selectEditorAsset('powerBrick',this)"><div class="asset-preview power-brick"></div><div class="asset-label">Special Plus</div></div>
    <div class="asset-row" data-asset="xPowerBrick" onclick="selectEditorAsset('xPowerBrick',this)"><div class="asset-preview x-power-brick"></div><div class="asset-label">Special Cross</div></div>
    <div class="asset-row" data-asset="antiMatter" onclick="selectEditorAsset('antiMatter',this)"><div class="asset-preview stone"></div><div class="asset-label">Anti Matter</div></div>
  </div>
</div>
<div id="creator-controls" class="creator-controls">
  <button id="creator-start" class="creator-btn start" onclick="startCreatedStage()">START</button>
  <button class="creator-btn asset" onclick="toggleAssetPanel()">ASSETS</button>
</div>
<button id="creator-download" class="creator-download" onclick="downloadStage1()">DOWNLOAD</button>

<script>
const world = document.getElementById('world');
const overlay = document.getElementById('overlay');
const worldW = 2200, worldH = 1500;

// Web Audio API procedural sound engine setup
let audioCtx = null;
let activeMusicTimeouts = [];

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function createNoiseBuffer(ctx, duration = 3.0, color = 'white') {
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    
    for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        if (color === 'pink') {
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            data[i] *= 0.11;
            b6 = white * 0.115926;
        } else {
            data[i] = white;
        }
    }
    return buffer;
}

// Attack Fire Sound
function playTankShot() {
    try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);

        let baseFreq = 45;
        let decay = 1.2;

        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq * 4, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
        oscGain.gain.setValueAtTime(1.0, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(oscGain); oscGain.connect(masterGain);
        osc.start(now); osc.stop(now + 0.5);

        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = createNoiseBuffer(ctx, decay, 'pink');
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1500, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + decay);
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(1.5, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + decay);
        noiseSource.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain);
        noiseSource.start(now); noiseSource.stop(now + decay);
    } catch(e) {}
}

// Explosion Blast Sound
function playDestroySound() {
    try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);

        const duration = 1.0;

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(70, now);
        subOsc.frequency.exponentialRampToValueAtTime(20, now + duration * 0.6);
        subGain.gain.setValueAtTime(1.2, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        subOsc.connect(subGain); subGain.connect(masterGain);
        subOsc.start(now); subOsc.stop(now + duration);

        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = createNoiseBuffer(ctx, duration, 'pink');
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.linearRampToValueAtTime(80, now + duration);
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(1.0, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        noiseSource.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain);
        noiseSource.start(now); noiseSource.stop(now + duration);
    } catch(e) {}
}

// Acquiring Things / Loot Sound
function playAcquireSound() {
    try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [1046.50, 1318.51, 1567.98, 2093.00].forEach((freq, i) => {
            const osc = ctx.createOscillator(); 
            const gain = ctx.createGain();
            const delay = i * 0.04; 
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(freq, now + delay);
            gain.gain.setValueAtTime(0.15, now + delay); 
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.3);
            osc.connect(gain); 
            gain.connect(ctx.destination); 
            osc.start(now + delay); 
            osc.stop(now + delay + 0.3);
        });
    } catch(e) {}
}

// Procedural Music Player for Game Theme & Glow Mode Theme
let currentPlayingMusic = null;

function stopActiveMusic() {
    activeMusicTimeouts.forEach(t => clearTimeout(t));
    activeMusicTimeouts = [];
    currentPlayingMusic = null;
}

function playProceduralSong(songType) {
    stopActiveMusic();
    currentPlayingMusic = songType;
    const ctx = getAudioContext();

    const songData = {
        gameTheme: { type: "sine", scale: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25], pattern: [0,2,4,7,4,2,0,1,3,5,7,5,3,1], tempo: 200, gain: 0.1 },
        glowTheme: { type: "square", scale: [261.63, 293.66, 329.63, 392.00, 440.00], pattern: [0,1,0,2,0,3,0,4], tempo: 140, gain: 0.08 }
    };

    const song = songData[songType];
    if (!song) return;

    let step = 0;

    function stepSequence() {
        if (currentPlayingMusic !== songType) return;

        const noteIndex = song.pattern[step];
        const freq = song.scale[noteIndex];
        
        try {
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.type = song.type;
            osc.frequency.setValueAtTime(freq, now);
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(song.gain, now + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + (song.tempo / 1000) * 0.9);
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + (song.tempo / 1000) * 0.9);
        } catch (e) {}

        step++;
        if (step >= song.pattern.length) {
            step = 0;
        }

        const timeoutId = setTimeout(stepSequence, song.tempo);
        activeMusicTimeouts.push(timeoutId);
    }

    stepSequence();
}

function downloadScorecard() {
    const playerName = document.getElementById('player-name-input').value.trim() || "PlayerX";
    const canvas = document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');

    ctx.save();
    ctx.beginPath();
    const radius = 40;
    ctx.moveTo(radius, 0);
    ctx.lineTo(canvas.width - radius, 0);
    ctx.quadraticCurveTo(canvas.width, 0, canvas.width, radius);
    ctx.lineTo(canvas.width, canvas.height - radius);
    ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - radius, canvas.height);
    ctx.lineTo(radius, canvas.height);
    ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - radius);
    ctx.lineTo(0, radius);
    ctx.quadraticCurveTo(0, 0, radius, 0);
    ctx.closePath();
    ctx.clip();

    ctx.fillStyle = '#ffcccc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(30, 30, canvas.width - 60, canvas.height - 60, 25) : ctx.rect(30, 30, canvas.width - 60, canvas.height - 60);
    ctx.fill();

    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 10;
    ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 45px Quicksand, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WINNER', canvas.width / 2, 130);

    ctx.fillStyle = '#b30000';
    ctx.font = 'bold 32px Quicksand, sans-serif';
    ctx.fillText(playerName, canvas.width / 2, 210);

    ctx.fillStyle = '#666666';
    ctx.font = '26px Quicksand, sans-serif';
    ctx.fillText(`Total Kills: ${state.kills}`, canvas.width / 2, 300);

    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 30px Quicksand, sans-serif';
    ctx.fillText("You're Tank Emperor", canvas.width / 2, 400);

    ctx.restore();

    const link = document.createElement('a');
    link.download = 'scorecard.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function buildWorld() {
    world.innerHTML = '';
    const cols = 55, rows = 37;
    const centerX = Math.floor(cols / 2);
    const centerY = Math.floor(rows / 2);
    
    const xPowerX = 2;
    const xPowerY = rows - 3;

    for (let x = 0; x < cols; x++) {
        for (let y = 0; y < rows; y++) {
            const isBorder = y === 0 || y === rows - 1 || x === 0 || x === cols - 1;
            const isCenterPowerBlock = (x === centerX && y === centerY);
            const isXPowerBlock = (x === xPowerX && y === xPowerY);
            const isRock = !isCenterPowerBlock && !isXPowerBlock && Math.random() > 0.90 && x % 2 === 0 && !(x > 45 && y < 5);
            
            if (isBorder || isRock || isCenterPowerBlock || isXPowerBlock) {
                const el = document.createElement('div');
                if (isCenterPowerBlock) {
                    el.className = 'power-brick';
                } else if (isXPowerBlock) {
                    el.className = 'x-power-brick';
                } else {
                    el.className = isBorder ? 'stone' : 'brick';
                }
                el.style.left = x * 40 + 'px';
                el.style.top = y * 40 + 'px';
                world.appendChild(el);
                state.blocks.push({ 
                    x: x * 40, 
                    y: y * 40, 
                    type: el.className, 
                    el, 
                    isCenter: isCenterPowerBlock, 
                    isXBlock: isXPowerBlock 
                });
            }
        }
    }
    state.playerEl = document.createElement('div');
    state.playerEl.className = 'sprite tank';
    world.appendChild(state.playerEl);
}

function spawnEnemies(count) {
    const color = stageColors[state.stage] || '#ff0000';
    
    let specialIndices = [];
    while(specialIndices.length < 3 && specialIndices.length < count) {
        let randIdx = Math.floor(Math.random() * count);
        if(!specialIndices.includes(randIdx)) {
            specialIndices.push(randIdx);
        }
    }

    for (let i = 0; i < count; i++) {
        let ex, ey;
        do {
            ex = 100 + (Math.random() * 1800);
            ey = 400 + (Math.random() * 1000);
        } while (checkBlockCollision(ex, ey, 30));
        
        const en = { 
            x: ex, 
            y: ey, 
            dir: 'right', 
            size: 28, 
            specialType: null,
            el: document.createElement('div') 
        };
        en.el.className = 'sprite enemy';
        en.el.style.backgroundColor = color;

        if (i === specialIndices[0]) {
            en.specialType = 'plus';
            en.el.classList.add('enemy-plus');
        } else if (i === specialIndices[1]) {
            en.specialType = 'x';
            en.el.classList.add('enemy-x');
        } else if (i === specialIndices[2]) {
            en.specialType = 'heart';
            en.el.classList.add('enemy-heart');
        }

        world.appendChild(en.el);
        state.enemies.push(en);
    }
}

function editorBoundaryCollision(nx, ny) {
    // The four existing black Anti Matter walls are real solid walls in Create Mode.
    // The stage is 55 x 37 tiles = 2200 x 1480px (not worldH=1500, which includes
    // a little unused space below the last wall in the normal game viewport).
    const size = 34;
    const wall = 40;
    const editorW = 55 * 40;
    const editorH = 37 * 40;
    return nx < wall || ny < wall || nx + size > editorW - wall || ny + size > editorH - wall;
}
function startEditorLoop() {
    cancelAnimationFrame(editorMoveRAF);
    function loop(){
        if(!editorMode)return;
        let nx=state.player.x + state.player.vx;
        let ny=state.player.y + state.player.vy;
        // Treat the four visible Anti Matter walls as hard collision geometry.
        // Clamp the cursor against the inside edge so it can never visually enter
        // or pass through a wall, even when moving diagonally or at frame boundaries.
        const editorW = 55 * 40;
        const editorH = 37 * 40;
        const cursorSize = 34;
        const minPos = 40;
        const maxX = editorW - 40 - cursorSize;
        const maxY = editorH - 40 - cursorSize;
        if(!editorBoundaryCollision(nx, state.player.y)) state.player.x=nx;
        else { state.player.x=Math.max(minPos,Math.min(maxX,state.player.x)); state.player.vx=0; }
        if(!editorBoundaryCollision(state.player.x, ny)) state.player.y=ny;
        else { state.player.y=Math.max(minPos,Math.min(maxY,state.player.y)); state.player.vy=0; }
        state.player.x=Math.max(minPos,Math.min(maxX,state.player.x));
        state.player.y=Math.max(minPos,Math.min(maxY,state.player.y));
        positionEditorCursor();
        let sx=(window.innerWidth/2)-state.player.x;
        let sy=(window.innerHeight/2)-state.player.y;

        editorMoveRAF=requestAnimationFrame(loop);
    }

}

function normalizeUploadedStage(data){
    if(!data || typeof data!=='object' || !Array.isArray(data.objects)) throw new Error('Invalid stage file.');
    const allowed=['enemy','changing','plusEnemy','xEnemy','heartEnemy','whiteTank','brick','powerBrick','xPowerBrick','antiMatter'];
    const objects=data.objects.map(o=>({
        type:o.type,x:Number(o.x),y:Number(o.y),dir:o.dir||'up',color:o.color||'#ff0000'
    })).filter(o=>allowed.includes(o.type) && Number.isFinite(o.x) && Number.isFinite(o.y));
    let player=null;
    if(data.player && Number.isFinite(Number(data.player.x)) && Number.isFinite(Number(data.player.y)))
        player={x:Number(data.player.x),y:Number(data.player.y),dir:data.player.dir||'up'};
    return {format:'TankWars Stage 1',version:1,player,objects};
}

function uploadStageFile(event){
    const file=event.target.files && event.target.files[0];
    event.target.value='';
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
        try{
            const design=normalizeUploadedStage(JSON.parse(reader.result));
            openStageCreator();
            loadDesignIntoEditor(design);
        }catch(err){alert('Could not load this Stage 1 file. Please use a Tank Wars downloaded stage file.');}
    };
    reader.onerror=function(){alert('Could not read the stage file.');};
    reader.readAsText(file);

function handlePlayerCollision(enemyObj) {
    const isSpecialEnemyGlowing = (state.specialEnemy && enemyObj === state.specialEnemy && state.specialEnemy.isGlowing);
    const isCustomGlowingEnemy = (state.customStage && enemyObj && enemyObj.isGlowing === true);
    
    if (state.isGlowMode) {
        createBlast(enemyObj.x, enemyObj.y);
        const idx = state.enemies.indexOf(enemyObj);
        if (idx > -1) {
            enemyObj.el.remove();
            state.enemies.splice(idx, 1);
        } else if (state.specialEnemy && enemyObj === state.specialEnemy) {
            state.specialEnemy.el.remove();
            state.specialEnemy = null;
        }
        state.kills++;
        updateUI();
        checkStageClear();
        return;
    }

    if (isSpecialEnemyGlowing || isCustomGlowingEnemy) {
        handleGlowCollisionPenalty(enemyObj);
        return;
    }

    if (state.isInvulnerable) return;

    if (state.lives > 1) {
        state.lives--;
        updateUI();
        createBlast(enemyObj.x, enemyObj.y);
        const idx = state.enemies.indexOf(enemyObj);
        if (idx > -1) {
            enemyObj.el.remove();
            state.enemies.splice(idx, 1);
        }
        
        checkStageClear();

        state.isInvulnerable = true;
        state.playerEl.classList.add('blipping');
        setTimeout(() => {
            state.playerEl.classList.remove('blipping');
            state.isInvulnerable = false;
        }, 900);
    } else {
        state.lives = 0;
        updateUI();
        createBlast(state.player.x, state.player.y);
        createBlast(enemyObj.x, enemyObj.y);
        const idx = state.enemies.indexOf(enemyObj);
        if (idx > -1) {
            enemyObj.el.remove();
            state.enemies.splice(idx, 1);
        }
        endGame("GAME OVER");
    }
}

function handleGlowCollisionPenalty(enemyObj) {
    if (state.isInvulnerable) return;

    if (state.lives > 1) {
        state.lives--;
        updateUI();
        createBlast(state.player.x, state.player.y);
        
        state.player.x = 2000;
        state.player.y = 100;

        state.isInvulnerable = true;
        state.playerEl.classList.add('blipping');
        setTimeout(() => {
            state.playerEl.classList.remove('blipping');

        }, 900);
    } else {
        state.lives = 0;
        updateUI();
        createBlast(state.player.x, state.player.y);
        endGame("GAME OVER");
    }
}

function handleSpecialEnemyCollision() {
    const isGlowing = state.specialEnemy && state.specialEnemy.isGlowing;

    if (state.isGlowMode) {
        if (state.specialEnemy) {
            createBlast(state.specialEnemy.x, state.specialEnemy.y);
            state.specialEnemy.el.remove();
            state.specialEnemy = null;
            state.kills++;
            updateUI();
            checkStageClear();
        }
        return;
    }

    if (isGlowing) {
        handleGlowCollisionPenalty(state.specialEnemy);
        return;
    }

    if (state.isInvulnerable) return;
    if (state.lives > 1) {
        state.lives--;
        updateUI();
        createBlast(state.specialEnemy.x, state.specialEnemy.y);
        state.specialEnemy.el.remove();
        state.specialEnemy = null;
        checkStageClear();

        state.isInvulnerable = true;
        state.playerEl.classList.add('blipping');
        setTimeout(() => {
            state.playerEl.classList.remove('blipping');
            state.isInvulnerable = false;
        }, 900);
    } else {
        state.lives = 0;
        updateUI();
        createBlast(state.player.x, state.player.y);
        createBlast(state.specialEnemy.x, state.specialEnemy.y);
        state.specialEnemy.el.remove();
        state.specialEnemy = null;
        endGame("GAME OVER");
    }
}

function handleWhiteTankCollision() {
    if (state.isGlowMode) {
        if (state.whiteTank) {
            createBlast(state.whiteTank.x, state.whiteTank.y);
            state.whiteTank.el.remove();
            state.whiteTank = null;

}

function handlePlayerShotDeath() {
    if (state.isGlowMode) return;
    if (state.isInvulnerable) return;
    
    state.lives--;

function checkStageClear() {
    if (state.customStage) {
        // Created Stage 1 is complete only when every placed enemy/tank is gone.
        // As soon as the target reaches 0, leave Create Mode and continue directly
        // into the normal game's Stage 2.
        const remaining = state.enemies.length + (state.specialEnemy ? 1 : 0) + (state.whiteTank ? 1 : 0);
        if (remaining === 0) {
            state.customStage = false;
            state.stage = 2;
            state.ammo += 50;
            state.lives = stageLivesMap[2] || 3;
            state.kills = state.kills;
            startGame();
        }
        return;
    }
    if (state.enemies.length === 0 && !state.specialEnemy && (!state.whiteTank || state.stage !== 8)) {
        if (state.stage === 8) {
            triggerWinState();
        } else if (state.stage < 8) {
            endGame(`STAGE ${state.stage} CLEAR!`);
        }
    }
}

let lastTime = 0;
let lastFrameTimestamp = 0;
const targetFpsInterval = 1000 / 60;

function gameLoop(timestamp) {
    if (!state.active) return;

    if (!lastTime) lastTime = timestamp;
    let elapsed = timestamp - lastTime;

    if (elapsed >= targetFpsInterval) {
        let deltaSec = (timestamp - lastFrameTimestamp) / 1000;
        if (!lastFrameTimestamp || deltaSec > 0.1) deltaSec = 1/60;
        lastFrameTimestamp = timestamp;

        lastTime = timestamp - (elapsed % targetFpsInterval);

        let nx = state.player.x + state.player.vx;
        let ny = state.player.y + state.player.vy;
        if (!checkBlockCollision(nx, state.player.y, state.player.size)) state.player.x = nx;
        if (!checkBlockCollision(state.player.x, ny, state.player.size)) state.player.y = ny;
        
        for (let h = state.heartDrops.length - 1; h >= 0; h--) {
            let heart = state.heartDrops[h];
            if (Math.abs(state.player.x - heart.x) < 25 && Math.abs(state.player.y - heart.y) < 25) {
                playSound(sfx.acquire);
                state.lives++; 
                updateUI();
                heart.el.remove();
                state.heartDrops.splice(h, 1);
            }
        }

        let scrollX = (window.innerWidth / 2) - state.player.x;
        let scrollY = (window.innerHeight / 2) - state.player.y;
        
        scrollX = Math.min(0, Math.max(scrollX, -(worldW - window.innerWidth)));
        scrollY = Math.min(0, Math.max(scrollY, -(worldH - window.innerHeight)));
        
        world.style.transform = `translate(${scrollX}px, ${scrollY}px)`;
        
        updateTankAppearance();
        state.playerEl.style.left = state.player.x + 'px';
        state.playerEl.style.top = state.player.y + 'px';
        const rots = { up: 0, right: 90, down: 180, left: 270 };
        
        if (state.isXActive && !state.isQuadActive) {
            state.playerEl.style.transform = `rotate(0deg)`;
        } else {
            state.playerEl.style.transform = `rotate(${rots[state.player.dir]}deg)`;
        }
        
        state.enemies.forEach(en => {
            let ox = en.x, oy = en.y;
            if (en.dir === 'up') en.y -= 2; else if (en.dir === 'down') en.y += 2; else if (en.dir === 'left') en.x -= 2; else if (en.dir === 'right') en.x += 2;
            if (checkBlockCollision(en.x, en.y, en.size) || Math.random() > 0.985) {
                en.x = ox; en.y = oy; en.dir = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)];
            }
            if (state.customStage && en.isGlowing !== undefined) {
                en.phaseTimer -= deltaSec;
                if (en.phaseTimer <= 0) {
                    en.isGlowing = !en.isGlowing;
                    en.phaseTimer = en.isGlowing ? en.glowTimerMax : en.normalTimerMax;
                    applyCustomSpecialAppearance(en);
                }
            }
            en.el.style.left = en.x + 'px'; en.el.style.top = en.y + 'px'; en.el.style.transform = `rotate(${rots[en.dir]}deg)`;
            if (Math.random() > 0.99) fire(en.isGlowing ? 'special-white' : 'enemy', en);
            
            if (Math.abs(en.x - state.player.x) < 26 && Math.abs(en.y - state.player.y) < 26) { 
                handlePlayerCollision(en);
            }
        });

        if (state.specialEnemy) {
            state.specialEnemy.phaseTimer -= deltaSec;
            if (state.specialEnemy.phaseTimer <= 0) {
                state.specialEnemy.isGlowing = !state.specialEnemy.isGlowing;
                state.specialEnemy.phaseTimer = state.specialEnemy.isGlowing ? state.specialEnemy.glowTimerMax : state.specialEnemy.normalTimerMax;
                applySpecialEnemyAppearance();
            }

            let sox = state.specialEnemy.x, soy = state.specialEnemy.y;
            if (state.specialEnemy.dir === 'up') state.specialEnemy.y -= 2.2; 
            else if (state.specialEnemy.dir === 'down') state.specialEnemy.y += 2.2; 
            else if (state.specialEnemy.dir === 'left') state.specialEnemy.x -= 2.2; 
            else if (state.specialEnemy.dir === 'right') state.specialEnemy.x += 2.2;

            if (checkBlockCollision(state.specialEnemy.x, state.specialEnemy.y, state.specialEnemy.size) || Math.random() > 0.985) {
                state.specialEnemy.x = sox; 
                state.specialEnemy.y = soy; 
                state.specialEnemy.dir = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)];
            }
            state.specialEnemy.el.style.left = state.specialEnemy.x + 'px'; 
            state.specialEnemy.el.style.top = state.specialEnemy.y + 'px'; 
            state.specialEnemy.el.style.transform = `rotate(${rots[state.specialEnemy.dir]}deg)`;

            if (state.specialEnemy.isGlowing && Math.random() > 0.98) {
                fire('special-white', state.specialEnemy);
            } else if (!state.specialEnemy.isGlowing && Math.random() > 0.99) {
                fire('enemy', state.specialEnemy);
            }

            if (Math.abs(state.specialEnemy.x - state.player.x) < 26 && Math.abs(state.specialEnemy.y - state.player.y) < 26) {
                handleSpecialEnemyCollision();
            }
        }

        if (state.whiteTank) {
            let wox = state.whiteTank.x, woy = state.whiteTank.y;
            if (state.whiteTank.dir === 'up') state.whiteTank.y -= 2.5; 
            else if (state.whiteTank.dir === 'down') state.whiteTank.y += 2.5; 
            else if (state.whiteTank.dir === 'left') state.whiteTank.x -= 2.5; 
            else if (state.whiteTank.dir === 'right') state.whiteTank.x += 2.5;

            if (checkBlockCollision(state.whiteTank.x, state.whiteTank.y, state.whiteTank.size) || Math.random() > 0.98) {
                state.whiteTank.x = wox; 
                state.whiteTank.y = woy; 
                state.whiteTank.dir = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)];
            }
            state.whiteTank.el.style.left = state.whiteTank.x + 'px'; 
            state.whiteTank.el.style.top = state.whiteTank.y + 'px'; 
            state.whiteTank.el.style.transform = `rotate(${rots[state.whiteTank.dir]}deg)`;

            if (Math.random() > 0.98) fire('whitestack', state.whiteTank);

            if (Math.abs(state.whiteTank.x - state.player.x) < 26 && Math.abs(state.whiteTank.y - state.player.y) < 26) {
                handleWhiteTankCollision();
            }
        }

        for (let i = state.bullets.length - 1; i >= 0; i--) {
            let bullet = state.bullets[i];
            if (bullet.dir === 'up') bullet.y -= bullet.speed; 
            else if (bullet.dir === 'down') bullet.y += bullet.speed; 
            else if (bullet.dir === 'left') bullet.x -= bullet.speed; 
            else if (bullet.dir === 'right') bullet.x += bullet.speed;
            else if (bullet.dir === 'upleft') { bullet.x -= bullet.speed * 0.707; bullet.y -= bullet.speed * 0.707; }
            else if (bullet.dir === 'upright') { bullet.x += bullet.speed * 0.707; bullet.y -= bullet.speed * 0.707; }
            else if (bullet.dir === 'downleft') { bullet.x -= bullet.speed * 0.707; bullet.y += bullet.speed * 0.707; }
            else if (bullet.dir === 'downright') { bullet.x += bullet.speed * 0.707; bullet.y += bullet.speed * 0.707; }
            
            bullet.el.style.left = bullet.x + 'px'; 
            bullet.el.style.top = bullet.y + 'px';

            let removed = false;

            const ignoresBlocks = (bullet.type === 'whitestack' || bullet.type === 'special-white' || (bullet.type === 'player' && bullet.isGlowShot));
            
            if (!ignoresBlocks) {
                for (let j = state.blocks.length - 1; j >= 0; j--) {
                    let bl = state.blocks[j];
                    if (bullet.x > bl.x && bullet.x < bl.x + 40 && bullet.y > bl.y && bullet.y < bl.y + 40) {
                        if (bullet.type === 'player' && (bl.type === 'brick' || bl.isCenter || bl.isXBlock)) { 
                            createBlast(bl.x, bl.y); 
                            bl.el.remove(); 
                            state.blocks.splice(j, 1); 
                            if (bl.isCenter) {
                                playSound(sfx.acquire);
                                state.hasQuadUnlocked = true;
                                state.isQuadActive = true;
                                state.quadShotsLeft += 10;
                                document.getElementById('mode-toggle').classList.remove('d-none');
                                document.getElementById('mode-toggle').innerHTML = `<span>QUAD(${state.quadShotsLeft})</span>`;
                                updateTankAppearance();
                            }
                            if (bl.isXBlock) {
                                playSound(sfx.acquire);
                                state.hasXUnlocked = true;
                                state.isXActive = true;
                                state.xShotsLeft += 10;
                                document.getElementById('cross-toggle').classList.remove('d-none');
                                document.getElementById('cross-toggle').innerHTML = `<span>X-MODE(${state.xShotsLeft})</span>`;
                                updateTankAppearance();
                            }
                        }
                        bullet.el.remove();
                        state.bullets.splice(i, 1);
                        removed = true;
                        break;
                    }
                }
                if (removed) continue;
            }

            if (bullet.type === 'player') {
                if (state.whiteTank && bullet.x > state.whiteTank.x && bullet.x < state.whiteTank.x + 30 && bullet.y > state.whiteTank.y && bullet.y < state.whiteTank.y + 30) {
                    // In a user-created Stage 1, every placed enemy must be killable
                    // so the target can actually reach 0. The original Stage 8 White
                    // King keeps its original Glow Mode requirement.
                    if (state.customStage || state.isGlowMode) {
                        createBlast(state.whiteTank.x, state.whiteTank.y);
                        state.whiteTank.el.remove();
                        state.whiteTank = null;
                        state.kills++;
                        updateUI();
                        checkStageClear();
                    }
                    bullet.el.remove();
                    state.bullets.splice(i, 1);
                    removed = true;
                    continue;
                }

                if (state.specialEnemy) {
                    if (bullet.x > state.specialEnemy.x && bullet.x < state.specialEnemy.x + 30 && bullet.y > state.specialEnemy.y && bullet.y < state.specialEnemy.y + 30) {
                        if (!state.specialEnemy.isGlowing) {
                            createBlast(state.specialEnemy.x, state.specialEnemy.y);
                            state.specialEnemy.el.remove();
                            state.specialEnemy = null;
                            state.isGlowMode = true;
                            state.glowTimer = stageGlowDurationMap[state.stage] || 10;
                            
                            // Switch to Glow Mode Theme music loop
                            playProceduralSong('glowTheme');

                            if (state.stage !== 8) {
                                state.ammo += 10;
                            }
                            state.kills++;
                            updateUI();
                            checkStageClear();
                        }
                        bullet.el.remove();
                        state.bullets.splice(i, 1);
                        removed = true;
                        continue;
                    }
                }

                for (let e = state.enemies.length - 1; e >= 0; e--) {
                    let en = state.enemies[e];
                    if (bullet.x > en.x && bullet.x < en.x + 30 && bullet.y > en.y && bullet.y < en.y + 30) {
                        if (state.customStage && en.isGlowing !== undefined && en.isGlowing) {
                            bullet.el.remove();
                            state.bullets.splice(i, 1);
                            handleGlowCollisionPenalty(en);
                            removed = true;
                            break;
                        }
                        createBlast(en.x, en.y); 
                        
                        if (state.customStage && en.isGlowing !== undefined) {
                            if (!en.isGlowing) {
                                state.isGlowMode = true;
                                state.glowTimer = stageGlowDurationMap[state.stage] || 10;
                                playProceduralSong('glowTheme');
                                state.ammo += 10;
                            }
                            en.el.remove();
                            state.enemies.splice(e, 1);
                            state.kills++;
                            updateUI();
                            bullet.el.remove();
                            state.bullets.splice(i, 1);
                            removed = true;
                            checkStageClear();
                            break;
                        }

                        if (en.specialType === 'plus') {
                            playSound(sfx.acquire);
                            state.hasQuadUnlocked = true;
                            state.isQuadActive = true;
                            state.quadShotsLeft += 10;
                            document.getElementById('mode-toggle').classList.remove('d-none');
                            document.getElementById('mode-toggle').innerHTML = `<span>QUAD(${state.quadShotsLeft})</span>`;
                            updateTankAppearance();
                        } else if (en.specialType === 'x') {
                            playSound(sfx.acquire);
                            state.hasXUnlocked = true;
                            state.isXActive = true;
                            state.xShotsLeft += 10;
                            document.getElementById('cross-toggle').classList.remove('d-none');
                            document.getElementById('cross-toggle').innerHTML = `<span>X-MODE(${state.xShotsLeft})</span>`;
                            updateTankAppearance();
                        } else if (en.specialType === 'heart') {
                            playSound(sfx.acquire);
                            const heartEl = document.createElement('div');
                            heartEl.className = 'heart-drop';
                            heartEl.style.left = en.x + 'px';
                            heartEl.style.top = en.y + 'px';
                            heartEl.innerHTML = '❤️';
                            world.appendChild(heartEl);
                            state.heartDrops.push({ x: en.x, y: en.y, el: heartEl });
                        }

                        en.el.remove(); 
                        state.enemies.splice(e, 1);
                        if (state.stage !== 8) {
                            state.ammo += 5;
                        }
                        state.kills++; 
                        updateUI();
                        bullet.el.remove();
                        state.bullets.splice(i, 1);
                        removed = true;
                        checkStageClear();
                        break;
                    }
                }
            } else {
                if (bullet.x > state.player.x && bullet.x < state.player.x + 28 && bullet.y > state.player.y && bullet.y < state.player.y + 28) {
                    bullet.el.remove();
                    state.bullets.splice(i, 1);
                    handlePlayerShotDeath();
                    removed = true;
                }
            }
            if (removed) continue;

            if (bullet.x < 0 || bullet.x > worldW || bullet.y < 0 || bullet.y > worldH) { 
                bullet.el.remove(); 
                state.bullets.splice(i, 1); 
            }
        }
    }

    requestAnimationFrame(gameLoop);
}

function playerFire() { 
    if (state.active && (state.ammo > 0 || state.isGlowMode)) { 
        playSound(sfx.tankShot);
        if (state.stage !== 8 && !state.isGlowMode) {
            state.ammo--;
        }

        if (state.isQuadActive && state.isXActive) {
            ['up', 'down', 'left', 'right', 'upleft', 'upright', 'downleft', 'downright'].forEach(dir => {
                fire('player', state.player, dir);
            });

            state.quadShotsLeft--;
            if (state.quadShotsLeft > 0) {
                document.getElementById('mode-toggle').innerHTML = `<span>QUAD(${state.quadShotsLeft})</span>`;
            } else {
                state.isQuadActive = false;
                document.getElementById('mode-toggle').innerHTML = '<span>QUAD</span>';
                document.getElementById('mode-toggle').classList.add('d-none');
            }

            state.xShotsLeft--;
            if (state.xShotsLeft > 0) {
                document.getElementById('cross-toggle').innerHTML = `<span>X-MODE(${state.xShotsLeft})</span>`;
            } else {
                state.isXActive = false;
                document.getElementById('cross-toggle').innerHTML = '<span>X-MODE</span>';
                document.getElementById('cross-toggle').classList.add('d-none');
            }
            updateTankAppearance();

        } else if (state.isQuadActive) {
            ['up', 'down', 'left', 'right'].forEach(dir => {
                fire('player', state.player, dir);
            });

            state.quadShotsLeft--;
            if (state.quadShotsLeft > 0) {
                document.getElementById('mode-toggle').innerHTML = `<span>QUAD(${state.quadShotsLeft})</span>`;
            } else {
                state.isQuadActive = false;
                document.getElementById('mode-toggle').innerHTML = '<span>QUAD</span>';
                document.getElementById('mode-toggle').classList.add('d-none');
            }
            updateTankAppearance();

        } else if (state.isXActive) {
            ['upleft', 'upright', 'downleft', 'downright'].forEach(diag => {
                fire('player', state.player, diag);
            });

            state.xShotsLeft--;
            if (state.xShotsLeft > 0) {
                document.getElementById('cross-toggle').innerHTML = `<span>X-MODE(${state.xShotsLeft})</span>`;
            } else {
                state.isXActive = false;
                document.getElementById('cross-toggle').innerHTML = '<span>X-MODE</span>';
                document.getElementById('cross-toggle').classList.add('d-none');
            }
            updateTankAppearance();

        } else {
            fire('player', state.player, state.player.dir);
        }

        updateUI(); 
    } 
}

function fire(type, owner, direction = null) {
    const b = document.createElement('div');
    if (type === 'player') {
        if (state.isGlowMode) {
            b.className = 'bullet special-white-shot';
        } else {
            b.className = 'bullet player-shot';
        }
    } else if (type === 'whitestack' || type === 'special-white') {
        b.className = 'bullet whitestack-shot';
    } else {
        b.className = 'bullet enemy-shot';
    }
    let bx = owner.x + 10, by = owner.y + 10, bd = direction || owner.dir;
    world.appendChild(b);
    
    state.bullets.push({
        el: b,
        type: type,
        x: bx,
        y: by,
        dir: bd,
        speed: type === 'player' ? 9 : 6,
        isGlowShot: (type === 'player' && state.isGlowMode)
    });
}
</script>
