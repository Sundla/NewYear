    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #2196f3;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            text-align: center;
        }

        .book-info h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .book-info p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0 0 15px 0;
        }

        .current-track-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #151515;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
        }

        .audio-wrapper {
            background: #151515;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Loading Overlay Indicator Styles */
        .loading-text {
            display: none;
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-weight: 500;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        audio {
            width: 100%;
            outline: none;
        }

        .book-selector {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #444;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            outline: none;
        }
        .book-selector:focus {
            border-color: var(--accent-color);
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding: 8px;
            background-color: #151515;
            border-radius: 6px;
            border: 1px solid #333;
            margin-bottom: 24px;
        }

        .chapter-btn {
            background-color: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 10px 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: left;
            padding-left: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .chapter-btn:hover {
            background-color: #3a3a3a;
            border-color: var(--accent-color);
        }

        .chapter-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        .notes-section {
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .notes-section h3 {
            font-size: 1rem;
            margin: 0 0 10px 0;
            color: var(--text-secondary);
        }

        textarea {
            width: 100%;
            height: 110px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: var(--text-color);
            padding: 12px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .status-msg {
            font-size: 0.8rem;
            color: #4caf50;
            margin-top: 5px;
            height: 15px;
            font-style: italic;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: #2196f3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s ease;
        }

        .download-btn:hover {
            background-color: #1b5e20;
        }

        .download-btn:active {
            transform: scale(0.99);
        }
    </style>
</head>

            { id: 128, title: "128 - Revelation 1-14", file: "bible_128_asv_128kb.mp3", cat: "nt-epistles" },
            { id: 129, title: "129 - Revelation 15-22", file: "bible_129_asv_128kb.mp3", cat: "nt-epistles" }
        ];

        const trackDisplay = document.getElementById('track-display');
        const audioPlayer = document.getElementById('native-audio-player');
        const loadingText = document.getElementById('player-loading-text');
        const gridContainer = document.getElementById('grid-container');
        let activeTrackId = 1;

        // Dynamic Loading Events for Media States
        audioPlayer.addEventListener('waiting', () => {
            loadingText.style.display = 'block';
        });

        audioPlayer.addEventListener('loadstart', () => {
            loadingText.style.display = 'block';
        });

        audioPlayer.addEventListener('canplay', () => {
            loadingText.style.display = 'none';
        });

        audioPlayer.addEventListener('playing', () => {
            loadingText.style.display = 'none';
        });

        function renderGrid(filterValue = "all") {
            gridContainer.innerHTML = "";
            tracksData.forEach(track => {
                if (filterValue !== "all" && track.cat !== filterValue) return;

                const btn = document.createElement('button');
                btn.className = `chapter-btn ${track.id === activeTrackId ? 'active' : ''}`;
                btn.id = `btn-${track.id}`;
                btn.textContent = track.title.substring(6);
                
                btn.onclick = () => changeTrack(track.id, track.title, track.file);
                gridContainer.appendChild(btn);
            });
        }

        function filterTracks() {
            const val = document.getElementById('book-filter').value;
            renderGrid(val);
        }

        function changeTrack(trackId, titleText, fileName) {
            activeTrackId = trackId;
            trackDisplay.textContent = titleText;
            
            document.querySelectorAll('.chapter-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${trackId}`);
            if (activeBtn) activeBtn.classList.add('active');

            const currentSpeed = audioPlayer.playbackRate;

            // Trigger the visual loading layout cleanly
            loadingText.style.display = 'block';

            audioPlayer.src = `https://archive.org/download/bible_asv_complete_2112_librivox/${fileName}`;
            
            audioPlayer.load();
            audioPlayer.playbackRate = currentSpeed;
            audioPlayer.play().catch(error => {
                console.log("Playback interaction error handles: ", error);
            });
        }

        // --- LocalStorage Saving Logic ---
        const notebook = document.getElementById('notebook');
        const status = document.getElementById('status');
        let timeout = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            const savedNotes = localStorage.getItem('bible_audiobook_notes');
            if (savedNotes) notebook.value = savedNotes;
        });

        notebook.addEventListener('input', () => {
            status.textContent = "Typing...";
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                localStorage.setItem('bible_audiobook_notes', notebook.value);
                status.textContent = "Notes saved automatically.";
                setTimeout(() => { status.textContent = ""; }, 2000);
            }, 1000);
        });

        // --- Photo Rendering Engine ---
        function downloadNotesAsImage() {
            const text = notebook.value.trim();
            if (!text) {
                alert("Please write something in your notes before downloading an image.");
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const padding = 40;
            const logicalWidth = 600;
            const currentTrack = trackDisplay.textContent;
            
            ctx.font = '16px "Segoe UI", sans-serif';
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            const maxWidth = logicalWidth - (padding * 2);

            words.forEach(word => {
                const testLine = currentLine + word + ' ';
                if (ctx.measureText(testLine).width > maxWidth) {
                    lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine = testLine;
                }
            });
            lines.push(currentLine.trim());

            const lineHeight = 26;
            const headerHeight = 100;
            const logicalHeight = headerHeight + (lines.length * lineHeight) + padding + 40;

            const scaleFactor = 2; 
            canvas.width = logicalWidth * scaleFactor;
            canvas.height = logicalHeight * scaleFactor;
            
            ctx.scale(scaleFactor, scaleFactor);

            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);

            ctx.fillStyle = '#2196f3';
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.fillText("Bible Reflections", padding, 45);

            ctx.fillStyle = '#b3b3b3';
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.fillText(`Track Reference: ${currentTrack}`, padding, 75);

            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, 90);
            ctx.lineTo(logicalWidth - padding, 90);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '16px "Segoe UI", sans-serif';
            let currentY = headerHeight + 20;
            
            lines.forEach(line => {
                ctx.fillText(line, padding, currentY);
                currentY += lineHeight;
            });

            ctx.fillStyle = '#ff3333';
            ctx.font = 'bold 13px "Segoe UI", sans-serif';
            
            const timeString = `Saved on: ${new Date().toLocaleDateString()} - ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            ctx.fillText(timeString, padding, logicalHeight - 20);

            const imageURI = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.download = `Bible_Seekho_Notes_${currentTrack.replace(/\s+/g, '_')}.png`;
            downloadLink.href = imageURI;
            downloadLink.click();
        }
    </script>
</body>
</html>
