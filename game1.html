<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Games</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }

        body, html {
            width: 100%;
            height: 100%;
            /* A sophisticated, strategic blend of mahogany, deep obsidian, velvet green, and ivory undertones */
            background: linear-gradient(135deg, #1a0f0a 0%, #0d0d11 35%, #0a1c12 70%, #1c1405 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            font-family: 'Cinzel', 'Times New Roman', serif; 
        }

        /* Background Canvas */
        #strategyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
            touch-action: none; 
        }

        /* Parallax Container */
        .parallax-container {
            position: relative;
            z-index: 2;
            height: 180vh; 
            pointer-events: none; 
        }

        /* Stacked Button Container Centered on Screen */
        .button-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; 
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            pointer-events: none; 
        }

        /* Tactical Button Styling with Sharp Geometric Borders */
        .strategy-btn {
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 14px 40px;
            border-radius: 0px; /* Sharp corners for a geometric board game feel */
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            background: transparent; /* Made completely transparent to show background stars */
            text-align: center;
            width: 100%; 
            backdrop-filter: none; /* Removed blur to prevent obscuring background elements */
            pointer-events: auto;
        }

        /* ChessMate - Interchanged with Go: Celestial Slate/Electric Cyan Glow (#5ac8fa) */
        .btn-chess {
            color: #5ac8fa;
            border: 1px solid #5ac8fa;
            text-shadow: 0 0 10px rgba(90, 200, 250, 0.5);
            box-shadow: inset 0 0 15px rgba(90, 200, 250, 0.1), 0 0 15px rgba(90, 200, 250, 0.05);
        }
        .btn-chess:hover {
            color: #0d0d11;
            background: #5ac8fa;
            box-shadow: 0 0 30px rgba(90, 200, 250, 0.7);
            text-shadow: none;
        }

        /* Shogi Arts - Interchanged with Monopoly: High-Stakes Luxury Gold Glow (#ffcc00) */
        .btn-shogi {
            color: #ffcc00;
            border: 1px solid #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            box-shadow: inset 0 0 15px rgba(255, 204, 0, 0.1), 0 0 15px rgba(255, 204, 0, 0.05);
        }
        .btn-shogi:hover {
            color: #0d0d11;
            background: #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.7);
            text-shadow: none;
        }

        /* Othello Clash - Deep Classic Reversi Green Glow (#4cd964) */
        .btn-othello {
            color: #4cd964;
            border: 1px solid #4cd964;
            text-shadow: 0 0 10px rgba(76, 217, 100, 0.5);
            box-shadow: inset 0 0 15px rgba(76, 217, 100, 0.1), 0 0 15px rgba(76, 217, 100, 0.05);
        }
        .btn-othello:hover {
            color: #0d0d11;
            background: #4cd964;
            box-shadow: 0 0 30px rgba(76, 217, 100, 0.7);
            text-shadow: none;
        }

        /* Go Strategy - Interchanged with Chess: Pure Royal Silver/White Glow (#e0e0e0) */
        .btn-go {
            color: #e0e0e0;
            border: 1px solid #e0e0e0;
            text-shadow: 0 0 10px rgba(224, 224, 224, 0.5);
            box-shadow: inset 0 0 15px rgba(224, 224, 224, 0.1), 0 0 15px rgba(224, 224, 224, 0.05);
        }
        .btn-go:hover {
            color: #0d0d11;
            background: #e0e0e0;
            box-shadow: 0 0 30px rgba(224, 224, 224, 0.7);
            text-shadow: none;
        }

        /* Monopoly Master - Interchanged with Shogi: Traditional Crimson/Lacquer Red Glow (#ff3b30) */
        .btn-monopoly {
            color: #ff3b30;
            border: 1px solid #ff3b30;
            text-shadow: 0 0 10px rgba(255, 59, 48, 0.5);
            box-shadow: inset 0 0 15px rgba(255, 59, 48, 0.1), 0 0 15px rgba(255, 59, 48, 0.05);
        }
        .btn-monopoly:hover {
            color: #0d0d11;
            background: #ff3b30;
            box-shadow: 0 0 30px rgba(255, 59, 48, 0.7);
            text-shadow: none;
        }

        /* --- Minimalist Intel Section --- */
        .intel-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .intel-btn {
            background: transparent;
            border: none;
            color: #777788;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(119, 119, 136, 0.5);
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        .intel-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Smooth Collapsible Drawer Container */
        .intel-drawer {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), margin-top 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
        }
        .intel-drawer.open {
            max-height: 200px; 
            margin-top: 15px;
        }

        /* Message in Neutral Soft Ivory */
        .intel-message {
            color: #d1d1d6;
            font-size: 0.85rem;
            line-height: 1.6;
            letter-spacing: 1px;
            margin-bottom: 15px;
            max-width: 380px;
        }

        /* Close Button in Steel Blue */
        .intel-close {
            background: transparent;
            border: 1px solid #5ac8fa;
            color: #5ac8fa;
            padding: 5px 18px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 0px;
            cursor: pointer;
            box-shadow: inset 0 0 8px rgba(90, 200, 250, 0.1);
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        .intel-close:hover {
            color: #0d0d11;
            background: #5ac8fa;
            box-shadow: 0 0 15px #5ac8fa;
        }
    </style>
</head>
<body>

    <canvas id="strategyCanvas"></canvas>

    <div class="parallax-container">
        <div class="button-overlay">
            <a href="Chess.html" class="strategy-btn btn-chess">ChessMate</a>
            <a href="Othello.html" class="strategy-btn btn-othello">Othello Clash</a>
            <a href="Shogi.html" class="strategy-btn btn-shogi">Shogi Arts</a>
            <a href="Go.html" class="strategy-btn btn-go">Go Strategy</a>
            <a href="Monopoly.html" class="strategy-btn btn-monopoly">Monopoly Master</a>
            
            <div class="intel-wrapper">
                <button class="intel-btn" id="intelToggleBtn">Fun Fact</button>
                
                <div class="intel-drawer" id="intelDrawer">
                    <p class="intel-message">The satisfying pop sound is generated in real time using the Web Audio API.</p>
                    <button class="intel-close" id="intelCloseBtn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Intel Dropdown Controls ---
        const intelToggleBtn = document.getElementById('intelToggleBtn');
        const intelDrawer = document.getElementById('intelDrawer');
        const intelCloseBtn = document.getElementById('intelCloseBtn');

        intelToggleBtn.addEventListener('click', () => {
            intelDrawer.classList.add('open');
        });

        intelCloseBtn.addEventListener('click', () => {
            intelDrawer.classList.remove('open');
        });

        // --- Web Audio API Mechanical Click & Tactile Tone Manager ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function getFrequencyForTheme(colorBase) {
            if (colorBase.includes('90, 200, 250')) {
                return { f1: 329.63, f2: 493.88 }; // Chess (Cyan)
            } else if (colorBase.includes('255, 204, 0')) {
                return { f1: 293.66, f2: 587.33 };  // Shogi (Gold)
            } else if (colorBase.includes('76, 217, 100')) {
                return { f1: 220.00, f2: 440.00 };  // Othello
            } else if (colorBase.includes('224, 224, 224')) {
                return { f1: 349.23, f2: 698.46 };  // Go (Silver)
            } else {
                return { f1: 392.00, f2: 783.99 };  // Monopoly (Red)
            }
        }

        function playTactileSound(colorBase) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const freqs = getFrequencyForTheme(colorBase);
            
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (colorBase.includes('255, 59, 48') || colorBase.includes('224, 224, 224')) {
                osc1.type = 'triangle';
                osc2.type = 'sawtooth';
            } else {
                osc1.type = 'sine';
                osc2.type = 'triangle';
            }
            
            osc1.frequency.setValueAtTime(freqs.f1, now); 
            osc2.frequency.setValueAtTime(freqs.f2, now); 

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.25, now + 0.005);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.35); 

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            
            osc1.stop(now + 0.35);
            osc2.stop(now + 0.35);
        }

        // --- Geometric Matrix Graphics Engine ---
        const canvas = document.getElementById('strategyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let nodes = [];
        let pulses = [];
        const baseNodes = 40; // Total count multiple of 10 to fit the exact ratio setup cleanly
        let targetNumNodes = baseNodes;
        let calculationFlux = 0; 

        // Sequence counter to enforce exact structural 1 : 1.5 : 1.5 ratio allocation
        let sizeCycleCounter = 0;
        
        // Define sizes: Small = 3.5, Medium = 5.75, Large = 8.0
        const sizePattern = [3.5, 5.75, 8.0, 5.75, 3.5, 8.0, 5.75, 8.0, 5.75, 5.75];

        // Shot tracking for dynamic allocation
        let consecutiveShots = 0;
        let lastShotTime = 0;

        // Sliding tracking variables
        let touchStartX = 0;
        let touchStartY = 0;
        let isMouseDown = false;

        function getTacticalColor() {
            const colors = [
                'rgba(90, 200, 250, ',   // Chess (Cyan)
                'rgba(255, 204, 0, ',   // Shogi (Gold)
                'rgba(76, 217, 100, ',  // Reversi Green
                'rgba(224, 224, 224, ', // Go (Silver)
                'rgba(255, 59, 48, '    // Monopoly (Red)
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createNode(initiallyEverywhere = false) {
            let x, y;
            if (initiallyEverywhere) {
                x = Math.random() * canvas.width;
                y = Math.random() * canvas.height;
            } else {
                const rand = Math.random();
                if (rand < 0.35) {
                    // 35% from top
                    x = Math.random() * canvas.width;
                    y = -20;
                } else if (rand < 0.70) {
                    // 35% from bottom
                    x = Math.random() * canvas.width;
                    y = canvas.height + 20;
                } else if (rand < 0.85) {
                    // 15% from left side
                    x = -20;
                    y = Math.random() * canvas.height;
                } else {
                    // 15% from right side
                    x = canvas.width + 20;
                    y = Math.random() * canvas.height;
                }
            }

            // Pick the size using our specific sequence array to guarantee the precise 1:1.5:1.5 distribution
            const nodeSize = sizePattern[sizeCycleCounter % sizePattern.length];
            sizeCycleCounter++;

            return {
                id: Math.random(),
                x: x,
                y: y,
                size: nodeSize, 
                rotateSpeed: Math.random() * 0.02 - 0.01,
                angle: Math.random() * Math.PI,
                speedX: (Math.random() * 0.4 - 0.2), 
                speedY: (Math.random() * 0.4 - 0.2), 
                colorBase: getTacticalColor(),
                isLaunched: false,
                isFreeVector: false 
            };
        }

        for (let i = 0; i < baseNodes; i++) {
            nodes.push(createNode(true));
        }

        function trackShotRegistration() {
            const now = Date.now();
            if (now - lastShotTime < 1000) {
                consecutiveShots++;
                if (consecutiveShots >= 2) {
                    // Double shot registered: inject additional blocks up to double capacity
                    targetNumNodes = Math.min(targetNumNodes + 10, baseNodes * 2);
                }
            } else {
                consecutiveShots = 1;
            }
            lastShotTime = now;
        }

        function triggerImpactRing(x, y, angle, colorBase) {
            pulses.push({
                x: x,
                y: y,
                angle: angle, // Capture the matched exact rotation angle of the node
                radius: 4,
                maxRadius: Math.random() * 50 + 40,
                alpha: 1.0,
                colorBase: colorBase
            });
        }

        // --- Action Routers ---
        function executeTargetedTap(clientX, clientY) {
            let targetedNode = null;
            let closestDist = 60; 

            for (let i = 0; i < nodes.length; i++) {
                const distance = Math.hypot(clientX - nodes[i].x, clientY - nodes[i].y);
                if (distance < closestDist) {
                    closestDist = distance;
                    targetedNode = nodes[i];
                }
            }

            if (targetedNode && !targetedNode.isLaunched) {
                let nearestNeighbor = null;
                let minNeighborDist = Infinity;

                // Priority 1: Search for nearest neighbor that matches both COLOR and SIZE
                for (let i = 0; i < nodes.length; i++) {
                    if (nodes[i].id === targetedNode.id) continue;
                    
                    if (nodes[i].colorBase === targetedNode.colorBase && nodes[i].size === targetedNode.size) {
                        const d = Math.hypot(nodes[i].x - targetedNode.x, nodes[i].y - targetedNode.y);
                        if (d < minNeighborDist) {
                            minNeighborDist = d;
                            nearestNeighbor = nodes[i];
                        }
                    }
                }

                // Priority 2 fallback: If no perfect match found, target the general absolute nearest neighbor
                if (!nearestNeighbor) {
                    for (let i = 0; i < nodes.length; i++) {
                        if (nodes[i].id === targetedNode.id) continue;
                        const d = Math.hypot(nodes[i].x - targetedNode.x, nodes[i].y - targetedNode.y);
                        if (d < minNeighborDist) {
                            minNeighborDist = d;
                            nearestNeighbor = nodes[i];
                        }
                    }
                }

                if (nearestNeighbor) {
                    trackShotRegistration();
                    targetedNode.isLaunched = true;
                    targetedNode.isFreeVector = false;
                    const angle = Math.atan2(nearestNeighbor.y - targetedNode.y, nearestNeighbor.x - targetedNode.x);
                    targetedNode.speedX = Math.cos(angle) * 8;
                    targetedNode.speedY = Math.sin(angle) * 8;
                }
            } else if (!targetedNode) {
                calculationFlux = 1.0; 
            }
        }

        function executeSwipeLaunch(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            const swipeDist = Math.hypot(dx, dy);
            
            if (swipeDist < 10) return; 

            let targetedNode = null;
            let closestDist = Infinity;

            for (let i = 0; i < nodes.length; i++) {
                const distance = Math.hypot(startX - nodes[i].x, startY - nodes[i].y);
                if (distance < closestDist) {
                    closestDist = distance;
                    targetedNode = nodes[i];
                }
            }

            if (targetedNode) {
                trackShotRegistration();
                targetedNode.isLaunched = true;
                targetedNode.isFreeVector = true;
                const angle = Math.atan2(dy, dx);
                targetedNode.speedX = Math.cos(angle) * 9.5;
                targetedNode.speedY = Math.sin(angle) * 9.5;
            }
        }

        // --- Event Listeners (Mouse & Touch) ---
        canvas.addEventListener('mousedown', (e) => {
            initAudio();
            touchStartX = e.clientX;
            touchStartY = e.clientY;
            isMouseDown = true;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            const dx = e.clientX - touchStartX;
            const dy = e.clientY - touchStartY;

            if (Math.hypot(dx, dy) > 15) {
                executeSwipeLaunch(touchStartX, touchStartY, e.clientX, e.clientY);
            } else {
                executeTargetedTap(e.clientX, e.clientY);
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                initAudio();
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });
        
        canvas.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const dx = endX - touchStartX;
                const dy = endY - touchStartY;

                if (Math.hypot(dx, dy) > 15) {
                    executeSwipeLaunch(touchStartX, touchStartY, endX, endY);
                } else {
                    executeTargetedTap(touchStartX, touchStartY);
                }
            }
        });

        // --- Core Animation Loop ---
        function animateMatrix() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';

            if (calculationFlux > 0) {
                calculationFlux -= 0.015;
                if (calculationFlux < 0) calculationFlux = 0;
            }

            // Slowly decay matrix capacity back down to standard ecosystem if no one is shooting
            if (Date.now() - lastShotTime > 4000 && targetNumNodes > baseNodes) {
                targetNumNodes -= 0.02; 
            }

            // Handle Node Pools Structurally
            if (nodes.length < Math.floor(targetNumNodes)) {
                nodes.push(createNode(false));
            }

            // Render Dynamic Expanding Tilted Ring Pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.radius += (p.maxRadius - p.radius) * 0.08;
                p.alpha -= 0.03;

                if (p.alpha <= 0 || p.radius >= p.maxRadius - 1) {
                    pulses.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle); // Rotate the blast matching the hit square's exact angle

                ctx.strokeStyle = `${p.colorBase}${p.alpha})`;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.rect(-p.radius, -p.radius, p.radius * 2, p.radius * 2);
                ctx.stroke();
                
                ctx.restore();
            }

            // Move and Check Nodes
            for (let i = nodes.length - 1; i >= 0; i--) {
                const node = nodes[i];
                
                node.angle += node.rotateSpeed * (1 + calculationFlux * 4);
                node.x += node.speedX * (1 + (node.isLaunched ? 0 : calculationFlux * 2));
                node.y += node.speedY * (1 + (node.isLaunched ? 0 : calculationFlux * 2));

                if (node.isLaunched) {
                    for (let j = 0; j < nodes.length; j++) {
                        if (nodes[j].id === node.id) continue;
                        
                        const targetDist = Math.hypot(nodes[j].x - node.x, nodes[j].y - node.y);
                        if (targetDist < 16) { 
                            playTactileSound(node.colorBase);
                            
                            // Trigger impact passing along the exact angle configuration of the target square
                            triggerImpactRing(nodes[j].x, nodes[j].y, nodes[j].angle, node.colorBase);
                            
                            nodes[j].speedX = node.speedX * 0.35;
                            nodes[j].speedY = node.speedY * 0.35;
                            
                            if (nodes.length > Math.floor(targetNumNodes)) {
                                nodes.splice(i, 1);
                            } else {
                                Object.assign(node, createNode(false));
                            }
                            break;
                        }
                    }
                }

                // Boundary verification checks using strict percentage allocation rules
                if (node.y < -30 || node.y > canvas.height + 30 || node.x < -30 || node.x > canvas.width + 30) {
                    if (nodes.length > Math.floor(targetNumNodes)) {
                        nodes.splice(i, 1);
                        continue;
                    } else {
                        Object.assign(node, createNode(false));
                    }
                }

                ctx.save();
                ctx.translate(node.x, node.y);
                ctx.rotate(node.angle);

                ctx.fillStyle = node.isLaunched ? `${node.colorBase}0.18)` : `${node.colorBase}0.04)`;
                ctx.beginPath();
                ctx.rect(-node.size * 2, -node.size * 2, node.size * 4, node.size * 4);
                ctx.fill();

                ctx.fillStyle = `${node.colorBase}0.85)`;
                ctx.beginPath();
                ctx.rect(-node.size / 2, -node.size / 2, node.size, node.size);
                ctx.fill();

                ctx.restore();
            }

            requestAnimationFrame(animateMatrix);
        }
        animateMatrix();

        // Parallax scroll adjustment handler
        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            const scrollDelta = currentScrollY - lastScrollY;
            lastScrollY = currentScrollY;

            nodes.forEach(node => {
                if (!node.isLaunched) node.y -= scrollDelta * 0.15; 
            });
            pulses.forEach(p => {
                p.y -= scrollDelta * 0.15;
            });
        });
    </script>
</body>
</html>
