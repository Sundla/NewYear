<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Painter</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Left UI: Fixed width prevents Load Model button from resizing */
    #left-ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: 200px;
    }

    /* Right UI: Drawing Mode Entry & Controls */
    #right-ui {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    /* Drawing Panel */
    #draw-panel {
      display: none;
      background: rgba(0, 0, 0, 0.85);
      padding: 28px 20px 20px 20px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      flex-direction: column;
      gap: 12px;
      min-width: 260px;
      position: relative;
    }

    /* Close (Cross) Button */
    .close-btn {
      position: absolute;
      top: 6px;
      right: 12px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #fff;
    }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .undo-redo-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s ease;
      text-align: center;
      user-select: none;
      width: 100%; /* Uniform button width within container */
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .btn-draw {
      background-color: #28a745;
      width: auto;
    }

    .btn-draw:hover {
      background-color: #218838;
    }

    .btn-download {
      background-color: #fd7e14;
      display: none; /* Initially hidden until first stroke is made */
    }

    .btn-download:hover {
      background-color: #e06b0e;
    }

    .btn-toggle {
      background-color: #17a2b8;
      width: 100%;
    }

    .btn-toggle.painting {
      background-color: #ffc107;
      color: #000;
    }

    .btn-step {
      background-color: #6c757d;
      flex: 1;
      padding: 8px 10px;
      font-size: 16px;
    }

    .btn-step:hover {
      background-color: #5a6268;
    }

    .btn-step:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }

    /* Customized Color Picker Controls */
    .color-picker-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .custom-color-btn {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
      background: linear-gradient(135deg, #ff0000, #00ff00, #0000ff);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .custom-color-btn:hover {
      transform: scale(1.08);
    }

    .color-swatch-inner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
    }

    .custom-color-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
    }

    #loading-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      display: none;
      font-size: 18px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

  <div id="canvas-container">
    <div id="left-ui">
      <label for="file-input" class="btn">Load Model</label>
      <input type="file" id="file-input" accept=".glb, .gltf, .obj" />
      <button id="download-btn" class="btn btn-download">Download Painted Model</button>
    </div>

    <div id="right-ui">
      <button id="enter-draw-btn" class="btn btn-draw">Drawing Mode</button>

      <div id="draw-panel">
        <button id="close-draw-btn" class="close-btn" title="Exit Drawing Mode">&times;</button>

        <div class="undo-redo-group">
          <button id="undo-btn" class="btn btn-step" title="Undo">↺ Undo</button>
          <button id="redo-btn" class="btn btn-step" title="Redo">↻ Redo</button>
        </div>

        <button id="toggle-paint-btn" class="btn btn-toggle">Rotate Mode</button>

        <div class="control-group">
          <div class="color-picker-wrapper" title="Paint Full Body Color">
            <div class="custom-color-btn">
              <div id="fill-color-preview" class="color-swatch-inner" style="background-color: #ffffff;"></div>
              <input type="color" id="fill-color-input" class="custom-color-input" value="#ffffff" />
            </div>
            <label for="fill-color-input" style="font-size: 12px; cursor: pointer;">Fill All</label>
          </div>

          <div class="color-picker-wrapper" title="Brush Color Picker">
            <label for="brush-color" style="font-size: 12px; cursor: pointer;">Brush:</label>
            <div class="custom-color-btn">
              <div id="brush-color-preview" class="color-swatch-inner" style="background-color: #ff0000;"></div>
              <input type="color" id="brush-color" class="custom-color-input" value="#ff0000" />
            </div>
          </div>
        </div>

        <div class="control-group">
          <label for="brush-size">Size:</label>
          <input type="range" id="brush-size" min="2" max="50" step="1" value="10" />
        </div>
      </div>
    </div>

    <div id="loading-screen">Loading model...</div>
  </div>

  <script>
    // --- Scene, Camera, Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const loadingScreen = document.getElementById('loading-screen');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(
      45, 
      container.clientWidth / container.clientHeight, 
      0.1, 
      1000
    );
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // --- Controls ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- Lighting Setup ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1);
    dirLight1.position.set(5, 10, 7.5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // --- Texture Painting Canvas Setup ---
    const drawCanvas = document.createElement('canvas');
    drawCanvas.width = 1024;
    drawCanvas.height = 1024;
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });

    let hasBeenInitialized = false;
    let hasMadeEdits = false; // Tracks if user made any stroke/change

    // Undo / Redo Stack
    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 20;

    function resetDrawCanvas() {
      drawCtx.fillStyle = '#ffffff';
      drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
      undoStack = [];
      redoStack = [];
      hasMadeEdits = false;
      downloadBtn.style.display = 'none'; // Hide download until a change is made
      saveState();
      hasBeenInitialized = true;
    }

    function saveState() {
      if (undoStack.length >= MAX_HISTORY) {
        undoStack.shift();
      }
      undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
      redoStack = [];
      updateUndoRedoButtons();
    }

    function undo() {
      if (undoStack.length > 1) {
        redoStack.push(undoStack.pop());
        const state = undoStack[undoStack.length - 1];
        drawCtx.putImageData(state, 0, 0);
        canvasTexture.needsUpdate = true;
        updateUndoRedoButtons();
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        const state = redoStack.pop();
        undoStack.push(state);
        drawCtx.putImageData(state, 0, 0);
        canvasTexture.needsUpdate = true;
        updateUndoRedoButtons();
      }
    }

    function updateUndoRedoButtons() {
      undoBtn.disabled = undoStack.length <= 1;
      redoBtn.disabled = redoStack.length === 0;
    }

    const canvasTexture = new THREE.CanvasTexture(drawCanvas);
    canvasTexture.flipY = true;

    // --- Variables ---
    let currentModel = null;
    let originalMaterials = new Map();
    let isDrawMode = false;
    let isPaintingState = false;
    let isDrawing = false;
    let lastUV = null;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // UI Controls
    const enterDrawBtn = document.getElementById('enter-draw-btn');
    const drawPanel = document.getElementById('draw-panel');
    const downloadBtn = document.getElementById('download-btn');
    const togglePaintBtn = document.getElementById('toggle-paint-btn');
    const closeDrawBtn = document.getElementById('close-draw-btn');
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');
    const brushColorInput = document.getElementById('brush-color');
    const brushColorPreview = document.getElementById('brush-color-preview');
    const fillColorInput = document.getElementById('fill-color-input');
    const fillColorPreview = document.getElementById('fill-color-preview');
    const brushSizeInput = document.getElementById('brush-size');

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    // Sync Custom UI Swatches with Inputs
    brushColorInput.addEventListener('input', (e) => {
      brushColorPreview.style.backgroundColor = e.target.value;
    });

    fillColorInput.addEventListener('input', (e) => {
      const selectedColor = e.target.value;
      fillColorPreview.style.backgroundColor = selectedColor;

      // Fill full canvas with selected color
      drawCtx.fillStyle = selectedColor;
      drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
      canvasTexture.needsUpdate = true;

      if (!hasMadeEdits) {
        hasMadeEdits = true;
        downloadBtn.style.display = 'block';
      }

      saveState();
    });

    // --- Loaders Setup (Including Draco Decoder) ---
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    const objLoader = new THREE.OBJLoader();
    const exporter = new THREE.GLTFExporter();

    // --- Load Default Model (Sachin.glb) ---
    function loadDefaultModel() {
      loadingScreen.style.display = 'block';
      gltfLoader.load(
        'Sachin.glb',
        (gltf) => {
          displayModel(gltf.scene);
        },
        undefined,
        (error) => {
          console.warn('Could not load default model "Sachin.glb":', error);
          loadingScreen.style.display = 'none';
        }
      );
    }

    loadDefaultModel();

    // --- File Input Handler ---
    document.getElementById('file-input').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const filename = file.name.toLowerCase();
      const fileURL = URL.createObjectURL(file);

      loadingScreen.style.display = 'block';

      if (isDrawMode) exitDrawingMode();

      hasBeenInitialized = false;
      hasMadeEdits = false;
      downloadBtn.style.display = 'none';

      if (filename.endsWith('.glb') || filename.endsWith('.gltf')) {
        gltfLoader.load(
          fileURL,
          (gltf) => {
            displayModel(gltf.scene);
            URL.revokeObjectURL(fileURL);
          },
          undefined,
          (error) => handleError(error, fileURL)
        );
      } else if (filename.endsWith('.obj')) {
        objLoader.load(
          fileURL,
          (obj) => {
            displayModel(obj);
            URL.revokeObjectURL(fileURL);
          },
          undefined,
          (error) => handleError(error, fileURL)
        );
      } else {
        alert('Unsupported file format! Please upload a .glb, .gltf, or .obj file.');
        loadingScreen.style.display = 'none';
      }
    });

    // --- Enter Drawing Mode ---
    enterDrawBtn.addEventListener('click', () => {
      if (!currentModel) return;

      isDrawMode = true;
      enterDrawBtn.style.display = 'none';
      drawPanel.style.display = 'flex';

      // Keep download button visible if user previously drew on the model
      if (hasMadeEdits) {
        downloadBtn.style.display = 'block';
      }

      if (!hasBeenInitialized) {
        resetDrawCanvas();
      }
      canvasTexture.needsUpdate = true;

      currentModel.traverse((child) => {
        if (child.isMesh) {
          if (!originalMaterials.has(child.uuid)) {
            originalMaterials.set(child.uuid, child.material);
          }
          child.material = new THREE.MeshStandardMaterial({
            map: canvasTexture,
            roughness: 0.5,
            metalness: 0.1
          });
        }
      });

      setPaintState(true);
    });

    // --- Exit Drawing Mode ---
    function exitDrawingMode() {
      isDrawMode = false;
      setPaintState(false);

      drawPanel.style.display = 'none';
      enterDrawBtn.style.display = 'block';

      // Restore original materials while preserving canvas texture in memory
      if (currentModel) {
        currentModel.traverse((child) => {
          if (child.isMesh && originalMaterials.has(child.uuid)) {
            child.material = originalMaterials.get(child.uuid);
          }
        });
      }
    }

    closeDrawBtn.addEventListener('click', exitDrawingMode);

    // --- Toggle Paint vs Rotate ---
    function setPaintState(painting) {
      isPaintingState = painting;
      controls.enabled = !isPaintingState;

      if (isPaintingState) {
        togglePaintBtn.innerText = "Paint Go Slow";
        togglePaintBtn.classList.add('painting');
      } else {
        togglePaintBtn.innerText = "Rotate Mode";
        togglePaintBtn.classList.remove('painting');
      }
    }

    togglePaintBtn.addEventListener('click', () => {
      setPaintState(!isPaintingState);
    });

    // --- Fixed Download Painted Model Handler ---
    downloadBtn.addEventListener('click', () => {
      if (!currentModel) return;

      const options = { binary: true };

      exporter.parse(
        currentModel,
        (result) => {
          let blob;
          if (result instanceof ArrayBuffer) {
            blob = new Blob([result], { type: 'application/octet-stream' });
          } else {
            const output = JSON.stringify(result, null, 2);
            // Force application/octet-stream so browsers don't attach .json extension
            blob = new Blob([output], { type: 'application/octet-stream' });
          }

          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = '3d-model.glb';
          
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(() => {
            URL.revokeObjectURL(link.href);
          }, 100);
        },
        (error) => {
          console.error('An error occurred while exporting the model:', error);
          alert('Could not export model.');
        },
        options
      );
    });

    // --- Uniform Brush Stroke Drawing ---
    function drawStroke(startUV, endUV, size, color) {
      drawCtx.strokeStyle = color;
      drawCtx.fillStyle = color;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.lineWidth = size;

      drawCtx.beginPath();
      if (startUV) {
        drawCtx.moveTo(startUV.x, startUV.y);
        drawCtx.lineTo(endUV.x, endUV.y);
      } else {
        // Uniform circle match for tap/start dots
        drawCtx.moveTo(endUV.x, endUV.y);
        drawCtx.lineTo(endUV.x, endUV.y);
      }
      drawCtx.stroke();

      canvasTexture.needsUpdate = true;
    }

    function paintAtPoint(clientX, clientY) {
      if (!isDrawMode || !isPaintingState || !currentModel) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentModel, true);

      if (intersects.length > 0 && intersects[0].uv) {
        const uv = intersects[0].uv;
        const currentUV = {
          x: uv.x * drawCanvas.width,
          y: (1 - uv.y) * drawCanvas.height
        };

        const size = parseInt(brushSizeInput.value, 10);
        const color = brushColorInput.value;

        if (lastUV) {
          const distUV = Math.hypot(currentUV.x - lastUV.x, currentUV.y - lastUV.y);
          // Protect crossing UV seams
          if (distUV < drawCanvas.width * 0.15) {
            drawStroke(lastUV, currentUV, size, color);
          } else {
            drawStroke(null, currentUV, size, color);
          }
        } else {
          drawStroke(null, currentUV, size, color);
        }

        // Activate Download Button upon making the first stroke/edit
        if (!hasMadeEdits) {
          hasMadeEdits = true;
          downloadBtn.style.display = 'block';
        }

        lastUV = currentUV;
      } else {
        lastUV = null;
      }
    }

    // --- Touch and Pointer Event Handlers ---
    function handleStart(clientX, clientY) {
      if (isDrawMode && isPaintingState) {
        isDrawing = true;
        lastUV = null;
        paintAtPoint(clientX, clientY);
      }
    }

    function handleMove(clientX, clientY) {
      if (isDrawing) {
        paintAtPoint(clientX, clientY);
      }
    }

    function handleEnd() {
      if (isDrawing) {
        isDrawing = false;
        lastUV = null;
        saveState();
      }
    }

    // Mouse Controls
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 0) handleStart(e.clientX, e.clientY);
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
      handleMove(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', handleEnd);

    // Screen Touch Controls
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        handleStart(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (isDrawing && e.touches.length === 1) {
        e.preventDefault();
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', handleEnd);

    // --- Display Model ---
    function displayModel(model) {
      if (currentModel) {
        scene.remove(currentModel);
      }

      currentModel = model;
      originalMaterials.clear();
      hasBeenInitialized = false;
      hasMadeEdits = false;
      downloadBtn.style.display = 'none';

      scene.add(currentModel);

      const box = new THREE.Box3().setFromObject(currentModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2 / (maxDim || 1);

      currentModel.position.sub(center.multiplyScalar(scale));
      currentModel.scale.setScalar(scale);

      camera.position.set(0, 1.5, 4);
      controls.target.set(0, 0, 0);
      controls.update();

      loadingScreen.style.display = 'none';
    }

    function handleError(error, url) {
      console.error('Error loading model:', error);
      alert('Failed to load the 3D model.');
      loadingScreen.style.display = 'none';
      if (url) URL.revokeObjectURL(url);
    }

    // --- Window Resize Handler ---
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
