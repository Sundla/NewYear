<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>3D Sculptor</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      touch-action: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Floating UI Panels Base */
    .ui-panel {
      position: absolute;
      z-index: 10;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    /* Unified Top Navigation Bar */
    #top-bar {
      top: 8px;
      left: 8px;
      right: 8px;
      background: rgba(25, 25, 25, 0.92);
      backdrop-filter: blur(10px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 110;
    }

    #top-bar::-webkit-scrollbar {
      display: none;
    }

    .top-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Left Toolbar: Brush Sliders */
    #left-toolbar {
      top: 115px;
      left: 8px;
      flex-direction: column;
      background: rgba(25, 25, 25, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 6px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      align-items: center;
      gap: 12px;
      width: 44px;
      z-index: 90;
    }

    /* Dynamic Bottom/Top Options Container */
    #bottom-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 100;
      width: 98%;
      max-width: 680px;
      pointer-events: none;
      transition: top 0.3s ease, bottom 0.3s ease;
    }

    #bottom-container.dock-bottom {
      top: auto;
      bottom: calc(52px + env(safe-area-inset-bottom, 0px));
    }

    #bottom-container.dock-top {
      bottom: auto;
      top: 54px;
    }

    /* Floating Sub-options Bar */
    .sub-bar {
      display: none;
      background: rgba(18, 18, 18, 0.94);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 210, 255, 0.4);
      gap: 6px;
      pointer-events: auto;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      max-width: 100%;
      overflow-x: auto;
      touch-action: pan-x;
    }

    /* Main Control Toolbar */
    #bottom-bar {
      background: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(12px);
      padding: 8px 12px;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      width: 100%;
      pointer-events: auto;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      overflow-x: auto;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: auto;
    }

    #bottom-bar::-webkit-scrollbar {
      height: 4px;
    }
    #bottom-bar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    /* Slider Track Controls */
    .slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .slider-icon {
      font-size: 10px;
      color: #aaa;
      font-weight: bold;
    }

    input[type="range"].thin-dragger {
      -webkit-appearance: none;
      appearance: none;
      width: 4px;
      height: 90px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      cursor: pointer;
      touch-action: auto;
    }

    input[type="range"].thin-dragger::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d2ff;
      box-shadow: 0 0 6px rgba(0, 210, 255, 0.8);
      cursor: pointer;
    }

    /* Buttons Styling */
    .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-icon.active {
      background: rgba(0, 210, 255, 0.25);
      border-color: #00d2ff;
      color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .btn-primary { background-color: #007bff; border: none; }
    .btn-success { background-color: #28a745; border: none; }
    .btn-danger { background-color: #dc3545; border: none; }

    /* Color Wheel Widget Styles */
    .color-module-container { 
      position: relative; 
      display: flex; 
      align-items: center; 
    }
    .native-wheel-proxy {
      width: 26px; 
      height: 26px; 
      border-radius: 50%; 
      border: 2px solid rgba(255, 255, 255, 0.4);
      position: relative; 
      cursor: pointer;
      background: #00d2ff;
    }

    #color-wheel-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 24, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      z-index: 1200;
      box-shadow: 0 10px 35px rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .wheel-top-actions {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 6px;
    }

    .wheel-shortcut-btn {
      background: #2a2a38;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .wheel-shortcut-btn:hover { background: #00d2ff; color: #121212; }

    .color-wheel-container {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      cursor: crosshair;
    }

    #color-wheel-canvas {
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    #wheel-pointer {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    .wheel-info-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      font-family: monospace;
      color: #8e8e9f;
      padding: 2px 4px;
    }

    input[type="file"] { display: none; }

    #loading-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 24px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Modal Overlay */
    #modal-overlay, #shape-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #shape-modal-overlay {
      display: none;
    }

    .modal-card {
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px;
      width: 320px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      color: #00d2ff;
    }

    .modal-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      font-weight: 600;
    }

    .shape-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .shape-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 6px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }

    .shape-option.selected {
      border-color: #00d2ff;
      background: rgba(0, 210, 255, 0.2);
      color: #00d2ff;
    }

    .modal-color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
  <!-- HEIC decoder library -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>

  <div id="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">Choose 3D Canvas Shape</div>
      
      <div class="modal-group" style="gap: 8px;">
        <label for="file-input-modal" class="btn-icon btn-success" style="padding: 10px; font-weight: bold; text-align: center; justify-content: center; cursor: pointer;">
          📁 Load Model / Photos
        </label>
        <input type="file" id="file-input-modal" accept=".glb, .gltf, .obj, .png, .jpg, .jpeg, .heic, .heif" />
      </div>

      <div class="modal-group">
        <span class="modal-label">Base Primitive</span>
        <div class="shape-grid">
          <div class="shape-option selected" data-shape="cube">Cube</div>
          <div class="shape-option" data-shape="sphere">Sphere</div>
          <div class="shape-option" data-shape="pyramid">Pyramid</div>
          <div class="shape-option" data-shape="cylinder">Cylinder</div>
          <div class="shape-option" data-shape="torus">Torus</div>
          <div class="shape-option" data-shape="cone">Cone</div>
        </div>
      </div>

      <div class="modal-group">
        <div class="modal-color-row">
          <span class="modal-label">Initial Color</span>
          <div class="color-module-container">
            <div class="native-wheel-proxy" id="start-color-preview" title="Select Initial Color" style="background: #FFFFFF;"></div>
          </div>
        </div>
      </div>

      <div class="modal-group" style="gap: 8px;">
        <button id="start-create-btn" class="btn-icon btn-primary" style="padding: 10px; font-weight: bold;">
          Create Canvas
        </button>
      </div>
    </div>
  </div>

  <!-- Shape Selector Modal for Add -> Shapes -->
  <div id="shape-modal-overlay">
    <div class="modal-card">
      <div class="modal-title">Add Shape to Scene</div>
      
      <div class="modal-group">
        <span class="modal-label">Select Primitive Shape</span>
        <div class="shape-grid">
          <div class="shape-option popup-shape selected" data-shape="cube">Cube</div>
          <div class="shape-option popup-shape" data-shape="sphere">Sphere</div>
          <div class="shape-option popup-shape" data-shape="pyramid">Pyramid</div>
          <div class="shape-option popup-shape" data-shape="cylinder">Cylinder</div>
          <div class="shape-option popup-shape" data-shape="torus">Torus</div>
          <div class="shape-option popup-shape" data-shape="cone">Cone</div>
        </div>
      </div>

      <div class="modal-group">
        <div class="modal-color-row">
          <span class="modal-label">Shape Color</span>
          <div class="color-module-container">
            <div class="native-wheel-proxy" id="popup-color-preview" title="Select Shape Color" style="background: #00d2ff;"></div>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button id="popup-cancel-btn" class="btn-icon" style="flex: 1; padding: 10px;">Cancel</button>
        <button id="popup-add-btn" class="btn-icon btn-primary" style="flex: 1; padding: 10px; font-weight: bold;">Add Shape</button>
      </div>
    </div>
  </div>

  <!-- Global Centered Color Wheel Popup -->
  <div id="color-wheel-popup">
    <div class="wheel-top-actions">
      <button type="button" id="wheel-btn-black" class="wheel-shortcut-btn">BL</button>
      <button type="button" id="wheel-btn-edit" class="wheel-shortcut-btn">Edit</button>
      <button type="button" id="wheel-btn-white" class="wheel-shortcut-btn">WH</button>
      <input type="color" id="native-color-picker-input" style="display:none;">
    </div>
    <div class="color-wheel-container" id="color-wheel-wrapper">
      <canvas id="color-wheel-canvas" width="160" height="160"></canvas>
      <div id="wheel-pointer"></div>
    </div>
    <div class="wheel-info-bar">
      <span id="wheel-selected-hex">#00D2FF</span>
      <span id="wheel-selected-name">Turquoise Cyan</span>
    </div>
  </div>

  <div id="canvas-container">
    
    <div id="top-bar" class="ui-panel">
      <div class="top-group">
        <button id="undo-btn" class="btn-icon" title="Undo">↺</button>
        <button id="redo-btn" class="btn-icon" title="Redo">↻</button>
        <button id="symmetry-btn" class="btn-icon active" title="Toggle Symmetry">🪞 Symmetry</button>
        
        <button id="dock-toggle-btn" class="btn-icon" title="Move Controls Up/Down">↕️</button>
      </div>

      <div class="top-group">
        <label for="file-input" class="btn-icon btn-primary">📁 Load</label>
        <input type="file" id="file-input" accept=".glb, .gltf, .obj, .png, .jpg, .jpeg, .heic, .heif" />
        <button id="export-btn" class="btn-icon btn-success">💾 Save</button>
      </div>
    </div>

    <div id="left-toolbar" class="ui-panel">
      <div class="slider-container" title="Brush Size">
        <span class="slider-icon">SZ</span>
        <input type="range" id="brush-size" class="thin-dragger" min="0.05" max="1.5" step="0.01" value="0.4" />
      </div>

      <div class="slider-container" title="Brush Strength">
        <span class="slider-icon">ST</span>
        <input type="range" id="brush-strength" class="thin-dragger" min="0.01" max="0.5" step="0.01" value="0.1" />
      </div>

      <div class="slider-container" title="Paint Color">
        <div class="color-module-container">
          <div class="native-wheel-proxy" id="color-indicator-preview" title="Open Art Wheel"></div>
        </div>
      </div>
    </div>

    <div id="bottom-container" class="dock-bottom">
      
      <div id="sculpt-options" class="sub-bar">
        <button id="sculpt-mode-build" class="btn-icon active">➕ Build</button>
        <button id="sculpt-mode-carve" class="btn-icon">➖ Carve</button>
        <span style="color: rgba(255,255,255,0.3)">|</span>
        <button id="sculpt-shape-sphere" class="btn-icon active">🔴 Sphere</button>
        <button id="sculpt-shape-cone" class="btn-icon">🔺 Cone</button>
        <button id="sculpt-shape-box" class="btn-icon">⬛ Box</button>
      </div>

      <div id="direction-options" class="sub-bar">
        <button id="dir-front" class="btn-icon">⬆️ View Front</button>
        <button id="dir-change" class="btn-icon">⚙️ Set New Axis</button>
      </div>

      <!-- Move Sub-bar Options -->
      <div id="move-options" class="sub-bar">
        <button id="toggle-move-gizmo-btn" class="btn-icon">🏹 Axis Arrows</button>
        <button id="move-translate" class="btn-icon active">Move</button>
        <button id="move-rotate" class="btn-icon">Rotate</button>
        <button id="move-scale" class="btn-icon">Scale</button>
      </div>

      <!-- Add Sub-bar -->
      <div id="add-options" class="sub-bar">
        <button id="add-move-btn" class="btn-icon active">🚀 Move</button>
        <button id="add-copy-btn" class="btn-icon">📋 Copy</button>
        <button id="add-shapes-btn" class="btn-icon">🔷 Shapes</button>
        <label for="file-input-add" class="btn-icon btn-primary" style="margin:0; cursor:pointer;">📥 Import</label>
        <input type="file" id="file-input-add" accept=".glb, .gltf, .obj, .png, .jpg, .jpeg, .heic, .heif" />
      </div>

      <div id="bottom-bar">
        <button id="tool-view" class="btn-icon active">🖐️ Move</button>
        <button id="tool-sculpt" class="btn-icon">🌋 Sculpt</button>
        <button id="tool-smooth" class="btn-icon">💧 Smooth</button>
        <button id="tool-paint" class="btn-icon">🖌️ Paint</button>
        <button id="tool-direction" class="btn-icon">🧭 Direction</button>
        <button id="tool-add" class="btn-icon">➕ Add</button>
        <button id="tool-subtract" class="btn-icon btn-danger">➖ Subtract</button>
      </div>
    </div>

    <div id="loading-screen">Processing Model/Photo...</div>
  </div>

  <script>
    // --- State Engine ---
    const STATE = {
      activeTool: 'view',
      sculptAction: 'build',
      sculptShape: 'sphere',
      symmetry: true,
      dockedTop: false,
      brushSize: 0.4,
      brushStrength: 0.1,
      brushColor: '#00d2ff',
      startColor: '#ffffff',
      popupShapeColor: '#00d2ff',
      isInteracting: false,
      showMoveGizmo: false
    };

    // --- Universal Color Wheel Controller ---
    const ArtWheelController = {
      init() {
        const canvas = document.getElementById('color-wheel-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const wrapper = document.getElementById('color-wheel-wrapper');
        const pointer = document.getElementById('wheel-pointer');
        const hexLabel = document.getElementById('wheel-selected-hex');
        const nameLabel = document.getElementById('wheel-selected-name');
        const nativeColorInput = document.getElementById('native-color-picker-input');
        const colorPopup = document.getElementById('color-wheel-popup');

        const radius = canvas.width / 2;
        const imgData = ctx.createImageData(canvas.width, canvas.height);
        const data = imgData.data;

        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const dx = x - radius;
            const dy = y - radius;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const index = (y * canvas.width + x) * 4;

            if (dist <= radius) {
              const angle = Math.atan2(dy, dx);
              let hue = (angle * 180 / Math.PI + 360) % 360;
              let sat = dist / radius;
              let light = 0.5;

              let c = (1 - Math.abs(2 * light - 1)) * sat;
              let xVal = c * (1 - Math.abs((hue / 60) % 2 - 1));
              let m = light - c / 2;
              let r = 0, g = 0, b = 0;

              if (0 <= hue && hue < 60) { r = c; g = xVal; b = 0; }
              else if (60 <= hue && hue < 120) { r = xVal; g = c; b = 0; }
              else if (120 <= hue && hue < 180) { r = 0; g = c; b = xVal; }
              else if (180 <= hue && hue < 240) { r = 0; g = xVal; b = c; }
              else if (240 <= hue && hue < 300) { r = xVal; g = 0; b = c; }
              else if (300 <= hue && hue < 360) { r = c; g = 0; b = xVal; }

              data[index] = Math.round((r + m) * 255);
              data[index + 1] = Math.round((g + m) * 255);
              data[index + 2] = Math.round((b + m) * 255);
              data[index + 3] = 255;
            } else {
              data[index + 3] = 0;
            }
          }
        }
        ctx.putImageData(imgData, 0, 0);

        const rgbToHex = (r, g, b) => "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();

        const getColorName = (r, g, b) => {
          if (r === 0 && g === 0 && b === 0) return 'Lamp Black';
          if (r === 255 && g === 255 && b === 255) return 'Titanium White';

          let rf = r / 255, gf = g / 255, bf = b / 255;
          let max = Math.max(rf, gf, bf), min = Math.min(rf, gf, bf);
          let h, s, l = (max + min) / 2;

          if (max === min) {
            h = s = 0;
          } else {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case rf: h = (gf - bf) / d + (gf < bf ? 6 : 0); break;
              case gf: h = (bf - rf) / d + 2; break;
              case bf: h = (rf - gf) / d + 4; break;
            }
            h /= 6;
          }

          const hue = Math.round(h * 360);
          const sat = Math.round(s * 100);
          const light = Math.round(l * 100);

          if (light < 15) return 'Dark Shade';
          if (light > 85 && sat < 15) return 'Light Tint';
          if (sat < 15) return 'Neutral Gray';

          if (hue < 15 || hue >= 345) return 'Crimson Red';
          if (hue < 45) return 'Warm Orange';
          if (hue < 70) return 'Golden Yellow';
          if (hue < 150) return 'Emerald Green';
          if (hue < 190) return 'Turquoise Cyan';
          if (hue < 260) return 'Cobalt Blue';
          if (hue < 315) return 'Deep Violet';
          return 'Magenta Pink';
        };

        let activeTargetCallback = null;

        const pickColor = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          if (clientX === undefined) return;

          const x = clientX - rect.left;
          const y = clientY - rect.top;
          const dx = x - radius;
          const dy = y - radius;
          const dist = Math.sqrt(dx * dx + dy * dy);

          let px = x, py = y;
          if (dist > radius) {
            px = radius + (dx / dist) * radius;
            py = radius + (dy / dist) * radius;
          }

          pointer.style.left = px + 'px';
          pointer.style.top = py + 'px';
          pointer.style.display = 'block';

          const sx = Math.min(Math.max(Math.floor(px), 0), canvas.width - 1);
          const sy = Math.min(Math.max(Math.floor(py), 0), canvas.height - 1);
          const pixel = ctx.getImageData(sx, sy, 1, 1).data;

          if (pixel[3] > 0) {
            const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
            const name = getColorName(pixel[0], pixel[1], pixel[2]);
            hexLabel.innerText = hex;

    // History Engine per mesh
    const historyMap = new Map();

    function saveHistoryState(mesh = currentMesh) {
      if (!mesh) return;
      if (!historyMap.has(mesh)) {
        historyMap.set(mesh, { undo: [], redo: [] });
      }
      const hist = historyMap.get(mesh);
      if (hist.undo.length >= 15) hist.undo.shift();

      const geoState = mesh.geometry.attributes.position.clone();
      const posState = mesh.position.clone();
      const rotState = mesh.rotation.clone();
      const scaleState = mesh.scale.clone();

      let textureState = null;
      if (mesh.material.map && mesh.material.map.image) {
        const img = mesh.material.map.image;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.width || 1024;
        tempCanvas.height = img.height || 1024;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.drawImage(img, 0, 0);
        textureState = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      }
      
      hist.undo.push({ 
        geometry: geoState, 
        texture: textureState,
        position: posState,
        rotation: rotState,
        scale: scaleState
      });
      hist.redo = [];
    }

    function undo() {
      if (!currentMesh || !historyMap.has(currentMesh)) return;
      const hist = historyMap.get(currentMesh);
      if (hist.undo.length <= 1) return;
      hist.redo.push(hist.undo.pop());
      const state = hist.undo[hist.undo.length - 1];
      applyState(currentMesh, state);
    }

    function redo() {
      if (!currentMesh || !historyMap.has(currentMesh)) return;
      const hist = historyMap.get(currentMesh);
      if (hist.redo.length === 0) return;
      const state = hist.redo.pop();
      hist.undo.push(state);
      applyState(currentMesh, state);
    }

    function applyState(mesh, state) {
      if (!mesh || !state) return;
      mesh.geometry.attributes.position.copy(state.geometry);
      mesh.geometry.attributes.position.needsUpdate = true;
      mesh.geometry.computeVertexNormals();

      if (state.position) mesh.position.copy(state.position);
      if (state.rotation) mesh.rotation.copy(state.rotation);
      if (state.scale) mesh.scale.copy(state.scale);
      mesh.updateMatrix();

      if (state.texture && mesh.material.map) {
        const ctx = mesh.userData.ctx;
        ctx.putImageData(state.texture, 0, 0);
        mesh.material.map.needsUpdate = true;
      }
    }

    function createDrawCanvas(colorHex = '#ffffff') {

      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.flipY = true;
      return { canvas, ctx, texture };
    }

    function initShape(shapeType, colorHex) {
      let geometry;
      switch (shapeType) {
        case 'sphere': geometry = new THREE.SphereGeometry(1, 64, 64); break;
        case 'pyramid': geometry = new THREE.ConeGeometry(1.2, 1.5, 4, 32); break;
        case 'cylinder': geometry = new THREE.CylinderGeometry(0.8, 0.8, 1.5, 32, 32); break;
        case 'torus': geometry = new THREE.TorusGeometry(0.8, 0.3, 32, 48); break;
        case 'cone': geometry = new THREE.ConeGeometry(0.9, 1.5, 32, 32); break;
        case 'cube':
        default: geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5, 32, 32, 32); break;
      }

      const { canvas, ctx, texture } = createDrawCanvas(colorHex);

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.4,
        metalness: 0.1,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.userData = { canvas, ctx };
      setupModel(mesh);
    }

    function setupModel(mesh, isAddition = false) {

        mesh.position.set((Math.random() - 0.5) * 1.5, 0, (Math.random() - 0.5) * 1.5);
        mesh.updateMatrix();
        selectModel(mesh);
      }

      saveHistoryState(mesh);
      loadingScreen.style.display = 'none';

    // Common file loading logic
    async function handleFileLoad(file) {
      if (!file) return;
      loadingScreen.style.display = 'block';
      let filename = file.name.toLowerCase();

      if (filename.endsWith('.heic') || filename.endsWith('.heif')) {
        try {
          const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg" });
          file = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
        } catch (err) {
          console.error("HEIC conversion failed:", err);
          alert("Could not decode HEIC image.");
          loadingScreen.style.display = 'none';
          return;
        }
      }

      const fileURL = URL.createObjectURL(file);

      const handleLoadedObj = (objScene) => {
        let foundMesh = null;
        objScene.traverse((child) => {
          if (child.isMesh && !foundMesh) foundMesh = child;
        });

        if (foundMesh) {
          const { canvas, ctx, texture } = createDrawCanvas('#ffffff');
          foundMesh.material = new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide
          });
          foundMesh.userData = { canvas, ctx };
          setupModel(foundMesh, meshes.length > 0);
        } else {
          alert('No valid 3D mesh found.');
          loadingScreen.style.display = 'none';
        }
        URL.revokeObjectURL(fileURL);
      };

      if (filename.endsWith('.glb') || filename.endsWith('.gltf')) {
        gltfLoader.load(fileURL, (gltf) => handleLoadedObj(gltf.scene), undefined, (err) => {
          console.error(err);
          alert('Failed to load GLTF file.');
          loadingScreen.style.display = 'none';
          URL.revokeObjectURL(fileURL);
        });
      } else if (filename.endsWith('.obj')) {
        objLoader.load(fileURL, (obj) => handleLoadedObj(obj), undefined, (err) => {
          console.error(err);
          alert('Failed to load OBJ file.');
          loadingScreen.style.display = 'none';
          URL.revokeObjectURL(fileURL);
        });
      } else if (
        filename.endsWith('.png') || 
        filename.endsWith('.jpg') || 
        filename.endsWith('.jpeg') || 
        filename.endsWith('.heic') || 
        filename.endsWith('.heif')
      ) {
        const img = new Image();
        img.onload = () => {
          const width = img.naturalWidth || img.width;
          const height = img.naturalHeight || img.height;
          const maxSide = 3.0;
          const aspect = width / height;
          let planeW, planeH;
          if (aspect >= 1) {
            planeW = maxSide;
            planeH = maxSide / aspect;
          } else {
            planeH = maxSide;
            planeW = maxSide * aspect;
          }

          const geometry = new THREE.PlaneGeometry(planeW, planeH, 32, 32);
          const cWidth = width > 2048 ? 2048 : width;
          const cHeight = height > 2048 ? 2048 : height;

          const canvas = document.createElement('canvas');
          canvas.width = cWidth;
          canvas.height = cHeight;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, cWidth, cHeight);
          
          const texture = new THREE.CanvasTexture(canvas);
          texture.flipY = true;

          const material = new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide
          });

          const planeMesh = new THREE.Mesh(geometry, material);
          planeMesh.userData = { canvas, ctx };
          setupModel(planeMesh, meshes.length > 0);
          URL.revokeObjectURL(fileURL);
        };
        img.onerror = (err) => {
          console.error(err);
          alert('Failed to load image file.');
          loadingScreen.style.display = 'none';
          URL.revokeObjectURL(fileURL);
        };
        img.src = fileURL;
      } else {
        alert('Unsupported file format!');
        loadingScreen.style.display = 'none';
        URL.revokeObjectURL(fileURL);
      }
    }

    dirChangeBtn.addEventListener('click', () => {
      if (!currentMesh) return;
      currentMesh.updateMatrixWorld(true);
      const worldPos = new THREE.Vector3();
      currentMesh.getWorldPosition(worldPos);

      const targetMatrix = new THREE.Matrix4();
      targetMatrix.copy(camera.matrixWorld).invert().multiply(currentMesh.matrixWorld);

      const position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      targetMatrix.decompose(position, quaternion, scale);

      const rotOnlyMatrix = new THREE.Matrix4().makeRotationFromQuaternion(quaternion);
      currentMesh.geometry.applyMatrix4(rotOnlyMatrix);

      currentMesh.position.copy(worldPos);
      currentMesh.rotation.set(0, 0, 0);
      currentMesh.scale.set(1, 1, 1);
      currentMesh.updateMatrix();
      currentMesh.updateMatrixWorld(true);

      transformControls.detach();
      transformControls.attach(currentMesh);

      currentMesh.geometry.computeVertexNormals();
      currentMesh.geometry.computeBoundingBox();
      currentMesh.geometry.computeBoundingSphere();

      saveHistoryState(currentMesh);
      alert('New axis successfully set!');
    });

    document.getElementById('brush-size').addEventListener('input', (e) => STATE.brushSize = parseFloat(e.target.value));
    document.getElementById('brush-strength').addEventListener('input', (e) => STATE.brushStrength = parseFloat(e.target.value));
    
    const symmetryBtn = document.getElementById('symmetry-btn');
    symmetryBtn.addEventListener('click', () => {
      STATE.symmetry = !STATE.symmetry;
      symmetryBtn.classList.toggle('active', STATE.symmetry);
    });

    document.getElementById('undo-btn').addEventListener('click', undo);
    document.getElementById('redo-btn').addEventListener('click', redo);

    document.getElementById('export-btn').addEventListener('click', () => {
      if (!currentMesh) return;
      currentMesh.updateMatrix();
      exporter.parse(
        currentMesh,
        (result) => {
          const blob = new Blob([result], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'sculpted-model.glb';
          link.click();
        },
        { binary: true }
      );
    });

    // Engine Core Interactor
    let lastUV = null;

    function performSculptOrPaint(e) {
      if (!currentMesh || STATE.activeTool === 'view' || STATE.activeTool === 'direction' || STATE.activeTool === 'add') return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentMesh);

      if (intersects.length > 0) {
        const hit = intersects[0];

        if (STATE.activeTool === 'paint' && hit.uv) {
          paintTexture(currentMesh, hit.uv);
          if (STATE.symmetry) {
            const symUV = new THREE.Vector2(1.0 - hit.uv.x, hit.uv.y);
            paintTexture(currentMesh, symUV);
          }
        } else if (STATE.activeTool === 'sculpt' || STATE.activeTool === 'smooth') {
          sculptMesh(currentMesh, hit.point, hit.face.normal, STATE.activeTool === 'smooth');
          if (STATE.symmetry) {
            const symPoint = hit.point.clone();
            symPoint.x *= -1;
            const symNormal = hit.face.normal.clone();
            symNormal.x *= -1;
            sculptMesh(currentMesh, symPoint, symNormal, STATE.activeTool === 'smooth');
          }
        }
      }
    }

    function sculptMesh(mesh, centerPoint, normal, isSmooth) {
      const positions = mesh.geometry.attributes.position;
      const localCenter = mesh.worldToLocal(centerPoint.clone());
      const radius = STATE.brushSize;
      const strength = STATE.brushStrength * (STATE.sculptAction === 'carve' ? -1 : 1);

      for (let i = 0; i < positions.count; i++) {
        const vx = positions.getX(i);
        const vy = positions.getY(i);
        const vz = positions.getZ(i);

        const dist = Math.sqrt((vx - localCenter.x) ** 2 + (vy - localCenter.y) ** 2 + (vz - localCenter.z) ** 2);

        if (dist < radius) {
          let falloff = 0;
          if (STATE.sculptShape === 'cone') {
            falloff = (1 - dist / radius);
          } else if (STATE.sculptShape === 'box') {
            falloff = 1.0;
          } else {
            falloff = (1 - dist / radius) ** 2;
          }

          if (isSmooth) {
            positions.setXYZ(
              i,
              vx + (localCenter.x - vx) * STATE.brushStrength * falloff * 0.2,
              vy + (localCenter.y - vy) * STATE.brushStrength * falloff * 0.2,
              vz + (localCenter.z - vz) * STATE.brushStrength * falloff * 0.2
            );
          } else {
            positions.setXYZ(
              i,
              vx + normal.x * strength * falloff * 0.2,
              vy + normal.y * strength * falloff * 0.2,
              vz + normal.z * strength * falloff * 0.2
            );
          }
        }
      }

      positions.needsUpdate = true;
      mesh.geometry.computeVertexNormals();
    }

    function paintTexture(mesh, uv) {
      const canvas = mesh.userData.canvas;
      const drawCtx = mesh.userData.ctx;
      const texture = mesh.material.map;

      const x = uv.x * canvas.width;
      const y = (1 - uv.y) * canvas.height;
      const radius = STATE.brushSize * 30;

      drawCtx.fillStyle = STATE.brushColor;
      drawCtx.strokeStyle = STATE.brushColor;
      drawCtx.lineWidth = radius * 2;
      drawCtx.lineCap = 'round';

      drawCtx.beginPath();
      if (lastUV) {
        drawCtx.moveTo(lastUV.x, lastUV.y);
        drawCtx.lineTo(x, y);
      } else {
        drawCtx.arc(x, y, radius, 0, Math.PI * 2);
      }
      drawCtx.stroke();
      drawCtx.fill();

      lastUV = { x, y };
      texture.needsUpdate = true;
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ui-panel') || e.target.closest('#bottom-container') || e.target.closest('#modal-overlay') || e.target.closest('#shape-modal-overlay') || e.target.closest('#color-wheel-popup')) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const selected = intersects[0].object;
        if (selected !== currentMesh) {
          selectModel(selected);
        }
      }

      STATE.isInteracting = true;
      lastUV = null;
      performSculptOrPaint(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (STATE.isInteracting) {
        performSculptOrPaint(e);
      }
    });

    window.addEventListener('pointerup', () => {
      if (STATE.isInteracting) {
        STATE.isInteracting = false;
        lastUV = null;
        if (currentMesh) saveHistoryState(currentMesh);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      orbitControls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
