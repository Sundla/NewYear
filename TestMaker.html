<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Maker</title>
  <!-- Include heic2any library for universal HEIC/HEIF support across all browsers -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #202124;
      --border: #dadce0;
      --success: #34a853;
      --danger: #ea4335;
      --warning: #fbbc04;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1000px; margin: 0 auto; }

    h1, h2, h3 { color: var(--primary-dark); margin-bottom: 15px; }
    .card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    .btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 5px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 8px; margin-right: 8px; margin-bottom: 8px; }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #5f6368; }
    .btn-secondary:hover { background: #3c4043; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #2d8e47; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #c5221f; }
    .btn-warning { background: var(--warning); color: #202124; }
    .btn-warning:hover { background: #e0a800; }
    .btn-sm { padding: 5px 10px; font-size: 13px; }

    input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
    textarea { resize: vertical; min-height: 70px; }

    /* Home View */
    .hero-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

    /* Subject & Exercise Section */
    .section-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px; overflow-x: auto; }
    .tab-btn { background: none; border: none; font-size: 18px; font-weight: bold; color: #5f6368; cursor: pointer; padding: 5px 15px; border-radius: 4px; white-space: nowrap; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #e8f0fe; }
    .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }

    /* Creator View */
    .question-builder { border: 1px dashed var(--primary); padding: 15px; border-radius: 6px; margin-bottom: 15px; background: #f1f8ff; position: relative; }
    .option-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .option-row input[type="text"] { margin-bottom: 0; flex: 1; }

    /* Image Preview & Controls */
    .img-upload-container { margin-bottom: 12px; }
    .img-preview-box { max-width: 100%; max-height: 250px; margin-top: 8px; border-radius: 4px; border: 1px solid var(--border); display: block; object-fit: contain; }
    .img-remove-btn { margin-top: 5px; font-size: 12px; }
    
    /* Test View & Slide Transitions */
    .test-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; }
    .timer { font-size: 20px; font-weight: bold; color: var(--danger); background: #fce8e6; padding: 6px 12px; border-radius: 5px; }
    
    #portal-swipe-container { overflow: hidden; position: relative; width: 100%; }
    #portal-q-container { transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out; will-change: transform, opacity; }
    
    .slide-out-left { transform: translateX(-100%); opacity: 0; }
    .slide-out-right { transform: translateX(100%); opacity: 0; }
    .slide-in { animation: slideInAnimation 0.25s ease-in-out forwards; }

    @keyframes slideInAnimation {
      from { transform: translateX(var(--slide-enter-offset, 100%)); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Question Palette - Horizontal Scrollable Row */
    .q-palette { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: thin; }
    .q-btn { width: 38px; height: 38px; min-width: 38px; border-radius: 50%; border: 1px solid var(--border); background: white; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    .q-btn.active { border: 2px solid var(--primary); }
    .q-btn.answered { background: var(--success); color: white; border-color: var(--success); }
    
    .test-option { display: block; padding: 12px; border: 1px solid var(--border); border-radius: 5px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
    .test-option:hover { background: #f1f3f4; }
    .test-option input { margin-right: 10px; }

    /* Result View */
    .score-badge { font-size: 36px; font-weight: bold; color: var(--primary); text-align: center; margin: 15px 0; }
    .result-item { padding: 12px; border-bottom: 1px solid var(--border); }
    .correct-ans { color: var(--success); font-weight: bold; }
    .wrong-ans { color: var(--danger); font-weight: bold; }

    .d-none { display: none !important; }
  </style>
</head>
<body>

  <!-- VIEW 1: HOME & MODE SELECTION -->
  <div id="view-home" class="card">
    <h1>Test Maker</h1>
    
    <div class="hero-actions">
      <button class="btn" onclick="openCreatorNew()">Create New Test</button>
      <button class="btn btn-warning" onclick="document.getElementById('edit-input').click()">📝 Edit Test</button>
      <button class="btn btn-success" onclick="document.getElementById('upload-input').click()">Upload & Take Test</button>
      
      <input type="file" id="upload-input" accept=".test" class="d-none" onchange="uploadAndTakeTest(event)">
      <input type="file" id="edit-input" accept=".test" class="d-none" onchange="uploadAndEditTest(event)">
    </div>
  </div>

  <!-- SUBJECT & EXERCISE SECTION -->
  <div id="section-selector-container" class="card">
    <div class="section-tabs">
      <button class="tab-btn active" id="tab-subject" onclick="switchSection('subject')">Subject</button>
      <button class="tab-btn" id="tab-exercise" onclick="switchSection('exercise')">Exercise</button>
      <button class="tab-btn" id="tab-saved" onclick="switchSection('saved')">Saved</button>
    </div>

    <!-- SUBJECT SECTION -->
    <div id="section-subject">
      <h3 style="margin-bottom: 10px;">Subject</h3>
      <div class="test-grid">
        <button class="btn btn-secondary" onclick="openTestFile('science.test')">Science</button>
        <button class="btn btn-secondary" onclick="openTestFile('art.test')">Art</button>
        <button class="btn btn-secondary" onclick="openTestFile('philosophy.test')">Philosophy</button>
        <button class="btn btn-secondary" onclick="openTestFile('iqeq.test')">IQ/EQ</button>
        <button class="btn btn-secondary" onclick="openTestFile('gk.test')"> GK</button>
      </div>
    </div>

    <!-- EXERCISE SECTION -->
    <div id="section-exercise" class="d-none">
      <h3 style="margin-bottom: 10px;">Exercise</h3>
      <div class="test-grid">
        <button class="btn btn-secondary" onclick="openTestFile('popcult.test')">Pop Cult</button>
        <button class="btn btn-secondary" onclick="openTestFile('money.test')">Money</button>
      </div>
    </div>

    <!-- SAVED SECTION -->
    <div id="section-saved" class="d-none">
      <h3 style="margin-bottom: 10px;">Saved</h3>
      <div id="saved-tests-grid" class="test-grid">
        <!-- Dynamically populated from localStorage -->
      </div>
    </div>
  </div>

  <!-- VIEW 2: TEST CREATOR / EDITOR -->
  <div id="view-creator" class="card d-none">
    <h2 id="creator-heading">Build Mock Test</h2>
    
    <label><b>Test Title:</b></label>
    <input type="text" id="test-title" placeholder="e.g., General Knowledge Practice Test">
    
    <label><b>Time Limit (Minutes):</b></label>
    <input type="number" id="test-time" value="10" min="1" style="width: 150px;">

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border);">

    <h3>Questions</h3>
    <div id="questions-container"></div>

    <button class="btn btn-secondary" onclick="addQuestionBuilder()">+ Add Question</button>
    
    <div style="margin-top: 30px; border-top: 2px solid var(--border); padding-top: 20px;">
      <button class="btn btn-success" onclick="saveTestToBrowser()">💾 Save</button>
      <button class="btn" onclick="exportBinaryTest()">Download Test File (.test)</button>
      <button class="btn btn-secondary" onclick="switchView('view-home')">Cancel</button>
    </div>
  </div>

  <!-- VIEW 3: TEST PORTAL -->
  <div id="view-portal" class="card d-none">
    <div class="test-header">
      <h2 id="portal-title">Mock Test</h2>
      <div class="timer" id="portal-timer">00:00</div>
    </div>

    <div class="q-palette" id="q-palette"></div>

    <div id="portal-swipe-container">
      <div id="portal-q-container">
        <h3 id="portal-q-text">Question Text</h3>
        <div id="portal-q-img-container" style="margin-bottom: 15px;"></div>
        <div id="portal-options-container"></div>
      </div>
    </div>

    <div style="margin-top: 25px; display: flex; justify-content: space-between;">
      <div>
        <button class="btn btn-secondary" id="btn-prev" onclick="navigateQuestion(-1)">Previous</button>
        <button class="btn btn-secondary" id="btn-next" onclick="navigateQuestion(1)">Next</button>
        <button class="btn btn-secondary" onclick="clearCurrentAnswer()">Clear Selection</button>
      </div>
      <button class="btn btn-danger" onclick="submitTest(false)">Submit Test</button>
    </div>
  </div>

  <!-- VIEW 4: TEST RESULTS -->
  <div id="view-result" class="card d-none">
    <h2>Test Results</h2>
    <div class="score-badge" id="score-text">0 / 0</div>
    <p style="text-align: center; font-size: 18px; margin-bottom: 25px;" id="score-percentage"></p>

    <div style="text-align: center; margin-bottom: 25px;">
      <button class="btn btn-success" onclick="downloadReportCard()">🖼️ Download Report Card</button>
    </div>

    <h3>Detailed Answer Sheet</h3>
    <div id="results-container"></div>

    <button class="btn" style="margin-top: 20px;" onclick="switchView('view-home')">🏠 Return to Home</button>
  </div>

  <script>
    // Global State
    let currentTest = null;
    let activeQuestions = [];
    let userAnswers = {};
    let currentQIndex = 0;
    let timerInterval = null;
    let remainingSeconds = 0;
    let lastTestResults = { score: 0, total: 0, percentage: 0 };
    let qCounter = 0;

    // Swipe Gesture Variables
    let touchStartX = 0;
    let touchEndX = 0;

    // Initialize Saved Tests on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderSavedTestsGrid();
    });

    // View Manager
    function switchView(viewId) {
      ['view-home', 'view-creator', 'view-portal', 'view-result'].forEach(id => {
        document.getElementById(id).classList.add('d-none');
      });
      document.getElementById(viewId).classList.remove('d-none');

      const selectorContainer = document.getElementById('section-selector-container');
      if (viewId === 'view-home') {
        selectorContainer.classList.remove('d-none');
        renderSavedTestsGrid();
      } else {
        selectorContainer.classList.add('d-none');
      }
    }

    // Section Switching (Subject vs Exercise vs Saved)
    function switchSection(section) {
      document.getElementById('section-subject').classList.add('d-none');
      document.getElementById('section-exercise').classList.add('d-none');
      document.getElementById('section-saved').classList.add('d-none');
      
      document.getElementById('tab-subject').classList.remove('active');
      document.getElementById('tab-exercise').classList.remove('active');
      document.getElementById('tab-saved').classList.remove('active');

      if (section === 'subject') {
        document.getElementById('section-subject').classList.remove('d-none');
        document.getElementById('tab-subject').classList.add('active');
      } else if (section === 'exercise') {
        document.getElementById('section-exercise').classList.remove('d-none');
        document.getElementById('tab-exercise').classList.add('active');
      } else if (section === 'saved') {
        document.getElementById('section-saved').classList.remove('d-none');
        document.getElementById('tab-saved').classList.add('active');
        renderSavedTestsGrid();
      }
    }

    // Local Storage Helpers for Browser-Saved Tests
    function getStoredTests() {
      try {
        const stored = localStorage.getItem('browser_saved_tests');
        return stored ? JSON.parse(stored) : {};
      } catch (e) {
        return {};
      }
    }

    function saveTestObjectToStorage(testData) {
      const tests = getStoredTests();
      const title = testData.title ? testData.title.trim() : 'Untitled Test';
      tests[title] = testData; // Overwrites if title already exists
      localStorage.setItem('browser_saved_tests', JSON.stringify(tests));
    }

    function renderSavedTestsGrid() {
      const grid = document.getElementById('saved-tests-grid');
      grid.innerHTML = '';
      const tests = getStoredTests();
      const titles = Object.keys(tests);

      if (titles.length === 0) {
        grid.innerHTML = '<p style="color: #5f6368; font-size: 14px; grid-column: 1 / -1;">No tests saved yet.</p>';
        return;
      }

      titles.forEach(title => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-secondary';
        btn.innerText = title;
        btn.onclick = () => openStoredTest(title);
        grid.appendChild(btn);
      });
    }

    function openStoredTest(title) {
      const tests = getStoredTests();
      if (tests[title]) {
        currentTest = tests[title];
        startTestPortal();
      } else {
        alert('Test not found in browser storage.');
      }
    }

    function saveTestToBrowser() {
      const testData = compileTestDataFromEditor();
      if (!testData) return;

      saveTestObjectToStorage(testData);
      alert(`Test "${testData.title}" successfully saved in browser!`);
      switchView('view-home');
    }

    // Shuffle/Jumble Questions Array
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Open local test files directly
    function openTestFile(filename) {
      fetch(filename)
        .then(res => {
          if (!res.ok) throw new Error('File not found');
          return res.arrayBuffer();
        })
        .then(buffer => {
          const decoder = new TextDecoder();
          const jsonString = decoder.decode(buffer);
          currentTest = JSON.parse(jsonString);
          startTestPortal();
        })
        .catch(() => alert(`Could not load ${filename}. Make sure it is placed in the same folder as this HTML file.`));
    }

    /* ==========================================================================
       1. TEST CREATOR & EDITOR LOGIC
       ========================================================================== */
    function openCreatorNew() {
      document.getElementById('creator-heading').innerText = "Build Mock Test";
      document.getElementById('test-title').value = "";
      document.getElementById('test-time').value = "10";
      document.getElementById('questions-container').innerHTML = "";
      qCounter = 0;
      addQuestionBuilder();
      switchView('view-creator');
    }

    function uploadAndEditTest(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const buffer = e.target.result;
          const decoder = new TextDecoder();
          const jsonString = decoder.decode(buffer);
          const data = JSON.parse(jsonString);
          
          loadTestIntoEditor(data);
        } catch (err) {
          alert('Invalid test file format!');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    function loadTestIntoEditor(testData) {
      document.getElementById('creator-heading').innerText = "Edit Mock Test";
      document.getElementById('test-title').value = testData.title || "";
      document.getElementById('test-time').value = testData.timeMinutes || 10;
      
      const container = document.getElementById('questions-container');
      container.innerHTML = "";
      qCounter = 0;

      if (testData.questions && testData.questions.length > 0) {
        testData.questions.forEach(q => {
          qCounter++;
          const qDiv = document.createElement('div');
          qDiv.className = 'question-builder';
          qDiv.id = `q-build-${qCounter}`;
          qDiv.dataset.imageData = q.image || "";
          
          let optionsHtml = '';
          q.options.forEach((optText, idx) => {
            optionsHtml += `
              <div class="option-row">
                <input type="radio" name="correct-${qCounter}" value="${idx}" ${q.correctIdx === idx ? 'checked' : ''}>
                <input type="text" class="opt-text" value="${optText}">
                ${idx >= 2 ? `<button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button>` : ''}
              </div>
            `;
          });

          const imgDisplay = q.image ? `<img src="${q.image}" class="img-preview-box" id="img-preview-${qCounter}">` : `<img id="img-preview-${qCounter}" class="img-preview-box d-none">`;
          const removeImgBtnDisplay = q.image ? '' : 'd-none';

          qDiv.innerHTML = `
            <button class="btn btn-danger btn-sm" style="position: absolute; right: 10px; top: 10px;" onclick="removeQuestion(${qCounter})">Remove</button>
            <label><b>Question ${qCounter}:</b></label>
            <textarea class="q-text" placeholder="Enter your question here...">${q.text || ''}</textarea>
            
            <div class="img-upload-container">
              <label><b>Question Photo (optional):</b></label><br>
              <input type="file" accept="image/png, image/jpeg, image/jpg, image/heif, image/heic, image/webp, image/gif" onchange="handleImageUpload(event, ${qCounter})" style="margin-top: 5px;">
              ${imgDisplay}
              <button class="btn btn-danger btn-sm img-remove-btn ${removeImgBtnDisplay}" id="img-remove-btn-${qCounter}" onclick="removeQuestionImage(${qCounter})">🗑️ Remove Image</button>
            </div>

            <label><b>Options:</b></label>
            <div class="options-list">${optionsHtml}</div>
            <button class="btn btn-secondary btn-sm" style="margin-top: 5px;" onclick="addOptionRow(${qCounter})">+ Add Option</button>
          `;
          container.appendChild(qDiv);
        });
      } else {
        addQuestionBuilder();
      }

      switchView('view-creator');
    }

    function addQuestionBuilder() {
      qCounter++;
      const container = document.getElementById('questions-container');
      const qDiv = document.createElement('div');
      qDiv.className = 'question-builder';
      qDiv.id = `q-build-${qCounter}`;
      qDiv.dataset.imageData = "";
      
      qDiv.innerHTML = `
        <button class="btn btn-danger btn-sm" style="position: absolute; right: 10px; top: 10px;" onclick="removeQuestion(${qCounter})">Remove</button>
        <label><b>Question ${qCounter}:</b></label>
        <textarea class="q-text" placeholder="Enter your question here..."></textarea>
        
        <div class="img-upload-container">
          <label><b>Question Photo (optional):</b></label><br>
          <input type="file" accept="image/png, image/jpeg, image/jpg, image/heif, image/heic, image/webp, image/gif" onchange="handleImageUpload(event, ${qCounter})" style="margin-top: 5px;">
          <img id="img-preview-${qCounter}" class="img-preview-box d-none">
          <button class="btn btn-danger btn-sm img-remove-btn d-none" id="img-remove-btn-${qCounter}" onclick="removeQuestionImage(${qCounter})">🗑️ Remove Image</button>
        </div>

        <label><b>Options :</b></label>
        <div class="options-list">
          ${renderOptionRow(qCounter, 1)}
          ${renderOptionRow(qCounter, 2)}
        </div>
        <button class="btn btn-secondary btn-sm" style="margin-top: 5px;" onclick="addOptionRow(${qCounter})">+ Add Option</button>
      `;
      container.appendChild(qDiv);
    }

    // Handle Image Upload with heic2any fallback for HEIC/HEIF compatibility
    async function handleImageUpload(event, qId) {
      const file = event.target.files[0];
      if (!file) return;

      let fileToProcess = file;
      const fileName = file.name.toLowerCase();
      
      if (fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif') {
        try {
          const conversionResult = await heic2any({
            blob: file,
            toType: 'image/jpeg',
            quality: 0.8
          });
          fileToProcess = Array.isArray(conversionResult) ? conversionResult[0] : conversionResult;
        } catch (err) {
          alert('Could not convert HEIC/HEIF image. Please try uploading as JPG or PNG.');
          return;
        }
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        const qDiv = document.getElementById(`q-build-${qId}`);
        qDiv.dataset.imageData = base64Data;

        const imgPreview = document.getElementById(`img-preview-${qId}`);
        imgPreview.src = base64Data;
        imgPreview.classList.remove('d-none');

        const removeBtn = document.getElementById(`img-remove-btn-${qId}`);
        removeBtn.classList.remove('d-none');
      };
      reader.readAsDataURL(fileToProcess);
    }

    function removeQuestionImage(qId) {
      const qDiv = document.getElementById(`q-build-${qId}`);
      qDiv.dataset.imageData = "";

      const imgPreview = document.getElementById(`img-preview-${qId}`);
      imgPreview.src = "";
      imgPreview.classList.add('d-none');

      const removeBtn = document.getElementById(`img-remove-btn-${qId}`);
      removeBtn.classList.add('d-none');

      const fileInput = qDiv.querySelector('.img-upload-container input[type="file"]');
      if (fileInput) fileInput.value = "";
    }

    function renderOptionRow(qId, optIdx) {
      return `
        <div class="option-row">
          <input type="radio" name="correct-${qId}" value="${optIdx - 1}" ${optIdx === 1 ? 'checked' : ''}>
          <input type="text" class="opt-text" placeholder="Option ${optIdx}">
          ${optIdx > 2 ? `<button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button>` : ''}
        </div>
      `;
    }

    function addOptionRow(qId) {
      const qDiv = document.getElementById(`q-build-${qId}`);
      const optList = qDiv.querySelector('.options-list');
      const currentOpts = optList.querySelectorAll('.option-row').length;
      
      if (currentOpts >= 5) {
        alert('Maximum 5 options allowed per question.');
        return;
      }
      
      const div = document.createElement('div');
      div.innerHTML = renderOptionRow(qId, currentOpts + 1);
      optList.appendChild(div.firstElementChild);
    }

    function removeQuestion(qId) {
      document.getElementById(`q-build-${qId}`).remove();
    }

    function compileTestDataFromEditor() {
      const title = document.getElementById('test-title').value.trim() || 'Untitled Test';
      const timeMinutes = parseInt(document.getElementById('test-time').value) || 10;
      
      const qBuilders = document.querySelectorAll('.question-builder');
      if (qBuilders.length === 0) {
        alert('Please add at least one question.');
        return null;
      }

      const questions = [];
      for (let i = 0; i < qBuilders.length; i++) {
        const qEl = qBuilders[i];
        const text = qEl.querySelector('.q-text').value.trim();
        const image = qEl.dataset.imageData || "";

        if (!text && !image) {
          alert(`Question ${i + 1} must contain either text, a photo, or both.`);
          return null;
        }

        const optInputs = qEl.querySelectorAll('.opt-text');
        const options = [];
        optInputs.forEach(opt => {
          if (opt.value.trim()) options.push(opt.value.trim());
        });

        if (options.length < 2) {
          alert(`Question ${i + 1} must have at least 2 non-empty options.`);
          return null;
        }

        const checkedRadio = qEl.querySelector(`input[type="radio"]:checked`);
        let correctIdx = checkedRadio ? parseInt(checkedRadio.value) : 0;
        if (correctIdx >= options.length) correctIdx = 0;

        questions.push({ text, image, options, correctIdx });
      }

      return { title, timeMinutes, questions };
    }

    /* Binary Exporter */
    function exportBinaryTest() {
      const testData = compileTestDataFromEditor();
      if (!testData) return;
      
      const jsonString = JSON.stringify(testData);
      const encoder = new TextEncoder();
      const byteArray = encoder.encode(jsonString);

      const blob = new Blob([byteArray.buffer], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${testData.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.test`;
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ==========================================================================
       2. TEST UPLOAD & PORTAL LOGIC
       ========================================================================== */
    function uploadAndTakeTest(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const buffer = e.target.result;
          const decoder = new TextDecoder();
          const jsonString = decoder.decode(buffer);
          
          currentTest = JSON.parse(jsonString);
          startTestPortal();
        } catch (err) {
          alert('Invalid test file format!');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    function startTestPortal() {
      userAnswers = {};
      currentQIndex = 0;
      remainingSeconds = currentTest.timeMinutes * 60;

      activeQuestions = shuffleArray(currentTest.questions || []);

      document.getElementById('portal-title').innerText = currentTest.title;
      
      const palette = document.getElementById('q-palette');
      palette.innerHTML = '';
      activeQuestions.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = `q-btn ${idx === 0 ? 'active' : ''}`;
        btn.id = `q-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          const dir = idx > currentQIndex ? 1 : -1;
          renderQuestion(idx, dir);
        };
        palette.appendChild(btn);
      });

      renderQuestion(0, 0);
      switchView('view-portal');
      setupSwipeListeners();
      
      clearInterval(timerInterval);
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          alert('Time is up! Submitting your test automatically.');
          submitTest(true);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
      const s = (remainingSeconds % 60).toString().padStart(2, '0');
      document.getElementById('portal-timer').innerText = `${m}:${s}`;
    }

    function renderQuestion(idx, direction = 0) {
      const container = document.getElementById('portal-q-container');
      
      const updateContent = () => {
        currentQIndex = idx;
        const q = activeQuestions[idx];

        document.querySelectorAll('.q-btn').forEach((b, i) => {
          b.classList.toggle('active', i === idx);
        });

        const activeBtn = document.getElementById(`q-btn-${idx}`);
        if (activeBtn) {
          activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        document.getElementById('portal-q-text').innerText = q.text ? `Q${idx + 1}. ${q.text}` : `Q${idx + 1}.`;
        
        const imgContainer = document.getElementById('portal-q-img-container');
        imgContainer.innerHTML = '';
        if (q.image) {
          const img = document.createElement('img');
          img.src = q.image;
          img.className = 'img-preview-box';
          imgContainer.appendChild(img);
        }

        const optContainer = document.getElementById('portal-options-container');
        optContainer.innerHTML = '';

        q.options.forEach((optText, optIdx) => {
          const label = document.createElement('label');
          label.className = 'test-option';
          const isChecked = userAnswers[idx] === optIdx;
          
          label.innerHTML = `
            <input type="radio" name="portal-opt" value="${optIdx}" ${isChecked ? 'checked' : ''} onclick="handleOptionClick(${idx}, ${optIdx}, event)">
            ${optText}
          `;
          optContainer.appendChild(label);
        });

        document.getElementById('btn-prev').disabled = idx === 0;
        document.getElementById('btn-next').disabled = idx === activeQuestions.length - 1;
      };

      if (direction !== 0) {
        const slideOutClass = direction > 0 ? 'slide-out-left' : 'slide-out-right';
        container.classList.add(slideOutClass);
        
        setTimeout(() => {
          updateContent();
          container.classList.remove(slideOutClass);
          
          container.style.setProperty('--slide-enter-offset', direction > 0 ? '100%': '-100%');
          container.classList.add('slide-in');
          
          setTimeout(() => {
            container.classList.remove('slide-in');
          }, 250);
        }, 200);
      } else {
        updateContent();
      }
    }

    function handleOptionClick(qIdx, optIdx, event) {
      if (userAnswers[qIdx] === optIdx) {
        event.preventDefault();
        delete userAnswers[qIdx];
        document.getElementById(`q-btn-${qIdx}`).classList.remove('answered');
        renderQuestion(qIdx, 0);
      } else {
        userAnswers[qIdx] = optIdx;
        document.getElementById(`q-btn-${qIdx}`).classList.add('answered');
      }
    }

    function clearCurrentAnswer() {
      delete userAnswers[currentQIndex];
      document.getElementById(`q-btn-${currentQIndex}`).classList.remove('answered');
      renderQuestion(currentQIndex, 0);
    }

    function navigateQuestion(direction) {
      const newIdx = currentQIndex + direction;
      if (newIdx >= 0 && newIdx < activeQuestions.length) {
        renderQuestion(newIdx, direction);
      }
    }

    /* Swipe Gesture Handling */
    function setupSwipeListeners() {
      const swipeContainer = document.getElementById('portal-swipe-container');
      
      swipeContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      swipeContainer.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipeGesture();
      }, { passive: true });
    }

    function handleSwipeGesture() {
      const swipeThreshold = 50;
      const diff = touchEndX - touchStartX;

      if (Math.abs(diff) > swipeThreshold) {
        if (diff < 0) {
          navigateQuestion(1);
        } else {
          navigateQuestion(-1);
        }
      }
    }

    /* ==========================================================================
       3. SUBMISSION & RESULTS
       ========================================================================== */
    function submitTest(isAutoSubmit = false) {
      if (!isAutoSubmit && !confirm('Are you sure you want to submit the test?')) return;
      
      clearInterval(timerInterval);
      
      let score = 0;
      const total = activeQuestions.length;
      const resContainer = document.getElementById('results-container');
      resContainer.innerHTML = '';

      activeQuestions.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.correctIdx;
        if (isCorrect) score++;

        const div = document.createElement('div');
        div.className = 'result-item';
        
        let statusHtml = '';
        if (userAns === undefined) {
          statusHtml = `<span style="color: var(--warning); font-weight:bold;">Not Attempted</span>`;
        } else if (isCorrect) {
          statusHtml = `<span class="correct-ans">Correct (+1)</span>`;
        } else {
          statusHtml = `<span class="wrong-ans">Incorrect</span>`;
        }

        const imgHtml = q.image ? `<br><img src="${q.image}" class="img-preview-box" style="max-height:150px; margin-top:5px;">` : '';

        div.innerHTML = `
          <p><b>Q${idx + 1}: ${q.text || ''}</b> ${statusHtml}</p>
          ${imgHtml}
          <p style="margin-top:5px;">Your Answer: ${userAns !== undefined ? q.options[userAns] : 'None'}</p>
          <p>Correct Answer: <span class="correct-ans">${q.options[q.correctIdx]}</span></p>
        `;
        resContainer.appendChild(div);
      });

      const percentage = parseFloat(((score / total) * 100).toFixed(1));
      lastTestResults = { score, total, percentage };

      document.getElementById('score-text').innerText = `${score} / ${total}`;
      document.getElementById('score-percentage').innerText = `Score Percentage: ${percentage}%`;

      switchView('view-result');
    }

    /* Report Card PNG Generator */
    function downloadReportCard() {
      const canvas = document.createElement('canvas');
      const width = 800;
      const height = 600;
      canvas.width = width * 2;
      canvas.height = height * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);

      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, '#f8fa22');
      bgGrad.addColorStop(0, '#ffffff');
      bgGrad.addColorStop(1, '#f0f4f9');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#1a73e8';
      ctx.lineWidth = 8;
      ctx.strokeRect(15, 15, width - 30, height - 30);
      
      ctx.strokeStyle = '#dadce0';
      ctx.lineWidth = 2;
      ctx.strokeRect(25, 25, width - 50, height - 50);

      ctx.fillStyle = '#1a73e8';
      ctx.fillRect(27, 27, width - 54, 90);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('THE REPORT CARD', width / 2, 80);

      ctx.fillStyle = '#202124';
      ctx.font = 'bold 22px "Segoe UI", sans-serif';
      const title = currentTest ? currentTest.title : 'Mock Test';
      ctx.fillText(title, width / 2, 160);

      const dateStr = `Date: ${new Date().toLocaleDateString()}`;
      ctx.fillStyle = '#5f6368';
      ctx.font = '16px "Segoe UI", sans-serif';
      ctx.fillText(dateStr, width / 2, 190);

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      ctx.fillRect(80, 220, width - 160, 220);
      ctx.shadowColor = 'transparent';

      ctx.strokeStyle = '#dadce0';
      ctx.lineWidth = 1;
      ctx.strokeRect(80, 220, width - 160, 220);

      ctx.fillStyle = '#202124';
      ctx.font = '18px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Total Marks:', 120, 270);
      ctx.fillText('Marks Obtained:', 120, 320);
      ctx.fillText('Percentage:', 120, 370);

      ctx.textAlign = 'right';
      ctx.font = 'bold 20px "Segoe UI", sans-serif';
      ctx.fillText(`${lastTestResults.total}`, width - 120, 270);
      
      ctx.fillStyle = '#1a73e8';
      ctx.fillText(`${lastTestResults.score}`, width - 120, 320);

      const isPass = lastTestResults.percentage >= 40;
      ctx.fillStyle = isPass ? '#34a853' : '#ea4335';
      ctx.fillText(`${lastTestResults.percentage}%`, width - 120, 370);

      ctx.textAlign = 'center';
      ctx.font = 'bold 24px "Segoe UI", sans-serif';
      ctx.fillStyle = isPass ? '#34a853' : '#ea4335';
      ctx.fillText(isPass ? 'PASSED 🎉' : 'NEEDS IMPROVEMENT 📖', width / 2, 490);

      ctx.fillStyle = '#9aa0a6';
      ctx.font = '14px "Segoe UI", sans-serif';
      ctx.fillText('Generated by Test Maker', width / 2, 545);

      const link = document.createElement('a');
      link.download = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_report_card.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
