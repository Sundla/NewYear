<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AAA Arabic Allied Arms</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #111;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none;
            font-family: 'Arial Black', sans-serif;
        }
        .game-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            background: #000;
        }
        svg { 
            width: 100%; height: 100%; display: block; 
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); 
            max-width: 100vh;
            aspect-ratio: 9 / 16;
        }
        
        #ui-layer {
            position: fixed; top: 20px; left: 20px; color: #fff;
            font-size: 28px; font-weight: bold; text-shadow: 2px 2px 0px #000;
            pointer-events: none; z-index: 10; text-align: left;
        }

        /* Fight Banner Style */
        #start-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            z-index: 10002;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            width: 100%;
            animation: fadeOut 0.5s forwards 2.5s;
        }
        .red-text { color: #ff0000; }
        .green-text { color: #00ff00; }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            color: white; z-index: 10001; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center;
            background: rgba(0,0,0,0.7);
        }
        button.action-btn {
            padding: 15px 35px; font-size: 20px; background: #ffcc00; color: #000;
            border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; font-weight: bold;
            box-shadow: 0 4px 0 #b89500;
        }
        #boss-hp-bar {
            display: none; position: fixed; top: 20px; right: 20px;
            width: 200px; height: 20px; background: #444; border: 2px solid #fff;
            z-index: 10;
        }
        #boss-hp-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.2s; }

        /* Rotating Fan Layer Animation for Enemy 2 */
        @keyframes fanRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .enemy-fan-layer {
            transform-origin: 0px -5px;
            animation: fanRotate 0.5s linear infinite;
        }
    </style>
</head>
<body>

<div id="start-banner">
    <span class="red-text">Fight!</span> 
    <span class="green-text">Pakistan Air Petrol</span>
</div>

<div id="ui-layer">KILLS: <span id="kill-count">0</span></div>
<div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>

<div id="game-over-screen" class="screen">
    <h1 style="font-size: 40px; color: #fff;">WRECKED!</h1>
    <p id="final-kills" style="font-size: 24px; margin-top: 10px;"></p>
    <button class="action-btn" onclick="location.reload()">TRY AGAIN</button>
</div>

<div id="victory-screen" class="screen">
    <h1 style="font-size: 50px; color: #ffcc00;">MISSION CLEAR!</h1>
    <p style="font-size: 20px;">PAP (पाप) BOSS Destroyed</p>
    <button class="action-btn" onclick="window.location.href='BoatGame.html'">Play Next Stage</button>
</div>

<div class="game-container">
    <svg id="game" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Smooth Radial Gradients for Subtle, Natural 3D Gloss Instead of Harsh Lines -->
            <radialGradient id="gloss-dark" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#666" />
                <stop offset="50%" stop-color="#444" />
                <stop offset="100%" stop-color="#222" />
            </radialGradient>

            <radialGradient id="gloss-slate" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#4f7a7a" />
                <stop offset="50%" stop-color="#2f4f4f" />
                <stop offset="100%" stop-color="#152020" />
            </radialGradient>

            <radialGradient id="gloss-red" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#e74c3c" />
                <stop offset="50%" stop-color="#c0392b" />
                <stop offset="100%" stop-color="#781d14" />
            </radialGradient>

            <radialGradient id="gloss-cyan" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#00d2ff" />
                <stop offset="50%" stop-color="#2d3436" />
                <stop offset="100%" stop-color="#0f1922" />
            </radialGradient>

            <radialGradient id="gloss-green" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#3b7a32" />
                <stop offset="50%" stop-color="#2d5a27" />
                <stop offset="100%" stop-color="#163313" />
            </radialGradient>

            <radialGradient id="gloss-light" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fff" />
                <stop offset="50%" stop-color="#ccc" />
                <stop offset="100%" stop-color="#777" />
            </radialGradient>

            <g id="player-plane">
                <path d="M-45,5 L45,5 L0,-15 Z" fill="url(#gloss-dark)" />
                <path d="M-8,30 L8,30 L10,-40 Q0,-55 -10,-40 Z" fill="url(#gloss-slate)" stroke="#111" stroke-width="1"/>
                <ellipse cx="0" cy="-15" rx="5" ry="12" fill="#87CEEB" opacity="0.6"/>
                <rect x="-12" y="25" width="6" height="12" fill="#ff4500" id="flame-l" />
                <rect x="6" y="25" width="6" height="12" fill="#ff4500" id="flame-r" />
            </g>

            <g id="enemy-1-design">
                <path d="M-35,-10 L35,-10 L0,15 Z" fill="url(#gloss-dark)" /> 
                <path d="M-10,-25 L10,-25 L12,20 L0,35 L-12,20 Z" fill="url(#gloss-red)" /> 
                <rect x="-15" y="-15" width="30" height="4" fill="url(#gloss-light)" /> 
                <circle cx="0" cy="5" r="5" fill="#333" /> 
            </g>

            <!-- Blue Thunder Shooting Enemy (Original Size with 4 Distinct Rotating Fan Blades) -->
            <g id="enemy-2-design">
                <!-- Inner Base Core Layer (Kept exact original size and shape) -->
                <path d="M-40,0 L-10,-10 L0,-30 L10,-10 L40,0 L10,5 L0,20 L-10,5 Z" fill="url(#gloss-cyan)" stroke="#00d2ff" stroke-width="2"/>
                <circle cx="0" cy="-5" r="4" fill="#55efc4" />
                
                <!-- Outer Rotating Fan Layer with 4 Fan Blades -->
                <g class="enemy-fan-layer">
                    <!-- Top Blade -->
                    <path d="M-6,-22 L6,-22 L10,-48 L0,-56 L-10,-48 Z" fill="#00ffff" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
                    <!-- Bottom Blade -->
                    <path d="M-6,12 L6,12 L10,38 L0,46 L-10,38 Z" fill="#00ffff" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
                    <!-- Left Blade -->
                    <path d="M-20,-12 L-20,0 L-46,-4 L-54,-14 L-46,-24 Z" fill="#00d2ff" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
                    <!-- Right Blade -->
                    <path d="M20,-12 L20,0 L46,-4 L54,-14 L46,-24 Z" fill="#00d2ff" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
                    
                    <circle cx="0" cy="-5" r="22" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="3,3"/>
                </g>
            </g>

            <g id="boss-design">
                <path d="M-120,20 L120,20 L0,-60 Z" fill="url(#gloss-green)" stroke="#fff" stroke-width="2"/>
                <path d="M-15,60 L15,60 L20,-80 L0,-100 L-20,-80 Z" fill="url(#gloss-light)" />
                <path d="M-15,10 L15,10 L18,-50 L-18,-50 Z" fill="url(#gloss-green)" />
                <path d="M-40,50 L-10,50 L-5,25 Z" fill="#1b4332" />
                <path d="M40,50 L10,50 L5,25 Z" fill="#1b4332" />
                <ellipse cx="0" cy="-60" rx="8" ry="15" fill="#333" />
            </g>

            <g id="cloud1"><circle r="20" fill="white" opacity="0.8" cx="0" cy="0"/><circle r="15" fill="white" opacity="0.8" cx="20" cy="5"/></g>
            <g id="cloud2"><ellipse rx="30" ry="15" fill="white" opacity="0.7"/><ellipse rx="20" ry="10" fill="white" opacity="0.7" cx="20" cy="-5"/></g>

            <rect id="red-dash" x="-2" y="-12" width="4" height="24" fill="#ff0000" rx="2" />
            <g id="fireball"><circle r="10" fill="#ff0000" stroke="#fff" stroke-width="1"/><circle r="5" fill="#ff3333"/></g>
            <path id="thunder" d="M0,0 L-8,15 L8,15 L0,35" stroke="#ffff00" stroke-width="4" fill="none" />
        </defs>

        <g id="sky-layer"></g>
        <g id="enemies-layer"></g>
        <g id="enemy-bullets-layer"></g>
        <g id="bullets-layer"></g>
        <g id="fx-layer"></g> 

        <g id="player-anchor" transform="translate(200, 650)">
            <g id="player-tilt"><use href="#player-plane" /></g>
        </g>
    </svg>
</div>

<script>
    // Remove banner after 3 seconds
    setTimeout(() => {
        const banner = document.getElementById('start-banner');
        if(banner) banner.remove();
    }, 3000);

    // Synthesized Audio Context & Procedural Audio Engine
    let audioCtx = null;
    let activeNodes = [];
    let activeTimeouts = [];
    let currentSongStopFn = null;

    function getAudioContext() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function createNoiseBuffer(ctx, duration = 2.0, color = 'white') {
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            if (color === 'pink') {
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                data[i] *= 0.11;
                b6 = white * 0.115926;
            } else {
                data[i] = white;
            }
        }
        return buffer;
    }

    // Zombie Theme Song Data
    const zombieSong = {
        type: "square",
        scale: [146.83, 155.56, 164.81, 174.61],
        pattern: [0, 2, 1, 3, 0, 1, 2, 3],
        tempo: 280
    };

    function startZombieBackgroundSong() {
        const ctx = getAudioContext();
        if (currentSongStopFn) return; // Already playing

        let step = 0;
        let isRunning = true;

        function stopThisSong() {
            isRunning = false;
            currentSongStopFn = null;
        }
        currentSongStopFn = stopThisSong;

        function stepSequence() {
            if (!isRunning) return;

            const noteIndex = zombieSong.pattern[step];
            const freq = zombieSong.scale[noteIndex];
            
            const startTime = ctx.currentTime;
            const duration = (zombieSong.tempo / 1000) * 0.9;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = zombieSong.type;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.12, startTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
            activeNodes.push(osc);

            step++;
            if (step >= zombieSong.pattern.length) {
                step = 0;
            }

            if (isRunning) {
                const timeoutId = setTimeout(stepSequence, zombieSong.tempo);
                activeTimeouts.push(timeoutId);
            }
        }

        stepSequence();
    }

    // Cannon Fire Sound Effect
    function playCannonSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);

        let baseFreq = 45;
        let decay = 1.2;

        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq * 4, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
        oscGain.gain.setValueAtTime(1.0, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(oscGain); 
        oscGain.connect(masterGain);
        osc.start(now); 
        osc.stop(now + 0.5);
        activeNodes.push(osc);

        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = createNoiseBuffer(ctx, decay, 'pink');
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1500, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + decay);
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(1.5, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + decay);
        noiseSource.connect(filter); 
        filter.connect(noiseGain); 
        noiseGain.connect(masterGain);
        noiseSource.start(now); 
        noiseSource.stop(now + decay);
    }

    // Nuclear Explosion Sound Effect
    function playNuclearExplosion() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);

        const duration = 2.5;

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(70, now);
        subOsc.frequency.exponentialRampToValueAtTime(15, now + duration * 0.6);
        subGain.gain.setValueAtTime(1.5, now);
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        subOsc.connect(subGain); 
        subGain.connect(masterGain);
        subOsc.start(now); 
        subOsc.stop(now + duration);
        activeNodes.push(subOsc);

        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = createNoiseBuffer(ctx, duration, 'pink');
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.linearRampToValueAtTime(50, now + duration);
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(1.5, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        noiseSource.connect(filter); 
        filter.connect(noiseGain); 
        noiseGain.connect(masterGain);
        noiseSource.start(now); 
        noiseSource.stop(now + duration);
    }

    const svg = document.querySelector("#game");
    const playerAnchor = document.querySelector("#player-anchor");
    const skyLayer = document.querySelector("#sky-layer");
    const bulletsLayer = document.querySelector("#bullets-layer");
    const eBulletsLayer = document.querySelector("#enemy-bullets-layer");
    const enemiesLayer = document.querySelector("#enemies-layer");
    const fxLayer = document.querySelector("#fx-layer");
    
    let plane = { x: 200, y: 650, targetX: 200, targetY: 650 };
    let kills = 0;
    let activeEnemies = [];
    let enemyBullets = [];
    let isGameOver = false;
    let isDragging = false;
    let bossActive = false;
    let bossMaxHP = 30;
    let bossHP = 30;

    // Player health & invulnerability state
    let playerLives = 2; // 2 lives: survive first damage, die on second
    let isInvulnerable = false;

    // Keyboard controls tracking
    let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', (e) => {
        if (e.key in keys) {
            keys[e.key] = true;
        }
        if (e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'x') {
            fire();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key in keys) {
            keys[e.key] = false;
        }
    });

    function triggerBlast(x, y, isNuclear = false) {
        if (isNuclear) {
            playNuclearExplosion();
        } else {
            playCannonSound();
        }
        
        let particleCount = isNuclear ? 30 : 10;
        for (let i = 0; i < particleCount; i++) {
            createParticle(x, y, {
                color: Math.random() > 0.4 ? '#ff0000' : '#ff3333',
                size: (isNuclear ? 12 : 8) + Math.random() * (isNuclear ? 20 : 10),
                driftX: (Math.random() - 0.5) * (isNuclear ? 20 : 12), 
                driftY: (Math.random() - 0.5) * (isNuclear ? 20 : 12),
                fadeSpeed: isNuclear ? 0.02 : 0.05, 
                growSpeed: 1.05
            });
        }
        for (let i = 0; i < (isNuclear ? 10 : 4); i++) {
            createParticle(x, y, {
                color: '#333', size: isNuclear ? 25 : 12, driftX: (Math.random()-0.5)*4, driftY: -5, fadeSpeed: 0.015, growSpeed: 1.1, opacity: 0.5
            });
        }
    }

    function createParticle(x, y, config) {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        p.setAttribute("cx", x); p.setAttribute("cy", y);
        p.setAttribute("r", config.size); p.setAttribute("fill", config.color);
        p.setAttribute("opacity", config.opacity || 1);
        fxLayer.appendChild(p);
        let curOp = config.opacity || 1, curS = config.size, cx = x, cy = y;
        function anim() {
            curOp -= config.fadeSpeed; curS *= config.growSpeed; cx += config.driftX; cy += config.driftY;
            if (curOp > 0) {
                p.setAttribute("opacity", curOp); p.setAttribute("r", curS); p.setAttribute("cx", cx); p.setAttribute("cy", cy);
                requestAnimationFrame(anim);
            } else p.remove();
        }
        anim();
    }

    const getCoords = (e) => {
        const rect = svg.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        return { x: (touch.clientX - rect.left) * (400 / rect.width), y: (touch.clientY - rect.top) * (800 / rect.height) };
    };

    window.addEventListener('touchstart', (e) => { 
        isDragging = true; 
        startZombieBackgroundSong();
        fire(); 
    });
    window.addEventListener('mousedown', () => {
        isDragging = true;
        startZombieBackgroundSong();
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);
    window.addEventListener('mousemove', (e) => { if(isDragging && !isGameOver) { let c = getCoords(e); plane.targetX = c.x; plane.targetY = c.y; } });
    window.addEventListener('touchmove', (e) => { if(!isGameOver) { let c = getCoords(e); plane.targetX = c.x; plane.targetY = c.y; } });
    window.addEventListener('click', (e) => { 
        if(!e.touches) {
            startZombieBackgroundSong();
            fire();
        } 
    });

    function fire() {
        if(isGameOver) return;
        playCannonSound();
        
        // Determine firing offsets: 2 streams for full life, 1 stream (center) for the second/last life
        const offsets = playerLives === 2 ? [-15, 15] : [0];

        offsets.forEach(off => {
            const b = document.createElementNS("http://www.w3.org/2000/svg", "use");
            b.setAttribute("href", "#red-dash");
            bulletsLayer.appendChild(b);
            let bx = plane.x + off, by = plane.y - 15;
            function moveB() {
                if(isGameOver) { b.remove(); return; }
                by -= 25; b.setAttribute("transform", `translate(${bx}, ${by})`);
                
                activeEnemies.forEach(en => {
                    if(!en.dead && Math.abs(bx - en.x) < 60 && Math.abs(by - en.y) < 60) {
                        if(en.isBoss) {
                            bossHP--;
                            document.getElementById('boss-hp-fill').style.width = Math.max(0, (bossHP/bossMaxHP)*100) + "%";
                            triggerBlast(bx, by, false);
                            if(bossHP <= 0) winGame(en);
                        } else {
                            en.dead = true; triggerBlast(en.x, en.y, false); kills++;
                            document.getElementById('kill-count').innerText = kills;
                            en.el.remove();
                        }
                        b.remove();
                    }
                });

                enemyBullets.forEach(eb => {
                    if(!eb.dead && eb.isFireball && Math.abs(bx - eb.x) < 25 && Math.abs(by - eb.y) < 25) {
                        eb.dead = true; eb.el.remove(); b.remove(); triggerBlast(eb.x, eb.y, false);
                    }
                });

                if(by > -50) requestAnimationFrame(moveB); else b.remove();
            }
            moveB();
        });
    }

    function spawnBullet(ex, ey, type, angle = 0) {
        const b = document.createElementNS("http://www.w3.org/2000/svg", "use");
        const isFire = (type === 1 || type === 'boss');
        b.setAttribute("href", isFire ? "#fireball" : "#thunder");
        eBulletsLayer.appendChild(b);
        let bx = ex, by = ey;
        let eb = { el: b, x: bx, y: by, dead: false, isFireball: isFire };
        enemyBullets.push(eb);

        function move() {
            if(isGameOver || eb.dead) return;
            by += (isFire ? 7 : 12);
            bx += Math.sin(angle) * 5;
            eb.x = bx; eb.y = by;
            b.setAttribute("transform", `translate(${bx}, ${by})`);

            if (isFire) {
                createParticle(bx + (Math.random() - 0.5) * 6, by + (Math.random() - 0.5) * 6, {
                    color: Math.random() > 0.5 ? '#ff0000' : '#cc0000',
                    size: 3 + Math.random() * 3,
                    driftX: (Math.random() - 0.5) * 1,
                    driftY: (Math.random() - 0.5) * 1,
                    fadeSpeed: 0.15,
                    growSpeed: 0.90
                });
            }

            if(Math.abs(bx - plane.x) < 30 && Math.abs(by - plane.y) < 30) hitPlayer();
            if(by < 850) requestAnimationFrame(move); else { b.remove(); eb.dead = true; }
        }
        move();
    }

    function spawnEnemy() {
        if(isGameOver || bossActive) return;
        if(kills >= 15) { spawnBoss(); return; }
        
        const type = Math.random() > 0.7 ? 2 : 1;
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", type === 2 ? "#enemy-2-design" : "#enemy-1-design");
        g.appendChild(use);
        enemiesLayer.appendChild(g);

        let en = { el: g, x: Math.random()*340+30, y: -60, dead: false, lastShot: 0, type: type };
        activeEnemies.push(en);

        function move() {
            if(en.dead || isGameOver) return;
            en.y += (type === 2 ? 4 : 2.5);
            g.setAttribute("transform", `translate(${en.x}, ${en.y})`);

            if (type === 1) {
                createParticle(en.x + (Math.random() - 0.5) * 8, en.y - 15, {
                    color: Math.random() > 0.5 ? '#ff0000' : '#cc0000',
                    size: 3 + Math.random() * 3,
                    driftX: (Math.random() - 0.5) * 1.5,
                    driftY: -3 - Math.random() * 2,
                    fadeSpeed: 0.1,
                    growSpeed: 0.92
                });
            }

            if(Date.now() - en.lastShot > (type === 2 ? 1200 : 2000)) {
                spawnBullet(en.x, en.y + 20, type);
                en.lastShot = Date.now();
            }
            if(Math.abs(en.x - plane.x) < 40 && Math.abs(en.y - plane.y) < 40) hitPlayer();
            if(en.y < 900) requestAnimationFrame(move); else { g.remove(); en.dead = true; }
        }
        move();
    }

    function spawnBoss() {
        bossActive = true;
        bossHP = bossMaxHP;
        document.getElementById('boss-hp-fill').style.width = '100%';
        document.getElementById('boss-hp-bar').style.display = 'block';
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", "#boss-design");
        g.appendChild(use);
        enemiesLayer.appendChild(g);
        let en = { el: g, x: 200, y: -150, dead: false, lastShot: 0, isBoss: true };
        activeEnemies.push(en);

        function move() {
            if(en.dead || isGameOver) return;
            if(en.y < 120) en.y += 0.5;
            en.x = 200 + Math.sin(Date.now()/1500) * 80;
            g.setAttribute("transform", `translate(${en.x}, ${en.y})`);
            if(Date.now() - en.lastShot > 1600) {
                [-0.6, 0, 0.6].forEach(ang => spawnBullet(en.x, en.y + 50, 'boss', ang));
                en.lastShot = Date.now();
            }
            requestAnimationFrame(move);
        }
        move();
    }

    function winGame(boss) {
        boss.dead = true; 
        triggerBlast(boss.x, boss.y, true); // Nuclear explosion on boss win
        boss.el.remove();
        document.getElementById('victory-screen').style.display = 'flex';
        document.getElementById('boss-hp-bar').style.display = 'none';
    }

    function hitPlayer() {
        if(isGameOver || isInvulnerable) return;
        
        playerLives--;
        
        if (playerLives > 0) {
            // First damage taken: survive, trigger small blast, blink three times & enter invulnerability
            triggerBlast(plane.x, plane.y, false);
            isInvulnerable = true;
            
            let blinks = 0;
            const blinkInterval = setInterval(() => {
                playerAnchor.style.opacity = playerAnchor.style.opacity === '0.2' ? '1' : '0.2';
                blinks++;
                if (blinks >= 6) { // 3 full blink cycles (hidden/shown counts as 6 changes)
                    clearInterval(blinkInterval);
                    playerAnchor.style.opacity = '1';
                    isInvulnerable = false;
                }
            }, 150);
        } else {
            // Final life lost: Game Over
            gameOver();
        }
    }

    function gameOver() {
        if(isGameOver) return;
        isGameOver = true; 
        triggerBlast(plane.x, plane.y, true); // Nuclear explosion on player defeat
        playerAnchor.style.display = "none";
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('final-kills').innerText = "TOTAL KILLS: " + kills;
        document.getElementById('boss-hp-bar').style.display = 'none';
    }

    setInterval(spawnEnemy, 1800);
    setInterval(() => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "use");
        c.setAttribute("href", Math.random() > 0.5 ? "#cloud1" : "#cloud2");
        let cx = Math.random() * 400, cy = -100;
        skyLayer.appendChild(c);
        function move() { cy += 1.2; c.setAttribute("transform", `translate(${cx}, ${cy})`); if(cy < 900) requestAnimationFrame(move); else c.remove(); }
        move();
    }, 2500);

    function update() {
        if(isGameOver) return;

        const speed = 6;
        if (keys.ArrowLeft) plane.targetX -= speed;
        if (keys.ArrowRight) plane.targetX += speed;
        if (keys.ArrowUp) plane.targetY -= speed;
        if (keys.ArrowDown) plane.targetY += speed;

        plane.targetX = Math.max(30, Math.min(370, plane.targetX));
        plane.targetY = Math.max(50, Math.min(750, plane.targetY));

        plane.x += (plane.targetX - plane.x) * 0.15;
        plane.y += (plane.targetY - plane.y) * 0.15;
        playerAnchor.setAttribute("transform", `translate(${plane.x}, ${plane.y})`);
        const s = 10 + Math.random() * 10;
        document.getElementById('flame-l').setAttribute("height", s);
        document.getElementById('flame-r').setAttribute("height", s);

        createParticle(plane.x + (Math.random() - 0.5) * 10, plane.y + 30, {
            color: Math.random() > 0.5 ? '#ffaa00' : '#ff4500',
            size: 4 + Math.random() * 4,
            driftX: (Math.random() - 0.5) * 2,
            driftY: 3 + Math.random() * 3,
            fadeSpeed: 0.08,
            growSpeed: 0.95
        });

        requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
